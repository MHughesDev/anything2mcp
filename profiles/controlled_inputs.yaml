# Pages whose inputs are kept in a component's state, so that a value put in
# an element does not reach the application unless the page's own key
# handlers saw it typed; and whose generated class names and identifiers are
# made by a build, and are different in each.
profile: controlled_inputs
detect:
  any:
    - {dom: "[data-reactroot]"}
    - {js: "window.__REACT_DEVTOOLS_GLOBAL_HOOK__"}
locators:
  priority: [role, label, test_id, text, css]
  reject_id_patterns: ["^:r[0-9a-z]+:$", "^[a-z]+-[0-9a-f]{6,}$"]
input_commit: type_then_blur
frames: {mode: declared}
drift_risk: medium
support_tier: full
