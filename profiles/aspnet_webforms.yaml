# Pages of a server framework whose identifiers are made from the control's
# place in the page, so that they change when a control is added or moved,
# and whose partial postbacks draw the form again. Locate by label; wait until
# the asynchronous postback reports it has finished.
profile: aspnet_webforms
detect:
  any:
    - {dom: "input[name='__VIEWSTATE']"}
    - {js: "Sys.WebForms.PageRequestManager"}
ready:
  js: "!Sys.WebForms.PageRequestManager.getInstance().get_isInAsyncPostBack()"
locators:
  priority: [label, role, text, css]
  reject_id_patterns: ["^ctl\\d+_", "^MainContent_"]
input_commit: blur_then_wait_ready
frames: {mode: declared}
drift_risk: low
support_tier: full
