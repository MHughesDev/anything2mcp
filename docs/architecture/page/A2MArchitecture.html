<meta charset="utf-8">
<title>A2MArchitecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A workspace of three panels. The middle is the Module Map: every station and subsystem is a container, its parts are
   modules nested inside it, the Provider Contract is a seam between the kernel and the packs, and the links between
   containers are drawn once per pair with a count. The left panel chooses a layer, a process map, filters, and a call to
   follow; the right panel reads the chosen part in depth. Both side panels fold to a rail. */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --ink: #14201e; --muted: #5a6966; --line: #d2dad8; --soft: #e6ebe9;
  --route: #0b6b66; --route-soft: #d8ecea; --on-route: #ffffff;
  --canvas: #f6f8f7; --card: #ffffff; --well: #eef2f1; --box: #fbfcfc;
  --built: #1c8548; --part: #b3740f; --todo: #8a9693;
  --shadow: 0 8px 26px rgb(20 32 30 / .14); --scrim: rgb(20 32 30 / .32);
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.3,1);
  --lw: clamp(236px, 19vw, 280px); --rw: clamp(320px, 28vw, 420px); --rail: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --canvas: #131a19; --card: #1b2423; --well: #172020; --box: #151d1c;
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a;
  --shadow: 0 8px 26px rgb(0 0 0 / .45); --scrim: rgb(0 0 0 / .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --canvas: #131a19; --card: #1b2423; --well: #172020; --box: #151d1c;
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a;
  --shadow: 0 8px 26px rgb(0 0 0 / .45); --scrim: rgb(0 0 0 / .5); color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 6px; }
a { color: var(--route); }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The workspace */
.app { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); grid-template-rows: auto minmax(0, 1fr);
  height: 100vh; height: 100dvh; transition: grid-template-columns .3s var(--ease); }
.app.lc { --lw: var(--rail); } .app.rc { --rw: var(--rail); }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px 20px; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.top .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -.005em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.done { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.done b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { width: 88px; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--route); }
.ib { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.ib:hover { color: var(--route); background: var(--soft); }
.menu { display: none; }

/* Side panels */
.left, .right { min-height: 0; min-width: 0; background: var(--surface); position: relative; display: flex; overflow: hidden; }
.left { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }
.rail { width: var(--rail); flex: none; display: none; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
.lc .left .rail, .rc .right .rail { display: flex; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; transition: opacity .2s var(--ease); }
.lc .left .pane, .rc .right .pane { display: none; }
.phead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 16px; }
.phead .lbl { flex: 1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.left .scroll { padding: 0 12px 24px 16px; display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 6px; }
h3 { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; }
.sec > h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec > h3 button { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--route); }
.note { color: var(--muted); font-size: 12.5px; margin: 0; line-height: 1.45; }

/* Search */
.find { position: relative; }
.find input { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px 6px 32px; -webkit-appearance: none; appearance: none; }
.find input::placeholder { color: var(--muted); }
.find input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.find input:focus { outline: 2px solid var(--route); outline-offset: 1px; }
.find > svg { position: absolute; left: 10px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none; }
.hits { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.hits button { display: grid; grid-template-columns: 8px minmax(0, 1fr); column-gap: 9px; align-items: baseline; width: 100%; padding: 5px 8px; border-radius: 6px; font-size: 13.5px; }
.hits button .pip { align-self: center; }
.hits button small { grid-column: 2; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hits button.on, .hits button:hover { background: var(--soft); }
.hits p { margin: 0; padding: 4px 8px; color: var(--muted); font-size: 13px; }

/* The layer tree */
.tree { display: flex; flex-direction: column; gap: 1px; }
.tr { display: flex; align-items: center; gap: 2px; border-radius: 6px; padding-left: calc(var(--d, 0) * 14px); }
.tr:hover { background: var(--soft); }
.tr.on { background: var(--route-soft); }
.tr.on .tn { color: var(--ink); font-weight: 500; }
.tr .cv { width: 20px; height: 26px; display: grid; place-items: center; color: var(--muted); flex: none; }
.tr .cv svg { width: 12px; height: 12px; transition: transform .25s var(--ease); }
.tr .cv[aria-expanded="true"] svg { transform: rotate(90deg); }
.tr .cv.none { visibility: hidden; pointer-events: none; }
.tn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; padding: 4px 2px; font-size: 13.5px; color: var(--muted); }
.tn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn:hover { color: var(--ink); }
.tn small { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.tm { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); opacity: 0; flex: none; }
.tr:hover .tm, .tm:focus-visible, .tr.on .tm { opacity: 1; }
.tm:hover { color: var(--route); background: var(--surface); }
.tm svg { width: 14px; height: 14px; }
.tsep { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px 22px; }
@media (pointer: coarse) { .tm { opacity: 1; } }

/* Filters */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 13px; background: var(--surface); color: var(--ink); }
.chip:hover { border-color: var(--route); }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; }
.chip[aria-pressed="false"] .pip, .chip[aria-pressed="false"] .ln { opacity: .35; }
.ln { display: inline-block; width: 16px; height: 0; border-top: 1.5px solid var(--muted); }
.ln.r { border-color: var(--route); } .ln.d { border-top-style: dashed; }

/* Walks */
.walks { display: flex; flex-direction: column; gap: 1px; }
.walks .wg { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 2px; }
.wr { display: flex; align-items: center; border-radius: 6px; }
.wr:hover { background: var(--soft); }
.wr.on { background: var(--route-soft); }
.wr .wn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; font-size: 13.5px; }
.wr .wn small { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.wr .tm { opacity: 1; }

.pip { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--todo); flex: none; }
.pip.b { background: var(--built); } .pip.p { background: var(--part); } .pip.t { background: none; box-shadow: inset 0 0 0 1.5px var(--todo); } .pip.x { background: var(--line); }

/* The middle */
.mid { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; }
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.mcr { flex: 1 1 240px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13.5px; color: var(--muted); }
.mcr button { color: var(--route); padding: 2px; }
.mcr button:hover { text-decoration: underline; }
.mcr b { color: var(--ink); font-weight: 600; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--route); color: var(--route); border-radius: 8px; padding: 3px 10px 3px 8px; font-size: 13px; font-weight: 500; }
.back:hover { background: var(--route); color: var(--on-route); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); }
.seg button { padding: 3px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--route); color: var(--on-route); }
.seg button:not([aria-pressed="true"]):hover { color: var(--ink); }
.seg button[disabled] { opacity: .45; cursor: default; }
.gtools { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 2px; }
.gtools button { width: 30px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.gtools button:hover { color: var(--route); background: var(--soft); }
.graph { position: relative; flex: 1; min-height: 0; background: var(--canvas); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#gsvg { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; font-family: var(--body); }
.graph.pan #gsvg { cursor: grab; } .graph.pan #gsvg:active { cursor: grabbing; }
.gmsg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); margin: 0; }
.gtip { position: absolute; z-index: 4; pointer-events: none; width: max-content; max-width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.gtip b { font-weight: 600; font-size: 14px; }
.gtip small { color: var(--muted); font-size: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.state { display: inline-flex; align-items: center; gap: 7px; }
.where { font-family: var(--mono); font-size: 12.5px; }

/* A walk, over the graph */
.walk { position: absolute; z-index: 3; left: 12px; bottom: 12px; width: min(440px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 3px 0 0 var(--route), var(--shadow); }
.walk .cap { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--route); font-weight: 600; font-variant-numeric: tabular-nums; }
.walk p { margin: 0; font-size: 14px; line-height: 1.5; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.act { border: 1px solid var(--route); color: var(--route); border-radius: 6px; padding: 3px 12px; font-size: 13px; font-weight: 500; }
.act:hover { background: var(--route); color: var(--on-route); }
.act[disabled] { opacity: .4; cursor: default; pointer-events: none; }
.act.quiet { border-color: transparent; color: var(--muted); }
.act.quiet:hover { background: none; color: var(--ink); }

/* Inside the Module Map */
.bx .bb { fill: var(--box); stroke: var(--line); stroke-width: 1; }
.bx.k-open .bb { fill: var(--well); }
.bx.k-scope .bb, .bx.k-map .bb { fill: var(--box); }
.bx.later .bb { stroke-dasharray: 5 4; fill: none; }
.bx .e { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); font-variant-numeric: tabular-nums; }
.bx .n { font-size: 14px; font-weight: 600; fill: var(--ink); transition: fill .2s; }
.bx .s { font-size: 12px; fill: var(--muted); }
.bx.hd { cursor: pointer; outline: none; }
.bx.hd:hover .n, .bx.sel .n, .bx.hd:focus-visible .n { fill: var(--route); }
.bx.sel .bb { stroke: var(--route); }
.div text { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); }
.div line { stroke: var(--line); stroke-dasharray: 2 4; }
.lcap { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); paint-order: stroke; stroke: var(--box); stroke-width: 4px; stroke-linejoin: round; pointer-events: none; }
.lcap.in { stroke: var(--well); }
.gl { fill: none; stroke: var(--muted); stroke-width: 1.1; opacity: .3; transition: opacity .2s, stroke .2s, stroke-width .2s; }
.gl.k-path { stroke: var(--route); opacity: .4; }
.gl.k-store { stroke-dasharray: 4 3; }
.gl.quiet { opacity: 0; }
.ga { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .42; transition: opacity .2s, stroke .2s; }
.ga.k-path { stroke: var(--route); opacity: .55; }
.ga.k-store { stroke-dasharray: 4 3; }
.gab rect { fill: var(--surface); stroke: var(--line); }
.gab text { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.gab { transition: opacity .2s; pointer-events: none; }
.mk-r { fill: var(--route); } .mk-m { fill: var(--muted); }
.dim .gl { opacity: .05; }
.dim .gl.quiet:not(.lit) { opacity: 0; }
.dim .gl.lit { opacity: 1; stroke: var(--route); stroke-width: 1.6; }
.dim .ga, .dim .gab { opacity: .07; }
.gh { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; }
.gh.quiet { pointer-events: none; }
.dim .gh.quiet.lit { pointer-events: stroke; }
#gsvg .gl.hl, #gsvg .ga.hl { opacity: 1; stroke: var(--route); stroke-width: 2; }
#gsvg .gl.off, #gsvg .ga.off { opacity: .04 !important; }
#gsvg .gh.off { pointer-events: none; }
.gc { cursor: pointer; outline: none; transition: opacity .25s; }
.gc .cb { fill: var(--card); stroke: var(--line); stroke-width: 1; transition: stroke .2s, fill .2s; }
.gc .cn { font-size: 13px; fill: var(--ink); pointer-events: none; }
.gc .cs { font-size: 12px; fill: var(--muted); pointer-events: none; }
.gc .ct { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.gc .ce { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; fill: var(--route); pointer-events: none; font-weight: 600; }
.gc .chev { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
.gc .tg { fill: transparent; }
.gc .tgw:hover .chev { stroke: var(--route); }
.gc .plug { fill: var(--line); }
.gc:hover .cb, .gc:focus-visible .cb { stroke: var(--route); }
.gc.k-head .cb { fill: var(--well); stroke: none; }
.gc.k-head .cn { font-weight: 600; font-size: 13.5px; }
.gc.k-head:hover .cn { fill: var(--route); }
.gc.k-seam .cb { fill: var(--route-soft); stroke: none; }
.gc.k-seam .cn { font-weight: 600; font-size: 14px; }
.gc .rule { stroke: var(--route); stroke-width: 2; opacity: .55; }
.gc.k-port .cb { stroke: var(--route); stroke-opacity: .45; }
.gc.sel .cb { stroke: var(--route); stroke-width: 1.5; fill: var(--route-soft); }
.gc.k-head.sel .cb { fill: var(--route-soft); }
.gc.k-seam.sel .cb { fill: var(--route-soft); stroke: var(--route); }
.gc .nb circle { fill: var(--route); } .gc .nb text { fill: var(--on-route); font-size: 10.5px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
.dim .gc { opacity: .38; }
.dim .gc.lit { opacity: 1; }
.dim .gc.lit .cb { stroke: var(--route); }
.dim .gc.lit .cn { font-weight: 500; }
.walking .gc.lit .cb { fill: var(--route-soft); }
#gsvg .gc.off { opacity: .16; }
.sd { stroke-width: 0; }
.s-b { fill: var(--built); } .s-p { fill: var(--part); } .s-t { fill: none; stroke: var(--todo); stroke-width: 1.4; } .s-x { fill: var(--todo); opacity: .55; }

/* The reading panel */
.right .scroll { padding: 4px 20px 28px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13px; color: var(--muted); padding: 2px 0 10px; }
.crumbs button { color: var(--route); padding: 1px 2px; }
.crumbs button:hover { text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 500; }
.sheet { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
h2 { font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; margin: 0; text-wrap: balance; line-height: 1.3; }
.sheet p { margin: 0; text-wrap: pretty; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.hand { color: var(--muted); font-size: 14px; }
.hand button, .lk { color: var(--route); font-weight: 500; }
.hand button:hover, .lk:hover { text-decoration: underline; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--line); width: 100%; }
.row:hover { background: var(--soft); }
.row .pip { align-self: center; }
.row b { font-weight: 500; }
.row small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; font-weight: 400; }
.row .more { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .more i { font-style: normal; color: var(--route); margin-left: 6px; }
.group { display: flex; flex-direction: column; gap: 6px; }
details { border-top: 1px solid var(--line); }
details:last-child { border-bottom: 1px solid var(--line); }
details + details { margin-top: -12px; }
summary { list-style: none; cursor: pointer; padding: 10px 2px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
summary h3 { font-size: 11.5px; }
summary::-webkit-details-marker { display: none; }
summary span { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
summary span::after { content: " +"; color: var(--route); font-weight: 600; }
details[open] summary span::after { content: " \2212"; }
summary:hover h3 { color: var(--route); }
.fold { padding: 0 2px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.fold ul, .fold ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.fold li small { display: block; margin-top: 2px; color: var(--muted); }
.fold li small button, .flow button { color: var(--route); font-size: 13px; }
.fold li small button:hover, .flow button:hover { text-decoration: underline; }
.flow { list-style: none; padding: 0 !important; }
.flow li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
.flow li > span { color: var(--muted); font-size: 12px; }
.flow .kd { color: var(--muted); font-size: 12px; }
.hint { color: var(--muted); margin: 0; font-size: 13.5px; }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.close { display: none; }
.scrim { display: none; }
.grab { display: none; }

  .close { display: inline-grid; }
  .left { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(330px, 88vw); transform: translateX(-102%); transition: transform .3s var(--ease); box-shadow: var(--shadow); }

  .grab { display: block; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  .right .phead { padding-top: 14px; }
  .scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); display: block; }
