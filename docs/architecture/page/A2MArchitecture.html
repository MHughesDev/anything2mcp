an absolute path and its digest; nothing from a caller is added to its arguments.", "where": "a2m-provider: src/supervisor/mod.rs", "never": ["Start a program a caller named."]}, "con-plugins": {"name": "Plug-In Host", "group": "Provider Contract", "state": "t", "text": "For providers written in other languages, run as separate processes speaking a fixed protocol, signed or off by default. Signature checking is not built; a plug-in is listed as present and not enabled.", "where": "a2m-provider: src/supervisor/"}, "mcp-endpoint": {"name": "MCP Endpoint", "group": "Front Door", "state": "b", "text": "An HTTP service, one endpoint per toolset, carried on the local channel on one machine. It holds no run state between requests: continuity is the run id.", "where": "a2m-mcp: src/http.rs", "never": ["Hold run state between requests."]}, "mcp-revisions": {"name": "Protocol Revisions", "group": "Front Door", "state": "b", "text": "Serves the newest stateless revision and an older one that opens with a handshake, with no session identifier for either. The protocol layer is the project's own.", "where": "a2m-mcp: src/protocol.rs"}, "mcp-list": {"name": "Tool List", "group": "Front Door", "state": "b", "text": "The use toolset lists twelve control tools; the build toolset adds the authoring ones. A target's pipelines fill the rest of a short list (19 by default). Single operations are reached by a2m_tool_search and a2m_tool_call. Names and descriptions come from published files; text from a target never reaches a tool's name or description. An action with no handler is never listed up front, so the build toolset's list holds only actions that run. A tool's name never carries a version. Each tool carries, in its _meta, the target's name, the version, and whether its description was drafted by rule or written by a builder.", "where": "a2m-mcp: src/tools.rs", "never": ["Let text from a target into a tool name."], "decided": ["Only a built action is listed up front in a toolset. Not: a higher cap on the list (0306).", "With each tool the MCP door sends the target's name, the version, and whether the description was drafted by rule or written by a builder, in the tool's _meta. Not: a client told nothing of whose words they are (0307).", "A tool stopped by a drift stays in the list with a mark, never left out (0396, not built).", "A tool's name carries no version; what a tool is, exactly, is its digest in _meta, anything2mcp/digest, which a client pins. Not: a major number in the name (0439; the digest is package YL2, not built)."]}, "mcp-call": {"name": "Call Mapping", "group": "Front Door", "state": "b", "text": "A name a2m_noun_verb is the action noun.verb; any other name is a call of that tool. A call may carry an idempotency key in its metadata. Calls are checked against the full schema.", "where": "a2m-mcp: src/tools.rs", "never": ["Branch on which client is calling, except through a profile."]}, "mcp-links": {"name": "Sign-In and Approval Links", "group": "Front Door", "state": "b", "text": "When a run rests at needs_login or needs_approval the result carries the link the person surface gave, and sends it as an elicitation where the client supports it. Giving the link to an agent is safe because following it approves nothing.", "where": "a2m-mcp: src/tools.rs"}, "mcp-results": {"name": "MCP Results", "group": "Front Door", "state": "b", "text": "Structured content, a short summary, resource links and annotations. Every string has passed the redactor in the dispatcher.", "where": "a2m-mcp: src/clean.rs"}, "mcp-long": {"name": "Progress and Long Runs", "group": "Front Door", "state": "p", "text": "A long action returns a run id. Pipelines map onto the protocol's tasks extension, answered from the run. Progress is sent only to a caller that asked.", "where": "a2m-mcp: src/tools.rs"}, "rest-actions": {"name": "Action Routes", "group": "Front Door", "state": "b", "text": "One route per action, generated from the registry. The router holds no route the registry did not generate except the two below, and never an approval route on the local channel.", "where": "a2m-api: src/router.rs", "never": ["Hold a hand-written route."]}, "rest-openapi": {"name": "OpenAPI Document", "group": "Front Door", "state": "b", "text": "The OpenAPI 3.1 description of every route, generated from the registry at /api/v1/openapi.json. It is the source the client libraries are generated from.", "where": "a2m-api: src/openapi.rs"}, "rest-events": {"name": "Run Events", "group": "Front Door", "state": "b", "text": "A page of a run's events from a sequence number, and the same as a stream that resumes from an event's number.", "where": "a2m-api: src/events.rs"}, "rest-webhooks": {"name": "Webhooks", "group": "Front Door", "state": "p", "text": "Reads the outbox, signs, posts, retries and records the outcome. It sends nowhere that settings and the egress rules do not name. The outbox table itself is not built yet.", "where": "a2m-api: src/lib.rs", "never": ["Send anywhere the settings do not name."]}, "rest-server": {"name": "Server Listener", "group": "Front Door", "state": "t", "text": "TLS, proxy headers, token checking through the kernel's verifier, and the console's approval page. Belongs to the shared server after the first release.", "where": "a2m-api"}, "pages-notify": {"name": "Notification", "group": "Person Surface", "state": "p", "text": "A system notification, and the link in the result of the waiting run. Not yet on every operating system.", "where": "a2m-local: src/surface.rs"}, "pages-loopback": {"name": "Loopback Listener", "group": "Person Surface", "state": "p", "text": "Serves the person's pages on the loopback address, on a random port, only while an approval, an act or a sign-in is pending. It checks Host and Origin, carries no API, and closes when nothing waits.", "where": "a2m-local: src/channel.rs", "never": ["Serve an API.", "Stay open with nothing pending."]}, "pages-approval": {"name": "Approval Page", "group": "Person Surface", "state": "p", "text": "Shows the diff read from the store, not rebuilt. Approve and Decline are equally easy. It expires with the approval window (15 minutes by default); a timeout is a decline. It names the caller and says in words what is not a field change, such as an upload or a send.", "where": "a2m-local: src/pages/approval.html", "never": ["Imply approval by silence."]}, "pages-act": {"name": "Act Page", "group": "Person Surface", "state": "p", "text": "Shows a person's act that an agent asked for, such as publishing, pinned to the hash of what the page shows. If drafts change before the press, nothing is published. A capture's page lists the surface, target, environment, bound and what is kept, begins the recording past the presence prompt, and then shows Stop recording, which ends it with no second prompt. A press whose prompt fails is refused by name, presence_failed or prompt_busy.", "where": "a2m-local: src/pages/act.html", "decided": ["The publish page names each asserted read and each launcher, from the review summary, with its fixed sentence (0394, 0398).", "A capture an agent asked for begins only when its person begins it here, past the presence prompt, told what is kept (0392).", "Stopping a recording asks for no prompt: it starts nothing and writes nothing to the system. Not: a second proof of presence that protects nothing (0433)."]}, "pages-signin": {"name": "Sign-In Window", "group": "Person Surface", "state": "p", "text": "A visible window of the engine's own browser at the system's sign-in page, labelled with the system and identity. The person signs in as always; the engine never asks for the password in its own interface and learns of success from a declared sign.", "where": "a2m-pack-web-ui: src/window.rs", "never": ["Ask for the password in its own interface."]}, "pages-presence": {"name": "Presence Prompt", "group": "Person Surface", "state": "p", "text": "The operating system's own user-presence prompt. The Linux prompt is built; on a headless machine, over SSH or in a container, nothing can approve.", "where": "a2m-local: src/presence.rs", "never": ["Accept a press from the page alone."], "decided": ["The product's presence prompt is the one door an approval rests on and has no setting that opens it; a copy test uses the copy test prompt of the copy test harness instead. Not: a setting that turns this prompt off (0304)."]}, "pages-desk": {"name": "Approval Recorder", "group": "Person Surface", "state": "b", "text": "Records an approval only when the presence prompt succeeded. It is not exposed through the local channel, so no command, tool or route can approve. It also ends a capture its person stops on the page, end_capture, and nothing else.", "where": "a2m-actions: src/person.rs", "never": ["Be reachable by an agent."]}, "bridge-stdio": {"name": "Standard Streams", "group": "Thin Client", "state": "b", "text": "Reads MCP messages from the client and writes the engine's answers. It is the binary itself, started by the bridge command.", "where": "a2m-mcp: src/proxy.rs"}, "bridge-find": {"name": "Engine Finder", "group": "Thin Client", "state": "b", "text": "Takes the start lock, starts the engine if nothing answers, and checks the socket or pipe is owned by the user. The runtime folder depends on nothing that differs between one user's processes: on macOS it is run in the data folder, and on Linux without XDG_RUNTIME_DIR it is the session folder the system made, when that is the user's own and closed. The engine writes the runtime folder it serves to engine.runtime beside the data folder's lock. If the engine is set to in-process mode it tells its caller instead of starting one.", "where": "a2m-local: src/start.rs", "decided": ["The runtime folder does not follow a variable that differs between one user's processes. Not: say in the documents that a process without the variable is not served, or the data folder on Linux too, where a network home folder cannot hold a socket (0432)."]}, "bridge-link": {"name": "Message Relay", "group": "Thin Client", "state": "b", "text": "Copies messages unchanged. It holds no engine logic, makes no decision, and keeps no state.", "where": "a2m-mcp: src/proxy.rs", "never": ["Hold engine logic."]}, "bridge-engine-note": {"name": "Engine MCP Endpoint", "group": "Thin Client", "state": "b", "text": "The same endpoint the network front door would use, reached on the local channel.", "where": "a2m-mcp: src/http.rs"}, "cli-tree": {"name": "Command Tree", "group": "Thin Client", "state": "b", "text": "Built from the registry: anything2mcp noun verb. A short name, a2m, runs the same program. Shortcuts are a word and a fixed list of actions. The shortcut ready runs draft.ready, so a read-only tool is add, ready, the person's press on the publish page, and call.", "where": "anything2mcp: src/cli/parse.rs"}, "cli-client": {"name": "Local Channel Client", "group": "Thin Client", "state": "b", "text": "Connects to the engine's socket or pipe, checks it belongs to the same user, starts it under a lock if it is not running, and sends the action. It holds no engine logic. Refused engine_running with no engine in its own runtime folder, it reads engine.runtime and names the engine's runtime folder in the fix; it never connects there.", "where": "anything2mcp: src/cli/client.rs", "never": ["Hold engine logic.", "Approve anything."]}, "cli-render": {"name": "Output and Exit Codes", "group": "Thin Client", "state": "b", "text": "Prints each response the same way, as text or JSON, and chooses the exit code from the response's exit class and nothing else.", "where": "anything2mcp: src/cli/render.rs"}, "cli-process": {"name": "Process Commands", "group": "Thin Client", "state": "b", "text": "serve runs the engine, bridge runs the stdio proxy, runner is a worker. These act on the process and are carried out in the client end.", "where": "anything2mcp: src/cli/process.rs"}, "watch-create": {"name": "Watch Request", "group": "Watches", "state": "p", "text": "watch.create takes a published read of effect class read, one fixed input, an interval (at least a minute) and an end no more than seven days away. Nothing from a result is ever carried into a later input.", "where": "a2m-actions: src/handlers/watches.rs", "never": ["Change its input after it is made."]}, "watch-confirm": {"name": "Person Confirmation", "group": "Watches", "state": "p", "text": "A watch's checks begin only after its person confirms it on the engine's page. An agent cannot confirm.", "where": "a2m-actions: src/handlers/watches.rs", "never": ["Be confirmed by an agent."]}, "watch-schedule": {"name": "Due Times", "group": "Watches", "state": "p", "text": "Works out when each check is due, on the store's clock, and admits it as the lowest priority work. A gap in due times is recorded.", "where": "a2m-sched: src/watch.rs"}, "watch-check": {"name": "Watch Check", "group": "Watches", "state": "p", "text": "An ordinary run of the read under the person's session. A watch changes nothing in the system: it reads only.", "where": "a2m-engine", "never": ["Write to a system."]}, "watch-compare": {"name": "Baseline Comparison", "group": "Watches", "state": "p", "text": "Reduces the normalized result to canonical digests and compares them with the previous check's. A condition, written in the expression language over the new result, is evaluated here.", "where": "a2m-ledger: src/watch_compare.rs"}, "watch-changes": {"name": "Changes", "group": "Watches", "state": "p", "text": "The recorded differences: added, changed, removed. Only digests are kept. A caller reads them with watch.changes after a number and gets the runs of the checks, never a value.", "where": "a2m-ledger: src/watch.rs", "never": ["Keep a value."]}, "watch-end": {"name": "Watch End", "group": "Watches", "state": "p", "text": "A watch ends at its end time, when its condition holds on a check's own result, when its person or its caller ends it, or when its operation's version is withdrawn. Two watches of the same read for one person share a run.", "where": "a2m-ledger: src/watch.rs"}, "web-ui": {"name": "Web Drivers", "group": "Web Pack", "state": "p", "text": "Three drivers over the same browser: ui drives the interface by role and name, page_http sends the application's own requests from inside the signed-in page, and site_tools calls tools the page registers. It also holds the widget drivers, the screens schema and the sign-in providers that need a browser. The first web writes are built through it; some drivers are still in progress. Each of its modes states three minutes for prepare: the browser's two-minute launch deadline and the calls that open the tab (0427). A read whose browser is lost goes on in a new browser of the same profile, and a write is never sent again (0424, 0428).", "where": "a2m-pack-web-ui", "never": ["Decide whether something may happen.", "Retry inside a step."], "rows": [{"title": "Web Modes", "cols": [{"ids": ["webui-ui", "webui-page-http", "webui-site-tools"]}]}, {"title": "Web Helpers", "cols": [{"ids": ["webui-widgets", "webui-screens", "webui-signin", "webui-expiry", "webui-page-requests"]}]}], "edges": [["webui-screens", "webui-ui", "locators, ordered by role and name", "path", 1], ["webui-widgets", "webui-ui", "set and read one control", "path", 2], ["webui-ui", "webui-expiry", "what the page answered", "path", 3], ["webui-signin", "webui-expiry", "the sign-in page it must recognise", "use"], ["webui-page-requests", "webui-ui", "asserted reads of a published version", "use"], ["webui-page-requests", "webui-page-http", "the requests a page makes", "use"]], "steps": [{"text": "A binding names a mode; the matching driver prepares an observing tab in the identity's browser profile.", "at": ["webui-ui", "webui-page-http", "webui-site-tools"]}, {"text": "The ui driver finds each element from the screen model's ordered locators and checks its fingerprint.", "at": ["webui-screens", "webui-ui"]}, {"text": "A widget driver sets the control the way that control needs and reads it back.", "at": ["webui-widgets"]}, {"text": "Every act is reported as sent, not sent or unknown. Unknown after a click that could have saved is possible_commit.", "at": ["webui-ui"]}, {"text": "If the application's own sign-in screen appears in place of the expected one, the driver stops with session_expired and tells the keeper.", "at": ["webui-expiry", "webui-signin"]}], "stepsTitle": "ui Step Sequence"}, "webui-ui": {"name": "ui", "group": "Web Pack", "state": "p", "text": "Acts on elements by role, label, text or test id, never by pixel or position. Used for writes that must pass the application's own validation, and for applications with no usable traffic. The risk is layout and label change, which a fingerprint check turns into a stop. A read whose browser is lost goes on in a new browser of the same profile, with only its observing tab opened again (0424).", "where": "a2m-pack-web-ui: src/driver.rs", "never": ["Click by position."]}, "webui-page-http": {"name": "page_http", "group": "Web Pack", "state": "p", "text": "Sends requests from inside the signed-in page, with the page's own session, cookies and headers, to origins the tool declared. Fast reads, and proven writes, without driving the interface. A read whose browser is lost places the run's state in a new browser of the same profile, opens the observing tab again, and does the last goto again before its request; a write is sent only from the acting tab and never again after a lost browser.", "where": "a2m-pack-web-ui: src/page_http.rs", "never": ["Send to an origin the tool did not declare."], "decided": ["A page-request read whose browser is lost goes on as a ui read does, through one Reopen shared by both drivers. Not: let the read fail and the person run the tool again, or do every goto since prepare again (0428)."]}, "webui-site-tools": {"name": "site_tools", "group": "Web Pack", "state": "t", "text": "Calls tools a site registers in the browser for agents, with typed arguments, after checking the tool and its schema digest against the binding. An early standard offered by few sites.", "where": "a2m-pack-web-ui: src/driver.rs"}, "webui-widgets": {"name": "Widget Drivers", "group": "Web Pack", "state": "p", "text": "One driver per kind of control: text, number, select, combobox, date, checkbox, radio, slider, file, rich text. Each says how to set and how to read back. For text it escalates from fill to key-by-key typing to the native setter, as one strategy in one step. An unknown control is a stop.", "where": "a2m-pack-web-ui: src/window.rs", "never": ["Guess a control."]}, "webui-screens": {"name": "Web Screen Models", "group": "Web Pack", "state": "p", "text": "The only place locators live: ordered locators by role and name, fingerprints, frame paths and variants of a page. Platform profiles, kept as data, say which locators to prefer and what the support tier lets it write.", "where": "a2m-pack-web-ui: src/screens.rs", "decided": ["The platform profile once named after a real framework is server_postback_forms, detected by a hidden field that carries the page's state between postbacks, with no ready rule of its own. Not: keep the framework's readiness script, which names it and was never run (0390, 0402)."]}, "webui-signin": {"name": "Browser Sign-In", "group": "Web Pack", "state": "p", "text": "form_login fills the application's sign-in page with a stored credential, tried once. window_login, sso_oidc and sso_saml open a visible window of the engine's own browser for the person to sign in. The keeper decides when; the pack only does the browser part.", "where": "a2m-pack-web-ui: src/sign_in.rs", "never": ["Try a refused credential twice."]}, "webui-expiry": {"name": "Expiry and Block Signs", "group": "Web Pack", "state": "p", "text": "Recognises a sign-in page, an edge block or an expiry sign in a page or a response and reports it. It acts on none: the keeper decides, and a block is a named stop. Not built in page_http.", "where": "a2m-pack-web-ui: src/sign_in.rs", "never": ["Answer a challenge."]}, "web-probe": {"rows": [{"title": "Probe Observation", "cols": [{"ids": ["probe-identify", "probe-snapshot"]}]}, {"title": "Traffic Learning", "cols": [{"ids": ["probe-capture", "probe-infer"]}]}, {"title": "Probe Presentation", "cols": [{"ids": ["probe-site-tools", "probe-describe"]}]}], "edges": [["probe-identify", "probe-snapshot", "a surface and its kind", "path", 1], ["probe-snapshot", "probe-describe", "screens, fields and actions seen", "path", 2], ["probe-capture", "probe-infer", "exchanges seen in use", "use"], ["probe-infer", "probe-describe", "inferred endpoints", "use"], ["probe-site-tools", "probe-describe", "tools the page registers", "use"]], "steps": [{"text": "Surface Identification: its platform, framework, support tier, sign-in method and any candidate surfaces it plainly offers.", "at": ["probe-identify"]}, {"text": "Take snapshots of pages with an observing tab, following only plain links, and report screens, fields and actions as findings with their coverage.", "at": ["probe-snapshot"]}, {"text": "Read what the site declares for agents, as untrusted findings.", "at": ["probe-site-tools"]}, {"text": "Traffic Capture records a page's own requests by structure, and web_use a person's use in a watching tab. Endpoint Inference groups them into endpoint shapes and drafts reads, and holds a request that may write with a question.", "at": ["probe-capture", "probe-infer"]}, {"text": "The describer shows an agent, in compact text, what was seen and what was not.", "at": ["probe-describe"]}], "stepsTitle": "Probe Sequence", "name": "Web Probe", "group": "Web Pack", "where": "a2m-pack-web-probe", "state": "p", "text": "Says what a web surface is and what is on it, without ever acting on it. It identifies the surface, takes snapshots as findings, reads what a site declares for agents, captures a page's own requests through the capture contract, and captures a person's use in a watching tab with web_use. Inference from a capture is built in the probe and the web pack's drafting rules; the action that drafts from stored recordings, endpoints.infer, has no handler.", "never": ["Press, type or submit.", "Enter a surface the target did not declare."], "decided": ["The capture package needs the sign-in window and not every sign-in provider. Writes from a capture wait for the first verified web write. Not: wait for every provider (0308).", "web_use opens its watching tab in a profile of its own, watching, and puts each request to the screen the person was on when it was taken. Not: put each request to the screen whose snapshot comes next, or take the requests at every change of the address (0442)."], "walks": [{"name": "Watched Use", "steps": [{"text": "The person begins a capture on the engine's page and uses the system in a watching tab. The engine only listens.", "at": ["probe-capture"]}, {"text": "Each request is kept by structure through the capture contract: method, path, and the names and kinds of its fields.", "at": ["probe-capture", "probe-infer"], "edges": [["probe-capture", "probe-infer"]]}, {"text": "A GET seen twice in one shape becomes a drafted read. A POST seen twice becomes a held page request with a question.", "at": ["probe-infer"]}, {"text": "The describer says what was seen, and that nothing the person did not use was looked at.", "at": ["probe-infer", "probe-describe"], "edges": [["probe-infer", "probe-describe"]]}]}]}, "probe-identify": {"name": "Surface Identification", "group": "Web Pack", "state": "p", "text": "Says what a web surface is: platform, framework, support tier, sign-in method, and candidate surfaces. It sends only a navigation to an address it was given or found as a plain link.", "where": "a2m-pack-web-probe: src/look.rs", "never": ["Enter a surface the target did not declare."]}, "probe-snapshot": {"name": "Snapshot Findings", "group": "Web Pack", "state": "p", "text": "Turns a snapshot of the accessibility tree into findings: screens, fields and actions seen. Pages of one screen whose addresses differ in one segment are joined under one address with a placeholder. It never presses, types or submits.", "where": "a2m-pack-web-probe: src/screen.rs", "never": ["Press, type or submit."]}, "probe-capture": {"name": "Traffic Capture", "group": "Web Pack", "state": "b", "text": "Records the requests a page makes, by structure, through the capture contract. Built: the probe's web_capture reads a page's own requests in an observing tab, recording started before the page loads. And web_use, called by DiscovererHandle::watch, captures a person's own use in a watching tab for every method, with a request's body as its fields' names and kinds, read only through take_capture; its bound is 1800 seconds. It gives exchange findings with how often each was seen and in how many shapes, and screen findings marked seen_by: person. Started only by the person whose use it records, and no proxy is set between another program and the network.", "where": "a2m-pack-web-probe: src/watch.rs, src/infer.rs", "decided": ["The probe declares traffic_capture for web and reads its tab only through take_capture. Not: a path private to the web pack (0391).", "An exchange seen is discovered; a path with a placeholder, and every draft from a capture, is inferred and sampled, and goes to the holding folder (0392, amending 0308)."]}, "probe-infer": {"name": "Endpoint Inference", "group": "Web Pack", "state": "p", "text": "Groups exchanges into endpoints, templates paths in two tiers, infers request and response shapes and the dependencies between requests, by comparing digests so no value is stored. Everything inferred stays at the inferred level. The scout drafts endpoints from them through the HTTP pack. The first inference drafts reads only, each to the holding folder. A request by a method that may write is drafted only as a held page request with a question, never as a read. Built for a capture of a person's use: what it saw at least twice in one shape is drafted held, and a request seen once is drafted as nothing.", "where": "a2m-pack-web-probe: src/infer.rs", "decided": ["The first inference drafts a read only for a GET answered with success and a structured body, seen at least twice with one shape; a placeholder in a path comes only from two requests that differ in that one part. Every draft goes to the holding folder at the inferred level. Not: draft writes from what a person did (0308).", "A request by a method that may write, seen twice with one shape, becomes a held page request: its body schema drafted from field names and kinds, a question in place of its effect, and no operation. A person answers by writing read_asserted. Not: let through a request whose path holds a word such as search (0392, 0394)."]}, "probe-site-tools": {"name": "Site-Declared Tools", "group": "Web Pack", "state": "p", "text": "Reads the tools a page registers for agents, as untrusted findings.", "where": "a2m-pack-web-probe: src/discover.rs", "never": ["Trust a site's own description of a tool."]}, "probe-describe": {"name": "Describer", "group": "Web Pack", "state": "p", "text": "Shows an agent, in compact text, what was seen, and what was not looked at.", "where": "a2m-pack-web-probe: src/describe.rs"}, "web-browser": {"rows": [{"title": "Browser Startup", "cols": [{"ids": ["wb-launch", "wb-tabs", "wb-watching"]}]}, {"title": "Page Interaction", "cols": [{"ids": ["wb-locate", "wb-act", "wb-wait"]}]}, {"title": "Page Observation", "cols": [{"ids": ["wb-snapshot", "wb-requests"]}]}, {"title": "Containment", "cols": [{"ids": ["wb-origins", "wb-failures", "wb-safe"]}]}], "edges": [["wb-launch", "wb-tabs", "a browser with its own data directory", "path", 1], ["wb-tabs", "wb-locate", "a tab, acting or only observing", "path", 2], ["wb-locate", "wb-act", "exactly one element", "path", 3], ["wb-act", "wb-wait", "an act, then its event", "path", 4], ["wb-tabs", "wb-snapshot", "the page's accessibility tree", "use"], ["wb-tabs", "wb-requests", "a request from inside the page", "use"], ["wb-origins", "wb-tabs", "the origins a tab may reach", "use"], ["wb-act", "wb-failures", "whether the input reached the page", "use"], ["wb-safe", "wb-tabs", "the asserted reads a tab may let through", "use"], ["wb-origins", "wb-watching", "the origins the surface declares", "use"], ["wb-watching", "wb-requests", "the person's requests, by structure", "use"]], "steps": [{"text": "The pack starts a browser through the supervisor, with a data directory the engine owns, one per target, environment and identity.", "at": ["wb-launch"]}, {"text": "Each run gets its own tab in that profile, set to the target's fixed viewport, locale, time zone and colour scheme. A tab is either allowed to act or only to observe.", "at": ["wb-tabs"]}, {"text": "An element is found by role and name, through a helper in an isolated world, and must resolve to exactly one element.", "at": ["wb-locate"]}, {"text": "An act checks the element is actionable and acts in one in-page call.", "at": ["wb-act"]}, {"text": "Condition Waits end on a named event or in-page observer, with a deadline. Nothing polls and nothing sleeps for a fixed time.", "at": ["wb-wait"]}, {"text": "Page Snapshots are built from the accessibility tree in one form shared by evidence and discovery.", "at": ["wb-snapshot"]}, {"text": "The tab is held to the origins it was opened for. A download, a new window or a crash is reported, and for each act the browser says whether its input reached the page.", "at": ["wb-origins", "wb-failures"]}], "stepsTitle": "Page Lifecycle", "name": "Browser Engine", "group": "Web Pack", "where": "a2m-pack-web-browser", "state": "b", "text": "Starts the engine's own browser with a data directory the engine owns, opens tabs that may act, only observe, or only listen while a person acts, finds one element by role and name, acts, waits on named events, builds snapshots, and keeps each tab on the origins it was opened for.", "never": ["Drive the person's everyday browser profile.", "Hide that it is automation."], "walks": [{"name": "Asserted Read", "steps": [{"text": "A read of a published version runs in an observing tab. The driver hands the tab the version's asserted reads.", "at": ["wb-tabs", "wb-safe"], "edges": [["wb-safe", "wb-tabs"]]}, {"text": "The page asks for its rows by POST. The tab holds the request and reads its body in memory.", "at": ["wb-tabs", "wb-requests"], "edges": [["wb-tabs", "wb-requests"]]}, {"text": "The request matches one asserted read in method, origin, path template and body shape, so it goes on to the surface.", "at": ["wb-safe", "wb-origins"]}, {"text": "Any other request that may write is failed before it leaves the browser, and the read stops as policy, page_write_refused.", "at": ["wb-safe", "wb-failures"]}, {"text": "The page draws its rows, and the value is read from the screen as in any ui read.", "at": ["wb-locate"]}]}]}, "wb-launch": {"name": "Browser Launch", "group": "Web Pack", "state": "b", "text": "Starts a browser program through the supervisor with a data directory the engine owns. It never connects to a browser it did not start and never reads another program's cookie store. Each browser's processes are measured from its own list of them: past MEMORY_LIMIT, 2 GiB, it is recycled between runs, and while the browsers hold MEMORY_CEILING, 4 GiB, no new browser work starts and a call answers busy, memory_short. One browser of one tab measured 188 to 327 MiB on Windows, macOS and Linux in CI, so one pair holds on all three systems.", "where": "a2m-pack-web-browser: src/launch.rs", "never": ["Drive the person's everyday browser profile.", "Hide that it is automation."], "decided": ["One pair of memory figures for all three systems, read from CI's runs on each. Not: a pair set per system, which the figures did not call for (0425)."]}, "wb-tabs": {"name": "Tab Postures", "group": "Web Pack", "state": "b", "text": "One browser process per profile, shared by many tabs. A tab has a fixed environment and a posture: one that may act, one that may only observe, or a watching tab, where a person acts and the engine only listens. A tab that sees its page crash or its target go, while the engine has not released it, counts its browser as lost and closes the link, so the next open of the profile starts a new browser whatever order the pipe and the process end in, as they do on Windows. Observing tabs fail every request that could write, except an asserted read a published version hands them.", "where": "a2m-pack-web-browser: src/tab.rs", "decided": ["A capture of a person's use runs in a watching tab; the scout keeps the observing tab, where every request that may write is failed. Not: capture in the observing tab (0392, superseding point 1 of 0308)."]}, "wb-locate": {"name": "Web Locator", "group": "Web Pack", "state": "b", "text": "Resolves a query to exactly one rendered element across open shadow roots. No XPath, no pixel position.", "where": "a2m-pack-web-browser: src/structure.rs", "never": ["Use XPath or a pixel position."], "decided": ["A read may find again an element the page drew again, by the query that found it, only when that query matches exactly one element; none or more than one is a stop. An act never finds an element again (0379, 0390)."]}, "wb-act": {"name": "Actionability and Input", "group": "Web Pack", "state": "b", "text": "Checks the element can take the action and acts, with the check and the focus in one in-page call. An element is valid for one page generation; using a stale one fails.", "where": "a2m-pack-web-browser: src/page_write.rs"}, "wb-wait": {"name": "Condition Waits", "group": "Web Pack", "state": "b", "text": "Condition Waits end on a protocol event or an in-page observer, with a deadline. No polling.", "where": "a2m-pack-web-browser: src/page_read.rs", "never": ["Sleep a fixed time."]}, "wb-snapshot": {"name": "Page Snapshots", "group": "Web Pack", "state": "b", "text": "Builds the compact accessibility snapshot, one builder for a run's evidence and for discovery.", "where": "a2m-pack-web-browser: src/snapshot.rs"}, "wb-requests": {"name": "Page Requests", "group": "Web Pack", "state": "p", "text": "Sends a request from inside the page with its session. An observing tab also records each request its page makes by itself, as names and kinds only.", "where": "a2m-pack-web-browser: src/page_read.rs"}, "wb-origins": {"name": "Origin Confinement", "group": "Web Pack", "state": "b", "text": "Holds every request of a tab's page, frames and workers to the surface's origin and the destinations its tool declared, and refuses what leaves the page. A move to another origin, a new window or a download stops the run.", "where": "a2m-pack-web-browser: src/origin.rs", "never": ["Let a page send anywhere it likes."]}, "wb-failures": {"name": "Crash and Dialog Reports", "group": "Web Pack", "state": "b", "text": "Detects a crash, a disconnect and a dialog, and says for each act whether its input reached the page. After a committing click, unknown is possible_commit.", "where": "a2m-pack-web-browser: src/error.rs"}, "web-refuses": {"name": "Web Refusals", "group": "Web Pack", "state": "b", "text": "Refuses the everyday browser profile, any browser the engine did not start, hiding automation, answering a challenge (a block is the named stop edge_blocked), clicking by position, XPath, any origin the target did not declare, and any unrecognised page, dialog or control.", "where": "a2m-pack-web-ui", "never": ["Hide automation.", "Answer a challenge.", "Guess."]}, "http-catalog": {"name": "Endpoint Catalog", "group": "HTTP Pack", "state": "b", "text": "The endpoints/ file kind: for each endpoint its method, path template, request template, status codes, answer form and shapes. The compiler turns it into the pack's own request templates. Another pack, such as the web pack, may read entries as data. Every placeholder has a position and an encoding, so an input cannot change where a request goes.", "where": "a2m-pack-http: src/endpoints.rs", "never": ["Let an input change where a request goes."]}, "http-shape": {"name": "Shape Check", "group": "HTTP Pack", "state": "b", "text": "Checks an answer against the endpoint's response shape, a closed subset of JSON Schema written inside the entry. A property marked nullable may be null; a property not listed as required may be missing; a null where the file does not say so, or a value of another kind, stops the read as drift. Unknown means stop.", "where": "a2m-pack-http: src/shape.rs", "never": ["Guess at an unexpected answer."], "decided": ["The shape moves to the provider contract, as Body Shape, and this check uses it unchanged (0394)."]}, "http-forms": {"name": "Answer Forms", "group": "HTTP Pack", "state": "p", "text": "JSON is the default. XML is read by declared paths in a closed language, text by character set and an anchored pattern, bytes by length and digest.", "where": "a2m-pack-http: src/forms.rs"}, "http-description": {"rows": [{"cols": [{"title": "Retrieval Stage", "ids": ["hd-source"]}, {"title": "Redaction Stage", "ids": ["hd-redact"]}, {"title": "Parsing Stage", "ids": ["hd-parse"]}, {"title": "Findings Stage", "ids": ["hd-findings"]}]}], "edges": [["hd-source", "hd-redact", "the description's text", "path", 1], ["hd-redact", "hd-parse", "text with secrets removed", "path", 2], ["hd-parse", "hd-findings", "each operation, parsed", "path", 3]], "steps": [{"text": "The description arrives as a file the person put among the Input Files, or is fetched from the surface by a read-only request.", "at": ["hd-source"]}, {"text": "Its text passes the redactor before it is parsed.", "at": ["hd-redact"]}, {"text": "It is parsed within bounds on depth, steps and bytes. OpenAPI 3.0 and 3.1 and the older Swagger 2.0 form are read; one past a bound is refused as input.", "at": ["hd-parse"]}, {"text": "Each operation becomes a described_operation finding at the inferred level, source published description. Whether the system answers is a separate, later observation.", "at": ["hd-findings"]}], "stepsTitle": "Description Reading", "name": "Description Reader", "group": "HTTP Pack", "where": "a2m-pack-http: src/openapi.rs", "state": "b", "text": "Takes a description a service publishes about itself, from a file or from the surface, removes secrets from its text, parses it within bounds, and turns each operation into a finding. A description is a claim; it is never taken for an observation."}, "hd-source": {"name": "Description Source", "group": "HTTP Pack", "state": "b", "text": "Takes a description given as a file from the Input Files, or asks the surface for it with GET, HEAD or OPTIONS only. The discoverer is handed a read client that can build nothing else.", "where": "a2m-pack-http: src/discover.rs", "never": ["Send anything that could write."]}, "hd-redact": {"name": "Early Redaction", "group": "HTTP Pack", "state": "b", "text": "The text passes the redactor before parsing, so a secret in a description never reaches a finding.", "where": "a2m-pack-http: src/discover.rs"}, "hd-parse": {"name": "Description Parser", "group": "HTTP Pack", "state": "b", "text": "Reads OpenAPI 3.0 and 3.1 and Swagger 2.0 within bounds. The first copy test found the older Swagger form was refused; it is now read. GraphQL and OData descriptions are in the design.", "where": "a2m-pack-http: src/openapi.rs"}, "hd-findings": {"name": "Description Findings", "group": "HTTP Pack", "state": "b", "text": "Each operation becomes a finding at the inferred level. A description saying an endpoint exists is a claim; the endpoint answering is a separate observation at discovered, and the two are never shown as the same.", "where": "a2m-pack-http: src/discover.rs"}, "http-draft": {"rows": [{"cols": [{"title": "Selection Stage", "ids": ["hdr-safe"]}, {"title": "Drafting Stage", "ids": ["hdr-endpoint", "hdr-read"]}, {"title": "Shaping Stage", "ids": ["hdr-null"]}, {"title": "Naming Stage", "ids": ["hdr-names"]}]}], "edges": [["hdr-safe", "hdr-endpoint", "operations marked safe", "path", 1], ["hdr-endpoint", "hdr-read", "endpoint entries", "path", 2], ["hdr-read", "hdr-names", "the drafted reads", "path", 3], ["hdr-endpoint", "hdr-null", "a response shape to mark nullable", "use"]], "steps": [{"text": "Only operations the description marks safe are drafted. A method it does not mark safe describes a write, and the drafter refuses it.", "at": ["hdr-safe"]}, {"text": "An endpoint entry is written with field types from the description's schema, tied to the target's surface only when exactly one surface fits.", "at": ["hdr-endpoint"]}, {"text": "A property the description does not list as required is drafted as possibly null, since many systems say absent with a null and few descriptions say so.", "at": ["hdr-null"]}, {"text": "One read operation is written for each safe method that answers with a body, using the description's own example only.", "at": ["hdr-read"]}, {"text": "No two drafted tools share a name or a file.", "at": ["hdr-names"]}], "stepsTitle": "Finding Drafting", "name": "Endpoint Drafting", "group": "HTTP Pack", "where": "a2m-pack-http: src/draft.rs", "state": "b", "text": "Turns findings into endpoint entries and one read for each safe method, tied to a surface only when exactly one fits. A property the description does not require is drafted as possibly null. A draft with an open question goes to the holding folder. A property or parameter named as a secret is left out of the draft, never drafted as an output or an input; a read whose required parameter is such a one is not drafted and is reported. The compiler's refusal stays as the guarantee. A sign-in the description declares is kept; a read is never sent without a credential to find out whether the system answers anyway.", "never": ["Draft a write."], "decided": ["A property whose name is a secret's is never drafted as an output or as an input, and the read says so in its description. Not: draft it and let the compiler refuse the whole target (0302).", "An endpoint is drafted without a credential only where the description says the operation takes none; a person who knows better writes that line by hand. Not: try each read with no credential first (0303)."]}, "hdr-safe": {"name": "Safe Methods", "group": "HTTP Pack", "state": "b", "text": "Drafts only for methods the description marks safe. Anything else is left to the developer, and a drafted read must be a read.", "where": "a2m-pack-http: src/draft.rs", "never": ["Draft a write."]}, "hdr-endpoint": {"name": "Endpoint Entries", "group": "HTTP Pack", "state": "b", "text": "Writes the endpoint file with field types from the schema. It ties an endpoint to a surface only when the target declares exactly one surface of that kind; otherwise the surface is an open question that goes to the holding folder.", "where": "a2m-pack-http: src/draft.rs"}, "hdr-read": {"name": "Read Operations", "group": "HTTP Pack", "state": "b", "text": "One read for each safe method with a body, carrying only the example the description itself published. No test or fixture is drafted.", "where": "a2m-pack-http: src/draft.rs"}, "hdr-null": {"name": "Nullable Rule", "group": "HTTP Pack", "state": "b", "text": "Decision 0297: a property not under required is written nullable, at any depth. It applies to an answer's shape only, not to request bodies or parameters. The check does not change. The compiled target's output will say beforehand that such an output may be absent, and the output schema will admit null for it (decision 0305, roadmap package FT7); this is not built yet.", "where": "a2m-pack-http: src/openapi.rs", "decided": ["In the HTTP pack an output may be absent exactly when its extract path is not certain in the answer's shape; a person may declare it by hand with may_be_absent. Not: mark every output as possibly absent (0305)."]}, "hdr-names": {"name": "Unique Names", "group": "HTTP Pack", "state": "b", "text": "No two drafted tools share a name or a file. This was fixed after the first copy test found two drafts with one name.", "where": "a2m-pack-http: src/draft.rs"}, "http-driver": {"rows": [{"title": "Connection Phase", "cols": [{"ids": ["hdrv-prepare"]}]}, {"title": "Action Phase", "cols": [{"ids": ["hdrv-token", "hdrv-request"]}]}, {"title": "Validation Phase", "cols": [{"ids": ["hdrv-validate", "hdrv-failures"]}]}, {"title": "Proof Phase", "cols": [{"ids": ["hdrv-readback"]}]}], "edges": [["hdrv-prepare", "hdrv-token", "a warm connection with the credential", "path", 1], ["hdrv-token", "hdrv-request", "the token, if the endpoint needs one", "path", 2], ["hdrv-request", "hdrv-validate", "the answer, status and body", "path", 3], ["hdrv-validate", "hdrv-readback", "a valid answer to a write", "path", 4], ["hdrv-request", "hdrv-failures", "sent, not sent, or unknown", "use"]], "steps": [{"text": "Connection Preparation: a warm connection per session and origin, with the credential injected by the session lease.", "at": ["hdrv-prepare"]}, {"text": "If the endpoint needs an anti-forgery token, fetch it first.", "at": ["hdrv-token"]}, {"text": "Build the request position by position from the template and send it once. A redirect is never followed.", "at": ["hdrv-request"]}, {"text": "Answer Validation: the status must be one the endpoint declares and the body must fit its shape.", "at": ["hdrv-validate"]}, {"text": "Every failure says whether the request was sent. A write that was sent with no verdict is possible_commit.", "at": ["hdrv-failures"]}, {"text": "For a write, the driver reads the record back through the endpoint the binding names, or uses the save's own response.", "at": ["hdrv-readback"]}], "stepsTitle": "HTTP Step Sequence", "name": "HTTP Driver", "group": "HTTP Pack", "where": "a2m-pack-http: src/driver.rs", "state": "b", "text": "Carries out one step: prepare a connection, fetch any anti-forgery token, send the request once, validate the answer, and for a write read the record back. It never retries, never follows a redirect, and reports whether a request was sent.", "never": ["Retry inside a step.", "Follow a redirect."]}, "hdrv-prepare": {"name": "Connection Preparation", "group": "HTTP Pack", "state": "b", "text": "Opens a warm client for the session and origin. It sends the session's credential only to an endpoint that takes it, and never over a plain link to another machine.", "where": "a2m-pack-http: src/driver.rs", "never": ["Send a credential over an unencrypted link to another machine."]}, "hdrv-token": {"name": "Anti-Forgery Token", "group": "HTTP Pack", "state": "b", "text": "Fetches a token the endpoint declares it needs, before the request.", "where": "a2m-pack-http: src/driver.rs"}, "hdrv-request": {"name": "Request Sender", "group": "HTTP Pack", "state": "b", "text": "Builds the request position by position from the template, sends it once, and holds the answer. Outside a live run, a request that may write is refused unsent. Headers beginning a2m- never leave the product.", "where": "a2m-pack-http: src/template.rs", "never": ["Follow a redirect.", "Use a proxy.", "Retry."]}, "hdrv-validate": {"name": "Answer Validation", "group": "HTTP Pack", "state": "b", "text": "Accepts only a status the endpoint declares and a body that fits its shape. A 404 on a declared lookup is an answer: the record is absent.", "where": "a2m-pack-http: src/driver.rs"}, "hdrv-failures": {"name": "Send Outcome", "group": "HTTP Pack", "state": "b", "text": "Each failure reports sent, not sent or unknown. A lost connection before any byte of a write is transient; a write sent in whole or part with no complete answer is possible_commit. Only the application's own verdict settles a sent write.", "where": "a2m-pack-http: src/driver.rs"}, "hdrv-readback": {"name": "HTTP Read-Back", "group": "HTTP Pack", "state": "b", "text": "Reads the record through the GET endpoint the binding names, or from the save response when the binding prefers it. The engine does the comparison.", "where": "a2m-pack-http: src/driver.rs"}, "http-signin": {"name": "Sign-In Division", "group": "HTTP Pack", "state": "b", "text": "The auth provider in the keeper's crate holds and injects the credential; this driver only carries out the scheme's round trips on the connection: digest challenges, the Windows negotiation, a client certificate, a key in a header or a bearer token. The driver never renews. A sign of expiry is reported as needs_login.", "where": "a2m-pack-http: src/link.rs", "never": ["Renew a token.", "Hold a credential beyond one pass of the loop."]}, "http-refuses": {"name": "HTTP Refusals", "group": "HTTP Pack", "state": "b", "text": "Sending to an origin the compiled target did not resolve, following a redirect, using a proxy, a secret in a template or trace, retrying inside a step, drafting for an unsafe method, using http on an endpoint whose requests the page computes or signs, imitating another application's client, and getting past an edge's bot defence.", "where": "a2m-pack-http: src/driver.rs", "never": ["Imitate another client.", "Get past a bot defence."]}, "mcp-p-mapping": {"name": "Mapping File", "group": "MCP Pack", "state": "b", "text": "One file per mcp surface: the only tools that can be reached, with the effect the developer judged for each, the read tool that proves a write, and which fields are untrusted text. It is the upstream server's manifest. Nothing is reachable until a person maps it.", "where": "a2m-pack-mcp", "never": ["Reach a tool the mapping does not name."]}, "mcp-p-pins": {"name": "Definition Pins", "group": "MCP Pack", "state": "b", "text": "Each mapped tool carries the SHA-256 digest of its definition (name, input and output schema, annotations). The title and description are not part of it. The call compares the tool's current definition with its pin first.", "where": "a2m-pack-mcp"}, "mcp-p-discover": {"name": "MCP Tool Discoverer", "group": "MCP Pack", "state": "p", "text": "Lists the server's tools through the sandbox port and reports them as findings. A server mapped only for discovery can never have its tools bound to an operation.", "where": "a2m-pack-mcp: src/discover.rs"}, "mcp-p-draft": {"name": "MCP Drafting Rules", "group": "MCP Pack", "state": "p", "text": "Writes a pass-through read for each tool the server marks read-only, unless its whole input is one string. Tools not marked read-only are left to the developer; the server's marking is a claim, not a judgment of effect.", "where": "a2m-pack-mcp: src/draft.rs", "never": ["Believe a server's read-only claim for a write."]}, "mcp-p-connect": {"name": "Upstream Connection", "group": "MCP Pack", "state": "p", "text": "One connection per surface and identity, never shared between identities. A local program is started through the supervisor by path and digest with an allowlisted environment; a remote server is reached over HTTP with a bearer token, and over HTTPS in a build with the tls feature. A server can be started through a launcher of the table with its entry file pinned by digest (0371); a package runner is refused.", "where": "a2m-pack-mcp: src/client.rs", "never": ["Share a connection between identities."]}, "mcp-p-call": {"name": "Tool Call", "group": "MCP Pack", "state": "p", "text": "The one step kind, call_tool, with typed arguments. A call to a tool mapped as a write is a commit point. A lost connection after a write call was sent is possible_commit. Members of a result the mapping does not list are dropped.", "where": "a2m-pack-mcp: src/driver.rs", "never": ["Retry inside a step.", "Call a tool that takes free text and runs it."]}, "mcp-p-readback": {"name": "MCP Read-Back", "group": "MCP Pack", "state": "p", "text": "A write is verified only by the upstream read tool the mapping names, called with its own arguments. A write with none is irreversible, approved as that, and never called verified.", "where": "a2m-pack-mcp: src/driver.rs"}, "mcp-p-untrusted": {"name": "Untrusted Text", "group": "MCP Pack", "state": "p", "text": "Any description or text that comes from the server is passed on only as untrusted data, never where it could read as an instruction.", "where": "a2m-pack-mcp: src/mapping.rs", "never": ["Pass server text on as instructions."]}, "mcp-p-refuses": {"name": "MCP Refusals", "group": "MCP Pack", "state": "p", "text": "A tool the mapping does not name, one text string run as a command or query, a credential beyond the one the mapping declares, one connection for two identities, and any resource or prompt: tools only.", "where": "a2m-pack-mcp"}, "desk-window": {"name": "Window Identification", "group": "Desktop Pack", "state": "p", "text": "Finds the application's window, and proves before every act that the element is in the window and process the step expects. It attaches only to a process a person named, and on every system proves it again before each act by id, start time, program and digest. The first slice finds an application already running and starts nothing.", "where": "a2m-pack-desktop: src/driver.rs", "never": ["Act in a window it cannot prove is the expected one."]}, "desk-backend": {"name": "Accessibility Backend", "group": "Desktop Pack", "state": "p", "text": "One implementation for each operating system, behind one private interface: find exactly one element, read, set, invoke, report events, build the tree for a snapshot. Reads run on all three systems and writes on Linux. Writes on Windows and macOS are written and linted from Linux; their first run is CI's.", "where": "a2m-pack-desktop: src/backend", "never": ["Click by screen position."]}, "desk-locate": {"name": "Desktop Locator", "group": "Desktop Pack", "state": "p", "text": "Resolves a screen model's query to one element of the tree, or fails. The control names are shared with the web pack as data, and the code is written twice, because a pack may not depend on another pack.", "where": "a2m-pack-desktop: src/roles.rs"}, "desk-set": {"name": "Input Actions", "group": "Desktop Pack", "state": "p", "text": "Sets a value, invokes an action, selects, expands, using accessibility patterns. A control that exposes no value cannot be written except as irreversible. An invoke that was sent with no confirmation, or after which the application exited, is possible_commit. On Windows and macOS a press is Invoke or AXPress, and a screen names it click; any other name is a stop, nothing sent.", "where": "a2m-pack-desktop: src/driver.rs", "never": ["Read a password field's value."], "decided": ["The action a screen names on Windows and macOS is click, and only click. Not: more names such as press or activate for the same press, a second spelling where unknown means stop (0399)."]}, "desk-wait": {"name": "Event Waits", "group": "Desktop Pack", "state": "p", "text": "Each wait ends on an accessibility event: focus, structure, value, window opened. Nothing polls.", "where": "a2m-pack-desktop: src/driver.rs", "never": ["Poll."]}, "desk-discover": {"name": "Desktop Probe", "group": "Desktop Pack", "state": "p", "text": "desktop_probe says what a running application is; desktop_snapshot reads a window's shape, never a value, as findings of kind window.", "where": "a2m-pack-desktop: src/discover.rs", "decided": ["desktop_probe, starting an application, and keys and clicks wait until after the first release: the person starts their own application, and a tool that finds no window stops by name (0397)."]}, "desk-screens": {"name": "Desktop Screen Models", "group": "Desktop Pack", "state": "p", "text": "The desktop pack's own screens/ file kind, for surfaces of kind desktop, with a window match by process, title or automation id.", "where": "a2m-pack-desktop: src/screens.rs"}, "desk-serialize": {"name": "Desktop Serialization", "group": "Desktop Pack", "state": "p", "text": "Work that changes what is on a person's screen is one request at a time per desktop session, and a run does not act while a person is using the same desktop unless the target says it may (busy, session_in_use).", "where": "a2m-pack-desktop"}, "desk-refuses": {"name": "Desktop Refusals", "group": "Desktop Pack", "state": "p", "text": "Clicking or typing by position, acting in an unproven window, reading a password, attaching to a process nobody named, and applications built on a browser runtime, which are web surfaces. A management namespace of another machine is refused by the driver before anything is asked, as remote_namespace_refused.", "where": "a2m-pack-desktop", "decided": ["The driver refuses a remote management namespace itself, as well as the review withdrawing its binding: fail closed (0399)."]}, "cmd-commands": {"name": "Commands File", "group": "Command Pack", "state": "b", "text": "To a program what an endpoints file is to an HTTP service: the one place its commands are described. It holds digests for each platform, the version check, help forms discovery may run, environment, working folder, limits, prompts, exit meanings, and each command's effect, typed params, argument template and output shape.", "where": "a2m-pack-command: src/model.rs"}, "cmd-program-check": {"name": "Program Check", "group": "Command Pack", "state": "b", "text": "Resolves the surface's path, refuses one that is not absolute, or that it or a folder above it can be changed by another user, or whose digest or version is not listed. The path is never searched on the path variable.", "where": "a2m-pack-command: src/safety.rs", "never": ["Start a program found by search."]}, "cmd-args": {"name": "Argument Builder", "group": "Command Pack", "state": "b", "text": "Each element comes from the template; a value is checked against its field type and refused if it holds NUL or would become an option or a file of arguments. No command line is ever put together from text an agent supplied.", "where": "a2m-pack-command: src/args.rs", "never": ["Pass a command line through a shell."]}, "cmd-start": {"name": "Supervised Start", "group": "Command Pack", "state": "b", "text": "Starts the absolute path with the element list in a new process group (a job object on Windows), no terminal, only declared handles, in a fresh empty folder. It reads standard output and error as they arrive with ceilings; passing one ends the process. At the time limit it asks, then ends the group by force.", "where": "a2m-pack-command: src/driver.rs", "never": ["Give the program a terminal.", "Start a program twice in a step."]}, "cmd-output": {"name": "Exit Status and Output", "group": "Command Pack", "state": "b", "text": "Checks the exit status against declared meanings and looks for prompts. Output is parsed as JSON, text patterns or fixed forms into typed values. Output from the program is untrusted text.", "where": "a2m-pack-command: src/output.rs"}, "cmd-readback": {"name": "Command Read-Back", "group": "Command Pack", "state": "b", "text": "Every write command names a read command that works from the identity inputs alone and answers absent through a declared exit or an empty complete result. A write stopped after the process started, other than by an exit declared to mean nothing changed, is possible_commit. A command with no read is irreversible.", "where": "a2m-pack-command: src/driver.rs"}, "cmd-discover": {"name": "Help Discoverer", "group": "Command Pack", "state": "b", "text": "Runs only the help and version forms the target declares, with no input, a fresh folder, a bare environment and a short limit. It runs nothing by default, since many programs ignore an unknown flag and do real work. Reads manuals and metadata in several formats to find commands.", "where": "a2m-pack-command: src/discover.rs", "never": ["Run anything the target did not declare."]}, "cmd-draft": {"name": "Command Drafting Rules", "group": "Command Pack", "state": "b", "text": "Writes a commands draft from the findings: the program block with the digest and version seen, and one command per listed command, with typed params where the help states a type and an open question where it does not. It cannot tell reads from writes, so it drafts no operation.", "where": "a2m-pack-command: src/draft.rs"}, "cmd-safety": {"name": "Blocked Programs", "group": "Command Pack", "state": "b", "text": "Shells and interpreters given inline code, programs that run what their arguments name (launchers, package runners, version managers, build tools), terminals, and attaching to a running program. A closed list of commands that run no code but the program's own is allowed (decision 0349), and a launcher starts only with the file it loads pinned by digest; the MCP pack starts a local server that way, and the publish review shows it as a launcher and says what nothing pins (decisions 0371, 0398).", "where": "a2m-pack-command: src/safety.rs", "never": ["Start a shell.", "Attach to a running program."]}, "data-statements": {"name": "Statements File", "group": "Data Pack", "state": "b", "text": "Names a database surface, declares the record kinds on it (table, key, fields with types), and declares every statement a binding may run, with its effect, parameters, row limit and time limit. A statement can also be written by the pack from a declaration, such as read one record by key.", "where": "a2m-pack-data: src/model.rs", "never": ["Build a statement from an input."]}, "data-stands": {"name": "Store Kind", "group": "Data Pack", "state": "b", "text": "A database surface declares it is the system of record (alone), or belongs to an application (beneath). Writes beneath an application compile only when the target's authorization record names that route as supported by the system's owner. If not declared, reads compile and writes do not.", "where": "a2m-pack-data: src/model.rs"}, "data-readonly": {"name": "Store-Enforced Read-Only", "group": "Data Pack", "state": "b", "text": "A read statement runs only on a connection the store holds read-only: a read-only transaction on a server database, a read-only open for an embedded file. If it tries to change data the store refuses, the run stops as policy and the binding is marked unhealthy. This is what licenses the scout to try a read.", "where": "a2m-pack-data: src/driver.rs", "never": ["Prove a read by reading the statement."]}, "data-fetch": {"name": "Typed Row Fetch", "group": "Data Pack", "state": "b", "text": "Fetches rows into typed values up to the statement's row limit. Zero rows for a read by key is absent; two is a failure.", "where": "a2m-pack-data: src/store.rs"}, "data-transaction": {"name": "Transactional Write", "group": "Data Pack", "state": "b", "text": "begin with the declared isolation, execute with bound parameters, expect exactly the declared row count, commit. The commit is the commit point. A parent with its rows in one transaction is one commit point. A serialization failure is rolled back and returned as busy; the driver does not retry.", "where": "a2m-pack-data: src/driver.rs", "never": ["Commit a count other than the expected one."]}, "data-readback": {"name": "Data Read-Back", "group": "Data Pack", "state": "b", "text": "The read-back statement runs in a new read-only transaction after the commit, never inside the writing transaction, and the record it returns must hold the key that was bound. A stored procedure with no declared read-back is irreversible.", "where": "a2m-pack-data: src/driver.rs"}, "data-discover": {"name": "Catalog Discoverer", "group": "Data Pack", "state": "b", "text": "Reads the store's own catalog inside a read-only transaction: tables, views, columns and types, keys, constraints, triggers and the identity's own rights. Row counts and values are not taken by default.", "where": "a2m-pack-data: src/discover.rs"}, "data-draft": {"name": "Data Drafting Rules", "group": "Data Pack", "state": "b", "text": "One record kind per table with a declared key, field types from column types, a read by key and a bounded list read for each. Nothing for a table with no key beyond an open question. Every write is left to the developer.", "where": "a2m-pack-data: src/draft.rs"}, "data-refuses": {"name": "Data Refusals", "group": "Data Pack", "state": "b", "text": "A statement assembled from inputs, a table or column chosen by an input, statements that change the schema or rights or open another file, and a shared administrative identity.", "where": "a2m-pack-data: src/lint.rs", "never": ["Assemble a statement from an input."]}, "file-path": {"name": "Path Opening", "group": "File Pack", "state": "b", "text": "Receives a path resolved and checked to lie inside an allowed root, with links resolved before the check. Refuses anything that is not a regular file with one link. A file whose bytes are not on this machine is refused as file_not_on_this_machine before any byte is read, by a read and a write alike. No input chooses which file is opened; the one exception is the name of an entry inside a folder the target declares.", "where": "a2m-pack-file: src/open.rs", "never": ["Let an input choose the file."]}, "file-formats": {"name": "Editable Formats", "group": "File Pack", "state": "b", "text": "A format is writable only if the pack has a patch editor that passes two tests: opened and saved with no change it is byte-identical, and saved with one place changed only that place differs. Delimited text and JSON first, then workbooks, INI and property lists one value at a time. YAML, TOML, XML and text documents are read-only for now.", "where": "a2m-pack-file: src/kind.rs"}, "file-locate": {"name": "Place Locator", "group": "File Pack", "state": "b", "text": "Finds each named place (a row by key, a named cell, a key path) in the parsed form together with its position in the bytes. Fixed cell coordinates are refused as a place.", "where": "a2m-pack-file: src/declare.rs"}, "file-patch": {"name": "Span Patching", "group": "File Pack", "state": "b", "text": "Builds the new bytes by replacing only the spans of the places named. Formulas are never evaluated, and a place that holds one is read as its cached value and never written. Macros and embedded code are copied as bytes and never run.", "where": "a2m-pack-file: src/edit.rs", "never": ["Run a macro or evaluate a formula.", "Edit in place."]}, "file-untouched": {"name": "Untouched Check", "group": "File Pack", "state": "b", "text": "Parses the new bytes again and requires every place outside the named ones to equal what it was. A mismatch stops the write before anything is saved.", "where": "a2m-pack-file: src/edit.rs"}, "file-save": {"name": "Atomic Replace", "group": "File Pack", "state": "b", "text": "Writes a temporary file in the same folder under a random name, readable by the engine's user alone, then replaces the old file in one step. Before the replace the old file is untouched, and after it the new file is whole; there is never a mixture. It removes nothing it cannot prove it wrote. The intended digest is recorded before the commit point.", "where": "a2m-pack-file: src/save.rs", "never": ["Write a file in place."]}, "file-readback": {"name": "File Read-Back", "group": "File Pack", "state": "b", "text": "Opens the file again from disk as a new read and compares the same places after normalization. The replace returning success is not proof.", "where": "a2m-pack-file: src/evidence.rs"}, "file-reconcile": {"name": "Digest Reconciliation", "group": "File Pack", "state": "b", "text": "After a stop between the replace and its record, the digest of the file at the path decides: the intended digest means the save landed; the digest seen before means it did not; anything else, read the places: intended values mean verified, otherwise stale. A temporary file a killed save left is not used and not removed.", "where": "a2m-pack-file: src/drive_folder.rs"}, "file-discover": {"name": "File Discoverer", "group": "File Pack", "state": "b", "text": "Reports sheets, tables and their headers, validation lists, and the presence of formulas, macros and signatures, as discovered. A key candidate is inferred, with limits. It also lists a folder's entries without reading content (an entry whose bytes are not on this machine with its name, kind, size and time, and no digest) and describes settings files and growing files. The drafter writes a document draft with the fingerprint and a record kind and a list read for each table.", "where": "a2m-pack-file: src/discover.rs"}, "file-refuses": {"name": "File Refusals", "group": "File Pack", "state": "b", "text": "A format it cannot write back without loss, files that are encrypted, protected or signed, writing while an application has the file open where that can be detected, writing a file the engine's user may not write, reading or writing a file whose bytes a sync program keeps elsewhere, and text in delimited files that a spreadsheet would run as a formula. A value is never changed to make it safe.", "where": "a2m-pack-file: src/settings.rs", "never": ["Change a value to make it safe."]}, "stream-channel": {"name": "Channel File", "group": "Stream Pack", "state": "b", "text": "The channels/ file kind: the channel (kind, key, schema, ownership, retention, duplicate window), fixed in the target's files. The key is a field of the message, or, key: {from: subject}, the last token of the subject a message is published on. A file that takes its key from the subject over a broker that keys by a field stops as shape_changed. A channel the runtime does not own cannot be taken from.", "where": "a2m-pack-stream: src/channel.rs", "never": ["Choose a channel from an input."], "decided": ["A broker that keys by subject gives the subject as a channel's key. Not: draft a field named key that the message does not hold (0434)."]}, "stream-latest": {"name": "Latest Read", "group": "Stream Pack", "state": "b", "text": "Reads the last retained value for a key: the state a channel holds now. A read whose operation declares an output found answers a key with no message as found: false, its other outputs null; a read that declares none stops on a missing key as before. The drafter declares found on every read of a retained key it drafts.", "where": "a2m-pack-stream: src/driver.rs", "decided": ["A key with no message is an answer, found: false, when the read declares found; a message whose body holds a field found that no schema states stops as response_schema_mismatch. Not: a named failure not_found, or found on every read without the operation asking (0429)."]}, "stream-await": {"name": "Match Wait", "group": "Stream Pack", "state": "b", "text": "Waits within a time limit for the next message matching a key or correlation field. A subscription that never ends is refused; a call must end.", "where": "a2m-pack-stream: src/driver.rs", "never": ["Wait for ever."]}, "stream-list": {"name": "Bounded List", "group": "Stream Pack", "state": "b", "text": "Lists what a channel holds now, with a bound, only where the broker offers a look without taking. Discovery never consumes.", "where": "a2m-pack-stream: src/driver.rs"}, "stream-publish": {"name": "Message Publish", "group": "Stream Pack", "state": "b", "text": "Encodes one message from the typed template, checks it against the schema, and sends it. A message body is never free text from a caller. The producer is the run's own, not shared.", "where": "a2m-pack-stream: src/driver.rs", "never": ["Pass a caller's text through as the body."]}, "stream-readback": {"name": "Stream Read-Back", "group": "Stream Pack", "state": "b", "text": "Only a retained state channel with no outside readers can be read back by key and counts as an ordinary write. A log is read at the acknowledged position or scanned for the token. A queue, or a channel with no retention, has only the acknowledgement as evidence, shown as accepted and not read back. Read-back proves the broker holds a message, never what a reader did with it.", "where": "a2m-pack-stream: src/driver.rs", "never": ["Call an acknowledgement verified."]}, "stream-dupes": {"name": "Duplicates and Resume", "group": "Stream Pack", "state": "b", "text": "Brokers deliver at least once. If the broker refuses repeated tokens, the record's idempotency token goes in a declared header. A publish to an outside reader is irreversible and is never resumed automatically, whatever reconcile finds.", "where": "a2m-pack-stream: src/driver.rs", "never": ["Resend an irreversible publish automatically."]}, "stream-take": {"name": "Message Take", "group": "Stream Pack", "state": "b", "text": "Compiles only on a channel the runtime owns. The message is stored in the ledger, redacted, before the acknowledging step is sent. A take is irreversible.", "where": "a2m-pack-stream: src/driver.rs", "never": ["Acknowledge on a shared queue."]}, "stream-discover": {"name": "Stream Discoverer", "group": "Stream Pack", "state": "b", "text": "Lists channels and their shapes, schemas held in a registry (inferred) and the shape of a sampled message, names and types never values. The channel facts say whether the broker keys by subject. The drafter writes a channel file and a read or list, taking the subject as the key where the broker keys by subject, and asks the key only of a retained channel whose broker names neither. It never writes a publish, a take or a subscription name.", "where": "a2m-pack-stream: src/discover.rs"}, "dev-map": {"name": "Register Map", "group": "Device Pack", "state": "p", "text": "The registers/ file kind: addresses, protocol, types, units, access, any read effect, and the serial of the device in each environment. A write is refused where no serial is declared for the run's environment. Writing memory or any address not in the map is not an interface the pack offers.", "where": "a2m-pack-device: src/map.rs", "never": ["Write an address not in the map."]}, "dev-link": {"name": "Exclusive Link", "group": "Device Pack", "state": "p", "text": "Opens the link with exclusive use for this run. One run at a time on one device link, as desktop work is serialized.", "where": "a2m-pack-device: src/link.rs"}, "dev-identify": {"name": "Device Identification", "group": "Device Pack", "state": "p", "text": "Reads the device's identity and compares it with the map, model, firmware version and the serial declared for this environment. A device that does not match, or whose firmware is outside the map, is unknown_variant for reads as well as writes.", "where": "a2m-pack-device: src/driver.rs", "never": ["Act on a device it has not identified."]}, "dev-frame": {"name": "Frame Send", "group": "Device Pack", "state": "p", "text": "Builds one frame from the map and typed values and sends it. Nothing else is sent in that step. A device write has a hazard, and no automatic retry.", "where": "a2m-pack-device: src/driver.rs", "never": ["Retry a device write automatically."]}, "dev-pace": {"name": "Pacing", "group": "Device Pack", "state": "p", "text": "A link carries one request at a time. The pack waits for each reply, keeps the minimum gap, and never exceeds the maximum rate. With no pace given, it sends one frame at a time and a few a second.", "where": "a2m-pack-device: src/modbus.rs"}, "dev-readback": {"name": "Device Read-Back", "group": "Device Pack", "state": "p", "text": "Reads the register again and compares. A register with a read effect is never read back, so a write to it is irreversible.", "where": "a2m-pack-device: src/driver.rs"}, "dev-lost": {"name": "Lost Link", "group": "Device Pack", "state": "p", "text": "A lost link after a write may mean it was applied: possible_commit. On reconnection the pack identifies the device, then reads the register. If the map says the device reverts on link loss, the value is compared with the safe state too.", "where": "a2m-pack-device: src/driver.rs"}, "dev-discover": {"name": "Device Discoverer", "group": "Device Pack", "state": "p", "text": "Asks the device to identify itself, and reads a published map of registers put in the project's sources. It never scans addresses, because a read can change a device. The drafter writes a read for each readable register of a published map, its description stating the unit and the places its scale gives; no write, range, hazard, safe state or unit the device did not state. From identification alone it drafts no map and says to put the published map in sources.", "where": "a2m-pack-device: src/discover.rs", "never": ["Scan addresses."], "decided": ["A scaled register's read states its places in its description. Not: draft a field type into types.yaml, which is not a pack's file to write, or let an output state places beside its type (0441)."]}, "dev-firmware": {"name": "Firmware", "group": "Device Pack", "state": "t", "text": "Inspection of an image the person supplies is discovery only. An update goes only through the device's own documented mechanism, as an irreversible operation with a hazard, approved by a person every run, after a recovery route is declared. Neither is built.", "where": "a2m-pack-device", "never": ["Build, patch or re-sign an image."]}, "dev-refuses": {"name": "Device Refusals", "group": "Device Pack", "state": "p", "text": "A debug probe, an exploit or unlock, defeating secure start-up or read-out protection, writing memory outside the map, scanning addresses, a free-form console line from a caller, one-way settings unless the maker documents them, and any real device without a test environment first.", "where": "a2m-pack-device", "never": ["Get past a device's protection."]}, "core-vocab": {"name": "Closed Vocabularies", "group": "Kernel", "state": "b", "text": "Access Kinds, effect classes, hazards, failure classes, evidence levels and states, each an enum whose names are the documents' names. A test holds the two together.", "where": "a2m-core: src/vocabulary.rs"}, "core-names": {"name": "Registered Names", "group": "Kernel", "state": "b", "text": "The shape of every name that arrives from outside: a mode, surface kind, step kind, verb, file kind, lint code, finding kind, failure code, target, operation and so on. A pack can bring a new one; the kernel never lists them. A name Windows keeps for a device (con, prn, aux, nul, com or lpt with one digit), or a dotted name with one as a part, is refused on every system.", "where": "a2m-core: src/name.rs", "decided": ["Windows's device names are refused on every system, so a project that compiles on one machine compiles on the next. Not: refuse them on Windows alone (0431)."]}, "core-values": {"name": "Value Model", "group": "Kernel", "state": "b", "text": "What a field's value can be once read from a file, a caller or a system, and its type: text, whole numbers, exact decimals, dates, moments, lengths of time.", "where": "a2m-core: src/value.rs"}, "core-decimal": {"name": "Exact Decimals", "group": "Kernel", "state": "b", "text": "Decimal arithmetic for any business value. No float is used to compare a business value. A result's decimal is written with exactly the places its field type states, padded with zeros and never rounded there; the padded value is the same number, equal and hashed alike.", "where": "a2m-core: src/decimal.rs", "never": ["Compare numbers as floats."], "decided": ["A result's decimal is padded to the places its field type states, in the engine, so the store reads it back the same. Not: pad in the result's faces, which see no types, or in the normalizer, which would change what every pack sends (0444)."]}, "core-failure": {"name": "Failure", "group": "Kernel", "state": "b", "text": "The one form in which anything in the kernel reports it could not do what was asked: a class, a code declared once in its crate's table, a plain sentence, and a next step. Each code maps to exactly one class.", "where": "a2m-core: src/failure.rs"}, "core-finding": {"name": "Finding", "group": "Kernel", "state": "b", "text": "What discovery returns, as data: a subject, a kind, what was found, the level, who vouches, coverage and limitations. Its id is a digest of its content.", "wh
