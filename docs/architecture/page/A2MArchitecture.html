ere": "a2m-core: src/finding.rs"}, "core-compiled-target": {"name": "Compiled Target Types", "group": "Kernel", "state": "b", "text": "The compiled target and its steps as immutable data, their one encoding as canonical JSON, and the check of a compiled target's hash. The compiler that makes one is elsewhere.", "where": "a2m-core: src/compiled_target.rs", "decided": ["The compiled target's output carries a may-be-absent flag, set by the pack's lowering. A null in an output that may not be absent stops the run. Not: mark every output as possibly absent (0305). Not built yet."]}, "core-secret": {"name": "Secret", "group": "Kernel", "state": "b", "text": "A wrapper that cannot be printed or serialized, plus the two interfaces the vault implements: redacting and keyed digests.", "where": "a2m-core: src/secret.rs", "never": ["Be printed or serialized."]}, "core-scope": {"name": "Address Scope", "group": "Kernel", "state": "b", "text": "What kind of place an address is, read from its literal alone, and the one question every check of a plain link asks: may a link to it leave this machine.", "where": "a2m-core: src/scope.rs"}, "tel-trace": {"name": "Step Trace", "group": "Kernel", "state": "b", "text": "The record of each step of a run, in JSON Lines. The ledger stores the resulting blob; this crate defines its form.", "where": "a2m-logs: src/trace"}, "tel-capture": {"name": "Capture Levels", "group": "Kernel", "state": "b", "text": "Given a level, decides which captures are kept and in what form, before anything is written. It applies a level; the compiled target and policy choose it.", "where": "a2m-logs: src/collect.rs"}, "tel-signature": {"name": "Trace Signature", "group": "Kernel", "state": "b", "text": "Which parts of a record enter the signature, in what order, and how they are hashed, so runs can be compared.", "where": "a2m-logs: src/trace"}, "tel-redact": {"name": "Capture Redaction", "group": "Kernel", "state": "b", "text": "Runs what is captured through the redactor and checks again on the way out. It does not paint over an image; the pack that took the picture does.", "where": "a2m-logs: src/collect.rs", "never": ["Keep a secret."]}, "tel-headers": {"name": "Recordable Headers", "group": "Kernel", "state": "b", "text": "One list of headers an exchange may record, for every pack. Others are dropped.", "where": "a2m-logs: src/headers.rs"}, "tel-spans": {"name": "Spans and Metrics", "group": "Kernel", "state": "b", "text": "Spans and counters with a closed set of attributes that cannot carry a value, a snapshot or a secret. Export to an outside collector is off unless a person switches it on, and is not built.", "where": "a2m-logs: src/logs_and_traces.rs", "never": ["Send anything off the machine unless switched on."]}, "tel-logs": {"name": "Engine Logs", "group": "Kernel", "state": "b", "text": "Structured, levelled, rotated by size and redacted.", "where": "a2m-logs: src/log.rs"}, "net-interfaces": {"name": "Network Interfaces", "group": "Kernel", "state": "b", "text": "The machine's network interfaces, their addresses and state.", "where": "a2m-netstate: src/sys"}, "net-routes": {"name": "Network Routes", "group": "Kernel", "state": "b", "text": "The routing table.", "where": "a2m-netstate: src/sys"}, "net-resolvers": {"name": "Name Servers", "group": "Kernel", "state": "b", "text": "The name servers the machine is set to use. It reads the setting and resolves no name.", "where": "a2m-netstate: src/sys"}, "net-neighbours": {"name": "Network Neighbours", "group": "Kernel", "state": "b", "text": "The neighbour table the system already holds. It never asks to refresh an entry.", "where": "a2m-netstate: src/sys"}, "net-listeners": {"name": "Local Listeners", "group": "Kernel", "state": "b", "text": "Which sockets are listening on the machine.", "where": "a2m-netstate: src/sys"}, "net-proxy": {"name": "System Proxy", "group": "Kernel", "state": "b", "text": "The proxy setting. It does not fetch a proxy script or apply a proxy.", "where": "a2m-netstate: src/sys"}, "net-standing": {"name": "Place Reading", "group": "Kernel", "state": "b", "text": "Where this machine stands: the kind of place each address is, and which interface carries each address family's preferred default route. Served as a listed read of the local user.", "where": "a2m-netstate: src/model.rs"}, "net-bounds": {"name": "Network Bounds", "group": "Kernel", "state": "b", "text": "Every list is bounded, a cut is recorded, and the serialized form applies privacy choices. The crate sends nothing onto a network, resolves no name, changes nothing and reads no other process's command line.", "where": "a2m-netstate: src/bound.rs", "never": ["Send a packet.", "Change the system's network tables."]}, "src-content": {"name": "Content Check", "group": "Kernel", "state": "b", "text": "Confirms an input is the format it claims, from its content and not its name.", "where": "a2m-sources: src/read.rs"}, "src-readers": {"name": "Format Readers", "group": "Kernel", "state": "b", "text": "Built-in readers for workbooks, delimited text and JSON, and the extension point a pack's own reader fills. A formula is never calculated, a macro never run, and a link to another file never followed.", "where": "a2m-sources: src/csv.rs", "never": ["Calculate a formula.", "Follow a link."]}, "src-fingerprint": {"name": "Template Fingerprints", "group": "Kernel", "state": "b", "text": "Recognises which known version of a template an input is. When none matches it lists the differences.", "where": "a2m-sources: src/fingerprint.rs"}, "src-mapping": {"name": "Source Mapping", "group": "Kernel", "state": "b", "text": "Locates the data in the input, filters rows, and turns them into fields as the Source Definitions say.", "where": "a2m-sources: src/locate.rs", "never": ["Guess which column is which."], "decided": ["The mapping comes from the Source Definitions, a target's own files, and not from the Input Files. Not: one name for both folders (0309)."]}, "src-typing": {"name": "Cell Typing", "group": "Kernel", "state": "b", "text": "Turns a cell into a typed value by the field type. Text such as \"NA\" is not missing unless the definition says so, and no number goes through a float.", "where": "a2m-sources: src/typing.rs", "never": ["Convert a number through a float."]}, "src-validated": {"name": "Validated Records", "group": "Kernel", "state": "b", "text": "The only form in which the engine receives a source's rows. Every row has been checked before any run step.", "where": "a2m-sources: src/model.rs"}, "src-positions": {"name": "Positioned Parse", "group": "Kernel", "state": "b", "text": "Keeps the position of every value in the bytes, so the file pack can patch a file without parsing it a second way, and errors can name a place.", "where": "a2m-sources: src/read.rs"}, "expr-env": {"name": "Type Environment", "group": "Kernel", "state": "b", "text": "Which names exist for an expression, and their types, as the caller declares them.", "where": "a2m-expr: src/check.rs"}, "expr-compile": {"name": "Expression Compilation", "group": "Kernel", "state": "b", "text": "Parses and checks an expression and turns it into the compiled target's own expression form. There is no float type.", "where": "a2m-expr: src/parse.rs", "never": ["Produce or compare a float."]}, "expr-eval": {"name": "Evaluation", "group": "Kernel", "state": "b", "text": "Evaluates a loaded expression against bound values with a cost limit, so every expression ends. It reads no clock, file, environment variable or network.", "where": "a2m-expr: src/eval.rs", "never": ["Read a clock, a file or the network."]}, "expr-library": {"name": "Host Functions", "group": "Kernel", "state": "b", "text": "A closed list of functions, versioned with the engine, for text, numbers, dates and measures. No function answers differently for the same arguments, and none can be supplied from outside.", "where": "a2m-expr: src/library.rs", "never": ["Accept a function from outside."]}, "expr-normalize": {"name": "Field-Type Normalizers", "group": "Kernel", "state": "b", "text": "The normalizer for each field-type base: decimals with their places and rounding, dates, text case and whitespace. The engine uses them on both sides before comparing.", "where": "a2m-expr: src/normalize.rs"}, "scout-waiting": {"name": "Waiting Reads", "group": "Scout", "where": "a2m-actions: src/handlers/scout_report.rs", "state": "t", "text": "The part of the report that lists each drafted read not sent because its endpoint takes a session's credential and no one has signed in. Each entry names the surface to sign in to and the one action that does it. A waiting read is not a failed read. Not built; roadmap package FT9.", "never": ["Send a read without the credential its description declares."], "decided": ["A read that waits for a sign-in is listed apart from proven and failed reads, with the one action that signs in. Not: count it as failed (0303)."]}, "pages-field-build": {"name": "Copy Test Harness", "group": "Person Surface", "where": "tools/copy-test-harness/, a workspace program built from the product crate's library", "state": "t", "text": "A second program that is the product's own serve in every part but one: the command line's Host carries the Copy Test Prompt, which the shipped program never sets. It runs in a container on a network with no route out, beside copies of systems the field-test runner started with invented data; at start it refuses to serve if a public address answers. The runner builds it into a folder of its own and deletes it after the run, and the packaging check fails when a wheel or npm package holds any binary but the expected ones. Not built; roadmap package FT4 (decision 0310).", "never": ["Ship in a wheel or an npm package.", "Serve when a public address can be reached."], "decided": ["The harness runs in a closed container network and says in the ledger what it is (decision 0310). Not: a copy test harness that passed an approval named in a file (decision 0304, superseded: any program running as the user could write the file)."]}, "pages-field-prompt": {"name": "Copy Test Prompt", "group": "Person Surface", "where": "a2m-local (CopyTestPrompt), built only by the Copy Test Harness", "state": "p", "text": "The presence prompt of the Copy Test Harness. It writes the prompt's text to the runner's pipe and passes only when the runner answers with the short hash it showed; the ledger records the presence as field_harness, never as an operating system's prompt. It refuses an approval of an irreversible operation, and one whose effect it was not told, without asking. Built in a2m-local; the harness that uses it is roadmap package FT4.", "never": ["Pass an approval the runner did not name.", "Approve an irreversible operation.", "Be recorded as polkit, Windows Hello or Local Authentication."], "decided": ["The prompt answers on a pipe only the runner holds, and refuses an approval whose effect it does not know (decision 0310). Not: a hash in a file (decision 0304)."]}, "proj-source-defs": {"name": "Source Definitions", "group": "Project File", "where": "a2m-files and a2m-sources", "state": "p", "text": "The files under a target's sources/ folder: how a kind of input file is read and mapped, with readers, template fingerprints and mappings. They are compiled with the target. Not the Input Files, which are in the project's own sources folder and are never compiled.", "never": ["Be mistaken for the Input Files."], "decided": ["The two folders each have a proper name and neither is renamed on disk. Not: rename the project's folder (0309)."]}, "con-capture": {"name": "Capture Contract", "group": "Provider Contract", "state": "b", "where": "a2m-provider: src/capture.rs", "text": "How a pack offers traffic capture, and the one check every capture passes. A pack lists the surface kinds it captures in its manifest and registers one capture source; a pack that lists none is never asked. A yield holds a request's method, origin, path by structure, and the names and kinds of its fields, and has no field a value could be put in. Every yield is read through take_capture, which withholds whatever does not look like structure, whatever the pack did. The web probe's capture of a page's own requests, and web_use's capture of a person's use in a watching tab, are built on it.", "never": ["Yield a value of a query, a header, a cookie or a body.", "Ask a pack that declared no capture."], "decided": ["Traffic capture is a capability of the provider contract that a pack declares, with one floor under every pack. Not: an interface of the web pack's own, a capture as a kind of discoverer, or trusting each pack to redact (0390, 0391)."]}, "con-watch": {"name": "Person-Driven Discoverer", "group": "Provider Contract", "state": "b", "where": "a2m-provider: src/discover.rs", "text": "A discoverer a person drives, as a capture of their own use. Its manifest says driven_by person, and it is called only through watch, with the scope, the capture's end and the sink, and with no port: it reaches the system through nothing of the kernel's. A scout and discover.run never get one. Its findings are checked against the manifest as any discoverer's. Built: driven_by in the manifest, Discoverer::watch and DiscovererHandle::watch, which holds each call to its manifest's bound; the web probe's web_use is one.", "never": ["Run in a scout or in discover.run.", "Reach the system through a port of the kernel's."], "decided": ["A person-driven discoverer is called through a method of its own, watch, and the capture's end is a type of the contract that only the kernel sets. Not: a new field of the discovery scope, which twelve crates build field by field, or a port that refuses every step (0392, 0395)."]}, "con-shape": {"name": "Body Shape", "group": "Provider Contract", "state": "b", "where": "a2m-provider: src/shape.rs", "text": "The one closed subset of JSON Schema that a pack checks a body against: type, nullable, properties, required, additionalProperties, items and enum. It moved here from the HTTP pack and the web drivers, which each held a copy, so that the browser checks a request's body by the same rule.", "decided": ["One shape in the provider contract, used by both packs and the browser base. Not: two copies and a third in the base, or the shape in a2m-core (0394)."]}, "wb-watching": {"name": "Watching Tab", "group": "Web Pack", "state": "b", "where": "a2m-pack-web-browser", "text": "A tab in a visible window of the engine's own browser, in a profile of its own, watching, where a person who must sign in signs in and the session is kept for the next capture, where the person uses the system and the engine only listens. It has no input method, starts no navigation and makes no request, so it fails none: every request there is the person's. It is held to the surface's declared origins and records only their exchanges, by structure, with a request's body as its media type and its fields' names and kinds. It takes a snapshot of each screen the person visits, to a bound.", "never": ["Send input, navigate, or make a request of its own.", "Store a value the person typed."], "decided": ["A person's use is captured in a watching tab, and the scout never opens one. Not: capture in the observing tab, which records what the probe already sees and nothing of a page that reads by POST (0392, superseding point 1 of 0308)."]}, "wb-safe": {"name": "Safe Request Match", "group": "Web Pack", "state": "b", "where": "a2m-pack-web-browser: src/tab.rs", "text": "The requests an observing tab lets through although their method may write. A request passes only when it matches one entry in method, origin, path template segment for segment, and body: none, or a shape in json or form encoding. A body the browser does not hand over whole, one longer than 1 MiB, or one that does not fit the shape is failed. The drivers fill the list from a published version's asserted reads.", "never": ["Store or log a body.", "Match a path by its prefix."], "decided": ["A safe request is matched in four parts, its body included, because two requests to one path can differ only in their bodies. Not: method, origin and path alone, or a word such as search in the path, which is a guess (0392, 0394)."]}, "webui-page-requests": {"name": "page_requests/", "group": "Web Pack", "state": "b", "where": "a2m-pack-web-ui: src/requests.rs", "text": "The web pack's file kind for the requests a page makes by itself, in the form of entries of the endpoint catalog, each with the screen whose page sends it. GET alone reads. A request by another method marked read is an asserted read: it compiles only with read_asserted: true and a body shape closed at its top level, or none. The drivers hand a published version's asserted reads to the observing tab, in a live run or in an environment of kind test. A request a capture saw by a method that may write is drafted held, with its effect as the question, a closed body and no read; such an entry writes nothing until a person writes its effect.", "never": ["Let a drafter write read_asserted."], "decided": ["An asserted read of a web surface is a key of its page request, read by the web drivers. Not: the HTTP pack's endpoints/, which has no section for a web surface (0394, correcting 0392).", "An asserted read is let through in a live run of a published version and in an environment of kind test, never under the drafts or in discovery; under the drafts the stop names the page request and says to publish it (0392, 0394)."], "weighing": ["A person's word is the only evidence that an asserted read changes nothing; the match narrows what a wrong one lets through and does not make it right. A field whose long text tells a read from a write waits for a pin by digest, after the first release (0392).", "Kept as a bet (H-52): the person confirms each assertion as the capture ends, so a draft may be tried. Taken up if FT6 shows the steps from capture to first read are the complaint (0392)."]}, "compiled-target-review": {"name": "Review Summary", "group": "Compiled Target", "state": "b", "where": "a2m-files: src/review.rs", "text": "The risk-ordered list a person sees on the publish page before a version goes live: what each tool can do, its evidence, which gates ran, and each program a tool starts, with a fixed notice. Each asserted read is shown with the sign-ins, before the tools, with the sentence that the person's word is its only evidence. A server started through a launcher is shown as a launcher, with its entry file's path and digest and the sentence that whatever the entry file loads is not pinned and not shown. Each tool whose change from the version in force is breaking is listed first, with why, by a closed list; the answer of the waiting publish names the same, and the publish is not refused (decision 0454).", "never": ["Gate a publish on a notice: a notice informs."], "decided": ["A launched program is shown as a launcher with a notice of its own, and counts as a script does in the order. Not: the script's notice, which is untrue for an installed entry file, or a list of what the entry file loads, a guess shown as a fact (0390, 0398).", "A file kind says what it asserts, and the summary lists every asserted read of the HTTP and web packs. Not: an assertion stated on one binding, since the tab lets it through for every read of the surface (0394).", "A breaking change to a tool is named to the person who publishes, and the tool's name carries no version. Not: a major number in the name, or refuse a breaking publish unless the person names it (0439)."]}, "mcp-unavailable": {"name": "Unavailable Mark", "group": "Front Door", "state": "t", "where": "a2m-mcp: src/tools.rs", "text": "A tool whose every binding is stopped by a drift stays in the list, marked. Its schema is unchanged; its description begins with one fixed sentence, that the system changed and the tool was stopped until its target is repaired; its
