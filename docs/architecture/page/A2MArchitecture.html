 {"text": "A call from any face reaches the dispatcher as the same request.", "at": ["reg-faces", "reg-dispatch"]}, {"text": "The Dispatcher runs the handler. Handlers do the work of one group of actions, such as using tools or building a target.", "at": ["reg-use", "reg-build", "reg-providers", "reg-publish", "reg-admin", "reg-machine"]}, {"text": "Handlers reach the engine, ledger, policy and keeper through the one kernel handle opened at start.", "at": ["reg-kernel"]}], "stepsTitle": "Definition to Call", "walks": [{"name": "Four Faces", "steps": [{"text": "The action is defined once, with its name, schemas and lowest role.", "at": ["reg-def"]}, {"text": "Its command, its MCP tool, its REST route and its client method are generated from the one list and checked against its digest.", "at": ["reg-catalog", "reg-faces"]}, {"text": "A call from any one of them reaches the dispatcher as the same request.", "at": ["reg-faces", "reg-dispatch"]}, {"text": "The Dispatcher does the same steps for every action: find, validate, health, policy, person, run, shape.", "at": ["reg-dispatch"]}, {"text": "The handler for the action's group does the work, and reaches the kernel through one handle.", "at": ["reg-use", "reg-build", "reg-kernel"]}]}]}, "policy": {"name": "Policy Engine", "group": "Kernel", "where": "a2m-policy", "state": "b", "text": "The only part that decides whether something may happen: this caller, this tool, this effect, this target. Every decision is recorded, allowed or refused. It stores approvals, each single-use and bound to the hash of one change. Grants, toolsets, and roles for several users come later.", "rows": [{"title": "Call Checks", "cols": [{"title": "Absolute Stops", "ids": ["policy-kill", "policy-guardrails"]}, {"title": "Access Rules", "ids": ["policy-grants", "policy-manifest"]}, {"title": "Usage Limits", "ids": ["policy-limits"]}]}, {"title": "Write Checks", "cols": [{"title": "Unattended Path", "ids": ["policy-preapproval"]}, {"title": "Attended Path", "ids": ["policy-approvals"]}, {"title": "Outcomes", "ids": ["policy-decision", "policy-masking"]}]}], "edges": [["policy-kill", "policy-guardrails", "a request no switch has stopped", "path", 1], ["policy-guardrails", "policy-grants", "a request no forbid matches", "path", 2], ["policy-grants", "policy-manifest", "a request its caller may make", "path", 3], ["policy-manifest", "policy-limits", "the surfaces the operation declared", "path", 4], ["policy-limits", "policy-preapproval", "a write within its limits", "path", 5], ["policy-preapproval", "policy-decision", "allowed without a person", "path", 6], ["policy-preapproval", "policy-approvals", "a write that needs a person", "use"], ["policy-approvals", "policy-decision", "the approval used, or none", "use"], ["policy-decision", "policy-masking", "the decision and the result's fields", "path", 7]], "steps": [{"text": "Kill switches are checked first. A switch that is on stops everything it covers.", "at": ["policy-kill"]}, {"text": "The built-in guardrails are consulted. Any matching forbid denies the call, and nothing else can override it.", "at": ["policy-guardrails"]}, {"text": "The caller must hold a grant for this tool and its effect class, and the run may act as the identity it asks for.", "at": ["policy-grants"]}, {"text": "The run may touch only the surfaces, downloads and destinations the operation declared.", "at": ["policy-manifest"]}, {"text": "Inputs, the record limit and the caller's quotas are applied.", "at": ["policy-limits"]}, {"text": "For a write, a pre-approval rule may let it go without a person. A hazard or an irreversible operation always needs a person.", "at": ["policy-preapproval"]}, {"text": "Otherwise a person approves the exact diff. That approval is single-use and bound to the diff's hash.", "at": ["policy-approvals"]}, {"text": "Every answer is written down with the rules that decided it. An error while deciding is a denial.", "at": ["policy-decision"]}, {"text": "When results return, fields the caller may not see are masked.", "at": ["policy-masking"]}], "stepsTitle": "Write Call Controls", "walks": [{"name": "Policy Refusal", "steps": [{"text": "A call arrives. The kill switches are checked first.", "at": ["policy-kill"]}, {"text": "A built-in guardrail matches the request and forbids it. Nothing else can override it.", "at": ["policy-guardrails"]}, {"text": "The refusal is written down with the rule that decided it and the policy version.", "at": ["policy-decision"]}, {"text": "The caller gets an ordinary failure with a next step. The later checks never run.", "at": ["policy-decision", "policy-masking"]}]}, {"name": "Single-Use Approval", "steps": [{"text": "A write passes the grants, the manifest and the limits. No pre-approval rule lets it go without a person.", "at": ["policy-grants", "policy-manifest", "policy-limits", "policy-preapproval"]}, {"text": "A person approves the exact diff. The approval is bound to that diff's hash and one tool version, and it expires.", "at": ["policy-approvals"]}, {"text": "The run uses the approval once. A second use is refused.", "at": ["policy-approvals"]}, {"text": "A changed diff has a different hash, so the approval does not match it.", "at": ["policy-approvals", "policy-decision"]}, {"text": "Each answer is stored with the rules that decided it.", "at": ["policy-decision"]}]}]}, "scheduler": {"name": "Scheduler", "group": "Kernel", "where": "a2m-sched", "state": "b", "text": "Admits or refuses a run against queues, limits for each session, and budgets, then writes the run's row. It holds the lease that says which worker has a job, so a lost worker's job is not run twice.", "rows": [{"title": "Entry Stage", "cols": [{"ids": ["sched-admission"]}]}, {"title": "Dispatch Stage", "cols": [{"ids": ["sched-queue", "sched-exclusive", "sched-locks-wait", "sched-holds"]}]}, {"title": "Running Stage", "cols": [{"ids": ["sched-leases", "sched-budgets"]}]}, {"title": "Loss Handling", "cols": [{"ids": ["sched-loss"]}]}, {"title": "Timer Work", "cols": [{"ids": ["sched-watches"]}]}], "edges": [["sched-admission", "sched-queue", "an accepted run", "path", 1], ["sched-queue", "sched-leases", "the job at the front", "path", 2], ["sched-leases", "sched-budgets", "a request for rate budget", "path", 3], ["sched-queue", "sched-exclusive", "a job and its resource key", "use"], ["sched-holds", "sched-queue", "a scope with no job handed out", "use"], ["sched-leases", "sched-loss", "heartbeats that stopped", "use"], ["sched-leases", "sched-locks-wait", "a wait for a record lock", "use"], ["sched-watches", "sched-admission", "a check that is due", "use"]], "steps": [{"text": "A new run is checked in order: kernel health, holds, a matching unfinished run, queue length, the caller's waiting jobs, a runner that could serve it, and the rate budget.", "at": ["sched-admission"]}, {"text": "An accepted job joins a queue per target and environment, ordered by priority, then fairly by caller.", "at": ["sched-queue"]}, {"text": "A job is not handed out while another holds one of the same exclusive resources, or while a hold covers it.", "at": ["sched-exclusive", "sched-holds"]}, {"text": "A runner takes the job on a 30 second lease and renews it with a heartbeat every 10 seconds. Each heartbeat returns a directive.", "at": ["sched-leases"]}, {"text": "While the job runs, it waits through the scheduler for rate budgets and for record locks the ledger says are held.", "at": ["sched-budgets", "sched-locks-wait"]}, {"text": "If heartbeats stop, the job is declared lost, the run gets a new lease number nobody holds, and a reconcile job is queued after a quarantine.", "at": ["sched-loss"]}, {"text": "Watches are checked when their due times come, as the lowest priority work.", "at": ["sched-watches"]}], "stepsTitle": "Job Sequence"}, "engine-loop": {"name": "Engine Loop", "group": "Kernel", "where": "a2m-engine", "state": "b", "text": "Runs a compiled target step by step, with no model and no improvising. For a write: reads the current values, builds the change, waits for approval, records the intent, has the pack act once, reads the value back, and compares. After a crash it reads the system before it writes anything again. A step it cannot do as written is a named stop.", "weighing": ["Kill at a random step and resume, a hundred seeds: not yet a test."], "rows": [{"title": "Read Sequence", "cols": [{"title": "Admission Stage", "ids": ["engine-guard", "engine-choose"]}, {"title": "Setup Stage", "ids": ["engine-prepare"]}, {"title": "Action Stage", "ids": ["engine-read-act"]}, {"title": "Storage Stage", "ids": ["engine-read-record"]}]}, {"title": "Write Sequence", "cols": [{"title": "Preview Stage", "ids": ["engine-preview"]}, {"title": "Decision Stage", "ids": ["engine-approval"]}, {"title": "Record Writing", "ids": ["engine-write"]}, {"title": "Recovery Stage", "ids": ["engine-resume"]}]}, {"title": "Shared Services", "cols": [{"ids": ["engine-normalize", "engine-failures", "engine-control", "engine-sandbox", "engine-shadow"]}]}], "edges": [["engine-guard", "engine-choose", "a compiled target whose hash matches", "path", 1], ["engine-choose", "engine-prepare", "the chosen binding", "path", 2], ["engine-prepare", "engine-read-act", "a session lease and a ready driver", "path", 3], ["engine-read-act", "engine-read-record", "the result and its evidence", "path", 4], ["engine-read-record", "engine-control", "the result, to be stored", "path", 5], ["engine-prepare", "engine-preview", "a write call to preview", "use", {"engine-preview": "engine-pre-source"}], ["engine-preview", "engine-approval", "the diff and its hash", "use", {"engine-preview": "engine-pre-route"}], ["engine-approval", "engine-write", "the approval, used once", "use", {"engine-write": "engine-w-lock"}], ["engine-write", "engine-resume", "a run that stopped in doubt", "use", {"engine-write": ["engine-w-intent", "engine-w-acted"], "engine-resume": "engine-r-lock"}], ["engine-write", "engine-normalize", "intended and read values", "use", {"engine-write": "engine-w-compare"}], ["engine-write", "engine-failures", "a step that failed", "use", {"engine-write": ["engine-w-lock", "engine-w-fresh", "engine-w-act", "engine-w-compare"]}], ["engine-write", "engine-control", "intent, acted, verified", "store", {"engine-write": ["engine-w-intent", "engine-w-acted", "engine-w-compare"]}]], "steps": [{"text": "Guard: five checks in order. The compiled target hash is checked, the kernel must be healthy, the session must be in a state that allows the call, policy must allow the call, and the surface must not be blocked at its edge.", "at": ["engine-guard"]}, {"text": "Binding Selector: the first verified binding whose driver is ready and whose surface has not drifted wins, and the reason is recorded.", "at": ["engine-choose"]}, {"text": "Preparation: the engine asks for a session lease and the driver gets what it needs, such as a page or a connection.", "at": ["engine-prepare"]}, {"text": "A read acts and reads once; there is no preview, no approval and no intent. The result is stored.", "at": ["engine-read-act", "engine-read-record"]}, {"text": "A write first runs as a preview: current values are read and the diff and its hash are stored. The run waits for a person.", "at": ["engine-preview", "engine-approval"]}, {"text": "After approval, each record goes through the Write Path: lock, freshness check, intent, act, read back, compare.", "at": ["engine-write", "engine-normalize"]}, {"text": "A failure becomes one named class, which alone decides retry, stop or ask for sign-in.", "at": ["engine-failures"]}, {"text": "After a crash, a resume reads every record that was in doubt before it writes anything.", "at": ["engine-resume"]}], "stepsTitle": "Call Sequence", "walks": [{"name": "Changed Record", "steps": [{"text": "The write ran as a preview first. A person approved the diff, and the approval is bound to that diff's hash.", "at": ["engine-preview", "engine-approval"]}, {"text": "At execute, the engine asks the Control to use the approval. That one step also moves the run to running. The engine cannot approve; it only asks.", "at": ["engine-approval", "engine-control"]}, {"text": "The Write Path takes the record's lock. The preview is older than the freshness window, so the record is read again and compared.", "at": ["engine-write"]}, {"text": "The values now differ from those seen at preview. The run stops as stale, changed since preview. Nothing was sent.", "at": ["engine-write", "engine-failures"]}, {"text": "The failure class decides what happens next: a new preview, and a person approves the new diff.", "at": ["engine-failures", "engine-preview", "engine-approval"]}]}, {"name": "Resume After Stop", "steps": [{"text": "The engine stops after an intent was stored and before the answer was seen. The run gets a new attempt and a new lease.", "at": ["engine-write", "engine-resume"]}, {"text": "Before it writes anything, the engine reads each doubtful record through the mode its intent was stored for.", "at": ["engine-resume", "engine-control"]}, {"text": "Values equal to the intended ones mean the write landed. The record is marked verified and nothing is sent again.", "at": ["engine-resume", "engine-normalize"]}, {"text": "Records still planned go on down the normal Write Path.", "at": ["engine-resume", "engine-write"]}]}]}, "session-keeper": {"name": "Session Keeper", "group": "Kernel", "where": "a2m-auth", "state": "p", "text": "The only part that signs in or renews a session. It hands the engine loop a lease on a session and never the session's contents. Ten runs that meet an expired session cause one renewal. Form sign-in is built; single sign-on is not.", "rows": [{"title": "Sign-In Stage", "cols": [{"ids": ["keeper-providers", "keeper-sign-in-guard"]}]}, {"title": "Session Lifecycle", "cols": [{"ids": ["keeper-states", "keeper-clocks", "keeper-checks"]}]}, {"title": "Renewal Stage", "cols": [{"ids": ["keeper-ladder", "keeper-person"]}]}, {"title": "Retention Stage", "cols": [{"ids": ["keeper-lease", "keeper-saved"]}]}], "edges": [["keeper-sign-in-guard", "keeper-providers", "an address, checked first", "path", 1], ["keeper-providers", "keeper-states", "a sign-in's outcome", "path", 2], ["keeper-states", "keeper-lease", "a valid session, as a lease", "path", 3], ["keeper-clocks", "keeper-checks", "the idle and token times", "use"], ["keeper-states", "keeper-checks", "a session that is wanted", "use"], ["keeper-checks", "keeper-ladder", "a sign of expiry", "use"], ["keeper-ladder", "keeper-person", "a request the keeper cannot answer", "use"], ["keeper-states", "keeper-saved", "the session's state, sealed", "store"]], "steps": [{"text": "A call asks for a session. If none is valid, the keeper starts a sign-in with the target's provider, after checking the address it would send credentials to.", "at": ["keeper-sign-in-guard", "keeper-providers"]}, {"text": "The session moves through its states: signing in, valid, suspect, renewing, needs a person, expired or revoked.", "at": ["keeper-states"]}, {"text": "While it is wanted, the keeper runs the target's cheap signed-in read about every half of the idle time.", "at": ["keeper-checks", "keeper-clocks"]}, {"text": "If a driver reports a sign of expiry, the keeper renews, once however many runs saw it.", "at": ["keeper-ladder"]}, {"text": "If a person is needed, the keeper asks only that person, and queued calls wait.", "at": ["keeper-person"]}, {"text": "The engine receives a lease on the session. It never sees the credential.", "at": ["keeper-lease"]}, {"text": "Session state is sealed in the vault so it survives a restart.", "at": ["keeper-saved"]}], "stepsTitle": "Session Sequence", "walks": [{"name": "Shared Expiry", "steps": [{"text": "Ten runs each hold a lease. Each driver sees a sign that the session has expired and tells the keeper.", "at": ["keeper-lease", "keeper-states"]}, {"text": "The state moves to renewing once. One renewal starts, however many runs saw the sign.", "at": ["keeper-states", "keeper-ladder"]}, {"text": "The keeper tries the silent way first, then a light prompt, then a full sign-in. A rung is never repeated.", "at": ["keeper-ladder"]}, {"text": "Before any request, it checks that each address a credential would go to is allowed.", "at": ["keeper-sign-in-guard", "keeper-providers"]}, {"text": "If a person is needed, the keeper asks only that session's own person. The ten runs wait.", "at": ["keeper-person"]}, {"text": "The new session is valid and its state is sealed. The ten runs get leases on it, and none sees the credential.", "at": ["keeper-saved", "keeper-lease"]}]}]}, "scout": {"name": "Scout and Drafter", "group": "Kernel", "where": "a2m-actions, a2m-files, each pack", "state": "p", "text": "Build time only. The scout identifies a system, runs the discoverers that suit it, drafts what follows by rule, and tries the drafted reads in a sandbox where a write is impossible. It reads a published description today. A capture of a person's use is built as far as its findings: capture.start, the person's page, web_use in a watching tab, and held drafts by the web pack's rules. Carrying a capture's findings through the drafter, trial and report, as a scout's stages, is not built (E5).", "decided": ["The short path is the sandbox: one command carries a system to drafted reads that passed their trial, and the building agent can call them at once. Publishing stays a person's act.", "Drafts with an open question are written to a holding folder (0298, being built).", "The scout's answer now fits the size cap: counts and first entries, lists read in pages.", "Its summary says why a step failed and how to fix it."], "weighing": ["A capture's findings enter the scout at the draft stage and end as a scout does: the main unbuilt step of learning a web application from a person's use (0400)."], "rows": [{"title": "Scout Run", "cols": [{"title": "Observation Stage", "ids": ["scout-identify", "scout-discover", "scout-capture"]}, {"title": "Analysis Stage", "ids": ["scout-compare", "scout-draft"]}, {"title": "Proof Stage", "ids": ["scout-check", "scout-try"]}, {"title": "Reporting Stage", "ids": ["scout-report", "scout-waiting"]}]}, {"title": "Scout Stores and Rules", "cols": [{"ids": ["scout-findings", "scout-unknowns", "scout-held"]}, {"title": "Scout Rules", "ids": ["scout-ladder", "scout-bounds", "scout-line"]}]}], "edges": [["scout-identify", "scout-discover", "each surface and its pack", "path", 1], ["scout-discover", "scout-compare", "findings from each discoverer", "path", 2], ["scout-compare", "scout-draft", "findings that map to a file", "path", 3], ["scout-draft", "scout-check", "draft files", "path", 4], ["scout-check", "scout-try", "drafts that compile and lint", "path", 5], ["scout-try", "scout-report", "reads tried, with results", "path", 6], ["scout-discover", "scout-findings", "what was found", "store"], ["scout-compare", "scout-unknowns", "a question a rule could not settle", "store"], ["scout-draft", "scout-held", "a draft with an open question", "store"], ["scout-try", "scout-ladder", "a read that earns executed", "use", {"scout-ladder": "ladder-executed"}], ["scout-report", "scout-waiting", "a read that waits for a sign-in", "store"], ["scout-capture", "scout-draft", "findings of a person's use", "use"]], "steps": [{"text": "Identification: each declared surface is probed for what kind it is and how sign-in works.", "at": ["scout-identify"]}, {"text": "Discovery: every discoverer that suits a surface runs in the sandbox, within its bounds.", "at": ["scout-discover"]}, {"text": "Scenario Comparison: what the system says about itself is set against what was seen. Differences become findings or open questions.", "at": ["scout-compare", "scout-findings", "scout-unknowns"]}, {"text": "Drafter: by fixed rule, the drafter writes files where a finding maps to one. A draft with an open question goes to the holding folder.", "at": ["scout-draft", "scout-held"]}, {"text": "Draft Check: drafts are linted and compiled; a failing one is kept and marked.", "at": ["scout-check"]}, {"text": "Trial: each read that is safe to try runs five times in the sandbox and the results are compared. A write is never tried.", "at": ["scout-try", "scout-ladder"]}, {"text": "Scout Report: one report with a hash, listing what was found, drafted, proven, held and open. Each stage is stored, so a stopped scout continues.", "at": ["scout-report"]}], "stepsTitle": "Scout Run", "walks": [{"name": "Held Draft", "steps": [{"text": "Scenario Comparison sets what the system says about itself against what was seen. A rule cannot settle one difference, so it becomes an open question.", "at": ["scout-compare", "scout-unknowns"]}, {"text": "The drafter writes a file from the finding. The draft holds an open question, so it goes to the holding folder, at the path it would have had.", "at": ["scout-draft", "scout-held"]}, {"text": "Draft Check lints and compiles the other drafts. The held one is kept out of the compile.", "at": ["scout-check"]}, {"text": "Trial runs the reads that are safe to try, five times in the sandbox. One doubtful draft does not stop them.", "at": ["scout-try"]}, {"text": "The report lists what was found, drafted, proven, held and open.", "at": ["scout-report"]}]}, {"name": "Capture End", "steps": [{"text": "The person stops the capture. Its findings enter the scout at the draft stage, as a scout's own would.", "at": ["scout-capture", "scout-draft"], "edges": [["scout-capture", "scout-draft"]]}, {"text": "The drafter drafts a read for each GET seen twice in one shape. A request by another method becomes a held page request with a question, and no operation.", "at": ["scout-draft", "scout-held"], "edges": [["scout-draft", "scout-held"]]}, {"text": "Draft Check lints and compiles what is not held.", "at": ["scout-check"], "edges": [["scout-draft", "scout-check"]]}, {"text": "Trial tries the drafted reads in the sandbox. A held draft and an asserted read are not tried; nothing that may write is.", "at": ["scout-try"], "edges": [["scout-check", "scout-try"]]}, {"text": "capture.stop answers with the report's reference. The report says it came from a capture, and its coverage is partial.", "at": ["scout-report"], "edges": [["scout-try", "scout-report"]]}]}]}, "watches": {"name": "Watches and Canaries", "group": "Kernel", "where": "a2m-engine, a2m-actions", "state": "p", "text": "A watch repeats a published read at an interval a person confirmed and reports what changed. A canary is a small read that runs before real work to catch a system that has changed. Watches are partly built: records are compared by key, and each watch is an MCP resource an agent subscribes to and a REST change stream. Canaries on a schedule of their own, and the retention of watches, which waits on the retention of runs, are not built.", "rows": [{"title": "Watch Creation", "cols": [{"ids": ["watch-create", "watch-confirm"]}]}, {"title": "Check Cycle", "cols": [{"ids": ["watch-schedule", "watch-check", "watch-compare"]}]}, {"title": "Watch Outputs", "cols": [{"ids": ["watch-changes", "watch-end"]}]}], "edges": [["watch-create", "watch-confirm", "a watch to confirm", "path", 1], ["watch-confirm", "watch-schedule", "a confirmed watch", "path", 2], ["watch-schedule", "watch-check", "a check that is due", "path", 3], ["watch-check", "watch-compare", "the normalized result", "path", 4], ["watch-compare", "watch-changes", "added, changed, removed digests", "path", 5], ["watch-compare", "watch-end", "a condition that holds", "use"], ["watch-end", "watch-schedule", "no more due times", "use"]], "steps": [{"text": "An agent asks for a watch: one published read with one fixed input, an interval and an end time.", "at": ["watch-create"]}, {"text": "The person confirms it on the engine's page. Until then nothing is checked.", "at": ["watch-confirm"]}, {"text": "Each due time is the start plus a whole number of intervals, taken from the store's clock, so it does not drift.", "at": ["watch-schedule"]}, {"text": "A check is an ordinary run of the read, with its ledger rows, trace and rate budget.", "at": ["watch-check"]}, {"text": "The result is reduced to digests and compared with the last check's digests, by key where the read returns keyed records.", "at": ["watch-compare"]}, {"text": "Differences are recorded as added, changed or removed (removed only when both checks were complete). Only digests are kept, never values.", "at": ["watch-changes"]}, {"text": "A watch ends at its end time, when its condition holds, or when a person ends it.", "at": ["watch-end"]}], "stepsTitle": "Watch Lifecycle", "decided": ["Canaries on a schedule of their own move after the first release: a canary nobody asked for sends requests nobody confirmed, and a stopped tool is shown by its mark. Not: build them before it, as 0390 first said (0397).", "A watch is an MCP resource, the face of watch.changes, and an agent subscribes to it with subscriptions/listen; its changes are followed through the kernel with no decision for each wait. Not: a resource handler of the MCP door's own, or a subscription that calls watch.changes in a loop (0478)."]}, "contract": {"name": "Provider Contract", "group": "Kernel", "where": "a2m-provider", "state": "b", "text": "The one interface between the kernel and the packs: the driver, the discoverer, the sign-in provider, the source reader, the capture contract, and the manifest in which a pack declares its modes, failure codes, and limits. Changing it needs a decision record.", "rows": [{"title": "Declarations", "cols": [{"ids": ["con-manifest", "con-registry"]}]}, {"title": "Extension Points", "cols": [{"ids": ["con-driver", "con-discoverer", "con-compiler-reg", "con-auth", "con-reader", "con-capture", "con-watch"]}]}, {"title": "Kernel Services", "cols": [{"ids": ["con-handle", "con-paths", "con-supervisor", "con-plugins", "con-shape"]}]}], "edges": [["con-manifest", "con-registry", "modes, limits and failure codes", "path", 1], ["con-registry", "con-handle", "which driver serves a mode", "path", 2], ["con-handle", "con-paths", "a path to check against its roots", "path", 3], ["con-driver", "con-handle", "the driver the handle fronts", "use"], ["con-supervisor", "con-plugins", "a process to start", "use"], ["con-manifest", "con-capture", "the surface kinds a pack captures", "use"], ["con-capture", "con-watch", "a recording, read only through take_capture", "use"], ["con-shape", "con-compiler-reg", "the closed shape a file kind checks a body by", "use"]], "steps": [{"text": "A provider ships one manifest saying what it is, what modes and surface kinds it registers, what it may do, and what it needs from the machine.", "at": ["con-manifest"]}, {"text": "At start, the manifests are checked and the registry is built once, as an immutable snapshot. Its digest goes into every trace.", "at": ["con-registry"]}, {"text": "The provider fills extension points from a fixed list: a driver, a discoverer, compiler registrations, an auth provider, a source reader, a capture source.", "at": ["con-driver", "con-discoverer", "con-compiler-reg", "con-auth", "con-reader", "con-capture"]}, {"text": "The engine reaches a driver only through a handle, which refuses a committing step that has no intent token.", "at": ["con-handle"]}, {"text": "Files a pack opens come as checked paths. A program is started only by the supervisor.", "at": ["con-paths", "con-supervisor"]}, {"text": "A provider that does something its manifest did not declare is stopped, and the run stops as policy.", "at": ["con-manifest", "con-supervisor"]}], "stepsTitle": "Pack Registration"}, "pack-web": {"name": "web", "group": "Pack", "where": "a2m-pack-web-browser, a2m-pack-web-ui, a2m-pack-web-probe", "state": "p", "text": "Drives a web application through a browser the engine owns, with its own profile. It finds controls by a screen model, reads and sets them, and can make the page's own requests. Reads and some writes are built, and a page that reads by POST is read through a request a person asserted; a person's use is captured in a watching tab and drafted held; many widget drivers are not.", "weighing": ["Whether requests made from inside the page are worth keeping: the first measurement did not show them faster than reading the screen."], "rows": [{"title": "Web Crates", "cols": [{"title": "Driving Crate", "ids": ["web-ui"]}, {"title": "Learning Crate", "ids": ["web-probe"]}, {"title": "Browser Crate", "ids": ["web-browser"]}]}, {"title": "Web Limits", "cols": [{"ids": ["web-refuses"]}]}], "edges": [["web-probe", "web-ui", "screens seen, for the drafter", "path", 1, {"web-probe": "probe-snapshot", "web-ui": "webui-screens"}], ["web-ui", "web-browser", "acts and reads in a tab", "path", 2, {"web-ui": ["webui-ui", "webui-page-http", "webui-site-tools"], "web-browser": "wb-tabs"}], ["web-probe", "web-browser", "an observing tab, or a watching tab", "use", {"web-probe": ["probe-identify", "probe-capture", "probe-site-tools"], "web-browser": "wb-tabs"}]], "steps": [{"text": "The scout asks the probe what a web surface is, then lets it take snapshots. The probe uses an observing tab that cannot act.", "at": ["web-probe", "web-browser"]}, {"text": "The drafter turns what was seen into screen models and reads. Locators live only in screen models.", "at": ["web-probe", "web-ui"]}, {"text": "A read through the interface locates elements by role and name, reads their values, and compares nothing it cannot name.", "at": ["web-ui", "web-browser"]}, {"text": "A write through the interface is set by a widget driver and saved once. The value is read back from the field or from the save's own response.", "at": ["web-ui", "web-browser"]}, {"text": "A faster read or write can use the application's own requests, sent from inside the signed-in page.", "at": ["web-ui"]}, {"text": "Anything it does not recognise, such as a new dialog, is a stop.", "at": ["web-refuses"]}], "stepsTitle": "Page Sequence", "walks": [{"name": "Page Write", "steps": [{"text": "The binding names the ui mode. The driver prepares a tab in the identity's own browser profile.", "at": ["web-ui", "web-browser"]}, {"text": "Each control is found from the screen model's ordered locators, by role and name.", "at": ["web-ui"]}, {"text": "A widget driver sets the control the way it needs, and the page is saved once.", "at": ["web-ui"]}, {"text": "The value is read back from the field or from the save's own response.", "at": ["web-ui", "web-browser"]}, {"text": "A new dialog the pack does not recognise is a stop, not a guess.", "at": ["web-refuses"]}]}, {"name": "Asserted Read", "steps": [{"text": "A read of a published version names the ui mode. The driver reads the version's page requests and hands the tab each asserted read.", "at": ["web-ui", "web-browser"], "edges": [["web-ui", "web-browser"]]}, {"text": "The page sends its own POST for its rows. It matches an asserted read in all four parts and goes on; anything else that may write is failed.", "at": ["web-browser"]}, {"text": "The value is read from the screen, as any ui read is.", "at": ["web-ui", "web-browser"]}, {"text": "Under the drafts the same read stops as policy, page_write_refused, and its next step names the page request and says to publish it.", "at": ["web-ui", "web-refuses"]}]}]}, "pack-http": {"name": "http", "group": "Pack", "where": "a2m-pack-http", "state": "b", "text": "Calls an HTTP service directly: reads, and writes with read-back, in JSON and other forms. It reads a published description in the OpenAPI 3.0, 3.1 or Swagger 2.0 form into drafted reads, ties each endpoint to the one surface that fits, and gives every drafted tool its own name. A field the description does not require may come back empty.", "decided": ["0297: a field the description does not require is drafted as allowed to be empty. Proven on real software.", "The older Swagger 2.0 description format is now read.", "A drafted endpoint is tied to a surface only when exactly one surface fits.", "No two drafted tools share a name or a file."], "weighing": ["Should a tool's output schema say beforehand which outputs may be absent? Leaning yes; the shape already knows, nothing carries it into the compiled target."], "rows": [{"title": "HTTP Knowledge", "cols": [{"ids": ["http-catalog", "http-shape", "http-forms"]}]}, {"title": "HTTP Discovery", "cols": [{"ids": ["http-description", "http-draft"]}]}, {"title": "HTTP Action", "cols": [{"ids": ["http-driver", "http-signin"]}]}, {"title": "HTTP Limits", "cols": [{"ids": ["http-refuses"]}]}], "edges": [["http-description", "http-draft", "findings, one per operation", "path", 1, {"http-description": "hd-findings", "http-draft": "hdr-safe"}], ["http-draft", "http-catalog", "endpoint entries", "path", 2, {"http-draft": "hdr-endpoint"}], ["http-catalog", "http-driver", "request templates", "path", 3, {"http-driver": "hdrv-request"}], ["http-shape", "http-driver", "the declared shape of an answer", "path", 4, {"http-driver": "hdrv-validate"}], ["http-forms", "http-shape", "the answer, read by its form", "use"], ["http-signin", "http-driver", "the scheme's round trips", "use", {"http-driver": "hdrv-prepare"}]], "steps": [{"text": "The scout hands the pack a published description of the service, or the pack fetches it from the surface.", "at": ["http-description"]}, {"text": "Its operations become findings, then the drafter writes endpoint entries and one read for each safe method.", "at": ["http-description", "http-draft"]}, {"text": "Each endpoint entry holds a request template and the shape of the answer. These are the only place endpoints live.", "at": ["http-catalog", "http-shape"]}, {"text": "At run time the driver builds the request from the template, places the session's credential, and sends it once.", "at": ["http-driver", "http-signin"]}, {"text": "The answer is checked against its declared shape. An answer outside it stops the run as drift.", "at": ["http-shape", "http-forms"]}, {"text": "For a write, the driver reads the record back through the endpoint the binding names.", "at": ["http-driver"]}], "stepsTitle": "Service Read Path", "walks": [{"name": "Drafted Read", "steps": [{"text": "The service publishes a description of itself. The scout hands it to the pack, or the pack fetches it from the surface.", "at": ["http-description"]}, {"text": "Each operation becomes a finding at the inferred level. A description is a claim, not an observation.", "at": ["http-description", "http-draft"]}, {"text": "The drafter writes an endpoint entry for each safe method. A property the description does not require is drafted as possibly null.", "at": ["http-draft", "http-catalog"]}, {"text": "One read operation is written for each safe method that answers with a body.", "at": ["http-draft"]}, {"text": "At run time the driver builds the request from the template and checks the answer against its declared shape.", "at": ["http-driver", "http-shape"]}]}, {"name": "Lost HTTP Answer", "steps": [{"text": "The driver builds the request from the template, places the session's credential, and sends it once.", "at": ["http-catalog", "http-signin", "http-driver"]}, {"text": "The connection drops after the request was sent. There is no answer. The driver says it was sent with no verdict, which is possible_commit.", "at": ["http-driver"]}, {"text": "The driver never retries. The engine reads the record back through the endpoint the binding names.", "at": ["http-driver", "http-catalog"]}, {"text": "The answer is checked against its declared shape. An answer outside it stops the run as drift.", "at": ["http-shape"]}]}]}, "pack-mcp": {"name": "mcp", "group": "Pack", "where": "a2m-pack-mcp", "state": "p", "text": "Wraps an existing MCP server and adds what it lacks: declared effects, approval, and read-back. Over HTTP, and as a local program. A local server can be started through a launcher with its entry file pinned where it lies; a package runner is refused, with what to do instead.", "weighing": [], "rows": [{"title": "MCP Setup", "cols": [{"ids": ["mcp-p-mapping", "mcp-p-pins"]}]}, {"title": "MCP Discovery", "cols": [{"ids": ["mcp-p-discover", "mcp-p-draft"]}]}, {"title": "MCP Calling", "cols": [{"ids": ["mcp-p-connect", "mcp-p-call", "mcp-p-readback"]}]}, {"title": "MCP Limits", "cols": [{"ids": ["mcp-p-untrusted", "mcp-p-refuses"]}]}], "edges": [["mcp-p-mapping", "mcp-p-pins", "the allowed tools and their digests", "path", 1], ["mcp-p-pins", "mcp-p-call", "a definition to compare with its pin", "path", 2], ["mcp-p-call", "mcp-p-readback", "a write's call and its result", "path", 3], ["mcp-p-connect", "mcp-p-call", "an open connection", "use"], ["mcp-p-call", "mcp-p-untrusted", "text from the server", "use"], ["mcp-p-discover", "mcp-p-draft", "the server's tools", "use"], ["mcp-p-draft", "mcp-p-mapping", "a proposed read", "use"]], "steps": [{"text": "A person writes a mapping file naming the only tools of an existing MCP server that may be reached, each pinned by the digest of its definition, and the effect they judge it to have.", "at": ["mcp-p-mapping", "mcp-p-pins"]}, {"text": "Discovery lists the server's tools through the sandbox and the drafter writes a pass-through read for each tool the server marks read-only.", "at": ["mcp-p-discover", "mcp-p-draft"]}, {"text": "At run time the pack connects: a local program started by path and digest, or a remote server over HTTP with the session's token.", "at": ["mcp-p-connect"]}, {"text": "Before each call it compares the tool's current definition with its pin. A changed definition is drift.", "at": ["mcp-p-pins", "mcp-p-call"]}, {"text": "It calls the tool with typed arguments. Text in the answer is passed on as untrusted data.", "at": ["mcp-p-call", "mcp-p-untrusted"]}, {"text": "A write is proved only by the mapped read tool. With none, the write is irreversible.", "at": ["mcp-p-readback"]}], "stepsTitle": "Upstream Call", "decided": ["0299: a server that runs through a launcher is started when its entry file is pinned by a digest. A package runner that fetches code at start stays refused, with what to do instead.", "The review shows a server started through a launcher as a launcher, and says that what its entry file loads is not pinned; no hazard is added. Not: mark every such operation as sending outside (0390, 0398)."]}, "pack-desktop": {"name": "desktop", "group": "Pack", "where": "a2m-pack-desktop", "state": "p", "text": "Reads and sets a desktop application through the operating system's accessibility interface. Never by clicking on a picture of the screen. Linux has reads and verified writes. Windows and macOS have reads, and writes through a closed list of their own on each, written and linted and not yet run there.", "rows": [{"title": "Desktop Reach", "cols": [{"ids": ["desk-window", "desk-backend"]}]}, {"title": "Desktop Action", "cols": [{"ids": ["desk-locate", "desk-set", "desk-wait"]}]}, {"title": "Desktop Learning", "cols": [{"ids": ["desk-discover", "desk-screens"]}]}, {"title": "Desktop Protection", "cols": [{"ids": ["desk-serialize", "desk-refuses"]}]}], "edges": [["desk-window", "desk-backend", "a window proven by id and program", "path", 1], ["desk-backend", "desk-locate", "the accessibility tree", "path", 2], ["desk-locate", "desk-set", "exactly one element", "path", 3], ["desk-set", "desk-wait", "an act, then its event", "path", 4], ["desk-discover", "desk-screens", "a window's shape", "store"], ["desk-screens", "desk-locate", "a screen model's query", "use"], ["desk-serialize", "desk-window", "one run at a time", "use"]], "steps": [{"text": "The pack finds the application already running (the first slice starts nothing) and proves the window and process are the expected ones, by id, start time and program digest.", "at": ["desk-window"]}, {"text": "It talks to the application through the operating system's own accessibility interface, through a backend written for each system.", "at": ["desk-backend"]}, {"text": "It finds exactly one element by role and name in the accessibility tree. Never by position on a picture.", "at": ["desk-locate"]}, {"text": "It sets a value or invokes an action. A committing invoke is the commit point; the value pattern is read back.", "at": ["desk-set"]}, {"text": "Event Waits end on an accessibility event. A condition an operating system cannot signal is refused for it, not polled.", "at": ["desk-wait"]}, {"text": "The scheduler lets only one run at a time change a person's desktop.", "at": ["desk-serialize"]}], "stepsTitle": "Desktop Write Sequence", "decided": ["Windows and macOS each have an acting half with a closed list of its own: SetValue and Invoke through UI Automation, AXValue and AXPress through the accessibility interface; the process is proven again before every act. Not: one acting interface behind a trait (0399)."]}, "pack-command": {"name": "command", "group": "Pack", "where": "a2m-pack-command", "state": "b", "text": "Runs a command-line program as declared commands with typed arguments, never as a shell and never as text an agent wrote. A write needs a declared command that reads the result back.", "rows": [{"title": "Command Declaration", "cols": [{"ids": ["cmd-commands", "cmd-program-check"]}]}, {"title": "Command Discovery", "cols": [{"ids": ["cmd-discover", "cmd-draft"]}]}, {"title": "Command Run", "cols": [{"ids": ["cmd-args", "cmd-start", "cmd-output"]}]}, {"title": "Command Proof", "cols": [{"ids": ["cmd-readback", "cmd-safety"]}]}], "edges": [["cmd-commands", "cmd-program-check", "the program block and its digests", "path", 1], ["cmd-program-check", "cmd-args", "a program that passed the check", "path", 2], ["cmd-args", "cmd-start", "an element list, never one string", "path", 3], ["cmd-start", "cmd-output", "exit status and output", "path", 4], ["cmd-output", "cmd-readback", "a write's parsed result", "path", 5], ["cmd-discover", "cmd-draft", "help and version findings", "use"], ["cmd-safety", "cmd-program-check", "programs it will not start", "use"]], "steps": [{"text": "A commands file describes one program: its known digests, a version check, its allowed help forms, its commands with typed parameters, and what each exit status means.", "at": ["cmd-commands"]}, {"text": "Before each start the path is checked: absolute, not writable by other users, matching a listed digest and a supported version.", "at": ["cmd-program-check", "cmd-safety"]}, {"text": "Arguments are put together from the template element by element, never as one string, and never passed through a shell.", "at": ["cmd-args"]}, {"text": "The supervisor starts the program once, in a fresh empty folder with a bare environment, no terminal, and ceilings on time and output.", "at": ["cmd-start"]}, {"text": "The exit status is checked against the declared meanings and the output is parsed into typed values.", "at": ["cmd-output"]}, {"text": "A write names a read command that works from the identity inputs alone. Without one it is irreversible.", "at": ["cmd-readback"]}], "stepsTitle": "Command Run Sequence"}, "pack-data": {"name": "data", "group": "Pack", "where": "a2m-pack-data", "state": "b", "text": "Reads and writes rows of a database. A read runs in a read-only transaction, so the database itself refuses a write. A write names its key, checks the count of rows changed inside the transaction, and reads the row back.", "rows": [{"title": "Data Declaration", "cols": [{"ids": ["data-statements", "data-stands"]}]}, {"title": "Data Discovery", "cols": [{"ids": ["data-discover", "data-draft"]}]}, {"title": "Data Reads", "cols": [{"ids": ["data-readonly", "data-fetch"]}]}, {"title": "Data Writes", "cols": [{"ids": ["data-transaction", "data-readback"]}]}, {"title": "Data Limits", "cols": [{"ids": ["data-refuses"]}]}], "edges": [["data-statements", "data-transaction", "one write statement and its parameters", "path", 1], ["data-transaction", "data-readback", "the committed row's key", "path", 2], ["data-statements", "data-readonly", "a read statement", "use"], ["data-readonly", "data-fetch", "a connection the store holds read-only", "use"], ["data-stands", "data-transaction", "whether this store may be written", "use"], ["data-discover", "data-draft", "tables, columns and keys", "use"]], "steps": [{"text": "Every statement any binding may run is text in a statements file, reviewed and hashed with the compiled target. An input only fills a bound parameter.", "at": ["data-statements"]}, {"text": "A read runs only on a connection the store itself holds read-only, and the driver asks the store for the access mode before going on.", "at": ["data-readonly"]}, {"text": "Rows come back as typed values up to a row limit, and more says if there were others.", "at": ["data-fetch"]}, {"text": "A write begins a transaction, runs one prepared statement, checks the row count, and commits. Any other count rolls back.", "at": ["data-transaction"]}, {"text": "After the commit, a read in a new read-only transaction fetches the record by its key. The engine compares.", "at": ["data-readback"]}, {"text": "A database an application owns can be written only if the target says so and its owner's authorization names the route.", "at": ["data-stands"]}], "stepsTitle": "Database Write Sequence"}, "pack-file": {"name": "file", "group": "Pack", "where": "a2m-pack-file", "state": "b", "text": "Reads and writes files: delimited text, JSON, workbooks, settings files, folders, and growing logs. A write makes a new file and swaps it in one step, then opens it again to check.", "rows": [{"title": "File Opening", "cols": [{"ids": ["file-path", "file-formats"]}]}, {"title": "File Change", "cols": [{"ids": ["file-locate", "file-patch", "file-untouched"]}]}, {"title": "File Saving", "cols": [{"ids": ["file-save", "file-readback", "file-reconcile"]}]}, {"title": "File Discovery", "cols": [{"ids": ["file-discover"]}]}, {"title": "File Limits", "cols": [{"ids": ["file-refuses"]}]}], "edges": [["file-path", "file-formats", "the bytes of a checked file", "path", 1], ["file-formats", "file-locate", "a parsed form, with positions", "path", 2], ["file-locate", "file-patch", "the spans of the named places", "path", 3], ["file-patch", "file-untouched", "the new bytes", "path", 4], ["file-untouched", "file-save", "new bytes that pass the check", "path", 5], ["file-save", "file-readback", "the file, opened again from disk", "path", 6], ["file-save", "file-reconcile", "the file's digest, after a doubt", "use"]], "steps": [{"text": "The kernel hands the pack a path already checked to lie inside an allowed root. The pack never resolves a path from text. A link at the file's own name is refused.", "at": ["file-path"]}, {"text": "The file is parsed with the position of every value kept, so a value can be found and replaced without disturbing the rest.", "at": ["file-formats", "file-locate"]}, {"text": "New bytes are built by replacing only the spans of the named places.", "at": ["file-patch"]}, {"text": "The new bytes are parsed again, and every place outside the named ones must equal what it was.", "at": ["file-untouched"]}, {"text": "Save: write a new file in the same folder and replace the old one in a single step. That replace is the commit point.", "at": ["file-save"]}, {"text": "File Read-Back: open the file again from disk, parse it, read the same places and compare.", "at": ["file-readback"]}, {"text": "After a lost answer, the file's digest says exactly what happened: the intended one landed, the earlier one did not, anything else is someone else's change.", "at": ["file-reconcile"]}], "stepsTitle": "File Write Sequence"}, "pack-stream": {"name": "stream", "group": "Pack", "where": "a2m-pack-stream", "state": "b", "text": "Reads a bounded sample from a message broker without taking a message from anyone, and publishes with a key so that a resumed publish delivers once. Speaks NATS with JetStream. A plain connection that carries the session's credential goes to this machine's loopback address only; one that carries none goes to the surface's address, an address or a host name with its port, checked before anything is resolved or sent. A server that asks for TLS is refused, because this build speaks none.", "rows": [{"title": "Stream Declaration", "cols": [{"ids": ["stream-channel", "stream-discover"]}]}, {"title": "Stream Reads", "cols": [{"ids": ["stream-latest", "stream-await", "stream-list"]}]}, {"title": "Stream Writes", "cols": [{"ids": ["stream-publish", "stream-readback", "stream-dupes"]}]}, {"title": "Stream Takes", "cols": [{"ids": ["stream-take"]}]}], "edges": [["stream-discover", "stream-channel", "a drafted channel entry", "path", 1], ["stream-channel", "stream-publish", "the channel, its key and schema", "path", 2], ["stream-publish", "stream-readback", "the broker's acknowledgement", "path", 3], ["stream-channel", "stream-latest", "a channel and a key", "use"], ["stream-publish", "stream-dupes", "a lost acknowledgement", "use"]], "steps": [{"text": "A channels file fixes the channel, its kind (retained, log or queue), its message schema and key. An input never chooses the channel.", "at": ["stream-channel"]}, {"text": "A read gets the last retained value for a key. A wait ends within a time limit with the next matching message, or with a named stop.", "at": ["stream-latest", "stream-await"]}, {"text": "A publish builds one message from a typed template and checks it against the schema.", "at": ["stream-publish"]}, {"text": "The broker's acknowledgement is the confirmation. Whether it can be read back depends on the channel.", "at": ["stream-readback"]}, {"text": "A retained state channel with no outside readers reads back by key. A log reads the position or scans for the record's token. A queue has only the acknowledgement, so it is irreversible.", "at": ["stream-readback"]}, {"text": "If an acknowledgement is lost, a broker that refuses repeated tokens makes a resend safe; otherwise the run stops and a person decides.", "at": ["stream-dupes"]}, {"text": "Taking a message is allowed only from a queue the runtime owns, and the message is stored before it is acknowledged.", "at": ["stream-take"]}], "stepsTitle": "Publish Proof", "decided": ["A plain link that carries no credential goes to the surface's address, which a person registered for the target. Not: the loopback rule for every connection, or an IP address only and never a name (0435)."]}, "pack-device": {"name": "device", "group": "Pack", "where": "a2m-pack-device", "state": "p", "text": "Reads and sets a device through its own protocol, checking a value's range before a frame is built. Speaks Modbus. Proven against a simulated device only.", "rows": [{"title": "Device Declaration", "cols": [{"ids": ["dev-map", "dev-discover"]}]}, {"title": "Pre-Frame Checks", "cols": [{"ids": ["dev-identify", "dev-link"]}]}, {"title": "Device Action", "cols": [{"ids": ["dev-frame", "dev-pace"]}]}, {"title": "Device Proof", "cols": [{"ids": ["dev-readback", "dev-lost"]}]}, {"title": "Device Limits", "cols": [{"ids": ["dev-firmware", "dev-refuses"]}]}], "edges": [["dev-link", "dev-identify", "an exclusive link", "path", 1], ["dev-map", "dev-identify", "the model, firmware and serial expected", "path", 2], ["dev-identify", "dev-frame", "a device that matches its map", "path", 3], ["dev-frame", "dev-readback", "a register to read again", "path", 4], ["dev-pace", "dev-frame", "the minimum gap between frames", "use"], ["dev-frame", "dev-lost", "a write with no reply", "use"], ["dev-discover", "dev-map", "a drafted register map", "use"]], "steps": [{"text": "A register map declares each readable or writable address with its type, unit, access and any side effect of reading.", "at": ["dev-map"]}, {"text": "One run at a time holds the link. The pack opens it with exclusive use.", "at": ["dev-link"]}, {"text": "Before any frame beyond identification, the device must report a model, firmware and serial matching the target. A mismatch stops every run, reads included.", "at": ["dev-identify"]}, {"text": "One frame is built from the map and typed values and sent. The pace follows the device's documentation, or four frames a second at most.", "at": ["dev-frame", "dev-pace"]}, {"text": "The device's acknowledgement confirms. The register is read again. A register whose reading changes it is never read back, and a write to it is irreversible.", "at": ["dev-readback"]}, {"text": "A lost link after a write is possible_commit; on reconnection the device is identified first, then read.", "at": ["dev-lost"]}], "stepsTitle": "Register Write Sequence"}, "project": {"name": "Project", "group": "Stored State", "where": "a2m-files", "state": "b", "text": "What the developer keeps, usually in version control: one folder for each target with its target file, screens, endpoints, operations, tests, and fixtures. People and agents read and edit these. The engine never reads them during a call. A draft the scout could not finish waits in a holding folder, held/, which is never compiled.", "decided": ["0298: drafts with an open question go to held/, so they no longer block the other tools (being built).", "The credential check no longer flags a pointer into an answer as a secret."], "rows": [{"title": "Project Level", "cols": [{"ids": ["proj-toml", "proj-agents", "proj-out", "proj-sources"]}]}, {"title": "Target Folder", "cols": [{"title": "Kernel File Kinds", "ids": ["proj-target", "proj-auth", "proj-types", "proj-operations", "proj-pipelines"]}, {"title": "Pack File Group", "ids": ["proj-pack-files"]}, {"title": "Test Files", "ids": ["proj-tests"]}, {"title": "Source Files", "ids": ["proj-source-defs"]}, {"title": "Held Drafts", "ids": ["proj-held"]}]}], "edges": [["proj-toml", "proj-target", "targets and environments", "path", 1], ["proj-target", "proj-operations", "the surfaces and types they name", "path", 2], ["proj-operations", "proj-pipelines", "operations, in order", "path", 3], ["proj-target", "proj-auth", "the sign-in method per surface", "use"], ["proj-operations", "proj-pack-files", "screens, endpoints or commands", "use"], ["proj-operations", "proj-tests", "expected results", "use"], ["proj-sources", "proj-pipelines", "rows for a pipeline to read", "use"], ["proj-held", "proj-operations", "a finished draft, moved back", "use"], ["proj-source-defs", "proj-pipelines", "how a input file is read and mapped", "use"]], "steps": [{"text": "A project is any folder with an anything2mcp.toml; commands look for it upward from where they run.", "at": ["proj-toml"]}, {"text": "Each target is one folder of YAML files. Everything a person or agent knows about the system is written there and nowhere else.", "at": ["proj-target", "proj-auth", "proj-types"]}, {"text": "Operations and pipelines describe the tools. Pack File Kinds (screens, endpoints, commands) hold the knowledge of one kind of system.", "at": ["proj-operations", "proj-pipelines", "proj-pack-files"]}, {"text": "The drafter writes a draft with no open question where it belongs. One with an open question goes to the holding folder, held/, at the same path.", "at": ["proj-held"]}, {"text": "The loader reads the folder and nothing outside it, and does not read held/.", "at": ["proj-target", "proj-held"]}, {"text": "Files for a pipeline to read, and descriptions handed to the scout, are the Input Files, in the project's sources/ folder. A target's own sources/ folder holds the Source Definitions. Live sessions and the store are not in the project at all.", "at": ["proj-sources"]}], "stepsTitle": "Target Layout"}, "compiled-target": {"name": "Compiled Target", "group": "Stored State", "where": "a2m-files compiles it; a2m-core checks it", "state": "b", "text": "The compiler checks a target's files and writes one file, the compiled target, with a hash of its exact bytes. The engine runs only compiled targets and refuses one whose hash does not match. Every run records the hash, and a publish is tied to it.", "decided": ["0298, reworked the same day: the compiler stays all-or-nothing. A draft with an open question waits in a holding folder that the compiler never reads.", "Every name of the part is the compiled target. What is stored keeps the old word, so that an older build's bytes still open and every hash stays the same: the envelope anything2mcp-plan 1, the ledger's plan_hash and plan columns, and the plan field of a diff, a trace and gate evidence. Not: rename what is stored with a migration, which would change every published hash (0402)."], "weighing": ["Rejected after a build and a review: having the compiler set files aside and compile the rest. It made the compiler decide what a target is, and the review found six faults with that one cause."], "rows": [{"title": "Compiler Stages", "cols": [{"title": "Reading Stages", "ids": ["compiled-target-parse", "compiled-target-validate", "compiled-target-resolve"]}, {"title": "Checking Stages", "ids": ["compiled-target-typecheck", "compiled-target-lower", "compiled-target-analyze"]}, {"title": "Finishing Stages", "ids": ["compiled-target-lint", "compiled-target-describe", "compiled-target-emit"]}]}, {"title": "Compiler Output", "cols": [{"ids": ["compiled-target-contents", "compiled-target-hash", "compiled-target-whole", "compiled-target-versions", "compiled-target-review"]}]}], "edges": [["compiled-target-parse", "compiled-target-validate", "values, with file, line and column", "path", 1], ["compiled-target-validate", "compiled-target-resolve", "files that fit their schemas", "path", 2], ["compiled-target-resolve", "compiled-target-typecheck", "names linked to their definitions", "path", 3], ["compiled-target-typecheck", "compiled-target-lower", "expressions that type-check", "path", 4], ["compiled-target-lower", "compiled-target-analyze", "a fixed list of steps per binding", "path", 5], ["compiled-target-analyze", "compiled-target-lint", "commit counts and effect classes", "path", 6], ["compiled-target-lint", "compiled-target-describe", "a target that passes the lints", "path", 7], ["compiled-target-describe", "compiled-target-emit", "each tool's name and schemas", "path", 8], ["compiled-target-emit", "compiled-target-hash", "the compiled target's exact bytes", "path", 9], ["compiled-target-emit", "compiled-target-contents", "what the compiled target holds", "use"], ["compiled-target-whole", "compiled-target-emit", "no problem left standing", "use"], ["compiled-target-contents", "compiled-target-versions", "the compiled target bytes of each version", "store"], ["compiled-target-versions", "compiled-target-review", "a version to review before it is published", "use"]], "steps": [{"text": "The target's files are parsed with the place of every value kept, then checked against their schemas.", "at": ["compiled-target-parse", "compiled-target-validate"]}, {"text": "Names are linked: operations to screens, endpoints and field types; pipelines to operations and sources.", "at": ["compiled-target-resolve"]}, {"text": "Every expression is type-checked. There is no float type; numbers are decimals.", "at": ["compiled-target-typecheck"]}, {"text": "Each binding is lowered into a fixed list of steps by its pack.", "at": ["compiled-target-lower"]}, {"text": "Commit points are counted from those steps, and each operation's effect class and permission manifest are worked out.", "at": ["compiled-target-analyze"]}, {"text": "Lint rules run, then each tool's name, description and schemas are generated.", "at": ["compiled-target-lint", "compiled-target-describe"]}, {"text": "If every stage passed, the compiled target is written as canonical JSON and its hash is taken. If any problem stood, nothing is emitted.", "at": ["compiled-target-emit", "compiled-target-whole", "compiled-target-hash"]}], "stepsTitle": "Compilation Sequence", "walks": [{"name": "Failed Compile", "steps": [{"text": "Every file is parsed with the place of each value kept, then checked against its schema.", "at": ["compiled-target-parse", "compiled-target-validate"]}, {"text": "Resolution fails: an operation names an endpoint that does not exist. The problem gets a code, a place and a fix.", "at": ["compiled-target-resolve"]}, {"text": "Type-Checking fails too: an expression uses a float name, which is refused.", "at": ["compiled-target-typecheck"]}, {"text": "The problems from the stages are reported together, not one at a time.", "at": ["compiled-target-whole"]}, {"text": "Nothing is emitted. There is no compiled target and no hash, so nothing can run or be published.", "at": ["compiled-target-emit", "compiled-target-hash"]}]}]}, "ledger": {"name": "Ledger", "group": "Stored State", "where": "a2m-ledger", "state": "b", "text": "The record of every run: its state, each record's intent, what was sent, what was read back, approvals, and traces. An intent is stored before the act it describes. With no ledger there is no write. SQLite on one machine.", "rows": [{"title": "Ledger Contents", "cols": [{"title": "Run Tables", "ids": ["ledger-runs", "ledger-records", "ledger-events", "ledger-locks"]}, {"title": "Evidence Tables", "ids": ["ledger-blobs", "ledger-findings", "ledger-versions"]}, {"title": "History Tables", "ids": ["ledger-audit", "ledger-watches"]}]}, {"title": "Ledger Mechanics", "cols": [{"title": "State Machines", "ids": ["ledger-run-states", "ledger-record-states"]}, {"title": "Write Gate", "ids": ["ledger-token", "ledger-rules"]}, {"title": "Storage Layer", "ids": ["ledger-store"]}]}], "edges": [["ledger-runs", "ledger-records", "one run, many records", "path", 1], ["ledger-records", "ledger-record-states", "planned, intent, acted, verified", "path", 2], ["ledger-record-states", "ledger-token", "an intent stored under a lease", "path", 3], ["ledger-token", "ledger-rules", "what the nine rules check", "path", 4, {"ledger-rules": ["ledger-rule-1", "ledger-rule-4"]}], ["ledger-runs", "ledger-run-states", "the run's state", "use"], ["ledger-records", "ledger-events", "an event for each change", "store"], ["ledger-records", "ledger-locks", "a record key to lock", "use"], ["ledger-records", "ledger-blobs", "evidence, named by a keyed digest", "store"], ["ledger-store", "ledger-runs", "rows, written inside transactions", "store"]], "steps": [{"text": "A call becomes a run row, in the state queued, with its caller, tool version and input hash.", "at": ["ledger-runs", "ledger-run-states"]}, {"text": "If the same caller makes the same call while that run is unfinished, the ledger hands back the first run instead of making another.", "at": ["ledger-runs"]}, {"text": "For a write, one record row is made per commit point, in the state planned or unchanged.", "at": ["ledger-records", "ledger-record-states"]}, {"text": "Storing an intent needs the run's approval and the record's lock. The ledger then answers with the intent token.", "at": ["ledger-locks", "ledger-token", "ledger-rules"]}, {"text": "Marking acted uses the token up. Marking verified needs a value read from the system and a link to the evidence.", "at": ["ledger-token", "ledger-records", "ledger-blobs"]}, {"text": "Every change adds an event and updates the current row in one transaction, so the current state can always be rebuilt from the events.", "at": ["ledger-events", "ledger-store"]}, {"text": "The audit chain, findings, published versions and watches ride in the same file under the same transactions.", "at": ["ledger-audit", "ledger-findings", "ledger-versions", "ledger-watches"]}], "stepsTitle": "Ledger Write Sequence", "walks": [{"name": "Record Lifecycle", "steps": [{"text": "A call becomes a run row in the state queued. A write gets one record row for each commit point, in the state planned.", "at": ["ledger-runs", "ledger-run-states", "ledger-records", "ledger-record-states"]}, {"text": "Before it writes, the engine takes the record's lock, so no other run can write the same record.", "at": ["ledger-locks"]}, {"text": "The intent is stored. This needs the run's approval and the record's lock. The ledger answers with the intent token.", "at": ["ledger-records", "ledger-token", "ledger-rules"]}, {"text": "Marking the record acted uses the token up and keeps any key the system assigned.", "at": ["ledger-token", "ledger-record-states"]}, {"text": "Marking it verified needs a value read from the system and a link to the evidence.", "at": ["ledger-records", "ledger-blobs"]}, {"text": "Every change adds an event and updates the current row in one transaction.", "at": ["ledger-events", "ledger-store"]}]}, {"name": "Lost Answer", "steps": [{"text": "The write was sent and the engine stopped before it saw the answer. The record stays in intent or acted.", "at": ["ledger-record-states"]}, {"text": "The lease is lost. The run gets a new lease number, and anything carrying the older number is refused.", "at": ["ledger-runs", "ledger-rules"]}, {"text": "No new intent is stored while any record of the run is in intent or acted under an older lease.", "at": ["ledger-rules", "ledger-records"]}, {"text": "The engine reads the system. If the value equals the intended one, the record is marked verified with a link to the evidence.", "at": ["ledger-records", "ledger-blobs"]}, {"text": "The events keep the whole story, so the current state can be rebuilt from them.", "at": ["ledger-events"]}]}], "decided": ["A read's own records are committed without a disk sync of their own, so a power loss can take the last records that a read happened. A request with a diff, an action that needs an administrator's role, and every write are synced. Not: sync every read, which costs more than half a read's speed and protects nothing rule 3 names (0386, 0390)."]}, "vault": {"name": "Vault", "group": "Stored State", "where": "a2m-vault", "state": "p", "text": "Holds passwords, tokens, and cookies, encrypted. Its key is to live in the operating system's key store; that has not been exercised on a real store yet. A secret is a type that cannot be printed, and everything that leaves the engine passes a redactor.", "rows": [{"title": "Key Hierarchy", "cols": [{"ids": ["vault-root", "vault-layers"]}]}, {"title": "Key Use", "cols": [{"ids": ["vault-seal", "vault-secret"]}]}, {"title": "Secret Exclusion", "cols": [{"ids": ["vault-redactor", "vault-digest"]}]}], "edges": [["vault-root", "vault-layers", "the root key wraps workspace keys", "path", 1], ["vault-layers", "vault-seal", "an item's own data key", "path", 2], ["vault-seal", "vault-secret", "a secret, opened in a wrapper", "path", 3], ["vault-secret", "vault-redactor", "each secret released, registered", "path", 4], ["vault-digest", "vault-seal", "a keyed digest that names evidence", "use"]], "steps": [{"text": "On first start a root key is made once, under a lock, and kept in the operating system's key store, or derived from a passphrase.", "at": ["vault-root"]}, {"text": "From the root come a key per workspace, per owner and per item, each wrapped by the one above.", "at": ["vault-layers"]}, {"text": "Sealing turns a plain item into an envelope bound to what it is. The caller stores the envelope; the vault stores nothing itself.", "at": ["vault-seal"]}, {"text": "A secret that is opened exists only in a wrapper that cannot be printed or saved.", "at": ["vault-secret"]}, {"text": "Every secret the vault releases is registered with the redactor first, so it can be removed from anything leaving the system.", "at": ["vault-redactor"]}, {"text": "Evidence is named by a keyed digest, so someone who can read the store cannot check a guess by hashing it.", "at": ["vault-digest"]}], "stepsTitle": "Key-to-Redaction Sequence", "walks": [{"name": "Secret Containment", "steps": [{"text": "The root key is kept in the operating system's key store, or derived from a passphrase.", "at": ["vault-root"]}, {"text": "An item is sealed under its own data key, wrapped by the owner key above it.", "at": ["vault-layers", "vault-seal"]}, {"text": "When the item is opened, the secret exists only in a wrapper that cannot be printed, logged or saved.", "at": ["vault-secret"]}, {"text": "Before it is released, the secret is registered with the redactor.", "at": ["vault-secret", "vault-redactor"]}, {"text": "Whatever leaves the engine passes the redactor, which removes the secret from results, logs, traces and errors.", "at": ["vault-redactor"]}, {"text": "Evidence is named by a keyed digest, so no one who reads the store can check a guess by hashing it.", "at": ["vault-digest"]}]}]}, "browser": {"name": "Browser Profile", "group": "Stored State", "where": "a2m-pack-web-browser", "state": "b", "text": "A browser with a data folder the engine owns. The engine never reads, copies, or drives the person's everyday browser profile."}, "core": {"name": "Core Types", "group": "Foundation", "where": "a2m-core", "state": "b", "text": "The shared words as types: access kinds, effect classes, hazards, failure classes, evidence levels, statuses, and the compiled target's shape. A test holds their names to the documents.", "rows": [{"title": "Vocabulary Types", "cols": [{"ids": ["core-vocab", "core-names"]}]}, {"title": "Value Types", "cols": [{"ids": ["core-values", "core-decimal"]}]}, {"title": "Interchange Types", "cols": [{"ids": ["core-failure", "core-finding", "core-compiled-target"]}]}, {"title": "Safety Types", "cols": [{"ids": ["core-secret", "core-scope"]}]}], "edges": [["core-failure", "core-vocab", "the failure's class", "use"], ["core-vocab", "core-names", "closed words and open names", "use"], ["core-values", "core-decimal", "numbers as exact decimals", "use"], ["core-compiled-target", "core-values", "typed values inside the compiled target", "use"]], "steps": [{"text": "Every closed word, such as an effect class, a failure class or a run state, is one enum whose names a test holds to the documents.", "at": ["core-vocab"]}, {"text": "Words that packs bring, such as a mode, are checked names, so the kernel never lists them.", "at": ["core-names"]}, {"text": "A value read from a file, a caller or a system has one model; numbers are exact decimals.", "at": ["core-values", "core-decimal"]}, {"text": "Anything that cannot do what was asked reports a Failure with a class, a code and a next step.", "at": ["core-failure"]}, {"text": "A compiled target is immutable data with one encoding and a hash check. A secret is a wrapper that cannot be printed.", "at": ["core-compiled-target", "core-secret"]}], "stepsTitle": "Core Type Roles"}, "expr": {"name": "Expressions", "group": "Foundation", "where": "a2m-expr", "state": "b", "text": "The small language a target file uses to compute an input or compare a value, with decimal arithmetic and no floats in a comparison.", "rows": [{"title": "Compile Time", "cols": [{"ids": ["expr-env", "expr-compile"]}]}, {"title": "Run Time", "cols": [{"ids": ["expr-eval", "expr-library", "expr-normalize"]}]}], "edges": [["expr-env", "expr-compile", "the names and types allowed", "path", 1], ["expr-compile", "expr-eval", "the checked expression, in compiled target form", "path", 2], ["expr-library", "expr-eval", "host functions, from a closed list", "use"], ["expr-normalize", "expr-library", "normalizers a field type uses", "use"]], "steps": [{"text": "The compiler declares which names an expression may use (input, result, row and so on) and their types.", "at": ["expr-env"]}, {"text": "An expression is parsed and type-checked against them. A float literal or a float name is refused.", "at": ["expr-compile"]}, {"text": "The checked expression goes into the compiled target in its parsed form.", "at": ["expr-compile"]}, {"text": "At run time the engine loads it and evaluates it against bound values, to one value, with a cost limit.", "at": ["expr-eval"]}, {"text": "Field types normalize values through a closed library of functions, so the same value always gets the same result.", "at": ["expr-library", "expr-normalize"]}], "stepsTitle": "Expression Lifecycle"}, "telemetry": {"name": "Logs and Traces", "group": "Foundation", "where": "a2m-logs", "state": "b", "text": "Logs and traces, with every registered secret removed before anything is written. Nothing is sent off the machine unless a person switches it on.", "rows": [{"title": "Run Recording", "cols": [{"ids": ["tel-trace", "tel-capture", "tel-signature"]}]}, {"title": "Clean Capture", "cols": [{"ids": ["tel-redact", "tel-headers"]}]}, {"title": "Engine Observation", "cols": [{"ids": ["tel-spans", "tel-logs"]}]}], "edges": [["tel-trace", "tel-capture", "a step's record", "path", 1], ["tel-capture", "tel-redact", "captures chosen to be kept", "path", 2], ["tel-redact", "tel-headers", "only the headers on the list", "path", 3], ["tel-trace", "tel-signature", "the parts chosen for the signature", "use"]], "steps": [{"text": "Every step of a run adds a record to its trace: what ran, which binding, how long, and how it ended.", "at": ["tel-trace"]}, {"text": "A capture level, set by the compiled target and policy, says which captures are kept.", "at": ["tel-capture"]}, {"text": "Everything passes the redactor before it is written or sent, and again on the way out.", "at": ["tel-redact"]}, {"text": "A signature over chosen parts of the trace lets two runs be compared for identical behaviour.", "at": ["tel-signature"]}, {"text": "Spans, metrics and logs carry a closed set of attributes that cannot hold a value.", "at": ["tel-spans", "tel-logs"]}], "stepsTitle": "Trace Lifecycle"}, "netstate": {"name": "Network State", "group": "Foundation", "where": "a2m-netstate", "state": "b", "text": "Reads what networks this machine is on and what kind of place an address is. It sends nothing.", "rows": [{"title": "Network Readers", "cols": [{"title": "Address Readers", "ids": ["net-interfaces", "net-routes", "net-resolvers"]}, {"title": "Peer Readers", "ids": ["net-neighbours", "net-listeners", "net-proxy"]}]}, {"title": "Standing Join", "cols": [{"ids": ["net-standing"]}]}, {"title": "Reader Limits", "cols": [{"ids": ["net-bounds"]}]}], "edges": [["net-interfaces", "net-standing", "addresses and their state", "use"], ["net-routes", "net-standing", "the default route for each family", "use"]], "steps": [{"text": "Each reader asks the operating system for one kind of fact the machine already knows about its own network.", "at": ["net-interfaces", "net-routes", "net-resolvers", "net-neighbours", "net-listeners", "net-proxy"]}, {"text": "Place Reading joins interfaces and routes: what kind of place each address is, and which interface carries each address family's preferred default.", "at": ["net-standing"]}, {"text": "Every list is bounded and a cut is recorded.", "at": ["net-bounds"]}], "stepsTitle": "Network Reading"}, "sources": {"name": "Sources", "group": "Foundation", "where": "a2m-sources", "state": "b", "text": "Reads a file a run takes its rows from, such as a spreadsheet, once, and keeps the bytes so a resumed run reads the same input.", "rows": [{"title": "Source Reading", "cols": [{"ids": ["src-content", "src-readers"]}]}, {"title": "Source Understanding", "cols": [{"ids": ["src-fingerprint", "src-mapping", "src-typing"]}]}, {"title": "Source Output", "cols": [{"ids": ["src-validated", "src-positions"]}]}], "edges": [["src-content", "src-readers", "the input's bytes, format confirmed", "path", 1], ["src-readers", "src-fingerprint", "the parsed input", "path", 2], ["src-fingerprint", "src-mapping", "the known version of a template", "path", 3], ["src-mapping", "src-typing", "located rows and cells", "path", 4], ["src-typing", "src-validated", "typed fields, row by row", "path", 5], ["src-readers", "src-positions", "the position of each value", "use"]], "steps": [{"text": "The caller hands over the bytes of an input. The crate never opens a path and never reads an input twice.", "at": ["src-content"]}, {"text": "A reader for the format (workbook, delimited text, JSON) parses them, and the content check confirms the file is the format it claims.", "at": ["src-content", "src-readers"]}, {"text": "The template ing2MCP. Only the pack beside it ever touches it."}, "t-mcp": {"name": "MCP Server", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "t-desktop": {"name": "Desktop Application", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "t-command": {"name": "Command-Line Tool", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "t-data": {"name": "Data Store", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "t-file": {"name": "Files and Folders", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "t-stream": {"name": "Message Broker", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "t-device": {"name": "Hardware Device", "group": "Target System", "where": "outside the product", "state": "x", "text": "A system the person already uses. It knows nothing of Anything2MCP. Only the pack beside it ever touches it."}, "system": {"name": "Anything2MCP on One Machine", "group": "", "where": "anything2mcp", "state": "p", "text": "One program on the person's own computer. Agents and developers reach it through thin clients. One engine process holds everything that decides or acts. Packs are the only code that touches a system. Select a box  "proj-pipelines", "proj-pack-files", "proj-source-defs"], "compiled-target": "compiled-target-parse"}], ["compiled-target", "engine-loop", "the compiled target, checked by its hash", "store", {"compiled-target": "compiled-target-hash", "engine-loop": "engine-guard"}], ["engine-loop", "ledger", "the intent before the act; verified after", "path", 7, {"engine-loop": "engine-control", "ledger": "ledger-records"}], ["session-keeper", "vault", "asks for a stored secret", "store", {"session-keeper": "keeper-providers", "vault": "vault-layers"}], ["pack-web", "browser", "drives its own browser", "store", {"pack-web": "web-browser", "web-browser": "wb-launch"}]], "decided": ["A draft with an open question waits in a holding folder; the compiler stays all-or-nothing (0298).", "Servers run through a launcher start with a pinned entry file (0299).", "Publishing always needs a person; the sandbox is the short path.", "The shared server waits for the first release, and progress is counted against it: packages done of all, and how many of those left an agent can build before the release. Not: build the shared server now because its rows are unblocked, or weight progress by a guessed size (0390)."], "walks": [{"name": "Read", "steps": [{"text": "The agent calls a published tool. The Stdio Proxy carries the call to the engine.", "at": ["ai-agent", "bridge", "mcp-face"]}, {"text": "The registry asks the policy engine whether this caller may run this tool. The answer is recorded.", "at": ["mcp-face", "registry", "policy"]}, {"text": "The scheduler admits the run and gives it a row in the ledger.", "at": ["registry", "scheduler", "ledger"], "edges": [["registry", "scheduler"]]}, {"text": "The engine loop loads the compiled target and refuses it if its hash does not match.", "at": ["scheduler", "engine-loop", "compiled-target"]}, {"text": "The session keeper lends a signed-in session. If there is none, the run stops and says a sign-in is needed.", "at": ["session-keeper", "engine-loop
