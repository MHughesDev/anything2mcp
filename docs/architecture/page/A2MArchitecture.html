", "vault"]}, {"text": "The engine hands each step to the pack for this kind of system, through the provider contract.", "at": ["engine-loop", "contract", "pack-http"]}, {"text": "The pack asks the system and gets its answer.", "at": ["pack-http", "t-http"]}, {"text": "The values are put in their declared forms, the trace is stored, and the result goes back with secrets removed.", "at": ["engine-loop", "ledger"]}]}, {"name": "Verified Write", "steps": [{"text": "The call arrives and is allowed, as for a read.", "at": ["ai-agent", "bridge", "mcp-face", "registry", "policy"]}, {"text": "The run is admitted and the compiled target is checked.", "at": ["registry", "scheduler", "engine-loop", "compiled-target"]}, {"text": "Preview: the pack reads the current values. The engine works out the change, stores it with its hash, and stops to wait.", "at": ["engine-loop", "contract", "pack-http", "t-http"]}, {"text": "The person sees that exact change on a page the agent cannot reach, and approves it after the operating system's presence prompt.", "at": ["person", "pages", "registry"]}, {"text": "The engine records the intent in the ledger before anything is sent.", "at": ["engine-loop", "ledger"]}, {"text": "The pack sends the change to the system, once.", "at": ["engine-loop", "contract", "pack-http", "t-http"]}, {"text": "The pack reads the value back. The engine compares it with what was meant and records it as verified.", "at": ["pack-http", "t-http", "engine-loop", "ledger"]}]}, {"name": "Tool Build", "steps": [{"text": "The developer, or their agent, registers a system and asks the scout to look at it.", "at": ["developer", "command-line", "rest-face", "registry", "scout"]}, {"text": "The scout runs the pack's discoverers in a sandbox where nothing can be written.", "at": ["scout", "contract", "pack-http", "t-http"], "edges": [["registry", "scout"]]}, {"text": "It writes drafts into the project folder. A draft it could not finish waits in the holding folder.", "at": ["scout", "project"]}, {"text": "The target's files compile into one compiled target, all of them or none.", "at": ["project", "compiled-target"]}, {"text": "A drafted read is tried in the sandbox. The building agent can use it at once.", "at": ["registry", "scheduler", "engine-loop", "compiled-target"]}, {"text": "To make it live and listed for every client, a person reviews what the tools will do and publishes.", "at": ["person", "pages", "registry"]}]}, {"name": "Crash Recovery", "steps": [{"text": "An intent was recorded and the engine stopped before it could record the outcome.", "at": ["engine-loop", "ledger"]}, {"text": "On restart the engine finds every record left at intent or acted.", "at": ["engine-loop", "ledger"]}, {"text": "For each one it asks the system first: did the change land?", "at": ["engine-loop", "contract", "pack-http", "t-http"]}, {"text": "Only then does it decide: mark it verified, or send it, never twice.", "at": ["engine-loop", "ledger"]}]}, {"name": "Session Expiry", "steps": [{"text": "A step fails because the system no longer accepts the session.", "at": ["pack-http", "t-http", "engine-loop"]}, {"text": "The engine asks the session keeper, the only part that may renew.", "at": ["engine-loop", "session-keeper"]}, {"text": "Where a credential is stored and renewal is allowed, the keeper renews once for every waiting run.", "at": ["session-keeper", "vault"]}, {"text": "Otherwise the run stops and says a sign-in is needed, and the person signs in on the engine's own page.", "at": ["person", "pages", "registry"]}]}, {"name": "Refusal", "steps": [{"text": "The call arrives at a front door.", "at": ["ai-agent", "bridge", "mcp-face"]}, {"text": "The policy engine says no. The refusal is recorded like any decision.", "at": ["mcp-face", "registry", "policy"]}, {"text": "The caller gets a named failure with its class, its code, and the next step. Nothing reached the system.", "at": ["registry", "mcp-face", "bridge", "ai-agent"]}]}]}, "engine-guard": {"name": "Guard", "group": "Kernel", "state": "b", "text": "Five checks, in this order, and the first to fail names the stop. The compiled target's hash against the published version; the engine checks it. The kernel's health, where a write needs full health; the engine checks it. The session's state for the call; the session keeper answers and the engine asks. The decision for this caller and this call; the policy engine decides and records it, and Guard asks through Control and does not decide. That the surface has no block at its edge, from what drivers reported; the engine checks it. A driver's own stop for a missing session stays as a second line. Package GD1 holds the code to this order.", "where": "a2m-engine: src/tool.rs, loaded.rs", "never": ["Run a compiled target whose hash does not match.", "Decide whether a call is allowed."], "decided": ["Guard checks five things, in this order, each with one owner: the compiled target's hash, the kernel's health, the session's state, the policy decision, and the edge block. Not: either document's old list of four (0309)."]}, "engine-choose": {"name": "Binding Selector", "group": "Kernel", "state": "b", "text": "Takes the compiled target's bindings in the order written and picks the first that is verified, has a ready driver, has not drifted and has a valid session. It records why. A binding in shadow is never chosen. Where every binding was passed over for its status alone, the run fails no_binding_may_act, policy, and offers no resume. A read may fall to the next binding after drift; a write never switches binding inside a job.", "where": "a2m-engine: src/run.rs", "never": ["Name a mode, a driver or a pack."], "decided": ["A tool whose every binding is covered by a drift mark is shown as unavailable where tools are listed, and comes back when the mark is lifted (0396)."]}, "engine-prepare": {"name": "Preparation", "group": "Kernel", "state": "b", "text": "Asks for a session lease through the Control and lets the driver get what the binding needs, such as a page, a token or an open file. It runs under the time the mode states in its manifest, at most ten minutes, or 30 seconds where the mode states none; past it the run fails transient, prepare_timed_out. The engine never renews a session itself.", "where": "a2m-engine: src/run.rs", "never": ["Sign in or renew a session."], "decided": ["A mode states how long its prepare may take, prepare_within_ms, and the engine honours it under a ceiling, PREPARE_CEILING, ten minutes. Not: raise the engine's one number for every mode, or shorten the web pack's launch deadline under 30 seconds (0427)."]}, "engine-read-act": {"name": "Read Execution", "group": "Kernel", "state": "b", "text": "Works out each step's inputs, spends the rate budget it was granted, and calls the driver through its handle. A step that fails with a passing fault is retried up to twice. Reads skip intend and, unless the binding declares one, the read-back.", "where": "a2m-engine: src/tool.rs", "never": ["Retry a failure class that is not transient."]}, "engine-read-record": {"name": "Result Store", "group": "Kernel", "state": "b", "text": "Writes each decimal output with its field type's places, then sends the result and its evidence to the control plane, which stores it. A value with more places than its type at that point stops the read as output_unexpected. If evidence cannot be stored the call fails with a named code rather than returning an unrecorded result.", "where": "a2m-engine: src/tool.rs"}, "engine-preview": {"name": "Preview", "group": "Kernel", "state": "b", "text": "Builds the diff of a write before anyone is asked: reads the source, runs the reads that come first, looks each record up, and classes it create, update or unchanged. It hashes the diff and stores both. Nothing is written. If nothing would change, the run ends completed with no approval.", "where": "a2m-engine: src/tool.rs", "never": ["Write anything."], "rows": [{"cols": [{"title": "Preview Inputs", "ids": ["engine-pre-source", "engine-pre-reads"]}, {"title": "Per-Record Preview", "ids": ["engine-pre-classify"]}, {"title": "Preview Result", "ids": ["engine-pre-diff", "engine-pre-route"]}]}], "edges": [["engine-pre-source", "engine-pre-reads", "the inputs and the source rows", "path", 1], ["engine-pre-reads", "engine-pre-classify", "rows ready to look up", "path", 2], ["engine-pre-classify", "engine-pre-diff", "each record and its values before", "path", 3], ["engine-pre-diff", "engine-pre-route", "the diff and its hash", "path", 4]], "steps": [{"text": "Check the inputs and read the whole source once, then apply the record limit.", "at": ["engine-pre-source"]}, {"text": "Run the read steps that come before the first write, checking each expectation. A failure ends the run before any approval.", "at": ["engine-pre-reads"]}, {"text": "For each record, work out its inputs and look it up by its identity rule. The values found are kept as the values before the write.", "at": ["engine-pre-classify"]}, {"text": "Build the diff and hash it in its canonical form. Only the engine computes this hash, so run and approval cannot disagree.", "at": ["engine-pre-diff"]}, {"text": "If nothing changes, finish. Otherwise ask policy whether the write may go without a person, or rest at needs_approval.", "at": ["engine-pre-route"]}]}, "engine-pre-source": {"name": "Input Reading", "group": "Kernel", "state": "b", "text": "Validates the call's inputs and reads the source (a sheet or file) once, storing its bytes. Every problem found is returned at once, before anything runs.", "where": "a2m-engine: src/tool.rs"}, "engine-pre-reads": {"name": "Leading Reads", "group": "Kernel", "state": "b", "text": "Runs the read steps that sit before the first write step and checks each expect. A read step after the first write runs only in the write phase.", "where": "a2m-engine: src/tool.rs"}, "engine-pre-classify": {"name": "Record Lookup", "group": "Kernel", "state": "b", "text": "Evaluates the record's inputs, finds it by its record matching (natural, composite, stamped, find or none) using the write binding's own read-back, and marks it create, update or unchanged. What it finds is kept as the values seen before.", "where": "a2m-engine: src/tool.rs"}, "engine-pre-diff": {"name": "Diff Builder", "group": "Kernel", "state": "b", "text": "Puts every record, its proposed values, the binding that writes it and that binding's evidence level into the diff, then hashes it. Both are stored on the run. The approval is bound to this hash.", "where": "a2m-engine: src/diff.rs"}, "engine-pre-route": {"name": "Preview Outcome", "group": "Kernel", "state": "b", "text": "If the diff holds nothing to create or update, the run completes with no approval. Otherwise policy is asked whether the write may go without a person; if not, the run rests as needs_approval.", "where": "a2m-engine: src/tool.rs"}, "engine-approval": {"name": "Approval Check", "group": "Kernel", "state": "b", "text": "At execute, the engine asks the Control to use the approval bound to the diff hash. That one transaction also moves the run to running. It then runs the leading reads again and stops if an expectation that held at the preview fails now. The engine cannot approve; it only asks.", "where": "a2m-engine: src/tool.rs", "never": ["Approve anything itself.", "Write without an approval of this exact diff."]}, "engine-write": {"name": "Write Path", "group": "Kernel", "state": "b", "text": "For each record: take the lock, check the preview is fresh, store the intent and get a token, act once, mark it acted, read it back, compare, mark it verified. Each part is its own box here.", "where": "a2m-engine: src/tool.rs", "never": ["Send a write whose intent is not yet stored.", "Call a driver for a write without the token.", "Mark a record verified without a value read from the system."], "rows": [{"title": "Pre-Send Steps", "cols": [{"ids": ["engine-w-lock", "engine-w-fresh", "engine-w-intent"]}]}, {"title": "Write and Proof", "cols": [{"ids": ["engine-w-act", "engine-w-acted", "engine-w-readback", "engine-w-compare"]}]}], "edges": [["engine-w-lock", "engine-w-fresh", "a locked record", "path", 1], ["engine-w-fresh", "engine-w-intent", "a preview that is still fresh", "path", 2], ["engine-w-intent", "engine-w-act", "the intent token", "path", 3], ["engine-w-act", "engine-w-acted", "the outcome and any assigned key", "path", 4], ["engine-w-acted", "engine-w-readback", "a record marked acted", "path", 5], ["engine-w-readback", "engine-w-compare", "the value read back", "path", 6]], "steps": [{"text": "Take the lock on this record, so no other run can write it. Wait through the scheduler, up to a limit.", "at": ["engine-w-lock"]}, {"text": "If the preview is older than the freshness window (60 seconds by default) or policy is strict, read the record again. A difference stops the run as stale.", "at": ["engine-w-fresh"]}, {"text": "Store the intent and values to be written. The ledger answers with an intent token.", "at": ["engine-w-intent"]}, {"text": "Send the one committing step, with the token, only if the lease still has time for it.", "at": ["engine-w-act"]}, {"text": "Mark the record acted at once, with any key the system assigned.", "at": ["engine-w-acted"]}, {"text": "Read the record back through the binding's read-back rule.", "at": ["engine-w-readback"]}, {"text": "Normalize both sides and compare. Equal: verified, and the ledger releases the lock. Different: re-read once, then stop with mismatch.", "at": ["engine-w-compare"]}], "stepsTitle": "Record Write Sequence"}, "engine-w-lock": {"name": "Lock Acquisition", "group": "Kernel", "state": "b", "text": "Asks the ledger for the lock on this record in this target and environment. If another run holds it the engine waits up to a limit, then stops with record_locked. There is no separate unlock: the ledger drops the lock when the record ends verified or unchanged.", "where": "a2m-engine: src/tool.rs"}, "engine-w-fresh": {"name": "Freshness Check", "group": "Kernel", "state": "b", "text": "If the preview is older than the freshness window, or policy is strict, the record is read again and compared with what the preview saw. A difference stops the run as stale, changed_since_preview, because the approved diff no longer describes what would happen.", "where": "a2m-engine: src/tool.rs"}, "engine-w-intent": {"name": "Intent Recording", "group": "Kernel", "state": "b", "text": "Sends the intended values to the ledger and waits until they are durably stored. The ledger returns the intent token. It also checks the lease has time left for the record's steps before and after the waits.", "where": "a2m-engine: src/tool.rs", "never": ["Act before the intent is on disk."]}, "engine-w-act": {"name": "Single Act", "group": "Kernel", "state": "b", "text": "Calls the driver's committing step with the token. Outputs needed for a later reconcile are sent before it. A failed save whose fate is unknown becomes possible_commit; the engine does not retry a sent write unless the application takes the idempotency token.", "where": "a2m-engine: src/tool.rs", "never": ["Send a committing step twice on its own."]}, "engine-w-acted": {"name": "Acted Mark", "group": "Kernel", "state": "b", "text": "Tells the ledger the write was sent, using up the token, with the outcome and any key the system assigned. From here until verified the record counts as in doubt, whatever any later failure says.", "where": "a2m-engine: src/tool.rs"}, "engine-w-readback": {"name": "Read-Back", "group": "Kernel", "state": "b", "text": "Runs the binding's read-back steps, or uses the save's own answer where the binding's evidence is response. A binding whose evidence is acknowledged reads nothing; its record ends acted, never verified.", "where": "a2m-engine: src/tool.rs"}, "engine-w-compare": {"name": "Verification", "group": "Kernel", "state": "b", "text": "Normalizes the intended and the read values with the field types, then compares. Equal: sends the record as verified with both raw and normalized values as evidence. Different: reads once more, then stops with mismatch, read_back_differs.", "where": "a2m-engine: src/compare.rs", "never": ["Compare numbers as floats."]}, "engine-resume": {"name": "Reconciliation", "group": "Kernel", "state": "b", "text": "After a crash, a lost lease or a timeout, the run gets a new attempt and lease. For every record in intent, acted or a retryable failure, the engine reads the system first and decides from what it sees whether the write landed. It writes nothing until every doubtful record is settled. A kill at a random step is not yet a test; faults at named steps are.", "where": "a2m-engine: src/tool.rs", "never": ["Write again before reading what is there.", "Treat a missing record with no key as proof it was never written, from one look."], "rows": [{"cols": [{"title": "Doubt Checks", "ids": ["engine-r-lock", "engine-r-read"]}, {"title": "Reconcile Outcomes", "ids": ["engine-r-landed", "engine-r-not", "engine-r-other"]}, {"title": "Continuation", "ids": ["engine-r-go"]}]}], "edges": [["engine-r-lock", "engine-r-read", "the lock, under the new lease", "path", 1], ["engine-r-read", "engine-r-landed", "values equal the intended ones", "path", 2], ["engine-r-landed", "engine-r-go", "a verified record, skipped", "path", 3], ["engine-r-read", "engine-r-not", "values equal those seen before", "use"], ["engine-r-read", "engine-r-other", "values match neither", "use"], ["engine-r-not", "engine-r-go", "a record back to planned", "use"]], "steps": [{"text": "Take or confirm the record lock under the new lease.", "at": ["engine-r-lock"]}, {"text": "Read the record, by the strategy that finds it: its key, its stamp, its declared lookup, or by what was recorded before the save.", "at": ["engine-r-read"]}, {"text": "If it equals what was intended, the write landed: mark it verified and write nothing.", "at": ["engine-r-landed"]}, {"text": "If it equals the values seen before, nothing landed: return it to planned.", "at": ["engine-r-not"]}, {"text": "If it equals neither, someone else changed it or part was applied: stop as stale and ask for a new preview.", "at": ["engine-r-other"]}, {"text": "Only after every doubtful record is settled do the planned records continue down the normal Write Path.", "at": ["engine-r-go"]}], "stepsTitle": "Resume Sequence"}, "engine-r-lock": {"name": "Lock Confirmation", "group": "Kernel", "state": "b", "text": "Takes or confirms the lock for the record under the new lease number.", "where": "a2m-engine: src/tool.rs"}, "engine-r-read": {"name": "Current Record Read", "group": "Kernel", "state": "b", "text": "Reads the record through the mode its intent was stored for, never another. A read that cannot be made stops the run with possible_commit, cannot_reconcile.", "where": "a2m-engine: src/tool.rs"}, "engine-r-landed": {"name": "Landed Outcome", "group": "Kernel", "state": "b", "text": "The current values equal the intended ones. The record is marked verified and nothing is sent.", "where": "a2m-engine: src/tool.rs"}, "engine-r-not": {"name": "Not-Landed Outcome", "group": "Kernel", "state": "b", "text": "The current values equal the ones seen before the write. The record returns to planned. A record with no key is returned only when its lookup is one the pack states is authoritative for absence, and says absent twice.", "where": "a2m-engine: src/tool.rs"}, "engine-r-other": {"name": "Unresolved Outcome", "group": "Kernel", "state": "b", "text": "The values match neither. The run stops with stale, changed_since_preview and needs a new preview and approval for that record.", "where": "a2m-engine: src/tool.rs"}, "engine-r-go": {"name": "Run Continuation", "group": "Kernel", "state": "b", "text": "Records that were planned go through the normal Write Path. Verified and unchanged records are skipped. A dependent record takes its parent's assigned key from the ledger and never runs the parent again.", "where": "a2m-engine: src/tool.rs"}, "engine-normalize": {"name": "Normalized Comparison", "group": "Kernel", "state": "b", "text": "Turns a value into the form its field type says (decimals, dates, text) using the expression crate, so that \"10.50\" and \"10.5\" compare equal when the field says they should. Money and counts use decimals, never floats.", "where": "a2m-engine: src/compare.rs", "never": ["Compare business numbers as floats."]}, "engine-failures": {"name": "Failure Class", "group": "Kernel", "state": "b", "text": "Every failure ends up in one class: transient, session_expired, edge_blocked, drift, unknown_variant, rejected, mismatch, possible_commit, input, busy, policy, stale. The class alone decides the response. Only transient is retried, up to twice, and only for a step that commits nothing or is known idempotent.", "where": "a2m-engine: src/codes.rs", "never": ["Guess when a page or response matches no rule."]}, "engine-control": {"name": "Control Port", "group": "Kernel", "state": "b", "text": "The one interface through which the engine reaches everything outside its loop: the compiled target by hash, the policy decision, a session lease, rate budgets, locks, intents, acted, verified, approval. In one process the action registry answers; on another machine a runner answers over a link. The same tests run against both.", "where": "a2m-engine: src/control.rs", "never": ["Open the store, call policy or read a target file directly."]}, "engine-sandbox": {"name": "Discovery Sandbox", "group": "Kernel", "state": "b", "text": "Runs drafts and discoverers where a write is impossible. A discoverer that tries to write is stopped and nothing is stored. Drafts run here as well, so the scout cannot change a system.", "where": "a2m-engine: src/sandbox.rs", "never": ["Let a discoverer write."]}, "engine-shadow": {"name": "Shadow Read", "group": "Kernel", "state": "p", "text": "In a live read with no pinned mode, a binding in shadow reads too, after the chosen one. What it returns is compared and counted, never returned to the caller. A person promotes a shadow binding after a run of exact matches.", "where": "a2m-engine: src/shadow.rs", "never": ["Return a shadow binding's result to the caller."]}, "ledger-runs": {"name": "Runs", "group": "Ledger", "state": "b", "text": "One row per call of an operation or pipeline: the unit a caller holds a run id for. It holds the state, caller, tool version, input hash, attempt number and lease number. An unfinished run is identified by its caller, tool version and input hash. A caller's idempotency key is kept only as a keyed digest, never the key; the same key with a different call is refused by name.", "where": "a2m-ledger: src/ledger.rs", "never": ["Change a run that is in a final state."]}, "ledger-records": {"name": "Records", "group": "Ledger", "state": "b", "text": "One row per commit point: the moment the system itself saves, such as one PUT or one file replaced. It holds the record key, a digest of the intended values, the values seen before and after, the binding used, attempts, any key the system assigned, and links to evidence. The values seen before are what make undo possible.", "where": "a2m-ledger: src/ledger.rs", "never": ["Hold a secret in the clear."]}, "ledger-events": {"name": "Events", "group": "Ledger", "state": "b", "text": "An append-only list of what happened. Every state change writes its event and updates the current row in the same transaction. Traces, streams and webhooks are made from it. A test rebuilds the current state from the events alone.", "where": "a2m-ledger: src/ledger.rs", "never": ["Update or delete an event, except by the retention job removing a whole run."]}, "ledger-locks": {"name": "Record Locks", "group": "Ledger", "state": "b", "text": "One lock per record key in a target and environment, so two runs never write the same record. It is released in the same transaction that marks the record verified or unchanged.", "where": "a2m-ledger: src/ledger.rs"}, "ledger-blobs": {"name": "Blobs", "group": "Ledger", "state": "b", "text": "Values, snapshots and traces, stored once, named by a keyed digest of their plain content, and sealed through the vault. They have a retention time and can be put on legal hold.", "where": "a2m-ledger: src/blob.rs", "never": ["Store evidence unredacted."]}, "ledger-findings": {"name": "Stored Findings", "group": "Ledger", "state": "b", "text": "What discovery found about a system, and the questions it could not settle, kept as data. A finding is stored once and never above the level of evidence it earned: discovered.", "where": "a2m-ledger: src/finding.rs"}, "ledger-versions": {"name": "Versions", "group": "Ledger", "state": "b", "text": "Each published version of a target and its compiled target bytes. The compiled target's hash is checked on every load.", "where": "a2m-ledger: src/version.rs"}, "ledger-audit": {"name": "Audit Chain", "group": "Ledger", "state": "b", "text": "One chain of entries per workspace, each linked to the one before, so that removing or changing an entry shows.", "where": "a2m-ledger: src/audit.rs", "never": ["Allow an entry to be rewritten."]}, "ledger-watches": {"name": "Watch and Shadow Results", "group": "Ledger", "state": "p", "text": "The tables behind watches and canaries (a watch, its checks, its changes and its baseline) and behind shadow bindings (each comparison and each promotion).", "where": "a2m-ledger: src/watch.rs, shadow.rs"}, "ledger-run-states": {"name": "Run States", "group": "Ledger", "state": "b", "text": "queued, validating, needs_approval, running, needs_input, needs_login, stopped; and the final states rejected, expired, completed, failed and cancelled. A reader skips the preview: validating goes straight to running. A stopped run re-enters running only after reconciliation. Resume gives the same run a new attempt and a new lease; it is not a new run.", "where": "a2m-core: src/state.rs"}, "ledger-record-states": {"name": "Record States", "group": "Ledger", "state": "b", "text": "planned (nothing done), unchanged (already equal, skip), intent (intended values stored), acted (write sent, nothing confirmed), verified (read back and matched), failed. On resume, intent, acted and a retryable failed are reconciled; planned proceeds; verified and unchanged are skipped.", "where": "a2m-core: src/state.rs"}, "ledger-token": {"name": "Intent Token", "group": "Ledger", "state": "b", "text": "Proof, as a type, that this record's intent is on disk under the current lease. It carries the run, record key, lease number, digest of the intended values and the record's idempotency token. Only the ledger can make one; it cannot be copied, saved or kept. Marking acted uses it up. The driver's handle refuses to commit without it.", "where": "a2m-ledger: src/ledger.rs", "never": ["Be forged or reused."]}, "ledger-store": {"name": "Ledger Store", "group": "Ledger", "state": "b", "text": "One SQLite file with one writing thread and two reading threads. Every table is reached only inside a transaction closure. Each crate may touch only its own tables, enforced by the database's own authorizer. Migrations are numbered, forward only, and checksummed. The same schema is meant to run on PostgreSQL later.", "where": "a2m-ledger: src/store.rs, sqlite.rs, migrate.rs", "never": ["Write a row outside a transaction.", "Let one crate's SQL name another's table."]}, "ledger-rules": {"name": "Ledger Rules", "group": "Ledger", "state": "b", "text": "Nine rules that must always hold, each a test, each enforced where the data is. A change that breaks one cannot merge.", "where": "a2m-ledger", "rows": [{"cols": [{"title": "Pre-Write Rules", "ids": ["ledger-rule-1", "ledger-rule-3", "ledger-rule-4"]}, {"title": "Doubt Rules", "ids": ["ledger-rule-5", "ledger-rule-2", "ledger-rule-6"]}, {"title": "Standing Rules", "ids": ["ledger-rule-7", "ledger-rule-8", "ledger-rule-9"]}]}], "edges": [["ledger-rule-3", "ledger-rule-1", "a run holding its approval", "path", 1], ["ledger-rule-1", "ledger-rule-2", "an intent stored, then acted", "path", 2]], "steps": [{"text": "To start writing, the run needs an approval of its exact diff, used once, in the same transaction (rule 3).", "at": ["ledger-rule-3"]}, {"text": "Only the holder of the current lease may change records (rule 4), and each record needs its lock (rule 7).", "at": ["ledger-rule-4", "ledger-rule-7"]}, {"text": "The intent is stored before acting (rule 1), and verified needs a value actually read back (rule 2).", "at": ["ledger-rule-1", "ledger-rule-2"]}, {"text": "After a lost lease, nothing new is written until old records were read back (rule 5).", "at": ["ledger-rule-5"]}, {"text": "Identical calls share one run (rule 6); final runs stay final (rule 8); history is never rewritten (rule 9).", "at": ["ledger-rule-6", "ledger-rule-8", "ledger-rule-9"]}]}, "ledger-rule-1": {"name": "Intent Before Action", "group": "Ledger Rule", "state": "b", "text": "A record reaches acted only if its intent was durably stored before the write was sent.", "where": "a2m-ledger"}, "ledger-rule-2": {"name": "Proof Before Verification", "group": "Ledger Rule", "state": "b", "text": "A record reaches verified only with a value read from the system that equals the intended value after normalization, and a link to the evidence.", "where": "a2m-ledger"}, "ledger-rule-3": {"name": "Approval Bound to Diff", "group": "Ledger Rule", "state": "b", "text": "A write run first enters running only with an approval whose diff hash equals the run's, unexpired and unused, or with a policy decision that allowed it without a person. Using the approval and moving the run happen in one transaction.", "where": "a2m-ledger"}, "ledger-rule-4": {"name": "One Writer per Run", "group": "Ledger Rule", "state": "b", "text": "Only the holder of the run's current lease number may change its records. Anything carrying an older number is refused.", "where": "a2m-ledger"}, "ledger-rule-5": {"name": "Reconciliation After Doubt", "group": "Ledger Rule", "state": "b", "text": "After a lease is lost or an engine stops, no new intent is stored while any record of the run is in intent or acted under an older lease. There is no flag to forget.", "where": "a2m-ledger"}, "ledger-rule-6": {"name": "One Run per Call", "group": "Ledger Rule", "state": "b", "text": "At most one unfinished run exists for the same caller, tool version and input hash. A second identical call gets the first run back.", "where": "a2m-ledger"}, "ledger-rule-7": {"name": "One Lock per Record", "group": "Ledger Rule", "state": "b", "text": "At most one run holds the lock for a record key in a target and environment.", "where": "a2m-ledger"}, "ledger-rule-8": {"name": "Final State Rule", "group": "Ledger Rule", "state": "b", "text": "A run in a final state never changes again.", "where": "a2m-ledger"}, "ledger-rule-9": {"name": "Append-Only History", "group": "Ledger Rule", "state": "b", "text": "Events are never updated or deleted, except by the retention job, which removes whole runs. Triggers installed by the migrations refuse anything else.", "where": "a2m-ledger"}, "policy-kill": {"name": "Kill Switches", "group": "Kernel", "state": "b", "text": "Switches that stop a caller, a target, a workspace or everything. They are the first thing checked, and a call under one is denied before anything else is looked at.", "where": "a2m-policy: src/rules.rs"}, "policy-guardrails": {"name": "Guardrails", "group": "Kernel", "state": "b", "text": "The forbids that ship with the product, written as code over the typed request, and consulted before any permit. Settings cannot remove one. A single matching forbid denies the call.", "where": "a2m-policy: src/rules.rs", "never": ["Let a permit outweigh a forbid."]}, "policy-grants": {"name": "Roles and Grants", "group": "Kernel", "state": "b", "text": "The permits, as data written by an administrator: which caller may use which tool and effect class, and which identity a run may act as. Nothing is allowed unless a permit applies. A session signed in as a person is usable only by that person or an agent acting for them.", "where": "a2m-policy: src/set.rs", "never": ["Let a caller supply any part of the context it is judged by."]}, "policy-manifest": {"name": "Permission Manifest", "group": "Kernel", "state": "b", "text": "Each operation declares the surfaces, downloads, uploads and destinations it will touch. The run may touch only those, so a call cannot be steered to somewhere else.", "where": "a2m-policy: src/rules.rs"}, "policy-limits": {"name": "Limits and Quotas", "group": "Kernel", "state": "b", "text": "Maximum records per run, quotas per caller, and the checks that apply them. Policy can only narrow what a target file or toolset allows, never widen it.", "where": "a2m-policy: src/policy.rs"}, "policy-preapproval": {"name": "Pre-Approval Rules", "group": "Kernel", "state": "b", "text": "Data rules that let a write proceed without a person, with a condition written in the expression language. A condition that fails when it runs turns the decision into a denial. Any hazard other than none, and every irreversible operation, needs a person each run.", "where": "a2m-policy: src/rules.rs", "never": ["Pre-approve an irreversible operation."]}, "policy-approvals": {"name": "Approvals", "group": "Kernel", "state": "b", "text": "A person's decision, bound to one exact diff hash, for one tool version, used once, and expiring. It can be recorded only through a channel an agent cannot operate. Consuming it moves the run to running in the ledger's own transaction. Standing approvals, consent records and delegations are not built.", "where": "a2m-policy: src/approval.rs", "never": ["Be given by a caller or an agent.", "Be reused for a different diff."]}, "policy-decision": {"name": "Policy Decision", "group": "Kernel", "state": "b", "text": "Every decision is stored with the rules that decided it and the policy version. The same request against the same version always gets the same answer. Any error while deciding is a denial, and with no valid policy loaded everything is denied.", "where": "a2m-policy: src/store.rs", "never": ["Reveal the content of a rule to a denied caller."]}, "policy-masking": {"name": "Result Masking", "group": "Kernel", "state": "p", "text": "Hides fields in a result that the caller may not see, as the last control before the answer leaves.", "where": "a2m-policy: src/policy.rs"}, "sched-admission": {"name": "Admission", "group": "Kernel", "state": "b", "text": "Decides in a fixed order whether a run is accepted, returned as an existing run, or refused with a next step: kernel health, holds, a matching unfinished run, the target's queue length (100 by default), the caller's waiting jobs (25), a runner that could ever serve it, and the rate budget. A refusal names its reason and a retry time.", "where": "a2m-sched: src/scheduler.rs", "never": ["Decide policy."]}, "sched-queue": {"name": "Queues and Dispatch", "group": "Kernel", "state": "b", "text": "One bounded queue per target and environment. Interactive before batch; within a priority, the caller served longest ago goes first, so one caller's hundred jobs do not starve another's one. A job no runner takes within its queue limit ends as busy.", "where": "a2m-sched: src/scheduler.rs"}, "sched-exclusive": {"name": "Exclusive Resources", "group": "Kernel", "state": "b", "text": "At most one job holds each resource key, such as one screen, one file or one device link. This is how work on one desktop application is run one at a time without the scheduler knowing what a screen is. A job takes all its keys in the transaction that leases it.", "where": "a2m-sched: src/scheduler.rs"}, "sched-locks-wait": {"name": "Record Lock Waits", "group": "Kernel", "state": "b", "text": "Holds the queue of runs that want a record lock the ledger reports as held, and wakes them when the ledger releases it. The lock itself belongs to the ledger.", "where": "a2m-sched: src/waits.rs", "never": ["Take or release a record lock."]}, "sched-leases": {"name": "Job Leases", "group": "Kernel", "state": "b", "text": "Who may work on a job, until when, and under which number. Leasing raises the run's lease number in the ledger in the same transaction, so anything older is refused. A heartbeat renews and returns a directive: continue, cancel, pause or drain.", "where": "a2m-sched: src/scheduler.rs", "never": ["Let a job run twice at once."]}, "sched-budgets": {"name": "Rate Budgets", "group": "Kernel", "state": "b", "text": "Request budgets for each surface, granted in batches. A job that needs more waits, up to a limit, or is told how long to wait.", "where": "a2m-sched: src/budget.rs"}, "sched-loss": {"name": "Lost Leases", "group": "Kernel", "state": "b", "text": "When a lease runs out and a grace period passes, a sweep declares the job lost, gives the run a new lease number, stops it as possible_commit, and queues a reconcile job after a quarantine. A late result from the lost runner is refused.", "where": "a2m-sched: src/scheduler.rs"}, "sched-holds": {"name": "Holds", "group": "Kernel", "state": "b", "text": "Scopes for which no job is handed out, including the stop-everything switch. A running job sees pause at its next heartbeat.", "where": "a2m-sched: src/scheduler.rs"}, "sched-watches": {"name": "Watch Timing", "group": "Kernel", "state": "p", "text": "Works out when each check of a watch is due, using the store's clock, and admits a check as the lowest priority work. Due times that passed with no check leave a gap that is recorded.", "where": "a2m-sched: src/watch.rs"}, "keeper-providers": {"name": "Built-In Auth Providers", "group": "Kernel", "state": "p", "text": "The ways of signing in. Those that only hold or exchange a credential live here: stored keys, bearer, basic, certificate, OAuth client credentials and code, and a one-time-code calculator. Those that need a surface live in a pack: the web pack's form login, and the MCP pack's own. Not all are built; the operating system broker is not.", "where": "a2m-auth: src/providers/", "never": ["Return a credential to a caller."]}, "keeper-sign-in-guard": {"name": "Sign-In Guard", "group": "Kernel", "state": "b", "text": "Before any request, every address a provider would send a credential, token or the person to is checked against the addresses the target declares for that environment. A redirect is not followed.", "where": "a2m-auth: src/surfaces.rs", "never": ["Send a credential somewhere the target did not declare."]}, "keeper-states": {"name": "Session States", "group": "Kernel", "state": "b", "text": "absent, signing_in, valid, suspect, renewing, needs_person, expired, revoked. Only the legal moves are allowed; a test tries every pair. A call for a session that is absent, expired or revoked gets needs_login.", "where": "a2m-auth: src/state.rs"}, "keeper-clocks": {"name": "Session Clocks", "group": "Kernel", "state": "b", "text": "The system's idle timeout (prevent it with a cheap read), token expiry (renew silently), and the identity provider's maximum age (nothing can be done; a person signs in again). A target may declare the first two; otherwise the keeper learns each from how long sessions lasted, by plain rule.", "where": "a2m-auth: src/state.rs", "never": ["Try to outlast the identity provider's maximum age."]}, "keeper-checks": {"name": "Session Checks", "group": "Kernel", "state": "b", "text": "Runs the target's declared cheap signed-in read, with jitter, only while the session is wanted (8 hours after last use by default). After that it lets it lapse. Every driver reports signs of expiry to the keeper instead of acting on them.", "where": "a2m-auth: src/keeper.rs"}, "keeper-ladder": {"name": "Renewal Order", "group": "Kernel", "state": "b", "text": "Silent first, then a light prompt, then a full sign-in; a rung is never repeated. Only the keeper renews, and once per session, so two refreshes cannot cancel each other. A stored credential is tried once; if refused the session goes to needs_person.", "where": "a2m-auth: src/keeper.rs", "never": ["Retry a refused stored credential.", "Let anyone else renew."]}, "keeper-person": {"name": "Person Prompt", "group": "Kernel", "state": "b", "text": "Asks only the session's own identity: in a visible window of the engine's own browser, or by a link they open in their own browser. Calls wait up to 5 minutes by default; a long pipeline stops as needs_login and resumes after sign-in.", "where": "a2m-auth: src/person.rs"}, "keeper-lease": {"name": "Session Lease", "group": "Kernel", "state": "b", "text": "What the engine receives: a handle to use the session for one job, not the credential. When a driver sees the session end, it reports to the keeper.", "where": "a2m-auth: src/lease.rs"}, "keeper-saved": {"name": "Saved Session State", "group": "Kernel", "state": "p", "text": "The session's state, such as the web pack's cookies, sealed in the vault under the owner's key and restored after a restart. Page storage is not yet saved.", "where": "a2m-auth: src/store.rs"}, "vault-root": {"name": "Root Key", "group": "Kernel", "state": "p", "text": "One per installation. Kept in the operating system's credential store, or derived from a passphrase on a machine with no store. It is never written to disk in the clear. The passphrase route's salt file records the derivation, algorithm, version, memory, passes and lanes beside the salt, and a root is derived with the cost its file records; a file of 16 bare bytes, as earlier builds wrote, reads with today's cost. The Linux desktop key store back end is left out for now. Rotation is not built.", "where": "a2m-vault: src/store/", "never": ["Write a key to disk in the clear."], "decided": ["The salt file records the cost its root was derived with, and one this build does not support is refused as key_store_unreachable. Not: keep the cost fixed forever, or keep it in the settings file apart from its salt (0438)."]}, "vault-layers": {"name": "Key Layers", "group": "Kernel", "state": "p", "text": "Root wraps workspace keys; workspace keys wrap owner keys; owner keys wrap each item's data key. Wrapped keys are kept by the ledger through an interface the vault defines. Rotating one layer does not mean re-encrypting everything.", "where": "a2m-vault: src/vault.rs"}, "vault-seal": {"name": "Envelope Sealing", "group": "Kernel", "state": "b", "text": "Uses a vetted authenticated cipher from an outside library; no cryptography of its own. Each envelope is bound to its id, owner and kind, so one cannot be swapped for another.", "where": "a2m-vault: src/sealed.rs", "never": ["Write its own cryptography."]}, "vault-secret": {"name": "Secret Wrapper", "group": "Kernel", "state": "b", "text": "The only form in which a secret leaves the vault. It cannot be printed, logged or serialized, and is wiped when dropped. There is no action that reads a secret back.", "where": "a2m-vault", "never": ["Return a secret in any other form."]}, "vault-redactor": {"name": "Redactor", "group": "Kernel", "state": "b", "text": "Knows every secret the vault has released and removes it, from results, logs, traces and errors. It also works on text that arrives in pieces.", "where": "a2m-vault: src/redactor.rs", "never": ["Let a secret reach a caller."]}, "vault-digest": {"name": "Keyed Digest", "group": "Kernel", "state": "b", "text": "A digest made with a key kept by the installation, used to name evidence and caller keys. Digests from different workspaces cannot be matched.", "where": "a2m-vault: src/digest.rs"}, "reg-def": {"name": "Action Definition", "group": "Kernel", "state": "p", "text": "One entry per action: its name (noun.verb), input and output schemas, lowest role, whether it is listed to agents, its handler, and what it needs of the engine's health. Providers add their own actions under their own name space.", "where": "a2m-actions: src/def.rs"}, "reg-catalog": {"name": "Action Catalog", "group": "Kernel", "state": "p", "text": "The list of actions with a digest. Every face is generated from it and checked against it, so a face cannot drift from the list. Each release keeps what it publishes in contracts/<version>/, the API description, failure codes, vocabularies, settings keys and the example's compiled target, and every build is checked against every kept release; a break passes only where the next release lists it with its record. No release is kept yet.", "where": "a2m-actions: src/catalog.rs", "decided": ["The 23 actions with no handler and no package before the first release answer action_not_built and wait until after it; a test is to name each one, so an unbuilt action is a decision. Not: drop them from the catalog (0397).", "What a release publishes is kept in the repository and every later build is checked against it. Not: rely on review and the changelog, or fetch the last release's packages at check time (0437)."]}, "reg-faces": {"name": "Generated Faces", "group": "Kernel", "state": "p", "text": "From each action: a command (anything2mcp noun verb), an MCP tool (a2m_noun_verb), a REST route (POST /api/v1/actions/noun.verb) and a client method. Nobody writes one by hand.", "where": "a2m-actions: src/faces.rs"}, "reg-dispatch": {"name": "Dispatcher", "group": "Kernel", "state": "p", "text": "Takes one request and does the same seven things for every action, in order. Every refusal is an ordinary failure with a next step.", "where": "a2m-actions: src/dispatch.rs", "never": ["Approve a write through any action."], "rows": [{"cols": [{"title": "Pre-Handler Stages", "ids": ["reg-d-find", "reg-d-validate", "reg-d-health", "reg-d-decide", "reg-d-person"]}, {"title": "Handler Stage", "ids": ["reg-d-run"]}, {"title": "Answer Stage", "ids": ["reg-d-shape"]}]}], "edges": [["reg-d-find", "reg-d-validate", "a known action", "path", 1], ["reg-d-validate", "reg-d-health", "input that fits the full schema", "path", 2], ["reg-d-health", "reg-d-decide", "an action the engine can serve", "path", 3], ["reg-d-decide", "reg-d-person", "a recorded decision to allow", "path", 4], ["reg-d-person", "reg-d-run", "proof of presence, where needed", "path", 5], ["reg-d-run", "reg-d-shape", "the handler's result", "path", 6]], "steps": [{"text": "Find the action by name. An unknown name is refused with the nearest names.", "at": ["reg-d-find"]}, {"text": "Check the input against the full schema.", "at": ["reg-d-validate"]}, {"text": "Check the engine's health against what the action needs.", "at": ["reg-d-health"]}, {"text": "Ask the policy engine. One decision is recorded whether it allows or refuses, and the dispatcher will not go on without one.", "at": ["reg-d-decide"]}, {"text": "For an act that belongs to a person, require proof of presence. A caller marked as an agent never satisfies it; its request is shown to the person on a page.", "at": ["reg-d-person"]}, {"text": "Run the handler. A long action is submitted to the scheduler and returns a run id at once.", "at": ["reg-d-run"]}, {"text": "Shape the answer: redact every string, mark target text as untrusted, cut to the size cap and say what was cut.", "at": ["reg-d-shape"]}]}, "reg-d-find": {"name": "Action Lookup", "group": "Kernel", "state": "p", "text": "Looks the action up by name. An unknown name is refused as invalid input, with the nearest names as the fix.", "where": "a2m-actions: src/dispatch.rs"}, "reg-d-validate": {"name": "Input Validation", "group": "Kernel", "state": "p", "text": "Checks the input against the action's full schema, not the compact one a tool list shows.", "where": "a2m-actions: src/dispatch.rs"}, "reg-d-health": {"name": "Health Check", "group": "Kernel", "state": "p", "text": "Compares what the action needs with the engine's health: stopped refuses everything, degraded refuses writes.", "where": "a2m-actions: src/health.rs"}, "reg-d-decide": {"name": "Policy Query", "group": "Kernel", "state": "p", "text": "Gets one decision from the policy engine and refuses to go on without it. The decision is recorded whether it allows or denies.", "where": "a2m-actions: src/dispatch.rs", "never": ["Decide for itself."]}, "reg-d-person": {"name": "Person Requirement", "group": "Kernel", "state": "p", "text": "For an act that is a person's, such as approving a write, proof comes only from the operating system's prompt on the person's own surface. An agent's ask is shown on a page; only a press there carries it out, once.", "where": "a2m-actions: src/person.rs", "never": ["Let an agent satisfy a person's act."]}, "reg-d-run": {"name": "Handler Execution", "group": "Kernel", "state": "p", "text": "Runs the action's own code. A long-running action goes to the scheduler and returns a run id.", "where": "a2m-actions: src/handlers/"}, "reg-d-shape": {"name": "Answer Shaping", "group": "Kernel", "state": "p", "text": "Every outgoing string passes the redactor. Text that came from a target is marked untrusted. The result is cut to its cap and says what was cut; a large one is kept as a blob and returned as a reference. A next step is added.", "where": "a2m-actions: src/render.rs", "never": ["Return a secret."]}, "reg-use": {"name": "Tool Use Actions", "group": "Action Group", "state": "b", "text": "Search and describe tools, call one (tool.search, tool.describe, tool.call), read a run, resume or cancel it, see a trace, check or ask for a sign-in (session.status, session.login), and make and manage watches. Designed and not built: tool.search and tool.describe say whether each tool is available, and why not. Undo of a run is planned, not built.", "where": "a2m-actions"}, "reg-build": {"name": "Target Build Actions", "group": "Action Group", "state": "p", "text": "Add and probe a target, detect the sign-in, take a snapshot, read and write and lint and try drafts, run the tests, record a fixture, compare versions, request publication. Ask for a capture of a person's use, which the person begins and ends on the engine's page (capture.start, capture.stop). draft.ready takes every read a trial in this project read a value through, the scout's or the caller's own, records its fixture, promotes its first binding on the fixture's own trial, runs the gates, and asks for the publish, which stays the person's act on the page. endpoints.infer has no handler.", "where": "a2m-actions", "decided": ["The add shortcut takes the description a person has, with a file option that puts it in the Input Files, and ends at the report; each proven read in the report carries the call that reads it. Not: a new action that lists what can be tried (0306).", "The steps between a proven read and a publish are one action, draft.ready: for each proven read it records the fixture, promotes the first binding and runs the gates, each by the existing action's own handler. It never touches a write, a held draft or an unproven read. Not: a shortcut of fixed actions, or folding the steps into add (0401).", "draft.ready takes the caller's own trial too, promotes on the fixture's own trial, and asks for the publish, answering needs_person with the page's link. Not: the scout's proven reads alone and no publish request, as 0401 had it, or promote on the trial the read was made ready from, which may have gone (0443).", "capture.start with no capture asks, and the same action with the capture's identifier and a proof of presence begins it, from the page. Not: a separate confirm action that only the page calls, as watches have (0433)."]}, "reg-providers": {"name": "Provider Actions", "group": "Action Group", "state": "p", "text": "List and describe packs, switch one on or off, find outside components, run discoverers, list findings and unknowns, settle one, and run the scout (scout.run, scout.report).", "where": "a2m-actions"}, "reg-publish": {"name": "Publish Actions", "group": "Action Group", "state": "p", "text": "Publish a reviewed version, promote a binding on the evidence of its tests, activate, roll back, bundle and import. Publishing is a person's act, never an agent's.", "where": "a2m-actions", "decided": ["A publish review shows which gates ran from the one table the gate runner holds; no document lists the gates a second time. Not: a second list in the documents (0307)."]}, "reg-admin": {"name": "Admin Actions", "group": "Action Group", "state": "p", "text": "Toolsets, grants, policy publication and tests, explaining a past decision, sessions, runners, kill switches, audit, secrets (set only), key rotation, delegation. Most of these arrive with shared servers and are later.", "where": "a2m-actions"}, "reg-machine": {"name": "Machine Actions", "group": "Action Group", "state": "p", "text": "Control the local engine, show and set settings, run the doctor, look at the machine's network (net.*), install a pinned browser, manage plug-ins, connect a client, show traces, and read built-in docs.", "where": "a2m-actions"}, "reg-absent": {"name": "Absent Actions", "group": "Action Group", "state": "b", "text": "No action approves a write or a publish on a local machine. No action reads a secret back. No action runs as another person, and ending a session cannot be used to enter one.", "where": "a2m-actions: src/dispatch.rs", "never": ["Approve.", "Read a secret back.", "Run as another person."]}, "reg-kernel": {"name": "Kernel Handle", "group": "Kernel", "state": "b", "text": "Opens the store, the vault, the ledger, policy, scheduler, keeper and engine in the right order, holds the kernel's health, and gives handlers the in-process versions of what the engine and keeper ask for. It also holds the settings loader and the on-disk layout as one function.", "where": "a2m-actions: src/kernel.rs", "never": ["Name a pack, a mode or a make of client."]}, "proj-toml": {"name": "Project Settings", "group": "Project File", "state": "b", "text": "anything2mcp.toml: which targets and environments the project holds. Found by looking in the current folder and then each parent. Meant to be its own private repository.", "where": "a2m-files: src/load.rs"}, "proj-agents": {"name": "Guidance File", "group": "Project File", "state": "p", "text": "Written by init: the build loop, the rules and a command list, so an agent starting in the folder knows how to work.", "where": "a2m-actions: src/init.rs"}, "proj-out": {"name": "Working Output", "group": "Project File", "state": "p", "text": ".anything2mcp/out holds snapshots, captures, traces and diffs, ignored by Git. The Ledger Store, the vault and every session live in the user's data directory, never here.", "where": "a2m-actions: src/paths.rs"}, "proj-sources": {"name": "Input Files", "group": "Project File", "state": "b", "text": "The files in the project's inputs folder: what a person gives a scout or a pipeline, such as a spreadsheet for a pipeline to read or a description the system publishes about itself. Named from the project folder and never compiled. A path outside it, a hidden file or a link is refused. Not the Source Definitions, which are a target's own files.", "where": "a2m-files: src/source.rs", "never": ["Read a file outside the folder."], "decided": ["Handing the add shortcut a description puts the file here and gives it to the scout under the name description. Not: a separate way of giving a file to the scout (0306).", "The project's inputs folder is named Input Files: what a person gives a scout or a pipeline, never compiled. The files under a target's sources folder are the Source Definitions. Neither folder is renamed on disk. Not: rename the project's folder (0309)."]}, "proj-target": {"name": "target.yaml", "group": "Project File", "state": "b", "text": "The target's surfaces (a kind, an address, how they share a session), environments, locale and defaults. A large system with several services is one target.", "where": "a2m-files: src/schema.rs"}, "proj-auth": {"name": "auth.yaml", "group": "Project File", "state": "b", "text": "The sign-in method per surface, the cheap signed-in read, signs of expiry and declared timeouts. It names vault entries; it never holds a secret.", "where": "a2m-files: src/schema.rs", "never": ["Hold a secret."]}, "proj-types": {"name": "types.yaml", "group": "Project File", "state": "b", "text": "Field types: units, rounding, code lists, and how the system writes a value. Units live here and nowhere else.", "where": "a2m-files: src/schema.rs"}, "proj-operations": {"name": "operations/", "group": "Project File", "state": "b", "text": "One file per operation: inputs, outputs, effect, key, and one binding per mode, each saying how that mode does it. Business steps live here and nowhere else.", "where": "a2m-files: src/schema.rs"}, "proj-pipelines": {"name": "pipelines/", "group": "Project File", "state": "b", "text": "One file per pipeline: operations in order, checkpoints, limits and success checks, over a source of records.", "where": "a2m-files: src/schema.rs"}, "proj-pack-files": {"name": "Pack File Kinds", "group": "Project File", "state": "b", "text": "Folders a pack brings: screens/ for web and desktop, page_requests/ for web, endpoints/ for HTTP, and others such as commands/ or registers/. Each kind has one owning pack; another pack may declare it reads one.", "where": "a2m-files: src/register.rs"}, "proj-tests": {"name": "Tests and Fixtures", "group": "Project File", "state": "b", "text": "Expected results per operation and recorded pages or responses for offline tests. Fixtures are synthetic or scrubbed. A fixture records whether it was written or recorded from a trial.", "where": "a2m-files: src/schema.rs", "decided": ["A fixture says where it came from: trial, when the engine recorded it from a trial and signed it, and written otherwise; a builder's file cannot say trial. Not: trust the file's own claim (0307)."]}, "proj-held": {"name": "Holding Folder", "group": "Project File", "state": "p", "text": "Where the drafter puts a draft that holds an open question, at the same path it would have had. A file drafted from one finding goes there together with its siblings. The loader and the compiler never read it, so the target still compiles whole. Lint lists every held draft with its question. A person releases one by answering and moving it out; the release action is not built yet (decision 0298).", "where": "a2m-files: src/draft.rs", "never": ["Be read by the compiler."], "decided": ["Every draft from a capture waits here until a person answers its question. Not: write the drafts in place (0308)."]}, "compiled-target-parse": {"name": "Parsing", "group": "Compiler", "state": "b", "text": "Reads every YAML file and keeps the file, line and column of each value. Fails on malformed YAML.", "where": "a2m-files: src/load.rs"}, "compiled-target-validate": {"name": "Schema Validation", "group": "Compiler", "state": "b", "text": "Checks each file against its published schema and the target's schema version: one number for every file kind the program carries, the kernel's and every pack's. Only number 1 exists; version.migrate, which rewrites files from the number before, is built with number 2. Fails on unknown or missing fields.", "where": "a2m-files: src/schema.rs", "decided": ["A removed, renamed or changed field raises the schema number; a new optional field, file kind or word does not. Not: a number for each pack, or a new number on every change (0436)."]}, "compiled-target-resolve": {"name": "Resolution", "group": "Compiler", "state": "b", "text": "Links names: an operation to its screens, endpoints and types, a pipeline to its operations and sources. Fails on a name that does not exist or is defined twice.", "where": "a2m-files: src/compile.rs"}, "compiled-target-typecheck": {"name": "Type-Checking", "group": "Compiler", "state": "b", "text": "Checks every expression against input and output schemas and field types. A double literal, a float name or a function returning a float is refused.", "where": "a2m-files: src/compile.rs"}, "compiled-target-lower": {"name": "Step Expansion", "group": "Compiler", "state": "b", "text": "Turns each binding's verb into the fixed list of steps its driver will run, using the lowering its pack registered. Fails on a mode or verb nobody registered.", "where": "a2m-files: src/compile.rs"}, "compiled-target-analyze": {"name": "Compiled Target Analysis", "group": "Compiler", "state": "b", "text": "Counts the steps marked as commits in each write binding, works out each pipeline's effect class and each operation's manifest. A write with no key that is not irreversible, or a declared effect lower than the derived one, fails. A compiled target whose effect is a read and which holds a step that can change the system is refused. A read whose binding holds a step of a kind its pack marks as able to change the system is refused as kernel.read_acts; each kind is marked never, as declared, or can, and an unmarked kind counts as can (decision 0312).", "where": "a2m-files: src/compile.rs", "decided": ["The kernel refuses a read compiled target that holds a step which can change the system, whichever pack lowered it; a pack says so where it registers a step kind. Not: leave the check to each pack (0307)."]}, "compiled-target-lint": {"name": "Linting", "group": "Compiler", "state": "b", "text": "Applies the kernel's lint rules and those packs register. Fixed sleeps, a suspected credential and others are errors. An operation of which every binding is draft or retired is warned of in every compile, kernel.no_binding_may_act, with binding.promote as the fix.", "where": "a2m-files: src/review.rs", "decided": ["The refusal of a secret in a file does not change; the HTTP drafter now asks the same function, so it never writes a file the compiler would refuse. Not: loosen the check for a path into an answer (0302).", "An operation no binding of which may act is a warning, not a refusal, so test.run can still prove the draft binding it promotes. Not: an error in a publish compile, or a third compile mode for test.run (0440)."]}, "compiled-target-describe": {"name": "Compiled Target Description", "group": "Compiler", "state": "b", "text": "Generates each tool's name, description, input and output schemas and annotations. Two indistinguishable tools fail.", "where": "a2m-files: src/compile.rs", "decided": ["The output schema lists every output as required; the type of an output that may be absent also admits null. Not: no required list at all (0305). Not built yet.", "A tool's description is plain text of at most 1,024 characters with no control characters, and the engine adds nothing to it. Not: unbounded text (0307)."]}, "compiled-target-emit": {"name": "Output Writing", "group": "Compiler", "state": "b", "text": "Writes the compiled target as canonical JSON (sorted keys, no spaces, whole numbers only) and takes its hash. The same files and compiler version give identical bytes.", "where": "a2m-files: src/compile.rs"}, "compiled-target-contents": {"name": "Compiled Target Contents", "group": "Compiled Target", "state": "b", "text": "A header, the target and its surfaces and environments, sign-in settings (never a credential), field types, one opaque section per pack file kind, operations with their steps in binding order, pipelines, parsed expressions, tool descriptions, permission manifests and tests. Each output also says whether it may be absent.", "where": "a2m-core: src/compiled_target.rs", "decided": ["Each output of an operation says whether it may be absent, set by the pack's lowering and not worked out by the kernel; an absent output is returned as null under its own name. Not: leave the key out of the result (0305). Not built yet; roadmap package FT7."]}, "compiled-target-hash": {"name": "Compiled Target Hash", "group": "Compiled Target", "state": "b", "text": "The digest of all the compiled target's bytes. The engine checks it again before running, and refuses a compiled target that does not match. It names exactly what ran.", "where": "a2m-core: src/digest.rs", "never": ["Run a compiled target whose hash does not match."]}, "compiled-target-whole": {"name": "Atomic Compilation", "group": "Compiled Target", "state": "b", "text": "A target compiles whole or not at all. Problems from stages 2 to 8 are reported together with a code, a place and a fix. The holding folder keeps open drafts out of the compile, so a target is never compiled around a missing piece (decision 0298).", "where": "a2m-files: src/compile.rs", "never": ["Compile a target with a part set aside."]}, "compiled-target-versions": {"name": "Drafts and Versions", "group": "Compiled Target", "state": "b", "text": "A draft compiles in memory and test rules are warnings. A published version compiles once in a clean mode, stores the compiled target, the source files and the gate evidence together and immutably, and gets a review summary ordered by risk. Nobody but a person publishes. The review also shows each tool's evidence and which gates ran.", "where": "a2m-files: src/compile.rs", "decided": ["The review of a version shows each tool's evidence level, names every tool below executed first, and shows each gate as passed, failed or not built. Publishing a tool below executed stays the person's choice. Not: refuse to publish it (0307)."]}, "scout-identify": {"name": "Identification", "group": "Scout", "state": "p", "text": "Probes each declared surface: what kind it is, which pack serves it, how sign-in works. Something the target did not declare but plainly offers, such as a published description, is reported as a candidate and not entered. A surface needing sign-in is reported needs_login and the scout carries on.", "where": "a2m-actions: src/handlers/scout.rs"}, "scout-discover": {"name": "Discovery", "group": "Scout", "state": "p", "text": "Runs the enabled discoverers for each surface as one discovery job inside the engine's sandbox. A discoverer can only read. A person may hand it files from the Input Files, which are checked when asked and again before use.", "where": "a2m-actions: src/handlers/scout.rs", "never": ["Write to the system."]}, "scout-compare": {"name": "Scenario Comparison", "group": "Scout", "state": "p", "text": "Sets what a system describes against what was observed. An endpoint present in a description and never seen is reported as inferred. Each difference is a finding or an open question. The rest of it waits until after the first release.", "where": "a2m-actions: src/handlers/scout.rs", "decided": ["The comparison stage, and the scout's own budget, wait until after the first release: no copy test has both a description and a capture (0397, 0400)."]}, "scout-draft": {"name": "Drafter", "group": "Scout", "state": "p", "text": "Kernel code with each pack's rules. From a finding it writes endpoint entries and reads, pass-through reads for read-only upstream tools, screen models and list reads, record kinds and reads for tables, and so on. Every draft is at the reconstructed level, carries no unit, key or read-back rule the system did not state, and types text from the system as untrusted. A write is never drafted.", "where": "a2m-files: src/draft.rs", "never": ["Guess a value the system did not state."]}, "scout-check": {"name": "Draft Check", "group": "Scout", "state": "p", "text": "Lints and compiles the drafts. A draft that fails is kept with its findings and marked.", "where": "a2m-actions: src/handlers/drafts.rs"}, "scout-try": {"name": "Trial", "group": "Scout", "state": "p", "text": "Runs each read the scout may try, five times in the sandbox, and compares. A read is tried only if the engine enforces that it is safe (a read-only transaction, a file opened for reading) or the system's own contract says so. For a program it runs only the help and version forms the target declares. A read that needs a sign-in nobody has made is not sent; it is reported as waiting, not as failed.", "where": "a2m-actions: src/handlers/drafts.rs", "never": ["Try a write, under any setting."], "decided": ["A read that waits for a sign-in is reported as waiting, and the trial's answer names the one action that signs in. Not: count it as failed (0303).", "A trial's answer states that it ran in the sandbox and that nothing is published, and says that a published tool is called with tool.call. Not: leave the answer to read as a live result (0306)."]}, "scout-report": {"name": "Scout Report", "group": "Scout", "state": "p", "text": "One report: found, drafted, proven, held, open, and what to look at first. Its hash leaves out run identifiers, and the system's own words are kept apart. The answer carries counts and the first 20 of each list; scout.report reads the rest in pages, because a real system's report was too large for one answer. Reads that wait for a sign-in are listed apart, as Waiting Reads.", "where": "a2m-actions: src/handlers/scout_report.rs", "decided": ["The report counts the properties left out because their names are a secret's. Not built yet; roadmap packages FT10 and FT11. Not: leave them out unmentioned (0302).", "The report lists reads that wait for a sign-in apart from proven and failed ones, and its counts add up: drafted is proven, waiting, failed and held. Not: a third value that sends a credential when there is one (0303).", "Each proven read in the report carries the call that reads it, with the target, the tool and an accepted input, for an agent to copy. Not: a third list of what can be tried (0306).", "A capture's report is a scout report: it says it came from a capture, how long it ran, what it saw and each bound it hit, and lists each held draft and asserted read as not tried, with its next step (0400)."]}, "scout-findings": {"name": "Scout Findings", "group": "Scout", "state": "b", "text": "A fact about a system with its subject, kind, what was found, the level (discovered or inferred, no higher), who vouches for it, how complete the look was, what limits it, and what it was derived from. Its id is a digest of its content, so the same observation has the same id everywhere.", "where": "a2m-core: src/finding.rs"}, "scout-unknowns": {"name": "Open Questions", "group": "Scout", "state": "b", "text": "The unknowns ledger: what a rule could not settle, kept as data. Where a rule gives no answer the scout asks; it never guesses.", "where": "a2m-ledger: src/finding.rs"}, "scout-held": {"name": "Holding Folder", "group": "Scout", "state": "p", "text": "A draft with an open question waits in held/, so one doubtful draft does not stop every other tool being tried. Asking to try or publish a held tool is refused by name with its question. An open question outside held/ is still an error. Releasing a draft by action is not built yet.", "where": "a2m-files: src/draft.rs", "decided": ["Every draft from a capture goes to the holding folder with the question whether the read is one the software means to be called this way. Not: write the drafts in place (0308)."]}, "scout-ladder": {"name": "Evidence Levels", "group": "Scout", "state": "b", "text": "Seven levels a tool earns and never declares: inferred, discovered, reconstructed, schema_verified, executed, behavior_verified, approved. No level is skipped. A level can fall when its evidence stops being true. The scout can raise a read to executed and no higher.", "where": "a2m-core: src/evidence.rs", "rows": [{"cols": [{"title": "Finding Levels", "ids": ["ladder-inferred", "ladder-discovered"]}, {"title": "Draft Levels", "ids": ["ladder-reconstructed", "ladder-schema"]}, {"title": "Proven Levels", "ids": ["ladder-executed", "ladder-behavior"]}, {"title": "Person Level", "ids": ["ladder-approved"]}]}], "edges": [["ladder-inferred", "ladder-discovered", "a claim seen on the live system", "path", 1], ["ladder-discovered", "ladder-reconstructed", "a draft that compiles and lints", "path", 2], ["ladder-reconstructed", "ladder-schema", "real answers that match the schemas", "path", 3], ["ladder-schema", "ladder-executed", "a sandbox run with a step trace", "path", 4], ["ladder-executed", "ladder-behavior", "publish gates that passed", "path", 5], ["ladder-behavior", "ladder-approved", "a person's publish", "path", 6]], "steps": [{"text": "A discoverer records what it derived (inferred) or saw on the live system (discovered).", "at": ["ladder-inferred", "ladder-discovered"]}, {"text": "The compiler raises a draft to reconstructed once it compiles and lints.", "at": ["ladder-reconstructed"]}, {"text": "Real answers matching the declared schemas give schema_verified; a run in the sandbox gives executed.", "at": ["ladder-schema", "ladder-executed"]}, {"text": "The publish gates give behavior_verified. Only a person gives approved. The level informs a person at review and gates no listing or call (0307).", "at": ["ladder-behavior", "ladder-approved"]}], "decided": ["The evidence level informs a person and decides nothing in a run; a finding may still not claim more than its source can give. Not: let a level gate a call (0307)."]}, "scout-bounds": {"name": "Scout Bounds", "group": "Scout", "state": "b", "text": "Every stage has limits on time, size, depth and number of requests, and the report says which were hit. The scout identifies itself as automation, keeps to the target's rate limit, and stops at a block.", "where": "a2m-actions: src/bounds.rs"}, "scout-line": {"name": "Division of Work", "group": "Scout", "state": "b", "text": "Mechanical work, which a rule decides the same way every time, is the runtime's. Judgment (naming a tool, choosing which endpoints matter) is the developer's or their agent's at build time. Authority (consent, sign-in, approving a write, publishing) is a person's. The runtime runs no model.", "never": ["Do judgment."]}, "ladder-inferred": {"name": "Inferred", "group": "Evidence Level", "state": "b", "text": "Derived and never observed: from a description, from reading code, from a pattern. A discoverer can set it.", "where": "a2m-core: src/evidence.rs"}, "ladder-discovered": {"name": "Discovered", "group": "Evidence Level", "state": "b", "text": "Observed on the live system, with the stored observation named. A discoverer can set it.", "where": "a2m-core: src/evidence.rs"}, "ladder-reconstructed": {"name": "Reconstructed", "group": "Evidence Level", "state": "b", "text": "A draft operation exists with inputs, outputs and a binding, and it compiles and lints. The compiler sets it.", "where": "a2m-core: src/evidence.rs"}, "ladder-schema": {"name": "Schema Verified", "group": "Evidence Level", "state": "b", "text": "Real answers matched the declared schemas, from fixtures and a schema check.", "where": "a2m-core: src/evidence.rs"}, "ladder-executed": {"name": "Executed", "group": "Evidence Level", "state": "b", "text": "The draft ran in the sandbox against a test record, with a step trace. A read that passes five identical runs reaches it.", "where": "a2m-core: src/evidence.rs"}, "ladder-behavior": {"name": "Behavior Verified", "group": "Evidence Level", "state": "b", "text": "The publish gates passed, with ground truth from a test stand where one can give it.", "where": "a2m-core: src/evidence.rs"}, "ladder-approved": {"name": "Approved", "group": "Evidence Level", "state": "b", "text": "A person published it, and it is the current version. Never set by an agent.", "where": "a2m-core: src/evidence.rs"}, "con-manifest": {"name": "Manifest", "group": "Provider Contract", "state": "b", "text": "One TOML file per provider. It lists the modes with their access kind, steps, exclusive resource and, where one needs longer than 30 seconds, how long its prepare may take (prepare_within_ms, at most ten minutes), surface kinds, file kinds, finding kinds, lint rules, drafting rules, failure codes (each with one class), actions, effects (processes, read and write roots, network, sessions), requirements from the machine, platforms and settings. A provider asks for nothing it did not declare, and the registry is checked against it.", "where": "a2m-provider: src/manifest.rs", "never": ["Let a provider do more than it declared."], "decided": ["A manifest that states a prepare time of zero or past the ceiling is refused at registration as manifest_invalid, never cut down to fit. Not: one engine number for every mode (0427)."]}, "con-registry": {"name": "Provider Registry", "group": "Provider Contract", "state": "b", "text": "One immutable snapshot of every provider, its modes and the objects each supplied, built once at start and replaced whole when a provider is switched. It refuses two providers that register one mode with different access kinds, and two packs that own one kind for one surface kind.", "where": "a2m-provider: src/registry.rs", "never": ["Hold a list of modes by name in the kernel."]}, "con-driver": {"name": "Driver", "group": "Provider Contract", "state": "b", "text": "Carries out the steps of one or more modes: prepare, act, read back. It returns outcomes; the engine writes the ledger. It may not retry inside a step, read the vault, sign in, or approve anything.", "where": "a2m-provider: src/driver.rs", "never": ["Decide whether something may happen.", "Mark anything verified."]}, "con-discoverer": {"name": "Discoverer", "group": "Provider Contract", "state": "b", "text": "Observes a target and returns findings, never above the discovered level, within declared bounds. It runs through the sandbox, where a write is impossible. Each discoverer also supplies a describer that says in words what it did and did not look at.", "where": "a2m-provider: src/discover.rs", "never": ["Write."], "decided": ["A discoverer is called by discover or by watch, never both, as its manifest's driven_by says; one driven by the engine is never handed the capture's end (0395)."]}, "con-compiler-reg": {"name": "Compiler Registrations", "group": "Provider Contract", "state": "b", "text": "File kinds a pack owns, the lowering of each verb of each of its modes into steps, its lint rules and its drafting rules. This is how knowledge of one kind of system stays in its pack.", "where": "a2m-files: src/register.rs"}, "con-auth": {"name": "Auth Provider", "group": "Provider Contract", "state": "b", "text": "How a session of one kind is made, checked, renewed and ended. Defined in the keeper's crate; a pack fills it when the sign-in needs a surface of its system.", "where": "a2m-auth: src/provider.rs"}, "con-reader": {"name": "Source Reader", "group": "Provider Contract", "state": "b", "text": "How one kind of input becomes validated records. Defined in the sources crate.", "where": "a2m-sources: src/read.rs"}, "con-handle": {"name": "Driver Handle", "group": "Provider Contract", "state": "b", "text": "The only way the engine reaches a driver. It refuses a step that commits unless it carries the intent token, and refuses every committing step for a driver prepared for discovery. In the sandbox this makes a write impossible. It gives the engine the time its mode states for prepare.", "where": "a2m-provider: src/driver.rs", "never": ["Let a write through without an intent token."]}, "con-paths": {"name": "Checked Paths", "group": "Provider Contract", "state": "b", "text": "A path a pack may open can be made only by checking it against the roots its manifest declares. A caller's input never chooses a file. A file whose bytes are not on this machine, a Windows placeholder or offline file or a macOS dataless file, is its own kind of entry, never a regular file.", "where": "a2m-provider: src/path.rs", "never": ["Open a file a caller's input named."], "decided": ["A file whose bytes a sync program keeps elsewhere is refused by name, file_not_on_this_machine, and never fetched. Not: let the system fetch it under the step's time limit, or ask the sync program to keep it here, which is the person's act (0430)."]}, "con-supervisor": {"name": "Supervisor", "group": "Provider Contract", "state": "b", "text": "The only way anything starts a process: with a handshake, framing, deadlines and ownership-proven stopping. A program is named by
