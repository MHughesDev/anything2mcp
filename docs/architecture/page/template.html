<title>A2MArchitecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one line with five stations, the route a call takes, and nothing else at first. Opening a station opens a
   reading sheet under the line; every part on a sheet opens its own sheet, as deep as the design goes. Three shelves
   hold what lies beneath the line. A walk moves along the line one step at a time. */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --ink: #14201e; --muted: #5a6966; --line: #d2dad8; --soft: #e6ebe9;
  --route: #0b6b66; --route-soft: #d8ecea; --on-route: #ffffff;
  --built: #1c8548; --part: #b3740f; --todo: #8a9693;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px; padding-top: 28px; }
h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.lede { margin: 0; max-width: 58ch; color: var(--muted); text-wrap: pretty; }
.done { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.done b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { width: 96px; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--route); }

/* The line */
.line { position: relative; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 0; padding-top: 6px; }
.line::before { content: ""; position: absolute; left: 7px; right: 0; top: 13px; height: 2px; background: var(--route); opacity: .45; }
.st { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 30px 16px 12px 0; border-radius: 8px; min-width: 0; }
.st::before { content: ""; position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--route); transition: background .15s; }
.st b { font-weight: 600; font-size: 1rem; line-height: 1.25; }
.st small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.st:hover b { color: var(--route); }
.st.on::before { background: var(--route); }
.st.on b { color: var(--route); }
.st.lit::before { background: var(--route); box-shadow: 0 0 0 5px var(--route-soft); }
.pips { display: flex; gap: 4px; margin-top: 6px; }
.pip { width: 6px; height: 6px; border-radius: 50%; background: var(--todo); }
.pip.b { background: var(--built); } .pip.p { background: var(--part); } .pip.t { background: none; box-shadow: inset 0 0 0 1.5px var(--todo); } .pip.x { background: var(--line); }

.under { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.set { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; min-width: 0; }
.set > span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13.5px; background: var(--surface); }
.chip:hover { border-color: var(--route); }
.chip.on { background: var(--route); border-color: var(--route); color: var(--on-route); }
.chip.lit { border-color: var(--route); box-shadow: 0 0 0 3px var(--route-soft); }

/* A walk */
.walk { background: var(--route-soft); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.walk .cap { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--route); font-weight: 600; font-variant-numeric: tabular-nums; }
.walk p { margin: 0; font-size: 1.05rem; line-height: 1.5; max-width: 70ch; }
.walk .at { display: flex; flex-wrap: wrap; gap: 6px; }
.walk .at .chip { background: var(--bg); }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.act { border: 1px solid var(--route); color: var(--route); border-radius: 6px; padding: 5px 14px; font-size: 13.5px; font-weight: 500; }
.act:hover { background: var(--route); color: var(--on-route); }
.act[disabled] { opacity: .4; cursor: default; pointer-events: none; }
.act.quiet { border-color: transparent; color: var(--muted); }
.act.quiet:hover { background: none; color: var(--ink); }

/* The reader */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13.5px; color: var(--muted); }
.crumbs button { color: var(--route); padding: 2px 2px; }
.crumbs button:hover { text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 500; }
.reader { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
.reader.two { grid-template-columns: 230px minmax(0, 1fr); }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
.side h3 { margin: 10px 0 2px; }
.side h3:first-child { margin-top: 0; }
.side button { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px; font-size: 13.5px; color: var(--muted); }
.side button:hover { color: var(--ink); background: var(--soft); }
.side button.on { color: var(--ink); background: var(--surface); font-weight: 500; box-shadow: inset 2px 0 0 var(--route); }
.sheet { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h2 { font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.state { display: inline-flex; align-items: center; gap: 7px; }
.where { font-family: var(--mono); font-size: 12.5px; }
.sheet p { margin: 0; max-width: 66ch; text-wrap: pretty; }
.hand { color: var(--muted); font-size: 14px; }
.hand button { color: var(--route); font-weight: 500; }
.hand button:hover { text-decoration: underline; }
.group { display: flex; flex-direction: column; gap: 6px; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); width: 100%; }
.row:hover { background: var(--soft); }
.row .pip { align-self: center; width: 8px; height: 8px; }
.row b { font-weight: 500; }
.row small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; font-weight: 400; }
.row .more { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .more i { font-style: normal; color: var(--route); margin-left: 6px; }
.tight .row { padding: 7px 4px; }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
details + details { margin-top: -14px; }
summary { list-style: none; cursor: pointer; padding: 11px 4px; display: flex; justify-content: space-between; gap: 12px; font-weight: 500; }
summary::-webkit-details-marker { display: none; }
summary span { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
summary span::after { content: " +"; color: var(--route); font-weight: 600; }
details[open] summary span::after { content: " \2212"; }
summary:hover { color: var(--route); }
.fold { padding: 2px 4px 16px; display: flex; flex-direction: column; gap: 12px; }
.fold ul, .fold ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 8px; max-width: 66ch; }
.fold li small { display: block; margin-top: 3px; }
.fold li small button, .flow button { color: var(--route); font-size: 13px; }
.fold li small button:hover, .flow button:hover { text-decoration: underline; }
.flow { list-style: none; padding: 0 !important; }
.flow li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
.flow li > span { color: var(--muted); font-size: 12.5px; }
.hint { color: var(--muted); margin: 0; }
footer { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
footer span { display: inline-flex; align-items: center; gap: 7px; }
footer .note { display: block; flex-basis: 100%; }

@media (max-width: 860px) {
  .reader.two { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
}
@media (max-width: 700px) {
  header { padding-top: 20px; }
  .line { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .line::before { left: 7px; right: auto; top: 14px; bottom: 22px; width: 2px; height: auto; }
  .st { padding: 6px 0 10px 30px; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .st::before { top: 8px; }
  .st b { flex-basis: 100%; }
  .pips { margin-top: 0; align-self: center; }
  .wrap.open .st small, .wrap.open .pips { display: none; }
  .wrap.open .st { padding-bottom: 4px; }
  .sheet { padding: 18px 16px 20px; }
  .row .more em { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap" id="wrap">
  <header>
    <div><h1>Anything2MCP, as designed</h1><p class="lede" id="lede"></p></div>
    <div class="done" aria-label="How much of the build is done"><b id="pct"></b><span class="bar"><i id="pctbar"></i></span><span id="prog"></span></div>
  </header>
  <nav class="line" id="line" aria-label="The route a call takes"></nav>
  <div class="under">
    <div class="set" id="shelves"><span>Beneath the line</span></div>
    <div class="set" id="walks"><span>Follow a call</span></div>
  </div>
  <section class="walk" id="walk" aria-live="polite" hidden></section>
  <div class="crumbs" id="crumbs" hidden></div>
  <div class="reader" id="reader"></div>
  <footer>
    <span><i class="pip b"></i>Built</span><span><i class="pip p"></i>Partly built</span><span><i class="pip t"></i>Not built</span><span><i class="pip x"></i>Outside the product</span>
    <span class="note">Drawn from the design documents and decision records in the repository, as of <span id="upd"></span>. Where this page and a specification section disagree, the section is right.</span>
  </footer>
</div>
<script>
(function(){
  var A=/*DATA*/null/*END*/, N=A.nodes, O=A.outline, S={}, ORDER=O.stations.concat(O.shelves);
  ORDER.forEach(function(s){ S[s.id]=s; });
  var LABEL={b:'Built',p:'Partly built',t:'Not built',x:'Outside the product'};
  function h(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function btn(cls,text,fn){ var b=h('button',cls,text); b.type='button'; if(fn) b.addEventListener('click',fn); return b; }
  function first(text){ var m=/^(.*?[.!?])(\s|$)/.exec(text||''); return m?m[1]:(text||''); }
  function groupsOf(id){
    if(S[id]) return S[id].groups;
    var out=[]; (N[id].rows||[]).forEach(function(r){ r.cols.forEach(function(c){ var t=c.title||r.title||'', ids=c.ids.filter(function(i){return N[i];});
      if(out.length&&out[out.length-1].title===t) out[out.length-1].ids=out[out.length-1].ids.concat(ids); else out.push({title:t,ids:ids}); }); });
    return out;
  }
  function kids(id){ return [].concat.apply([],groupsOf(id).map(function(g){return g.ids;})); }
  var parent={};
  ORDER.forEach(function(s){ kids(s.id).forEach(function(c){ parent[c]=s.id; }); });
  Object.keys(N).forEach(function(id){ if(id===A.root) return; kids(id).forEach(function(c){ if(!(c in parent)) parent[c]=id; }); });
  function valid(id){ return !!(S[id]||(N[id]&&id!==A.root&&parent[id])); }
  function pathTo(id){ var p=[]; while(id){ p.unshift(id); id=parent[id]; } return p; }
  function nameOf(id){ return (S[id]||N[id]).name; }
  function viewOf(id){ var p=parent[id]; return S[p]?N[A.root]:N[p]; }

  var cur='', walk=-1, at=0, WALKS=N[A.root].walks||[];
  document.getElementById('lede').textContent=O.says;
  document.getElementById('upd').textContent=A.updated;
  document.getElementById('pct').textContent=A.percent!=null?A.percent+'% built':'';
  document.getElementById('prog').textContent=A.progress||'';
  document.getElementById('pctbar').style.width=(A.percent||0)+'%';

  function pip(state){ var i=h('i','pip '+(state||'x')); i.setAttribute('aria-hidden','true'); return i; }
  function go(id){ var want=valid(id)?id:''; if(location.hash.slice(1)===want){ show(want); return; }
    if(want) location.hash=want; else { try{ history.pushState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } show(''); } }

  function drawLine(){
    var L=document.getElementById('line'); L.textContent=''; L.style.setProperty('--n',O.stations.length);
    var path=pathTo(cur), lit={};
    if(walk>=0) (WALKS[walk].steps[at].at||[]).forEach(function(i){ lit[parent[i]]=1; });
    O.stations.forEach(function(s){ var b=btn('st'+(path[0]===s.id?' on':'')+(lit[s.id]?' lit':''),null,function(){ go(cur===s.id?'':s.id); });
      b.appendChild(h('b','',s.name)); b.appendChild(h('small','',s.short));
      var p=h('span','pips'); kids(s.id).forEach(function(i){ p.appendChild(pip(N[i].state)); }); b.appendChild(p);
      b.setAttribute('aria-expanded',path[0]===s.id?'true':'false'); L.appendChild(b); });
    var H=document.getElementById('shelves'); while(H.children.length>1) H.removeChild(H.lastChild);
    O.shelves.forEach(function(s){ H.appendChild(btn('chip'+(path[0]===s.id?' on':'')+(lit[s.id]?' lit':''),s.name,function(){ go(cur===s.id?'':s.id); })); });
    var W=document.getElementById('walks'); while(W.children.length>1) W.removeChild(W.lastChild);
    WALKS.forEach(function(w,i){ W.appendChild(btn('chip'+(walk===i?' on':''),w.name,function(){ if(walk===i) walk=-1; else { walk=i; at=0; } drawLine(); drawWalk(); })); });
    W.hidden=!WALKS.length;
  }
  function drawWalk(){
    var P=document.getElementById('walk'); P.textContent=''; P.hidden=walk<0; if(walk<0) return;
    var w=WALKS[walk], s=w.steps[at];
    P.appendChild(h('div','cap',w.name+' · step '+(at+1)+' of '+w.steps.length));
    P.appendChild(h('p','',s.text));
    var a=h('div','at'); (s.at||[]).forEach(function(i){ a.appendChild(btn('chip',N[i].name,function(){ go(i); })); }); P.appendChild(a);
    var nav=h('div','nav'), back=btn('act','Back',function(){ at--; drawLine(); drawWalk(); }), next=btn('act','Next',function(){ at++; drawLine(); drawWalk(); });
    back.disabled=at===0; next.disabled=at===w.steps.length-1; nav.appendChild(back); nav.appendChild(next);
    nav.appendChild(btn('act quiet','End the walk',function(){ walk=-1; drawLine(); drawWalk(); })); P.appendChild(nav);
  }
  function rows(ids,withText){
    var box=h('div','rows'+(withText?'':' tight'));
    ids.forEach(function(i){ var n=N[i], r=btn('row',null,function(){ go(i); }); r.appendChild(pip(n.state));
      var mid=h('span',''); mid.appendChild(h('b','',n.name)); if(withText) mid.appendChild(h('small','',first(n.text))); r.appendChild(mid);
      var k=kids(i).length, more=h('span','more'); if(k){ more.appendChild(h('em','',k+' inside')); } more.appendChild(h('i','','›')); r.appendChild(more);
      r.setAttribute('aria-label',n.name+', '+(LABEL[n.state]||'')+(k?', '+k+' parts inside':'')); box.appendChild(r); });
    return box;
  }
  function inside(id,withText){ var f=document.createDocumentFragment();
    groupsOf(id).forEach(function(g){ if(!g.ids.length) return; var d=h('div','group'); if(g.title) d.appendChild(h('h3','',g.title)); d.appendChild(rows(g.ids,withText)); f.appendChild(d); });
    return f; }
  function fold(title,count,build){ var d=h('details',''), s=h('summary','',title); s.appendChild(h('span','',count)); d.appendChild(s); var body=h('div','fold'); build(body); d.appendChild(body); return d; }
  function plainList(items){ var ul=h('ul',''); items.forEach(function(t){ ul.appendChild(h('li','',t)); }); return ul; }
  function stepList(steps){ var ol=h('ol',''); steps.forEach(function(s){ var li=h('li','',s.text);
      if((s.at||[]).length){ var sm=h('small',''); s.at.forEach(function(i,k){ if(k) sm.appendChild(document.createTextNode(' · ')); sm.appendChild(btn('',N[i].name,function(){ go(i); })); }); li.appendChild(sm); }
      ol.appendChild(li); }); return ol; }

  function sheet(id){
    var X=h('article','sheet'), st=S[id], n=st||N[id];
    X.appendChild(h('div','eyebrow',st?(O.stations.indexOf(st)>=0?'On the line':'Beneath the line'):(n.group||'Part')));
    X.appendChild(h('h2','',n.name));
    if(!st){ var m=h('div','meta'), sp=h('span','state'); sp.appendChild(pip(n.state)); sp.appendChild(document.createTextNode(LABEL[n.state]||'')); m.appendChild(sp);
      if(n.where) m.appendChild(h('span','where',n.where)); X.appendChild(m); }
    X.appendChild(h('p','',n.text));
    if(st){ var ix=O.stations.indexOf(st), nx=O.stations[ix+1];
      if(ix>=0&&nx&&st.passes){ var p=h('p','hand','Hands on to '); p.appendChild(btn('',nx.name,function(){ go(nx.id); })); p.appendChild(document.createTextNode(': '+st.passes+'.')); X.appendChild(p); }
      X.appendChild(inside(id,true)); return X; }
    var k=kids(id); if(k.length>8) X.appendChild(fold('Inside',k.length+' parts',function(b){ b.appendChild(inside(id,false)); }));
    else if(k.length){ var w=h('div','group'); w.appendChild(h('h3','','Inside')); X.appendChild(w); X.appendChild(inside(id,k.length<=6)); }
    var runs=[]; if(n.steps&&n.steps.length) runs.push({name:n.stepsTitle||'How it runs',steps:n.steps}); (n.walks||[]).forEach(function(wk){ runs.push(wk); });
    runs.forEach(function(r,i){ X.appendChild(fold(i===0&&n.steps&&n.steps.length?'How it runs: '+r.name:'Walk: '+r.name,r.steps.length+' steps',function(b){ b.appendChild(stepList(r.steps)); })); });
    var E=(viewOf(id).edges||[]).filter(function(e){ return (e[0]===id||e[1]===id)&&N[e[0]]&&N[e[1]]; });
    if(E.length) X.appendChild(fold('What it receives and hands over',E.length+(E.length===1?' arrow':' arrows'),function(b){ var ul=h('ul','flow');
      E.forEach(function(e){ var inn=e[1]===id, other=inn?e[0]:e[1], li=h('li',''); li.appendChild(h('span','',inn?'From':'To')); var d=h('div','');
        d.appendChild(btn('',N[other].name,function(){ go(other); })); if(e[2]) d.appendChild(document.createTextNode(': '+e[2])); li.appendChild(d); ul.appendChild(li); }); b.appendChild(ul); }));
    if(n.never&&n.never.length) X.appendChild(fold('What it never does',String([].concat(n.never).length),function(b){ b.appendChild(plainList([].concat(n.never))); }));
    if(n.decided&&n.decided.length) X.appendChild(fold('Decided lately',String(n.decided.length),function(b){ b.appendChild(plainList(n.decided)); }));
    if(n.weighing&&n.weighing.length) X.appendChild(fold('Alternatives and open questions',String(n.weighing.length),function(b){ b.appendChild(plainList(n.weighing)); }));
    return X;
  }
  function side(id){ var p=parent[id]; if(!p) return null; var box=h('nav','side'); box.setAttribute('aria-label','Beside this part');
    groupsOf(p).forEach(function(g){ if(g.title) box.appendChild(h('h3','',g.title)); g.ids.forEach(function(i){ var b=btn(i===id?'on':'',null,function(){ go(i); }); b.appendChild(pip(N[i].state)); b.appendChild(h('span','',N[i].name)); box.appendChild(b); }); });
    return box; }
  function drawReader(){
    var R=document.getElementById('reader'), C=document.getElementById('crumbs'); R.textContent=''; C.textContent='';
    document.getElementById('wrap').classList.toggle('open',!!cur); C.hidden=!cur;
    if(!cur){ R.className='reader'; R.appendChild(h('p','hint','Nothing is open. Choose a station on the line, something beneath it, or a call to follow.')); return; }
    C.appendChild(btn('','Overview',function(){ go(''); }));
    pathTo(cur).forEach(function(p){ C.appendChild(h('span','','›')); if(p===cur) C.appendChild(h('b','',nameOf(p))); else C.appendChild(btn('',nameOf(p),function(){ go(p); })); });
