<meta charset="utf-8">
<title>A2MArchitecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* A workspace of three panels. The middle is the Module Map: every station and subsystem is a container, its parts are
   modules nested inside it, the Provider Contract is a seam between the kernel and the packs, and the links between
   containers are drawn once per pair with a count. The left panel chooses a layer, a process map, filters, and a call to
   follow; the right panel reads the chosen part in depth. Both side panels fold to a rail. */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --ink: #14201e; --muted: #5a6966; --line: #d2dad8; --soft: #e6ebe9;
  --route: #0b6b66; --route-soft: #d8ecea; --on-route: #ffffff;
  --canvas: #f6f8f7; --card: #ffffff; --well: #eef2f1; --box: #fbfcfc;
  --built: #1c8548; --part: #b3740f; --todo: #8a9693;
  --shadow: 0 8px 26px rgb(20 32 30 / .14); --scrim: rgb(20 32 30 / .32);
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2,.7,.3,1);
  --lw: clamp(236px, 19vw, 280px); --rw: clamp(320px, 28vw, 420px); --rail: 48px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --canvas: #131a19; --card: #1b2423; --well: #172020; --box: #151d1c;
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a;
  --shadow: 0 8px 26px rgb(0 0 0 / .45); --scrim: rgb(0 0 0 / .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --canvas: #131a19; --card: #1b2423; --well: #172020; --box: #151d1c;
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a;
  --shadow: 0 8px 26px rgb(0 0 0 / .45); --scrim: rgb(0 0 0 / .5); color-scheme: dark }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 6px; }
a { color: var(--route); }
[hidden] { display: none !important; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* The workspace */
.app { display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); grid-template-rows: auto minmax(0, 1fr);
  height: 100vh; height: 100dvh; transition: grid-template-columns .3s var(--ease); }
.app.lc { --lw: var(--rail); } .app.rc { --rw: var(--rail); }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px 20px; justify-content: space-between; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); min-width: 0; }
.top .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -.005em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.done { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.done b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { width: 88px; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--route); }
.ib { width: 32px; height: 32px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.ib:hover { color: var(--route); background: var(--soft); }
.menu { display: none; }

/* Side panels */
.left, .right { min-height: 0; min-width: 0; background: var(--surface); position: relative; display: flex; overflow: hidden; }
.left { border-right: 1px solid var(--line); }
.right { border-left: 1px solid var(--line); }
.rail { width: var(--rail); flex: none; display: none; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; }
.lc .left .rail, .rc .right .rail { display: flex; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; transition: opacity .2s var(--ease); }
.lc .left .pane, .rc .right .pane { display: none; }
.phead { display: flex; align-items: center; gap: 8px; padding: 10px 10px 6px 16px; }
.phead .lbl { flex: 1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.scroll { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.left .scroll { padding: 0 12px 24px 16px; display: flex; flex-direction: column; gap: 18px; }
.sec { display: flex; flex-direction: column; gap: 6px; }
h3 { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; }
.sec > h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sec > h3 button { text-transform: none; letter-spacing: 0; font-size: 12.5px; color: var(--route); }
.note { color: var(--muted); font-size: 12.5px; margin: 0; line-height: 1.45; }

/* Search */
.find { position: relative; }
.find input { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px 6px 32px; -webkit-appearance: none; appearance: none; }
.find input::placeholder { color: var(--muted); }
.find input::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.find input:focus { outline: 2px solid var(--route); outline-offset: 1px; }
.find > svg { position: absolute; left: 10px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none; }
.hits { display: flex; flex-direction: column; gap: 1px; margin-top: 4px; }
.hits button { display: grid; grid-template-columns: 8px minmax(0, 1fr); column-gap: 9px; align-items: baseline; width: 100%; padding: 5px 8px; border-radius: 6px; font-size: 13.5px; }
.hits button .pip { align-self: center; }
.hits button small { grid-column: 2; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hits button.on, .hits button:hover { background: var(--soft); }
.hits p { margin: 0; padding: 4px 8px; color: var(--muted); font-size: 13px; }

/* The layer tree */
.tree { display: flex; flex-direction: column; gap: 1px; }
.tr { display: flex; align-items: center; gap: 2px; border-radius: 6px; padding-left: calc(var(--d, 0) * 14px); }
.tr:hover { background: var(--soft); }
.tr.on { background: var(--route-soft); }
.tr.on .tn { color: var(--ink); font-weight: 500; }
.tr .cv { width: 20px; height: 26px; display: grid; place-items: center; color: var(--muted); flex: none; }
.tr .cv svg { width: 12px; height: 12px; transition: transform .25s var(--ease); }
.tr .cv[aria-expanded="true"] svg { transform: rotate(90deg); }
.tr .cv.none { visibility: hidden; pointer-events: none; }
.tn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; padding: 4px 2px; font-size: 13.5px; color: var(--muted); }
.tn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tn:hover { color: var(--ink); }
.tn small { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.tm { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); opacity: 0; flex: none; }
.tr:hover .tm, .tm:focus-visible, .tr.on .tm { opacity: 1; }
.tm:hover { color: var(--route); background: var(--surface); }
.tm svg { width: 14px; height: 14px; }
.tsep { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 0 2px 22px; }
@media (pointer: coarse) { .tm { opacity: 1; } }

/* Filters */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 13px; background: var(--surface); color: var(--ink); }
.chip:hover { border-color: var(--route); }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; }
.chip[aria-pressed="false"] .pip, .chip[aria-pressed="false"] .ln { opacity: .35; }
.ln { display: inline-block; width: 16px; height: 0; border-top: 1.5px solid var(--muted); }
.ln.r { border-color: var(--route); } .ln.d { border-top-style: dashed; }

/* Walks */
.walks { display: flex; flex-direction: column; gap: 1px; }
.walks .wg { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 8px 8px 2px; }
.wr { display: flex; align-items: center; border-radius: 6px; }
.wr:hover { background: var(--soft); }
.wr.on { background: var(--route-soft); }
.wr .wn { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; padding: 5px 8px; font-size: 13.5px; }
.wr .wn small { margin-left: auto; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.wr .tm { opacity: 1; }

.pip { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--todo); flex: none; }
.pip.b { background: var(--built); } .pip.p { background: var(--part); } .pip.t { background: none; box-shadow: inset 0 0 0 1.5px var(--todo); } .pip.x { background: var(--line); }

/* The middle */
.mid { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 16px; }
.mbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; }
.mcr { flex: 1 1 240px; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13.5px; color: var(--muted); }
.mcr button { color: var(--route); padding: 2px; }
.mcr button:hover { text-decoration: underline; }
.mcr b { color: var(--ink); font-weight: 600; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--route); color: var(--route); border-radius: 8px; padding: 3px 10px 3px 8px; font-size: 13px; font-weight: 500; }
.back:hover { background: var(--route); color: var(--on-route); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); }
.seg button { padding: 3px 12px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--route); color: var(--on-route); }
.seg button:not([aria-pressed="true"]):hover { color: var(--ink); }
.seg button[disabled] { opacity: .45; cursor: default; }
.gtools { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); padding: 2px; }
.gtools button { width: 30px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
.gtools button:hover { color: var(--route); background: var(--soft); }
.graph { position: relative; flex: 1; min-height: 0; background: var(--canvas); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
#gsvg { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; font-family: var(--body); }
.graph.pan #gsvg { cursor: grab; } .graph.pan #gsvg:active { cursor: grabbing; }
.gmsg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); margin: 0; }
.gtip { position: absolute; z-index: 4; pointer-events: none; width: max-content; max-width: 300px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.gtip b { font-weight: 600; font-size: 14px; }
.gtip small { color: var(--muted); font-size: 12px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.state { display: inline-flex; align-items: center; gap: 7px; }
.where { font-family: var(--mono); font-size: 12.5px; }

/* A walk, over the graph */
.walk { position: absolute; z-index: 3; left: 12px; bottom: 12px; width: min(440px, calc(100% - 24px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: inset 3px 0 0 var(--route), var(--shadow); }
.walk .cap { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--route); font-weight: 600; font-variant-numeric: tabular-nums; }
.walk p { margin: 0; font-size: 14px; line-height: 1.5; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.act { border: 1px solid var(--route); color: var(--route); border-radius: 6px; padding: 3px 12px; font-size: 13px; font-weight: 500; }
.act:hover { background: var(--route); color: var(--on-route); }
.act[disabled] { opacity: .4; cursor: default; pointer-events: none; }
.act.quiet { border-color: transparent; color: var(--muted); }
.act.quiet:hover { background: none; color: var(--ink); }

/* Inside the Module Map */
.bx .bb { fill: var(--box); stroke: var(--line); stroke-width: 1; }
.bx.k-open .bb { fill: var(--well); }
.bx.k-scope .bb, .bx.k-map .bb { fill: var(--box); }
.bx.later .bb { stroke-dasharray: 5 4; fill: none; }
.bx .e { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); font-variant-numeric: tabular-nums; }
.bx .n { font-size: 14px; font-weight: 600; fill: var(--ink); transition: fill .2s; }
.bx .s { font-size: 12px; fill: var(--muted); }
.bx.hd { cursor: pointer; outline: none; }
.bx.hd:hover .n, .bx.sel .n, .bx.hd:focus-visible .n { fill: var(--route); }
.bx.sel .bb { stroke: var(--route); }
.div text { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); }
.div line { stroke: var(--line); stroke-dasharray: 2 4; }
.lcap { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; fill: var(--muted); }
.gl { fill: none; stroke: var(--muted); stroke-width: 1.1; opacity: .3; transition: opacity .2s, stroke .2s, stroke-width .2s; }
.gl.k-path { stroke: var(--route); opacity: .4; }
.gl.k-store { stroke-dasharray: 4 3; }
.gl.quiet { opacity: 0; }
.ga { fill: none; stroke: var(--muted); stroke-width: 1.4; opacity: .42; transition: opacity .2s, stroke .2s; }
.ga.k-path { stroke: var(--route); opacity: .55; }
.ga.k-store { stroke-dasharray: 4 3; }
.gab rect { fill: var(--surface); stroke: var(--line); }
.gab text { font-size: 10.5px; fill: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.gab { transition: opacity .2s; pointer-events: none; }
.mk-r { fill: var(--route); } .mk-m { fill: var(--muted); }
.dim .gl { opacity: .05; }
.dim .gl.quiet:not(.lit) { opacity: 0; }
.dim .gl.lit { opacity: 1; stroke: var(--route); stroke-width: 1.6; }
.dim .ga, .dim .gab { opacity: .07; }
.gh { fill: none; stroke: transparent; stroke-width: 9; pointer-events: stroke; }
.gh.quiet { pointer-events: none; }
.dim .gh.quiet.lit { pointer-events: stroke; }
#gsvg .gl.hl, #gsvg .ga.hl { opacity: 1; stroke: var(--route); stroke-width: 2; }
#gsvg .gl.off, #gsvg .ga.off { opacity: .04 !important; }
#gsvg .gh.off { pointer-events: none; }
.gc { cursor: pointer; outline: none; transition: opacity .25s; }
.gc .cb { fill: var(--card); stroke: var(--line); stroke-width: 1; transition: stroke .2s, fill .2s; }
.gc .cn { font-size: 13px; fill: var(--ink); pointer-events: none; }
.gc .cs { font-size: 12px; fill: var(--muted); pointer-events: none; }
.gc .ct { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; }
.gc .ce { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; fill: var(--route); pointer-events: none; font-weight: 600; }
.gc .chev { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s var(--ease); }
.gc .tg { fill: transparent; }
.gc .tgw:hover .chev { stroke: var(--route); }
.gc .plug { fill: var(--line); }
.gc:hover .cb, .gc:focus-visible .cb { stroke: var(--route); }
.gc.k-head .cb { fill: transparent; stroke: none; }
.gc.k-head .cn { font-weight: 600; font-size: 13.5px; }
.gc.k-head:hover .cn { fill: var(--route); }
.gc.k-seam .cb { fill: var(--route-soft); stroke: none; }
.gc.k-seam .cn { font-weight: 600; font-size: 14px; }
.gc .rule { stroke: var(--route); stroke-width: 2; opacity: .55; }
.gc.k-port .cb { stroke: var(--route); stroke-opacity: .45; }
.gc.sel .cb { stroke: var(--route); stroke-width: 1.5; fill: var(--route-soft); }
.gc.k-head.sel .cb { fill: var(--route-soft); }
.gc.k-seam.sel .cb { fill: var(--route-soft); stroke: var(--route); }
.gc .nb circle { fill: var(--route); } .gc .nb text { fill: var(--on-route); font-size: 10.5px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
.dim .gc { opacity: .38; }
.dim .gc.lit { opacity: 1; }
.dim .gc.lit .cb { stroke: var(--route); }
.dim .gc.lit .cn { font-weight: 500; }
.walking .gc.lit .cb { fill: var(--route-soft); }
#gsvg .gc.off { opacity: .16; }
.sd { stroke-width: 0; }
.s-b { fill: var(--built); } .s-p { fill: var(--part); } .s-t { fill: none; stroke: var(--todo); stroke-width: 1.4; } .s-x { fill: var(--todo); opacity: .55; }

/* The reading panel */
.right .scroll { padding: 4px 20px 28px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13px; color: var(--muted); padding: 2px 0 10px; }
.crumbs button { color: var(--route); padding: 1px 2px; }
.crumbs button:hover { text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 500; }
.sheet { display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
h2 { font-size: 1.3rem; font-weight: 600; letter-spacing: -.01em; margin: 0; text-wrap: balance; line-height: 1.3; }
.sheet p { margin: 0; text-wrap: pretty; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.hand { color: var(--muted); font-size: 14px; }
.hand button, .lk { color: var(--route); font-weight: 500; }
.hand button:hover, .lk:hover { text-decoration: underline; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; padding: 8px 4px; border-bottom: 1px solid var(--line); width: 100%; }
.row:hover { background: var(--soft); }
.row .pip { align-self: center; }
.row b { font-weight: 500; }
.row small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; font-weight: 400; }
.row .more { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .more i { font-style: normal; color: var(--route); margin-left: 6px; }
.group { display: flex; flex-direction: column; gap: 6px; }
details { border-top: 1px solid var(--line); }
details:last-child { border-bottom: 1px solid var(--line); }
details + details { margin-top: -12px; }
summary { list-style: none; cursor: pointer; padding: 10px 2px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
summary h3 { font-size: 11.5px; }
summary::-webkit-details-marker { display: none; }
summary span { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
summary span::after { content: " +"; color: var(--route); font-weight: 600; }
details[open] summary span::after { content: " \2212"; }
summary:hover h3 { color: var(--route); }
.fold { padding: 0 2px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
.fold ul, .fold ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.fold li small { display: block; margin-top: 2px; color: var(--muted); }
.fold li small button, .flow button { color: var(--route); font-size: 13px; }
.fold li small button:hover, .flow button:hover { text-decoration: underline; }
.flow { list-style: none; padding: 0 !important; }
.flow li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
.flow li > span { color: var(--muted); font-size: 12px; }
.flow .kd { color: var(--muted); font-size: 12px; }
.hint { color: var(--muted); margin: 0; font-size: 13.5px; }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.close { display: none; }
.scrim { display: none; }
.grab { display: none; }

/* Narrow: the left panel is a drawer, the right panel a sheet from the bottom. */
@media (max-width: 999px) {
  .app { display: block; height: auto; }
  .menu { display: inline-grid; }
  .top { position: sticky; top: 0; z-index: 20; }
  .rail, .lc .left .rail, .rc .right .rail { display: none; }
  .lc .left .pane, .rc .right .pane { display: flex; }
  .left .phead .fold-l, .right .phead .fold-r { display: none; }
  .close { display: inline-grid; }
  .left { position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(330px, 88vw); transform: translateX(-102%); transition: transform .3s var(--ease); box-shadow: var(--shadow); }
  .app.drawer .left { transform: none; }
  .right { position: fixed; z-index: 35; left: 0; right: 0; bottom: 0; max-height: 78vh; max-height: 78dvh; height: 78dvh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; transform: translateY(102%); transition: transform .3s var(--ease); box-shadow: var(--shadow); }
  .app.sheet .right { transform: none; }
  .right .scroll { padding: 4px 16px 32px; }
  .grab { display: block; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  .right .phead { padding-top: 14px; }
  .scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s var(--ease); display: block; }
  .app.drawer .scrim { opacity: 1; pointer-events: auto; }
  .mid { padding: 12px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
  .graph { flex: none; height: clamp(420px, calc(100dvh - 150px), 900px); }
  .graph.flow-y { height: auto; overflow: clip; }
  .graph.flow-y .walk { position: sticky; left: auto; bottom: 12px; width: auto; margin: 0 10px 10px; }
}
@media (max-width: 520px) { .done .bar, .done span:last-child { display: none; } .mcr { flex-basis: 100%; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }

<div class="app" id="app">
  <header class="top">
    <div class="ttl"><button type="button" class="ib menu" id="menu" aria-label="Open the menu" aria-controls="left"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1>Anything2MCP, as designed</h1></div>

      <div class="gtools" id="gtools" role="group" aria-label="Zoom">

    <div class="pane">
      <span class="grab" aria-hidden="true"></span>
      <div class="phead"><span class="lbl">Reading</span>
        <button type="button" class="ib fold-r" id="foldR" aria-label="Fold the reading panel to a rail" title="Fold the reading panel"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
        <button type="button" class="ib close" id="closeR" aria-label="Close the reading panel"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="scroll" id="reader"></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
</div>
<script>
(function(){
  var A=/*DATA*/null/*END*/, N=A.nodes, O=A.outline, S={}, ORDER=O.stations.concat(O.shelves), ROOT=A.root, REC=A.records||{};
  var GH='https://github.com/MHughesDev/web2mcp/blob/main/docs/decisions/';
  ORDER.forEach(function(s){ S[s.id]=s; });
  var LABEL={b:'Built',p:'Partly built',t:'Not built',x:'Outside the product'}, KIND={path:'Route of a call',use:'Uses',store:'Stores'};
  function h(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
  function btn(cls,text,fn){ var b=h('button',cls,text); b.type='button'; if(fn) b.addEventListener('click',fn); return b; }
  function svgI(d){ var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('class','i'); s.setAttribute('aria-hidden','true'); s.innerHTML=d; return s; }
  var I_MAP='<circle cx="5" cy="12" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="19" cy="18" r="2"/><path d="M7 12h4l6-6M11 12l6 6"/>', I_CHEV='<path d="M9 6l6 6-6 6"/>', I_BACK='<path d="M15 6l-6 6 6 6"/>';
  function first(text){ var m=/^(.*?[.!?])(\s|$)/.exec(text||''); return m?m[1]:(text||''); }
  function store(k,v){ try{ if(v==null) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }

  // ---- The model: one tree of parts, from the outline and the views ----
  function groupsOf(id){
    if(S[id]) return S[id].groups;
    var out=[]; (N[id].rows||[]).forEach(function(r){ r.cols.forEach(function(c){ var t=c.title||r.title||'', ids=c.ids.filter(function(i){return N[i];});
      if(out.length&&out[out.length-1].title===t) out[out.length-1].ids=out[out.length-1].ids.concat(ids); else out.push({title:t,ids:ids}); }); });
    return out;
  }
  // The sections of a container: each row of its view, holding its columns as groups.
  function structOf(id){
    if(S[id]) return [{title:'',groups:S[id].groups.map(function(g){ return {title:g.title||'',ids:g.ids.slice()}; })}];
    return (N[id].rows||[]).map(function(r){ var gs=[]; r.cols.forEach(function(c){ var t=c.title||'', ids=c.ids.filter(function(i){ return N[i]; });
      if(gs.length&&gs[gs.length-1].title===t) gs[gs.length-1].ids=gs[gs.length-1].ids.concat(ids); else gs.push({title:t,ids:ids}); });
      return {title:r.title||'',groups:gs}; });
  }
  function kids(id){ if(id===ROOT) return ORDER.map(function(s){ return s.id; }); return [].concat.apply([],groupsOf(id).map(function(g){return g.ids;})); }
  var parent={};
  ORDER.forEach(function(s){ kids(s.id).forEach(function(c){ parent[c]=s.id; }); });
  Object.keys(N).forEach(function(id){ if(id===ROOT) return; kids(id).forEach(function(c){ if(!(c in parent)) parent[c]=id; }); });
  function valid(id){ return !!(S[id]||(N[id]&&id!==ROOT&&parent[id])); }
  function pathTo(id){ var p=[]; while(id&&id!==ROOT){ p.unshift(id); id=parent[id]; } return p; }
  function nameOf(id){ return id===ROOT?'Whole system':(S[id]||N[id]).name; }
  function viewOf(id){ var p=parent[id]; return S[p]?N[ROOT]:N[p]; }
  function viewIdOf(id){ var p=parent[id]; return S[p]?ROOT:p; }
  function isScope(id){ return id===ROOT||!!S[id]||!!(N[id]&&N[id].rows&&parent[id]); }
  function stateOf(id){ return S[id]?'':(N[id].state||'x'); }
  function count(ids){ var ours=ids.filter(function(i){ return N[i]&&N[i].state!=='x'; }), b=ours.filter(function(i){ return N[i].state==='b'; }).length;
    return ours.length?b+' of '+ours.length+' built':'Outside the product'; }
  // The seam: the part of the root view that is the one interface between kernel and packs, and its extension points.
  var SEAM=O.seam||null, SEAMAT=null, PORTS=[];
  ORDER.forEach(function(s,i){ s.groups.forEach(function(g){ if(g.ids.indexOf(SEAM)>=0) SEAMAT=i; }); });
  if(SEAMAT==null||!N[SEAM]) SEAM=null;
  else { var er=(N[SEAM].rows||[]).filter(function(r){ return /extension/i.test(r.title||''); })[0]; PORTS=er?[].concat.apply([],er.cols.map(function(c){ return c.ids; })):[]; }
  // Every walk, with the view it belongs to.
  var WALKS=[];
  [ROOT].concat(Object.keys(N).filter(function(k){ return k!==ROOT; })).forEach(function(v){ (N[v].walks||[]).forEach(function(w,i){ WALKS.push({key:v+':'+i,view:v,name:w.name,steps:w.steps}); }); });
  function walkBy(key){ return WALKS.filter(function(w){ return w.key===key; })[0]; }

  var cur='', scope=ROOT, mode='structure', walk=null, at=0, OFFS={}, OFFK={};
  var app=document.getElementById('app');
  var wide=function(){ return window.matchMedia('(min-width: 1000px)').matches; };
  document.getElementById('pct').textContent=A.percent!=null?A.percent+'% built':'';
  document.getElementById('prog').textContent=A.progress||'';
  document.getElementById('pctbar').style.width=(A.percent||0)+'%';
  function pip(state){ var i=h('i','pip '+(state||'x')); i.setAttribute('aria-hidden','true'); return i; }

  // ---- Panels: fold to a rail on a wide screen; a drawer and a sheet on a narrow one ----
  function setFold(side,folded){ app.classList.toggle(side==='l'?'lc':'rc',folded); store('a2m-fold-'+side,folded?'1':'0'); }
  if(store('a2m-fold-l')==='1') app.classList.add('lc');
  if(store('a2m-fold-r')==='1') app.classList.add('rc');
  function drawer(open){ app.classList.toggle('drawer',open); if(open){ var f=document.querySelector('#left .phead .close'); if(f) f.focus(); } }
  function sheetOpen(open){ app.classList.toggle('sheet',open); }
  document.getElementById('foldL').onclick=function(){ setFold('l',true); };
  document.getElementById('foldR').onclick=function(){ setFold('r',true); };
  document.getElementById('openR').onclick=document.getElementById('openR2').onclick=function(){ setFold('r',false); };
  document.getElementById('menu').onclick=function(){ drawer(true); };
  document.getElementById('closeL').onclick=function(){ drawer(false); };
  document.getElementById('closeR').onclick=function(){ sheetOpen(false); };
  document.getElementById('scrim').onclick=function(){ drawer(false); };
  [].forEach.call(document.querySelectorAll('.left .rail [data-open]'),function(b){ b.onclick=function(){ setFold('l',false); var s=b.getAttribute('data-open');
    if(s) requestAnimationFrame(function(){ var el=document.getElementById('s-'+s); if(el) el.scrollIntoView({block:'start'}); if(s==='find') document.getElementById('q').focus(); }); }; });

  // ---- The route: the hash names the chosen part ----
  function go(id){ var want=valid(id)?id:''; if(location.hash.slice(1)===want){ show(want); return; }
    if(want) location.hash=want; else { try{ history.pushState(null,'',location.pathname+location.search); }catch(e){ location.hash=''; } show(''); } }
  function show(id){
    cur=valid(id)?id:''; drawReader(); drawTree();
    if(cur&&!wide()) sheetOpen(true);
    if(G) G.select();
  }
  function choose(id){ if(wide()) setFold('r',false); drawer(false); go(id); }

  // ---- Left: layers ----
  var treeOpen={};
  function scopeKids(id){ return kids(id).filter(function(k){ return N[k]&&N[k].rows; }); }
  function drawTree(){
    var T=document.getElementById('tree'); T.textContent='';
    pathTo(scope).forEach(function(p){ treeOpen[p]=true; });
    function row(id,d){
      var sub=id===ROOT?[]:scopeKids(id), r=h('div','tr'+(scope===id?' on':'')); r.style.setProperty('--d',d); r.setAttribute('role','treeitem');
      var cv=btn('cv'+(sub.length?'':' none'),null,function(){ treeOpen[id]=!treeOpen[id]; drawTree(); }); cv.appendChild(svgI(I_CHEV));
      cv.setAttribute('aria-label',(treeOpen[id]?'Fold ':'Unfold ')+nameOf(id)); cv.setAttribute('aria-expanded',treeOpen[id]?'true':'false'); r.appendChild(cv);
      var n=btn('tn',null,function(){ drawer(false); setScope(id,'structure'); }); n.appendChild(h('span','',nameOf(id)));
      if(id!==ROOT) n.appendChild(h('small','',String(kids(id).length)));
      n.setAttribute('aria-current',scope===id&&mode==='structure'?'true':'false'); r.appendChild(n);
      if(id!==ROOT){ var m=btn('tm',null,function(){ drawer(false); setScope(id,'map'); }); m.appendChild(svgI(I_MAP)); m.setAttribute('aria-label','Open '+nameOf(id)+' alone, as a process map'); m.title='Open alone, as a process map'; r.appendChild(m); }
      T.appendChild(r);
      if(sub.length&&treeOpen[id]) sub.forEach(function(k){ row(k,d+1); });
    }
    row(ROOT,0);
    O.stations.forEach(function(s){ row(s.id,0); });
    T.appendChild(h('div','tsep','Beneath the line'));
    O.shelves.forEach(function(s){ row(s.id,0); });
  }
  // ---- Left: filters ----
  function drawFilters(){
    var fs=document.getElementById('fstate'), fk=document.getElementById('fkind'); fs.textContent=''; fk.textContent='';
    ['b','p','t','x'].forEach(function(s){ var c=btn('chip',null,function(){ OFFS[s]=!OFFS[s]; drawFilters(); if(G) G.focus(); }); c.appendChild(pip(s)); c.appendChild(document.createTextNode(LABEL[s])); c.setAttribute('aria-pressed',OFFS[s]?'false':'true'); fs.appendChild(c); });
    [['path','r'],['use',''],['store','d']].forEach(function(k){ var c=btn('chip',null,function(){ OFFK[k[0]]=!OFFK[k[0]]; drawFilters(); if(G) G.focus(); }); var l=h('i','ln '+k[1]); c.appendChild(l); c.appendChild(document.createTextNode(KIND[k[0]])); c.setAttribute('aria-pressed',OFFK[k[0]]?'false':'true'); fk.appendChild(c); });
    var any=Object.keys(OFFS).some(function(k){ return OFFS[k]; })||Object.keys(OFFK).some(function(k){ return OFFK[k]; }), all=document.getElementById('fall');
    all.hidden=!any; all.onclick=function(){ OFFS={}; OFFK={}; drawFilters(); if(G) G.focus(); };
  }
  // ---- Left: walks ----
  function drawWalks(){
    var W=document.getElementById('walks'); W.textContent=''; var last=null;
    WALKS.forEach(function(w){ if(w.view!==last){ last=w.view; W.appendChild(h('div','wg',w.view===ROOT?'Through the whole system':'In '+nameOf(w.view))); }
      var r=h('div','wr'+(walk&&walk.key===w.key?' on':'')), n=btn('wn',null,function(){ drawer(false); startWalk(w.key,0); });
      n.appendChild(h('span','',w.name)); n.appendChild(h('small','',w.steps.length+' steps')); r.appendChild(n);
      var m=btn('tm',null,function(){ drawer(false); setScope('walk:'+w.key,'map'); startWalk(w.key,0,true); }); m.appendChild(svgI(I_MAP)); m.title='Open as a numbered process map'; m.setAttribute('aria-label','Open '+w.name+' as a numbered process map'); r.appendChild(m);
      W.appendChild(r); });
  }
  function startWalk(key,step,keepScope){
    var w=walkBy(key); if(!w) return; walk=w; at=step||0; drawWalks(); drawWalk();
    if(G) G.walkStart(keepScope);
  }
  function endWalk(){ walk=null; drawWalks(); drawWalk(); }
  function drawWalk(){
    var P=document.getElementById('walk'); P.textContent=''; P.hidden=!walk; if(!walk){ if(G) G.focus(); return; }
    var s=walk.steps[at];
    P.appendChild(h('div','cap',walk.name+' · step '+(at+1)+' of '+walk.steps.length));
    P.appendChild(h('p','',s.text));
    var nav=h('div','nav'), back=btn('act','Back',function(){ at--; drawWalk(); }), next=btn('act','Next',function(){ at++; drawWalk(); });
    back.disabled=at===0; next.disabled=at===walk.steps.length-1; nav.appendChild(back); nav.appendChild(next);
    nav.appendChild(btn('act quiet','End the walk',endWalk)); P.appendChild(nav);
    if(G) G.walkStep();
  }

  // ---- Right: the reading panel, one renderer for every part ----
  function rows(ids,withText){
    var box=h('div','rows');
    ids.forEach(function(i){ var n=N[i], r=btn('row',null,function(){ choose(i); }); r.appendChild(pip(n.state));
      var mid=h('span',''); mid.appendChild(h('b','',n.name)); if(withText) mid.appendChild(h('small','',first(n.text))); r.appendChild(mid);
      var k=kids(i).length, more=h('span','more'); if(k) more.appendChild(document.createTextNode(k+' inside')); more.appendChild(h('i','','›')); r.appendChild(more);
      r.setAttribute('aria-label',n.name+', '+(LABEL[n.state]||'')+(k?', '+k+' parts inside':'')); box.appendChild(r); });
    return box;
  }
  function inside(id,withText){ var f=document.createDocumentFragment();
    groupsOf(id).forEach(function(g){ if(!g.ids.length) return; var d=h('div','group'); if(g.title) d.appendChild(h('h3','',g.title)); d.appendChild(rows(g.ids,withText)); f.appendChild(d); });
    return f; }
  function fold(title,countText,open,build){ var d=h('details',''), s=h('summary',''); s.appendChild(h('h3','',title)); s.appendChild(h('span','',countText)); d.appendChild(s); if(open) d.open=true;
    var body=h('div','fold'); build(body); d.appendChild(body); return d; }
  function withRecords(text){ var f=document.createDocumentFragment(), re=/\b(0\d{3})\b/g, last=0, m;
    while((m=re.exec(text))){ if(!REC[m[1]]) continue; f.appendChild(document.createTextNode(text.slice(last,m.index)));
      var a=h('a','',m[1]); a.href=GH+REC[m[1]]; a.target='_blank'; a.rel='noopener'; a.title='Decision record '+m[1]+' on GitHub'; f.appendChild(a); last=m.index+m[0].length; }
    f.appendChild(document.createTextNode(text.slice(last))); return f; }
  function plainList(items,rec){ var ul=h('ul',''); items.forEach(function(t){ var li=h('li',''); if(rec) li.appendChild(withRecords(t)); else li.textContent=t; ul.appendChild(li); }); return ul; }
  function stepList(steps,walkKey){ var ol=h('ol',''); steps.forEach(function(s,k){ var li=h('li','',s.text);
      if((s.at||[]).length){ var sm=h('small',''); s.at.forEach(function(i,j){ if(j) sm.appendChild(document.createTextNode(' · ')); sm.appendChild(btn('',N[i].name,function(){ choose(i); })); }); li.appendChild(sm); }
      ol.appendChild(li); }); return ol; }
  // Every walk and every step list, in any view, that names this part.
  function takesPart(id){ var out=[];

      aggSel=gAgg.selectAll('path').data(AGG,function(g){ return g.key; }).join(function(en){ af=en.append('path').attr('d',aggPath).style('opacity',0)
          .on('pointerenter',function(ev,g){ if(ev.pointerType!=='mouse') return; d3.select(this).classed('hl',true); aggTip(ev,g); })

          .on('pointerleave',function(){ d3.select(this).classed('hl',false); tip.hidden=true; }); return af; }, function(up){ return up; }, function(ex){ return ex.remove(); })
        .attr('class',function(g){ return 'ga k-'+g.kind; }).attr('marker-end',function(g){ return 'url(#gm-'+(g.kind==='path'?'r':'m')+')'; }).style('pointer-events','stroke').style('stroke-width',function(g){ return (1.2+Math.min(1.4,Math.log2(g.n)*.35)).toFixed(2); });
      if(af) (T.move?af.transition('fade').duration(T.enter).delay(T.edelay+T.enter/2):af).style('opacity',null);
      (T.move?aggSel.transition().duration(T.move).delay(T.delay).ease(EASE):aggSel).attr('d',aggPath);
      var bd=gBadge.selectAll('g.gab').data(AGG.filter(function(g){ return g.n>1; }),function(g){ return g.key; }).join(function(en){ var g=en.append('g').attr('class','gab').style('opacity',0); g.append('rect').attr('rx',7).attr('height',14).attr('y',-7); g.append('text').attr('dy','.35em').attr('text-anchor','middle'); return g; },
        function(up){ return up; }, function(ex){ return ex.remove(); });
      bd.select('text').text(function(g){ return g.n; }); bd.select('rect').attr('width',function(g){ return String(g.n).length*7+9; }).attr('x',function(g){ return -(String(g.n).length*7+9)/2; });
      (T.move?bd.transition().duration(T.move).delay(T.delay).ease(EASE):bd).style('opacity',null).attr('transform',function(g){ return 'translate('+g.mx+','+g.my+')'; });
    }
    function update(kind,keepView){
      T=timing(kind);
      var from={}; Object.keys(P).forEach(function(k){ from[k]={x:P[k].x,y:P[k].y}; });
      layout(); relink(); sizeBox();
      box.classList.toggle('pan',!tall); box.classList.toggle('flow-y',tall);
      drawBoxes(from); drawCards(from); drawLinks(); focus(); bindZoom();
      if(!tall&&!keepView) svg.call(zoom.transform,cons(kind==='scope'?fitT():d3.zoomTransform(svgEl)));
    }
    function sizeBox(){ if(tall){ svgEl.style.height=Math.ceil(ch)+'px'; H=ch; } else { svgEl.style.height=''; H=box.clientHeight; } }
    function fitT(){ var k=Math.max(mode==='map'?.85:.5,Math.min(1,W/cw)); return d3.zoomIdentity.translate(0,0).scale(k); }

    function events(sel){
      sel.on('pointerenter',function(ev,d){ if(ev.pointerType!=='mouse') return; hoverId=d.id; focus(); lastEv=ev; clearTimeout(tipT); tipT=setTimeout(function(){ if(hoverId===d.id) showTip(lastEv,d.id); },420); })
        .on('pointermove',function(ev){ if(ev.pointerType!=='mouse') return; lastEv=ev; if(!tip.hidden) placeTip(ev); })
        .on('pointerleave',function(){ clearTimeout(tipT); hoverId=null; focus(); tip.hidden=true; })
        .on('click',function(ev,d){ if(ev.defaultPrevented) return; clearTimeout(clickT); clearTimeout(tipT); tip.hidden=true; var id=d.id; clickT=setTimeout(function(){ tip.hidden=true; choose(id); },(coarse||!d.kids||mode!=='structure')?0:220); })
        .on('dblclick',function(ev,d){ ev.preventDefault(); ev.stopPropagation(); clearTimeout(clickT); toggle(d.id); })
        .on('keydown',function(ev,d){ if(ev.key==='Enter'){ ev.preventDefault(); choose(d.id); } else if(ev.key==='+'||ev.key==='-'||ev.key===' '){ ev.preventDefault(); toggle(d.id); } })
        .on('focus',function(ev,d){ hoverId=d.id; focus(); }).on('blur',function(){ hoverId=null; focus(); });
    }
    function showTip(ev,id){
      tip.textContent=''; var st=S[id], n=st||N[id];
      tip.appendChild(h('b','',n.name));
      var m=h('div','meta');
      if(!st){ var sp=h('span','state'); sp.appendChild(pip(N[id].state)); sp.appendChild(document.createTextNode(LABEL[N[id].state]||'')); m.appendChild(sp); if(n.where) m.appendChild(h('span','where',n.where)); }
      else m.textContent=st.short+' · '+count(kids(id));
      tip.appendChild(m); tip.appendChild(h('div','',first(n.text)));
      var k=kids(id).length, d=P[id], deg=links.filter(function(L){ return L.source===id||L.target===id; }).length;
      tip.appendChild(h('small','',[!st&&k&&mode==='structure'&&d&&d.kind!=='seam'&&d.kind!=='port'?(k+' parts inside · '+(d.open?'double-click to close':'double-click to open in place')):(k?k+' parts inside':''),deg?(deg+(deg===1?' link':' links')):'','click to read'].filter(Boolean).join(' · ')));
      tip.hidden=false; placeTip(ev);
    }
    function linkTip(ev,L){ clearTimeout(tipT); tip.textContent='';
      tip.appendChild(h('b','',N[L.source].name+' → '+N[L.target].name));
      if(L.texts.length) tip.appendChild(h('div','',L.texts.slice(0,3).join('; ')+(L.texts.length>3?'; and '+(L.texts.length-3)+' more':'')));
      tip.appendChild(h('small','',KIND[L.kind]+(L.n>1?' · '+L.n+' arrows':'')));
      tip.hidden=false; placeTip(ev); }
    function aggTip(ev,g){ clearTimeout(tipT); tip.textContent='';
      function nm(t){ return t==='seam'?N[SEAM].name:S[t].name; }
      tip.appendChild(h('b','',nm(g.a)+' → '+nm(g.b)));
      tip.appendChild(h('div','',g.texts.slice(0,3).join('; ')+(g.texts.length>3?'; and '+(g.texts.length-3)+' more':'')));
      tip.appendChild(h('small','',g.n+(g.n===1?' arrow':' arrows')+' · strongest: '+KIND[g.kind].toLowerCase()+' · choose a module to see each one'));
      tip.hidden=false; placeTip(ev); }
    function placeTip(ev){ var r=box.getBoundingClientRect(), x=ev.clientX-r.left+14, y=ev.clientY-r.top+16, w=tip.offsetWidth, hh=tip.offsetHeight;
      if(x+w>r.width-8) x=Math.max(8,ev.clientX-r.left-w-14); if(y+hh>r.height-8) y=Math.max(8,ev.clientY-r.top-hh-14); tip.style.left=x+'px'; tip.style.top=y+'px'; }

    // ---- What is lit: the hovered module and its links, else a walk's step, else the chosen part ----
    function walkSet(){
      if(!walk) return null; var s=walk.steps[at], ns=new Set(), ls=new Set(), ids=s.at||[], VE=N[walk.view].edges||[];
      ids.forEach(function(i){ var r=rep(i); if(r) ns.add(r); });
      var pairs=(s.edges&&s.edges.length)?s.edges:VE.filter(function(e){ return ids.indexOf(e[0])>=0&&ids.indexOf(e[1])>=0; });
      pairs.forEach(function(e){ var a=rep(e[0]), b=rep(e[1]); if(!a||!b||a===b) return; if(LM[a+'>'+b]) ls.add(a+'>'+b); else if(LM[b+'>'+a]) ls.add(b+'>'+a); });
      return {n:ns,l:ls,walk:true};
    }
    function around(id){
      var ns=new Set(), ls=new Set(), inner=new Set();
      if(S[id]) Object.keys(P).forEach(function(k){ if(P[k].top===id) inner.add(k); });
      else { inner.add(id); if(P[id]&&P[id].open||P[id]&&P[id].kind==='seam') Object.keys(P).forEach(function(k){ if(pathTo(k).indexOf(id)>=0) inner.add(k); }); }
      inner.forEach(function(k){ ns.add(k); });
      if(P[id]&&P[id].kind==='seam') Object.keys(P).forEach(function(k){ if(P[k].kind==='plug') ns.add(k); });
      if(P[id]&&P[id].kind==='plug'&&SEAM&&P[SEAM]) ns.add(SEAM);
      links.forEach(function(L){ if(inner.has(L.source)||inner.has(L.target)){ ls.add(L.key); ns.add(L.source); ns.add(L.target); } });
      return {n:ns,l:ls};
    }
    function focusSet(){
      if(hoverId&&(P[hoverId]||S[hoverId])) return around(hoverId);
      var w=walkSet(); if(w) return w;
      var c=cur&&(P[cur]||(S[cur]&&scope===ROOT&&mode==='structure'))?cur:null; return c?around(c):null;
    }
    function focus(){
      var F=focusSet(); svg.classed('dim',!!F).classed('walking',!!(F&&F.walk));
      cardSel.classed('lit',function(d){ return !!F&&F.n.has(d.id); }).classed('sel',function(d){ return d.id===cur; })
        .classed('off',function(d){ return !!OFFS[N[d.id].state||'x']; });
      linkSel.classed('lit',function(L){ return !!F&&F.l.has(L.key); }).classed('off',function(L){ return !!OFFK[L.kind]; })
        .attr('marker-end',function(L){ return 'url(#gm-'+((F&&F.l.has(L.key))||L.kind==='path'?'r':'m')+')'; });
      hitSel.classed('lit',function(L){ return !!F&&F.l.has(L.key); }).classed('off',function(L){ return !!OFFK[L.kind]; });
      aggSel.classed('off',function(g){ return !!OFFK[g.kind]; });
      boxSel.classed('sel',function(b){ return !!b.id&&b.id===cur&&b.kind!=='open'; });
      if(F) linkSel.filter('.lit').raise();
    }

    // ---- Zoom and pan: plain scrolling moves the drawing; Ctrl or a pinch zooms ----
    function cons(t){ var k=Math.max(.5,Math.min(2.5,t.k)), x=t.x, y=t.y, pad=12, vh=H-cardRoom();
      x=cw*k<=W?(W-cw*k)/2*(mode==='map'?1:0):Math.min(pad,Math.max(W-cw*k-pad,x));
      y=ch*k<=vh?0:Math.min(0,Math.max(vh-ch*k-pad,y));
      return d3.zoomIdentity.translate(x,y).scale(k); }
    function cardRoom(){ var w=document.getElementById('walk'); return (w.hidden||tall)?0:w.offsetHeight+24; }
    var zoom=d3.zoom().scaleExtent([.5,2.5])
      .filter(function(ev){ if(tall) return false; if(ev.type==='wheel') return ev.ctrlKey||ev.metaKey; return !ev.button&&ev.type!=='dblclick'; })
      .constrain(function(t){ return cons(t); })
      .on('zoom',function(ev){ gz.attr('transform',ev.transform); });
    svgEl.addEventListener('wheel',function(ev){ if(tall||ev.ctrlKey||ev.metaKey) return; var t=d3.zoomTransform(svgEl), f=ev.deltaMode===1?16:1;
      svg.call(zoom.translateBy,-ev.deltaX*f/t.k,-ev.deltaY*f/t.k); var u=d3.zoomTransform(svgEl); if(u.x!==t.x||u.y!==t.y) ev.preventDefault(); },{passive:false});
    function bindZoom(){ if(tall){ svg.on('.zoom',null); svgEl.style.touchAction='auto'; svgEl.__zoom=d3.zoomIdentity; gz.attr('transform',null); } else { svg.call(zoom).on('dblclick.zoom',null); }
      ['in','out','fit'].forEach(function(z){ tools.querySelector('[data-z="'+z+'"]').hidden=tall; }); }
    function moveTo(t){ (calm?svg:svg.transition().duration(380).ease(d3.easeCubicInOut)).call(zoom.transform,cons(t)); }
    function bounds(ids,whole){ var b=null; ids.forEach(function(id){ var d=P[id]; if(!d) return; var x1=d.x+d.w, y1=d.y+d.h;
        if(d.open&&whole) B.forEach(function(c){ if(c.id===id&&c.kind==='open') y1=c.y+c.h; });
        if(!b) b={x0:d.x,y0:d.y,x1:x1,y1:y1}; else { b.x0=Math.min(b.x0,d.x); b.y0=Math.min(b.y0,d.y); b.x1=Math.max(b.x1,x1); b.y1=Math.max(b.y1,y1); } }); return b; }
    function inView(b){ var t=d3.zoomTransform(svgEl), vh=H-cardRoom(); return t.applyY(b.y0)>=8&&t.applyY(b.y1)<=vh-8&&t.applyX(b.x0)>=0&&t.applyX(b.x1)<=W; }
    function fly(ids,always,whole){
      var b=bounds(ids,whole); if(!b) return;
      if(tall){ var r=box.getBoundingClientRect(), top=r.top+b.y0, bot=r.top+b.y1, wk=document.getElementById('walk'), room=window.innerHeight-(wk.hidden?0:wk.offsetHeight+24);
        if(always||top<70||bot>room) window.scrollTo({top:Math.max(0,window.scrollY+top-90),behavior:calm?'auto':'smooth'}); return; }
      if(!always&&inView(b)) return;
      var t=d3.zoomTransform(svgEl), k=t.k, vh=H-cardRoom(), bh=b.y1-b.y0+48, bw=b.x1-b.x0+32;
      if(bw*k>W) k=Math.max(.75,Math.min(k,W/bw));
      // Too tall to show whole: keep the zoom and bring its top into view.
      var ty=bh*k>vh?24-k*b.y0:vh/2-k*(b.y0+b.y1)/2;
      moveTo(d3.zoomIdentity.translate(W/2-k*(b.x0+b.x1)/2,ty).scale(k));
    }
    function toggle(id){
      if(!kids(id).length||mode!=='structure'||!P[id]||P[id].kind==='port'||P[id].kind==='seam') return;
      if(open.has(id)){ open.delete(id); Array.from(open).forEach(function(o){ if(pathTo(o).indexOf(id)>=0) open.delete(o); }); }
      else open.add(id);
      tip.hidden=true; update('open',true); fly([id],false,open.has(id)); if(cur===id) drawReader();
    }
    function reveal(id){ var changed=false; var p=pathTo(id), from=scope===ROOT?0:p.indexOf(scope)+1;
      p.slice(from,-1).forEach(function(a){ if(!open.has(a)&&N[a]&&N[a].rows&&a!==SEAM){ open.add(a); changed=true; } }); if(changed) update('open',true); }

    var tools=document.getElementById('gtools');
    tools.querySelector('[data-z="in"]').onclick=function(){ (calm?svg:svg.transition().duration(250).ease(EASE)).call(zoom.scaleBy,1.25); };
    tools.querySelector('[data-z="out"]').onclick=function(){ (calm?svg:svg.transition().duration(250).ease(EASE)).call(zoom.scaleBy,.8); };
    tools.querySelector('[data-z="fit"]').onclick=function(){ moveTo(fitT()); };
    tools.querySelector('[data-z="reset"]').onclick=function(){ open=new Set(); update('open'); moveTo(fitT()); };

    // ---- Find a part: it opens in place and the map moves there ----
    var q=document.getElementById('q'), hits=document.getElementById('hits'), hi=0, found=[];
    var INDEX=ORDER.map(function(s){ return {id:s.id,name:s.name}; }).concat(Object.keys(N).filter(function(id){ return id!==ROOT&&parent[id]; }).map(function(id){ return {id:id,name:N[id].name}; }));
    INDEX.forEach(function(x){ x.low=x.name.toLowerCase(); });
    function context(id){ var p=pathTo(id).slice(0,-1).map(nameOf); return p.length?p.join(' › '):(O.stations.indexOf(S[id])>=0?'On the line':'Beneath the line'); }
    function listHits(){
      var t=q.value.trim().toLowerCase(); hits.textContent=''; if(!t){ hits.hidden=true; found=[]; return; }
      var words=t.split(/\s+/);
      found=INDEX.map(function(x){ if(!words.every(function(w){ return x.low.indexOf(w)>=0; })) return null; var i=x.low.indexOf(words[0]);
          return {x:x,s:x.low===t?-1:i===0?0:(x.low.charAt(i-1)===' '?1:2)}; }).filter(Boolean)
        .sort(function(a,b){ return a.s-b.s||a.x.name.length-b.x.name.length; }).slice(0,8).map(function(r){ return r.x; });
      hi=0; hits.hidden=false;
      if(!found.length){ hits.appendChild(h('p','','No part has that in its name.')); return; }
      found.forEach(function(x,i){ var b=btn(i===hi?'on':'',null,function(){ pick(x.id); }); b.setAttribute('role','option');
        b.appendChild(pip(S[x.id]?'b':N[x.id].state)); if(S[x.id]) b.firstChild.style.visibility='hidden';
        b.appendChild(h('span','',x.name)); b.appendChild(h('small','',context(x.id))); hits.appendChild(b); });
    }
    function pick(id){ hits.hidden=true; q.value=''; choose(id); }
    q.addEventListener('input',listHits);
    q.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!found.length) return; hi=(hi+(e.key==='ArrowDown'?1:found.length-1))%found.length;
        [].forEach.call(hits.children,function(c,i){ c.classList.toggle('on',i===hi); }); }
      else if(e.key==='Enter'){ e.preventDefault(); if(found[hi]) pick(found[hi].id); }
      else if(e.key==='Escape'){ q.value=''; hits.hidden=true; } });

    // ---- Following the rest of the page ----
    function inScope(id){ if(!id) return true; if(mode==='map') return !!P[id]||!!rep(id)&&SUB&&SUB.ids.indexOf(rep(id))>=0; if(scope===ROOT) return true; if(S[scope]) return pathTo(id)[0]===scope&&id!==scope; return pathTo(id).indexOf(scope)>=0&&id!==scope; }
    function select(){
      if(cur&&!inScope(cur)&&!(S[cur]&&scope===ROOT)){ scope=ROOT; mode='structure'; store('a2m-scope',ROOT); store('a2m-mode','structure'); drawBar(); drawTree(); update('scope'); }
      if(cur&&mode==='structure'&&N[cur]) reveal(cur);
      focus();
      if(cur){ if(P[cur]) fly([cur]); else if(S[cur]){ var b=boxOfTop(cur); if(b){ if(tall) window.scrollTo({top:window.scrollY+box.getBoundingClientRect().top+b.y-12,behavior:calm?'auto':'smooth'}); else if(!inView({x0:b.x,y0:b.y,x1:b.x+b.w,y1:b.y+Math.min(b.h,H-40)})) moveTo(d3.zoomIdentity.translate(0,-b.y+8).scale(d3.zoomTransform(svgEl).k)); } } }
    }
    function walkStart(keep){
      if(!keep&&!(mode==='map'&&scope==='walk:'+walk.key)){ var ids=[].concat.apply([],walk.steps.map(function(s){ return s.at||[]; }));
        var allShown=ids.every(function(i){ return P[i]; }); if(!allShown){ scope=walk.view; mode='structure'; drawBar(); drawTree(); update('scope'); } }
      walkStep();
    }
    function walkStep(){ focus(); var F=walkSet(); if(F){ var ids=Array.from(F.n); requestAnimationFrame(function(){ fly(ids); }); } }
    var lastW=0, rT=0;
    function resize(){ var w=box.clientWidth; if(!w||w===lastW){ if(!tall) H=box.clientHeight; return; } lastW=w; clearTimeout(rT); rT=setTimeout(function(){ update(null); svg.call(zoom.transform,cons(fitT())); },60); }
    lastW=box.clientWidth; update(null); svg.call(zoom.transform,cons(fitT()));
    if(window.ResizeObserver) new ResizeObserver(resize).observe(box); else window.addEventListener('resize',resize);
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ update(null,true); });
    if(cur) select();
    return {select:select,focus:focus,toggle:toggle,rescope:function(){ update('scope'); if(cur&&P[cur]) focus(); },walkStart:walkStart,walkStep:walkStep,
      canOpen:function(id){ return mode==='structure'&&!!P[id]&&P[id].kids>0&&P[id].kind!=='port'&&P[id].kind!=='seam'; },isOpen:function(id){ return open.has(id); }};
  }

  window.addEventListener('hashchange',function(){ show(location.hash.slice(1)); });
  window.addEventListener('popstate',function(){ show(location.hash.slice(1)); });
  document.addEventListener('keydown',function(e){
    if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(walk&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ var n=walk.steps.length, to=Math.max(0,Math.min(n-1,at+(e.key==='ArrowRight'?1:-1))); if(to!==at){ at=to; drawWalk(); } }
    if(e.key==='Escape'){ if(app.classList.contains('drawer')) drawer(false); else if(walk) endWalk(); else if(app.classList.contains('sheet')) sheetOpen(false); else if(cur) go(''); } });

  var s0=store('a2m-scope'), m0=store('a2m-mode');
  if(s0&&isScope(s0)){ scope=s0; mode=m0==='map'&&s0!==ROOT?'map':'structure'; }
  cur=valid(location.hash.slice(1))?location.hash.slice(1):'';
  drawFilters(); drawWalks(); drawBar(); drawTree(); drawReader();
  startGraph();
})();
