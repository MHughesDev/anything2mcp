<meta charset="utf-8">
<title>A2MArchitecture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one line with five stations, the route a call takes, and nothing else at first. Opening a station opens a
   reading sheet under the line; every part on a sheet opens its own sheet, as deep as the design goes. Three shelves
   hold what lies beneath the line. A walk moves along the line one step at a time. */
:root {
  --bg: #f2f5f4; --surface: #ffffff; --ink: #14201e; --muted: #5a6966; --line: #d2dad8; --soft: #e6ebe9;
  --route: #0b6b66; --route-soft: #d8ecea; --on-route: #ffffff;
  --built: #1c8548; --part: #b3740f; --todo: #8a9693;
  --g1: #3a6db3; --g2: #7454c0; --g3: #0b7a73; --g4: #b0466f; --g5: #5b6b7d; --g6: #5f7472;
  --shadow: 0 8px 26px rgb(20 32 30 / .14);
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --g1: #80a8ea; --g2: #ad95ee; --g3: #55c7bf; --g4: #e78db1; --g5: #a3b3c4; --g6: #9fb3b0;
  --shadow: 0 8px 26px rgb(0 0 0 / .45);
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #171f1e; --ink: #e2eae8; --muted: #94a3a0; --line: #2a3634; --soft: #1e2927;
  --route: #55c7bf; --route-soft: #15312f; --on-route: #0f1514;
  --g1: #80a8ea; --g2: #ad95ee; --g3: #55c7bf; --g4: #e78db1; --g5: #a3b3c4; --g6: #9fb3b0;
  --shadow: 0 8px 26px rgb(0 0 0 / .45);
  --built: #5bc98a; --part: #e2b25c; --todo: #6f7d7a; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55;
  padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; text-align: left; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--route); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 32px; padding-top: 28px; }
h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
.lede { margin: 0; max-width: 58ch; color: var(--muted); text-wrap: pretty; }
.done { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.done b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { width: 96px; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--route); }

/* The line */
.line { position: relative; display: grid; grid-template-columns: repeat(var(--n, 5), minmax(0, 1fr)); gap: 0; padding-top: 6px; }
.line::before { content: ""; position: absolute; left: 7px; right: 0; top: 13px; height: 2px; background: var(--route); opacity: .45; }
.st { position: relative; display: flex; flex-direction: column; gap: 3px; padding: 30px 16px 12px 0; border-radius: 8px; min-width: 0; }
.st::before { content: ""; position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 2px solid var(--route); transition: background .15s; }
.st b { font-weight: 600; font-size: 1rem; line-height: 1.25; }
.st small { color: var(--muted); font-size: 13px; line-height: 1.35; }
.st:hover b { color: var(--route); }
.st.on::before { background: var(--route); }
.st.on b { color: var(--route); }
.st.lit::before { background: var(--route); box-shadow: 0 0 0 5px var(--route-soft); }
.pips { display: flex; gap: 4px; margin-top: 6px; }
.pip { width: 6px; height: 6px; border-radius: 50%; background: var(--todo); }
.pip.b { background: var(--built); } .pip.p { background: var(--part); } .pip.t { background: none; box-shadow: inset 0 0 0 1.5px var(--todo); } .pip.x { background: var(--line); }

.under { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 14px; }
.set { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 8px; min-width: 0; }
.set > span { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 13.5px; background: var(--surface); }
.chip:hover { border-color: var(--route); }
.chip.on { background: var(--route); border-color: var(--route); color: var(--on-route); }
.chip.lit { border-color: var(--route); box-shadow: 0 0 0 3px var(--route-soft); }

/* A walk */
.walk { background: var(--route-soft); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.walk .cap { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--route); font-weight: 600; font-variant-numeric: tabular-nums; }
.walk p { margin: 0; font-size: 1.05rem; line-height: 1.5; max-width: 70ch; }
.walk .at { display: flex; flex-wrap: wrap; gap: 6px; }
.walk .at .chip { background: var(--bg); }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.act { border: 1px solid var(--route); color: var(--route); border-radius: 6px; padding: 5px 14px; font-size: 13.5px; font-weight: 500; }
.act:hover { background: var(--route); color: var(--on-route); }
.act[disabled] { opacity: .4; cursor: default; pointer-events: none; }
.act.quiet { border-color: transparent; color: var(--muted); }
.act.quiet:hover { background: none; color: var(--ink); }

/* The reader */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-size: 13.5px; color: var(--muted); }
.crumbs button { color: var(--route); padding: 2px 2px; }
.crumbs button:hover { text-decoration: underline; }
.crumbs b { color: var(--ink); font-weight: 500; }
.reader { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
.reader.two { grid-template-columns: 230px minmax(0, 1fr); }
.side { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; padding-right: 4px; }
.side h3 { margin: 10px 0 2px; }
.side h3:first-child { margin-top: 0; }
.side button { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px; font-size: 13.5px; color: var(--muted); }
.side button:hover { color: var(--ink); background: var(--soft); }
.side button.on { color: var(--ink); background: var(--surface); font-weight: 500; box-shadow: inset 2px 0 0 var(--route); }
.sheet { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 26px 26px; display: flex; flex-direction: column; gap: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h2 { font-size: 1.35rem; font-weight: 600; letter-spacing: -.01em; margin: 2px 0 0; text-wrap: balance; }
h3 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }
.state { display: inline-flex; align-items: center; gap: 7px; }
.where { font-family: var(--mono); font-size: 12.5px; }
.sheet p { margin: 0; max-width: 66ch; text-wrap: pretty; }
.hand { color: var(--muted); font-size: 14px; }
.hand button { color: var(--route); font-weight: 500; }
.hand button:hover { text-decoration: underline; }
.group { display: flex; flex-direction: column; gap: 6px; }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; column-gap: 10px; align-items: baseline; padding: 10px 4px; border-bottom: 1px solid var(--line); width: 100%; }
.row:hover { background: var(--soft); }
.row .pip { align-self: center; width: 8px; height: 8px; }
.row b { font-weight: 500; }
.row small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.4; font-weight: 400; }
.row .more { color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .more i { font-style: normal; color: var(--route); margin-left: 6px; }
.tight .row { padding: 7px 4px; }
details { border-top: 1px solid var(--line); }
details:last-of-type { border-bottom: 1px solid var(--line); }
details + details { margin-top: -14px; }
summary { list-style: none; cursor: pointer; padding: 11px 4px; display: flex; justify-content: space-between; gap: 12px; font-weight: 500; }
summary::-webkit-details-marker { display: none; }
summary span { color: var(--muted); font-weight: 400; font-size: 13px; white-space: nowrap; }
summary span::after { content: " +"; color: var(--route); font-weight: 600; }
details[open] summary span::after { content: " \2212"; }
summary:hover { color: var(--route); }
.fold { padding: 2px 4px 16px; display: flex; flex-direction: column; gap: 12px; }
.fold ul, .fold ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 8px; max-width: 66ch; }
.fold li small { display: block; margin-top: 3px; }
.fold li small button, .flow button { color: var(--route); font-size: 13px; }
.fold li small button:hover, .flow button:hover { text-decoration: underline; }
.flow { list-style: none; padding: 0 !important; }
.flow li { display: grid; grid-template-columns: 4.2em minmax(0, 1fr); column-gap: 8px; align-items: baseline; }
.flow li > span { color: var(--muted); font-size: 12.5px; }
.hint { color: var(--muted); margin: 0; }
footer { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
footer span { display: inline-flex; align-items: center; gap: 7px; }
footer .note { display: block; flex-basis: 100%; }

[hidden] { display: none !important; }

/* The view switch, and the graph: the same parts and arrows, drawn as a map that unfolds in place */
.viewbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-bottom: -6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface); }
.seg button { padding: 4px 16px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--route); color: var(--on-route); }
.seg button:not([aria-pressed="true"]):hover { color: var(--ink); }
.find { position: relative; flex: 0 1 300px; min-width: 0; }
.find input { width: 100%; font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 5px 10px 5px 32px; -webkit-appearance: none; appearance: none; }
.find input::placeholder { color: var(--muted); }
.find input:focus { outline: 2px solid var(--route); outline-offset: 1px; }
.find > svg { position: absolute; left: 10px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); stroke: var(--muted); fill: none; stroke-width: 2; pointer-events: none; }
.hits { position: absolute; z-index: 6; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); padding: 4px; max-height: 330px; overflow: auto; }
.hits button { display: grid; grid-template-columns: 8px minmax(0, 1fr); column-gap: 9px; align-items: baseline; width: 100%; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; }
.hits button .pip { align-self: center; }
.hits button small { grid-column: 2; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hits button.on, .hits button:hover { background: var(--soft); }
.hits p { margin: 0; padding: 6px 8px; color: var(--muted); font-size: 13px; }
.graph { position: relative; height: clamp(420px, calc(100vh - 290px), 760px); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
#gsvg { display: block; width: 100%; height: 100%; cursor: grab; user-select: none; -webkit-user-select: none; font-family: var(--body); }
#gsvg:active { cursor: grabbing; }
.ghint.gone { opacity: 0; }
.ghint { transition: opacity .4s; position: absolute; left: 14px; top: 11px; right: 60px; margin: 0; font-size: 12.5px; line-height: 1.4; color: var(--muted); pointer-events: none; }
.gtools { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
.gtools button { width: 34px; height: 34px; border-radius: 8px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); text-align: center; }
.gtools button:hover { border-color: var(--route); color: var(--route); }
.gtools svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.gkey { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 14px; font-size: 12px; color: var(--muted); pointer-events: none; background: var(--surface); padding: 2px 6px; border-radius: 6px; }
.gkey span { display: inline-flex; align-items: center; gap: 6px; }
.gkey i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--muted); opacity: .8; }
.gkey i.r { border-color: var(--route); } .gkey i.d { border-top-style: dashed; }
.gmsg { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); margin: 0; }
.gtip { position: absolute; z-index: 4; pointer-events: none; width: max-content; max-width: 290px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 11px; font-size: 13px; line-height: 1.45; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.gtip b { font-weight: 600; font-size: 14px; }
.gtip .meta { font-size: 12px; }
.gtip small { color: var(--muted); font-size: 12px; }
.graph .walk { position: absolute; z-index: 3; left: 12px; bottom: 12px; width: min(460px, calc(100% - 24px)); padding: 12px 14px; gap: 8px; border: 1px solid var(--route); box-shadow: var(--shadow); }
.graph .walk p { font-size: 14.5px; }
.graph .walk .at { display: none; }
.graph .walk .act { padding: 3px 12px; }

.g-hull { fill: var(--h); fill-opacity: .075; stroke: var(--h); stroke-opacity: .42; stroke-width: 1.3; transition: fill-opacity .15s; }
.g-hull.inner { fill-opacity: .07; stroke-dasharray: 5 4; stroke-opacity: .55; stroke-width: 1.1; }
.g-hull.lit { fill-opacity: .14; }
.h1 { --h: var(--g1); } .h2 { --h: var(--g2); } .h3 { --h: var(--g3); } .h4 { --h: var(--g4); } .h5 { --h: var(--g5); } .h6 { --h: var(--g6); }
.g-spine { fill: none; stroke: var(--route); stroke-opacity: .5; stroke-width: 2.5; }
.g-below { font-size: 12px; letter-spacing: .08em; fill: var(--muted); }
.g-link { fill: none; stroke: var(--muted); stroke-opacity: .42; stroke-width: 1.2; transition: opacity .15s; }
.g-link.k-path { stroke: var(--route); stroke-opacity: .62; stroke-width: 1.7; }
.g-link.k-store { stroke-dasharray: 4 3; }
.mk-r { fill: var(--route); } .mk-m { fill: var(--muted); }
.dim .g-link { opacity: .1; }
.dim .g-link.lit { opacity: 1; stroke-opacity: 1; stroke-width: 2.4; }
.g-ll { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; display: none; pointer-events: none; }
.dim .g-ll.lit { display: inline; }
.g-node { cursor: pointer; transition: opacity .15s; outline: none; }
.dim .g-node { opacity: .2; }
.dim .g-node.top.hub { opacity: .6; }
.dim .g-node.lit { opacity: 1; }
.dim .g-node.lit .lab { font-weight: 600; }
.g-node text { fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; }
.g-node .lab { font-size: 11.5px; text-anchor: middle; }
.g-node .hlab { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.g-node .tname { font-size: 16px; font-weight: 600; fill: var(--ink); }
.g-node .tname.small { font-size: 13.5px; }
.g-node .tshort { font-size: 12px; fill: var(--muted); }
.g-node .count { font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; stroke-width: 0; }
.g-node .count.sub { font-size: 9.5px; font-weight: 400; fill: var(--muted); }
.s-b { fill: var(--built); } .s-p { fill: var(--part); } .s-x { fill: var(--line); stroke: var(--todo); stroke-width: 1; stroke-opacity: .7; }
.s-t { fill: var(--surface); stroke: var(--todo); stroke-width: 1.6; }
.halo { fill: none; stroke: var(--muted); stroke-opacity: .55; stroke-width: 1; stroke-dasharray: 2 2.2; }
.hubring { fill: var(--surface); stroke-width: 2.5; }
.hubring.st-b { stroke: var(--built); } .hubring.st-p { stroke: var(--part); } .hubring.st-t { stroke: var(--todo); } .hubring.st-x { stroke: var(--line); }
.stdot { fill: var(--surface); stroke: var(--route); stroke-width: 2.5; }
.g-node.lit .stdot, .g-node:hover .stdot { fill: var(--route); }
.donut-hole { fill: var(--surface); }
.selr { fill: none; stroke: var(--ink); stroke-width: 2; display: none; }
.g-node.sel .selr, .g-node:focus-visible .selr { display: inline; }
.g-node.pin .selr { display: inline; stroke: var(--route); stroke-width: 3; }
.g-node:hover .body { filter: brightness(1.08); }
.badge circle { fill: var(--surface); stroke: var(--route); stroke-width: 1.5; }
.badge text { fill: var(--route); font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; stroke-width: 0; }
.badge:hover circle { fill: var(--route); }
.badge:hover text { fill: var(--on-route); }
.badge circle.hit { fill: transparent; stroke: none; }
.far .g-node.leaf .lab { display: none; }
.far .g-node.leaf.lit .lab { display: inline; }

@media (max-width: 860px) {
  .reader.two { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
}
@media (max-width: 700px) {
  header { padding-top: 20px; }
  .line { grid-template-columns: minmax(0, 1fr); padding-top: 0; }
  .line::before { left: 7px; right: auto; top: 14px; bottom: 22px; width: 2px; height: auto; }
  .st { padding: 6px 0 10px 30px; flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .st::before { top: 8px; }
  .st b { flex-basis: 100%; }
  .pips { margin-top: 0; align-self: center; }
  .wrap.open .st small, .wrap.open .pips { display: none; }
  .wrap.open .st { padding-bottom: 4px; }
  .sheet { padding: 18px 16px 20px; }
  .row .more em { display: none; }
  .graph { height: clamp(400px, 64vh, 620px); }
  .gkey { display: none; }
  .find { flex-basis: 100%; }
}
.graph:has(> .walk:not([hidden])) .gkey { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<div class="wrap" id="wrap">
  <header>
    <div><h1>Anything2MCP, as designed</h1><p class="lede" id="lede"></p></div>
    <div class="done" aria-label="How much of the build is done"><b id="pct"></b><span class="bar"><i id="pctbar"></i></span><span id="prog"></span></div>
  </header>
  <div class="viewbar">
    <div class="seg" role="group" aria-label="How to show the design"><button type="button" data-mode="line" aria-pressed="true">Line</button><button type="button" data-mode="graph" aria-pressed="false">Graph</button></div>
    <div class="find" id="find" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input type="search" id="q" placeholder="Find a part by name" aria-label="Find a part by name" autocomplete="off" spellcheck="false"><div class="hits" id="hits" role="listbox" hidden></div></div>
  </div>
  <nav class="line" id="line" aria-label="The route a call takes"></nav>
  <section class="graph" id="graph" aria-label="The design as a graph" hidden>
    <svg id="gsvg"></svg>
    <p class="ghint" id="ghint"></p>
    <div class="gtools" id="gtools">
      <button type="button" data-z="in" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

        h.members.forEach(function(m){ var dx=m.x-h.x, dy=m.y-h.y, dd=Math.sqrt(dx*dx+dy*dy)||1; if(dd>R){ var f=(dd-R)/dd*alpha*.4; m.vx-=dx*f; m.vy-=dy*f; } }); }); })
      .force('charge',d3.forceManyBody().distanceMax(260))
      .force('collide',d3.forceCollide().iterations(2).strength(.85))
      .force('tether',d3.forceLink().id(function(d){ return d.id; }))
      .force('data',d3.forceLink().id(function(d){ return d.id; }))
      .force('x',d3.forceX()).force('y',d3.forceY());
    sim.on('tick',draw);
    function setForces(){
      sim.nodes(nodes);
      sim.force('charge').strength(function(d){ return d.depth===0?0:-28-2.2*d.r; });
      sim.force('collide').radius(function(d){ return d.depth===0?(d.hub?44:d.r+34):d.hub?d.r+24:Math.max(d.r+8,36); });
      var teth=[]; nodes.forEach(function(d){ if(d.depth>=2) teth.push({source:d.up,target:d.id,dist:30+12*Math.sqrt(vis[d.up].kids)}); });
      sim.force('tether').links(teth).distance(function(l){ return l.dist; }).strength(.55);
      sim.force('data').links(links.filter(function(L){ return L.s.top===L.t.top; }).map(function(L){ return {source:L.source,target:L.target}; })).distance(90).strength(.035);
      sim.force('x').x(function(d){ return d.depth?ANC[d.top].cx:0; }).strength(function(d){ return d.depth===1?.065:d.depth&&!vertical?.03:0; });
      sim.force('y').y(function(d){ return d.depth===1?ANC[d.top].cy:0; }).strength(function(d){ return d.depth===1?.065:0; });
    }

    function hullOf(h){
      var pts=[], pad=h.depth?11:18;
      function ring(x,y,r){ for(var i=0;i<12;i++){ var a=i/12*2*Math.PI; pts.push([x+Math.cos(a)*r,y+Math.sin(a)*r]); } }
      ring(h.x,h.y,h.depth?h.r+pad:16);
      h.members.forEach(function(d){ ring(d.x,d.y,d.r+pad); if(!d.hub){ ring(d.x-30,d.y+d.r+16,pad*.7); ring(d.x+30,d.y+d.r+16,pad*.7); } else ring(d.x,d.y-d.r-12,pad); });
      var hp=d3.polygonHull(pts); return hp?curve(hp):'';
    }
    function geo(L){
      var s=L.s, t=L.t, dx=t.x-s.x, dy=t.y-s.y, dist=Math.sqrt(dx*dx+dy*dy)||1, ux=dx/dist, uy=dy/dist, off=Math.min(36,dist*.14);
      var mx=(s.x+t.x)/2-uy*off, my=(s.y+t.y)/2+ux*off, sr=(s.depth===0&&s.hub?11:s.r+2), tr=(t.depth===0&&t.hub?11:t.r)+4;
      var a=Math.atan2(my-s.y,mx-s.x), b=Math.atan2(my-t.y,mx-t.x), x1=s.x+Math.cos(a)*sr, y1=s.y+Math.sin(a)*sr, x2=t.x+Math.cos(b)*tr, y2=t.y+Math.sin(b)*tr;
      L.mx=.25*x1+.5*mx+.25*x2; L.my=.25*y1+.5*my+.25*y2;
      return 'M'+x1.toFixed(1)+','+y1.toFixed(1)+'Q'+mx.toFixed(1)+','+my.toFixed(1)+' '+x2.toFixed(1)+','+y2.toFixed(1);
    }
    function draw(){
      nodeSel.attr('transform',function(d){ return 'translate('+d.x.toFixed(1)+','+d.y.toFixed(1)+')'; });
      linkSel.attr('d',geo);
      llSel.attr('x',function(L){ return L.mx; }).attr('y',function(L){ return L.my-4; });
      hullSel.attr('d',hullOf);
      var st=O.stations.map(function(s){ return vis[s.id]; });
      spine.attr('d','M'+st.map(function(d){ return d.x.toFixed(1)+','+d.y.toFixed(1); }).join('L'));
      if(belowAt) below.attr('x',belowAt.x).attr('y',belowAt.y);
    }

    function paint(g,d){
      var s=d3.select(g); s.selectAll('*').remove();
      s.attr('class','g-node h'+HUE[d.top]+(d.depth===0?' top':'')+(d.hub?' hub':' leaf'));
      var label=d.depth===0?S[d.id].name:N[d.id].name;
      s.attr('tabindex',0).attr('role','button').attr('aria-label',label+(d.depth?', '+(LABEL[d.st]||''):'')+(d.kids?', '+d.kids+' parts inside, '+(d.hub?'open':'folded'):''));
      s.append('circle').attr('class','selr').attr('r',(d.depth===0&&d.hub?9:d.r)+5);
      if(d.depth===0){
        var sh=S[d.id].short;
        if(d.hub){ s.append('circle').attr('class','stdot body').attr('r',8);
          if(vertical){ s.append('text').attr('class','tname').attr('x',16).attr('y',-2).text(label); s.append('text').attr('class','tshort').attr('x',16).attr('y',14).text(sh); }
          else { s.append('text').attr('class','tname').attr('text-anchor','middle').attr('y',-30).text(label); s.append('text').attr('class','tshort').attr('text-anchor','middle').attr('y',-14).text(sh); }
        } else {
          var m=mix(d.id), arc=d3.arc().innerRadius(d.r*.62).outerRadius(d.r).padAngle(.015),
            pie=d3.pie().sort(null).value(function(e){ return e[1]; })(['b','p','t','x'].map(function(q){ return [q,m[q]]; }).filter(function(e){ return e[1]; }));
          s.append('circle').attr('class','donut-hole').attr('r',d.r);
          pie.forEach(function(p){ s.append('path').attr('class','body s-'+p.data[0]).attr('d',arc(p)); });
          s.append('text').attr('class','count').attr('y',-4).text(desc(d.id)); s.append('text').attr('class','count sub').attr('y',8).text('parts');
          if(ANC[d.id]&&ANC[d.id].row){ var tt=s.append('text').attr('class','tname small').attr('text-anchor','middle').attr('y',d.r+18);
            wrap2(label).forEach(function(line,i){ tt.append('tspan').attr('x',0).attr('dy',i?15:0).text(line); }); }
          else if(vertical){ s.append('text').attr('class','tname').attr('x',d.r+12).attr('y',-2).text(label); s.append('text').attr('class','tshort').attr('x',d.r+12).attr('y',14).text(sh); }
          else { s.append('text').attr('class','tname').attr('text-anchor','middle').attr('y',d.r+20).text(label); s.append('text').attr('class','tshort').attr('text-anchor','middle').attr('y',d.r+35).text(sh); }
        }
      } else if(d.hub){
        s.append('circle').attr('class','hubring body st-'+d.st).attr('r',d.r);
        s.append('text').attr('class','hlab').attr('y',-d.r-8).text(label);
      } else {
        if(d.kids) s.append('circle').attr('class','halo').attr('r',d.r+3.5);
        s.append('circle').attr('class','body s-'+d.st).attr('r',d.r);
        var t=s.append('text').attr('class','lab').attr('y',d.r+14);
        wrap2(label).forEach(function(line,i){ t.append('tspan').attr('x',0).attr('dy',i?13:0).text(line); });
      }
      if(d.kids){
        var bx, by; if(d.depth===0&&d.hub){ var tn=s.select('.tname').node(), tw=0; try{ tw=tn.getComputedTextLength(); }catch(e){ tw=label.length*8.5; }
          if(vertical){ bx=16+tw+14; by=-8; } else { bx=tw/2+14; by=-36; } } else if(d.hub){ bx=d.r+10; by=0; } else { bx=d.r*.72+4; by=-d.r*.72-4; }
        var b=s.append('g').attr('class','badge').attr('transform','translate('+bx+','+by+')');
        b.append('circle').attr('class','hit').attr('r',coarse?16:11); b.append('circle').attr('r',7.5); b.append('text').text(d.hub?'−':'+');
        b.on('click',function(ev){ ev.stopPropagation(); clearTimeout(clickT); toggle(d.id); }).on('dblclick',function(ev){ ev.stopPropagation(); ev.preventDefault(); })
          .on('pointerdown',function(ev){ ev.stopPropagation(); });
      }
    }
    var drag=d3.drag().filter(function(ev){ return !ev.button&&!(ev.target.closest&&ev.target.closest('.badge')); })
      .on('start',function(ev,d){ if(d.depth===0) return; if(!ev.active) sim.alphaTarget(.15).restart(); d.fx=d.x; d.fy=d.y; })
      .on('drag',function(ev,d){ if(d.depth===0) return; d.fx=ev.x; d.fy=ev.y; })
      .on('end',function(ev,d){ if(d.depth===0) return; if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; });

    function render(){
      hullSel=gHull.selectAll('path').data(hubs,function(d){ return d.id; }).join('path').attr('class',function(d){ return 'g-hull h'+HUE[d.top]+(d.depth?' inner':''); });
      linkSel=gLink.selectAll('path').data(links,function(L){ return L.key; }).join('path')
        .attr('class',function(L){ return 'g-link k-'+L.kind; }).attr('marker-end',function(L){ return 'url(#gm-'+(L.kind==='path'?'r':'m')+')'; });
      llSel=gLL.selectAll('text').data(links.filter(function(L){ return L.label; }),function(L){ return L.key; }).join('text').attr('class','g-ll').text(function(L){ return L.label.length>60?L.label.slice(0,58)+'…':L.label; });
      nodeSel=gNode.selectAll('g.g-node').data(nodes,function(d){ return d.id; }).join(function(en){ return en.append('g').call(events).call(drag); });
      nodeSel.each(function(d){ paint(this,d); });
    }
    function events(sel){
      sel.on('pointerenter',function(ev,d){ if(ev.pointerType!=='mouse') return; hoverId=d.id; applyFocus(); showTip(ev,d); })
        .on('pointermove',function(ev){ if(ev.pointerType==='mouse') placeTip(ev); })
        .on('pointerleave',function(){ hoverId=null; applyFocus(); tip.hidden=true; })
        .on('click',function(ev,d){ if(ev.defaultPrevented) return; clearTimeout(clickT); var id=d.id; clickT=setTimeout(function(){ tip.hidden=true; go(id); },coarse?0:250); })
        .on('dblclick',function(ev,d){ ev.preventDefault(); ev.stopPropagation(); clearTimeout(clickT); toggle(d.id); })
        .on('keydown',function(ev,d){ if(ev.key==='Enter'){ ev.preventDefault(); go(d.id); } else if(ev.key==='+'||ev.key==='-'||ev.key===' '){ ev.preventDefault(); toggle(d.id); } })
        .on('focus',function(ev,d){ hoverId=d.id; applyFocus(); }).on('blur',function(){ hoverId=null; applyFocus(); });
    }
    function showTip(ev,d){
      tip.textContent=''; var n=d.depth?N[d.id]:S[d.id];
      tip.appendChild(h('b','',n.name));
      var m=h('div','meta');
      if(d.depth){ var sp=h('span','state'); sp.appendChild(pip(d.st)); sp.appendChild(document.createTextNode(LABEL[d.st]||'')); m.appendChild(sp); if(n.where) m.appendChild(h('span','where',n.where)); }
      else { var mx=mix(d.id); m.textContent=desc(d.id)+' parts: '+mx.b+' built, '+mx.p+' partly, '+mx.t+' not built'; }
      tip.appendChild(m); tip.appendChild(h('div','',first(n.text)));
      var deg=links.filter(function(L){ return L.source===d.id||L.target===d.id; }).length;
      tip.appendChild(h('small','',[d.kids?(d.kids+' parts inside, '+(d.hub?'open':'double-click to open')):'',deg?(deg+(deg===1?' arrow':' arrows')+' shown'):'','click to read'].filter(Boolean).join(' · ')));
      tip.hidden=false; placeTip(ev);
    }
    function placeTip(ev){ var r=box.getBoundingClientRect(), x=ev.clientX-r.left+14, y=ev.clientY-r.top+16, w=tip.offsetWidth, hh=tip.offsetHeight;
      if(x+w>r.width-8) x=Math.max(8,ev.clientX-r.left-w-14); if(y+hh>r.height-8) y=Math.max(8,ev.clientY-r.top-hh-14); tip.style.left=x+'px'; tip.style.top=y+'px'; }

    function walkSet(){
      if(walk<0) return null; var s=WALKS[walk].steps[at], ns=new Set(), ls=new Set(), ids=s.at||[];
      ids.forEach(function(i){ var r=rep(i); if(r){ ns.add(r); ns.add(vis[r].top); } });
      var pairs=(s.edges&&s.edges.length)?s.edges:(N[A.root].edges||[]).filter(function(e){ return ids.indexOf(e[0])>=0&&ids.indexOf(e[1])>=0; });
      pairs.forEach(function(e){ var a=rep(e[0]), b=rep(e[1]); if(!a||!b||a===b) return; if(LM[a+'>'+b]) ls.add(a+'>'+b); else if(LM[b+'>'+a]) ls.add(b+'>'+a); });
      return {n:ns,l:ls};
    }
    function focusSet(){
      var id=hoverId||pinId;
      if(id&&vis[id]){ var ns=new Set([id]), ls=new Set(), d=vis[id];
        links.forEach(function(L){ if(L.source===id||L.target===id){ ls.add(L.key); ns.add(L.source); ns.add(L.target); } });
        if(d.hub) d.members.forEach(function(m){ ns.add(m.id); });
        links.forEach(function(L){ if(d.hub&&ns.has(L.source)&&ns.has(L.target)) ls.add(L.key); });
        ns.forEach(function(x){ ns.add(vis[x].top); }); return {n:ns,l:ls}; }
      return walkSet();
    }
    function applyFocus(){
      var F=focusSet(); svg.classed('dim',!!F);
      nodeSel.classed('lit',function(d){ return !!F&&F.n.has(d.id); }).classed('sel',function(d){ return d.id===cur; }).classed('pin',function(d){ return d.id===pinId; });
      linkSel.classed('lit',function(L){ return !!F&&F.l.has(L.key); }); llSel.classed('lit',function(L){ return !!F&&F.l.has(L.key); });
      hullSel.classed('lit',function(d){ return !!F&&F.n.has(d.id); });
      if(F) linkSel.filter('.lit').raise();
    }

    function update(settle){
      rebuild(); anchors(); spawn(); relink(); setForces(); render();
      if(settle||calm){ sim.alpha(1); for(var i=0;i<(calm?320:180);i++) sim.tick(); }
      draw(); if(calm) sim.stop(); else sim.alpha(settle?.05:.75).restart(); applyFocus();
    }
    function cardRoom(){ var w=document.getElementById('walk'); return (w.hidden||w.parentNode!==box)?0:w.offsetHeight+16; }
    function fly(ids,maxK){
      var x0=1/0, y0=1/0, x1=-1/0, y1=-1/0;
      ids.forEach(function(id){ var d=vis[id]; if(!d) return; var p=d.r+(d.depth===0?70:42);
        x0=Math.min(x0,d.x-p); x1=Math.max(x1,d.x+p); y0=Math.min(y0,d.y-p-(d.hub?24:0)); y1=Math.max(y1,d.y+p+(d.hub?0:12)); });
      if(x0===1/0) return;
      var top=36, hh=Math.max(120,H-cardRoom()-top), k=Math.max(.15,Math.min(maxK,Math.min(W/(x1-x0),hh/(y1-y0))));
      var t=d3.zoomIdentity.translate(W/2-k*(x0+x1)/2,top+hh/2-k*(y0+y1)/2).scale(k);
      (calm?svg:svg.transition().duration(650)).call(zoom.transform,t);
    }
    function fitAll(){ fly(nodes.map(function(d){ return d.id; }),1.15); }
    function inView(ids){ var t=d3.zoomTransform(svgEl);
      return ids.every(function(id){ var d=vis[id]; if(!d) return true; var x=t.applyX(d.x), y=t.applyY(d.y); return x>20&&x<W-20&&y>20&&y<H-20; }); }
    function toggle(id){
      if(!kids(id).length) return;
      if(open.has(id)){ open.delete(id); Array.from(open).forEach(function(o){ if(o!==id&&pathTo(o).indexOf(id)>=0) open.delete(o); }); }
      else open.add(id);
      tip.hidden=true; update(false);
      if(open.has(id)) setTimeout(function(){ var ids=[id].concat(vis[id]?vis[id].members.map(function(m){ return m.id; }):[]);
        if(!inView(ids)) fly(ids,Math.max(.5,d3.zoomTransform(svgEl).k)); },calm?0:700);
    }
    function reveal(id){ var p=pathTo(id), changed=false; p.slice(0,-1).forEach(function(a){ if(!open.has(a)){ open.add(a); changed=true; } }); if(changed) update(true); }

    var zoom=d3.zoom().scaleExtent([.15,3]).on('zoom',function(ev){ gz.attr('transform',ev.transform); if(ev.sourceEvent) document.getElementById('ghint').classList.add('gone'); kz=ev.transform.k; svg.classed('far',kz<.55); });
    svg.call(zoom).on('dblclick.zoom',null);
    svg.on('click',function(ev){ if(ev.target===svgEl||ev.target.classList.contains('g-hull')){ if(pinId){ pinId=null; applyFocus(); } } });
    function zoomBy(f){ (calm?svg:svg.transition().duration(250)).call(zoom.scaleBy,f); }
    var tools=document.getElementById('gtools');
    tools.querySelector('[data-z="in"]').onclick=function(){ zoomBy(1.4); };
    tools.querySelector('[data-z="out"]').onclick=function(){ zoomBy(1/1.4); };
    tools.querySelector('[data-z="fit"]').onclick=fitAll;
    tools.querySelector('[data-z="reset"]').onclick=function(){ initialOpen(); pinId=null; Object.keys(P).forEach(function(k){ delete P[k]; }); update(true); fitAll(); };

    // Find a part: the graph unfolds to it and flies there.
    var q=document.getElementById('q'), hits=document.getElementById('hits'), hi=0, found=[];
    var INDEX=ORDER.map(function(s){ return {id:s.id,name:s.name}; }).concat(Object.keys(N).filter(function(id){ return id!==A.root&&parent[id]; }).map(function(id){ return {id:id,name:N[id].name}; }));
    INDEX.forEach(function(x){ x.low=x.name.toLowerCase(); });
    function context(id){ var p=pathTo(id).slice(0,-1).map(nameOf); return p.length?p.join(' › '):(O.stations.indexOf(S[id])>=0?'On the line':'Beneath the line'); }
    function listHits(){
      var t=q.value.trim().toLowerCase(); hits.textContent=''; if(!t){ hits.hidden=true; found=[]; return; }
      var words=t.split(/\s+/);
      found=INDEX.map(function(x){ if(!words.every(function(w){ return x.low.indexOf(w)>=0; })) return null; var i=x.low.indexOf(words[0]);
          return {x:x,s:x.low===t?-1:i===0?0:(x.low.charAt(i-1)===' '?1:2)}; }).filter(Boolean)
        .sort(function(a,b){ return a.s-b.s||a.x.name.length-b.x.name.length; }).slice(0,8).map(function(r){ return r.x; });
      hi=0; hits.hidden=false;
      if(!found.length){ hits.appendChild(h('p','','No part has that in its name.')); return; }
      found.forEach(function(x,i){ var b=btn(i===hi?'on':'',null,function(){ pick(x.id); }); b.setAttribute('role','option');
        b.appendChild(pip(S[x.id]?'b':N[x.id].state)); if(S[x.id]) b.firstChild.style.visibility='hidden';
        b.appendChild(h('span','',x.name)); b.appendChild(h('small','',context(x.id))); hits.appendChild(b); });
    }
    function pick(id){ hits.hidden=true; q.value=nameOf(id); pinId=id; reveal(id); applyFocus(); fly([id],1.25); }
    q.addEventListener('input',listHits);
    q.addEventListener('focus',listHits);
    q.addEventListener('keydown',function(e){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!found.length) return; hi=(hi+(e.key==='ArrowDown'?1:found.length-1))%found.length;
        [].forEach.call(hits.children,function(c,i){ c.classList.toggle('on',i===hi); }); }
      else if(e.key==='Enter'){ e.preventDefault(); if(found[hi]) pick(found[hi].id); }
      else if(e.key==='Escape'){ q.value=''; hits.hidden=true; if(pinId){ pinId=null; applyFocus(); } } });
    document.addEventListener('pointerdown',function(e){ if(!document.getElementById('find').contains(e.target)) hits.hidden=true; });

    function sync(){
      if(MODE!=='graph') return;
      if(cur&&cur!==lastCur&&!vis[cur]){ reveal(cur); fly([cur],1.3); }
      lastCur=cur;
      var wk=walk>=0?walk+':'+at:'';
      if(wk!==lastWalk){ lastWalk=wk; var F=walkSet(); if(F){ var ids=[]; F.n.forEach(function(x){ if(vis[x].depth||!vis[x].hub) ids.push(x); }); requestAnimationFrame(function(){ fly(ids,1.35); }); } }
      applyFocus();
    }
    function resize(){ var w=box.clientWidth, hh=box.clientHeight; if(!w||!hh) return; var was=vertical; W=w; H=hh;
      hint(); placeWalk(); if((w<560)!==was){ update(true); fitAll(); } }
    W=box.clientWidth; H=box.clientHeight; hint(); initialOpen(); update(true); fitAll(); lastCur=cur;
    if(cur&&!vis[cur]){ reveal(cur); }
    if(window.ResizeObserver) new ResizeObserver(resize).observe(box); else window.addEventListener('resize',resize);
    sync();
    return {resize:resize,sync:sync};
  }
  window.addEventListener('hashchange',function(){ show(location.hash.slice(1)); });
  window.addEventListener('popstate',function(){ show(location.hash.slice(1)); });
  document.addEventListener('keydown',function(e){
    if(e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(walk>=0&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){ var n=WALKS[walk].steps.length, to=Math.max(0,Math.min(n-1,at+(e.key==='ArrowRight'?1:-1))); if(to!==at){ at=to; drawLine(); drawWalk(); } }
    if(e.key==='Escape'){ if(walk>=0){ walk=-1; drawLine(); drawWalk(); } else if(cur) go(parent[cur]||''); } });
  show(location.hash.slice(1),true);
  if(MODE==='graph') setMode('graph');
})();
