[package]
name = "example-desk"
description = "Test stand: a desktop program's accessibility tree, published on an accessibility bus of the test's own, with labelled values, a table, a nameless control, two controls of one name, a password field, a late value, and a save button nobody may press."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The stand publishes its tree over AT-SPI, which is Linux's interface. On
# macOS it builds and says it is not built there. `service` is the part of
# the bus crate that exports objects; the workspace's other user of the
# crate only calls.
[target.'cfg(target_os = "linux")'.dependencies]
tokio.workspace = true
zbus = { workspace = true, features = ["service"] }

# On Windows the stand is a window of plain Win32 controls, made through the
# workspace's `windows` crate with the features it needs and no more
# (decision 0209). Tokio for the one blocking start, off the test's thread.
[target.'cfg(windows)'.dependencies]
tokio.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader", "Win32_System_StationsAndDesktops", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# The stand's own test sends its controls messages as another process.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
