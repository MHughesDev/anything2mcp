[package]
name = "example-app"
description = "The built-in test application: an imaginary order-entry system that imitates the hard cases, with a control interface that reports what it stored."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The application served over TLS as well, with certificates a test-only
# authority makes when a test runs (decision 0157). A crate whose tests use
# this stand in a build with TLS on turns this on, so that the harness's own
# clients state their TLS provider too.
tls = [
    "dep:rcgen",
    "dep:rustls",
    "dep:tokio-rustls",
    "reqwest/rustls-no-provider",
    "tokio/io-util",
]

[dependencies]
axum.workspace = true
rcgen = { workspace = true, optional = true }
reqwest.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rustls = { workspace = true, optional = true }

[lints]
workspace = true
