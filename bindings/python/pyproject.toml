[build-system]
requires = ["flit_core==4.2.0"]
build-backend = "flit_core.buildapi"

[project]
name = "anything2mcp"
version = "0.0.1"
description = "Placeholder for Anything2MCP: turn existing software and systems into safe, deterministic MCP tools. Nothing is usable yet."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/MHughesDev/anything2mcp"
Changelog = "https://github.com/MHughesDev/anything2mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/MHughesDev/anything2mcp/issues"
