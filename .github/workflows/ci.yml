name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Show versions
        run: cargo --version && rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Every crate's tests run even when one crate fails, so that one run
      # shows every failure on this operating system.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # The harness and its sample scenario; nothing is gated until a budgeted
      # path is measured (spec section 225).
      - name: Benchmark
        run: cargo run --locked --release -p a2m-bench -- run --out bench-results
        env:
          A2M_BENCH_COMMIT: ${{ github.sha }}
      # Pinned by commit; this is v7.0.2.
      - name: Store the benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bench-${{ matrix.os }}
          path: bench-results/
          if-no-files-found: error

  dependencies:
    name: Licences and advisories of dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Pinned by commit; this is v2.1.1, which runs cargo-deny 0.20.2 against deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check

  documents:
    name: Documents and crate layering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit the documents and the crate layering
        run: python3 tools/docs_audit.py
      - name: Prove the audit fails when it should
        run: python3 tools/test_docs_audit.py

  bindings:
    name: Wheel and npm packages on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # Pinned by commit; this is v7.1.0.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      # Pinned by commit; this is v7.1.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Name the paths of this operating system
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "VENV_BIN=Scripts" >> "$GITHUB_ENV"
            echo "EXE=.exe" >> "$GITHUB_ENV"
          else
            echo "VENV_BIN=bin" >> "$GITHUB_ENV"
            echo "EXE=" >> "$GITHUB_ENV"
          fi
      - name: Build the wheel and the source distribution
        working-directory: bindings/python
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/$VENV_BIN/pip" install --quiet maturin==1.16.0
          "$RUNNER_TEMP/tools/$VENV_BIN/maturin" build --release --out dist
          "$RUNNER_TEMP/tools/$VENV_BIN/maturin" sdist --out dist
          ls -l dist
      - name: Install the wheel into a clean environment and run both names and the import
        run: |
          python -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/$VENV_BIN/pip" install --quiet bindings/python/dist/*.whl
          "$RUNNER_TEMP/try/$VENV_BIN/anything2mcp$EXE" --version
          "$RUNNER_TEMP/try/$VENV_BIN/python" -c "import anything2mcp; print(anything2mcp.binary_path())"
          # On Windows pip makes no launcher for the a2m script (research note 21).
          if [ "$RUNNER_OS" != "Windows" ]; then "$RUNNER_TEMP/try/$VENV_BIN/a2m" --version; fi
      - name: Test the Python client, against a fake engine and the built one
        working-directory: bindings/python
        env:
          A2M_TEST_BINARY: ${{ github.workspace }}/target/release/anything2mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s tests -v
      - name: Run the short name from the installed wheel on Windows
        if: runner.os == 'Windows'
        run: |
          cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/try/Scripts/a2m.cmd") --version"
      - name: Check the generated client methods are current
        run: |
          python bindings/python/tools/generate_actions.py --check
          node bindings/npm/scripts/generate-actions.js --check
      - name: Test the npm packages and the Node client, against a fake engine and the built one
        working-directory: bindings/npm
        env:
          A2M_TEST_BINARY: ${{ github.workspace }}/target/release/anything2mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          node --test test/platform.test.js test/client.test.js
          node test/install.js --binary "$GITHUB_WORKSPACE/target/release/anything2mcp$EXE"

  presence:
    name: The Linux presence prompt against a real polkit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTION: io.github.mhughesdev.anything2mcp.presence
      ACCOUNT: a2m-presence
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install polkit, its text agent, and what the job drives them with
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends polkitd dbus bsdutils jq
      - name: Build the tests of a2m-local and put the test program where another account can run it
        shell: bash
        run: |
          set -euo pipefail
          program=$(cargo test --locked -p a2m-local --lib --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "a2m_local") | .executable' \
            | tail -n 1)
          test -x "$program"
          sudo install -m 0755 "$program" /usr/local/bin/a2m-local-tests
          sudo tee /usr/local/bin/a2m-presence-stage >/dev/null <<'SCRIPT'
          #!/bin/bash
          # Runs the test against a real polkit as account $1, on a machine prepared as $2.
          # It fails unless exactly that one test ran and passed.
          set -euo pipefail
          sudo -u "$1" env "A2M_TEST_POLKIT=$2" /usr/local/bin/a2m-local-tests \
            --exact tests::polkit::against_a_real_polkit_the_prompt_answers_as_the_machine_is_prepared \
            --nocapture 2>&1 | tee /tmp/a2m-presence-stage.log
          grep -q 'test result: ok. 1 passed' /tmp/a2m-presence-stage.log
          SCRIPT
          sudo chmod 0755 /usr/local/bin/a2m-presence-stage
      - name: Create the test account with a made-up password, and start polkit
        run: |
          sudo useradd --no-create-home --shell /bin/sh "$ACCOUNT"
          echo "$ACCOUNT:secret-for-tests-presence" | sudo chpasswd
          sudo systemctl start polkit.service
      - name: polkit runs and the policy file is not installed
        run: a2m-presence-stage "$ACCOUNT" no_policy
      - name: Install the policy file as an administrator does
        run: |
          sudo install -m 0644 "crates/a2m-local/polkit/$ACTION.policy" "/usr/share/polkit-1/actions/$ACTION.policy"
          sudo systemctl restart polkit.service
          timeout 60 sh -c "until pkaction --action-id '$ACTION' >/dev/null 2>&1; do sleep 1; done"
          pkaction --action-id "$ACTION" --verbose
      - name: A runner has no seat, so no session on it is local and active
        run: a2m-presence-stage "$ACCOUNT" no_session
      - name: The administrator account is allowed without being asked, which proves nobody
        run: a2m-presence-stage root root
      - name: Give the test account auth_self by a rule, in the place of the seat a runner lacks
        run: |
          sudo tee /etc/polkit-1/rules.d/00-a2m-presence-test.rules >/dev/null <<RULE
          polkit.addRule(function(action, subject) {
              if (action.id == "$ACTION" && subject.user == "$ACCOUNT") {
                  return polkit.Result.AUTH_SELF;
              }
          });
          RULE
          sudo systemctl restart polkit.service
          timeout 60 sh -c "until pkaction --action-id '$ACTION' >/dev/null 2>&1; do sleep 1; done"
      - name: polkit would ask, and no agent is there to ask through
        run: a2m-presence-stage "$ACCOUNT" no_agent
      - name: A text agent types the password, wrong, right, and not at all
        run: a2m-presence-stage "$ACCOUNT" ready
      - name: Show polkit's log when a stage failed
        if: failure()
        run: sudo journalctl --unit polkit.service --no-pager | tail -n 200

  tls:
    name: Rust with TLS on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Lint with TLS on
        run: cargo clippy -p a2m-auth -p a2m-pack-http -p a2m-pack-mcp -p example-app --all-targets --locked --features a2m-auth/tls,a2m-pack-http/tls,a2m-pack-mcp/tls,example-app/tls -- -D warnings
      - name: Test with TLS on
        run: cargo test -p a2m-auth -p a2m-pack-http -p a2m-pack-mcp -p example-app --locked --no-fail-fast --features a2m-auth/tls,a2m-pack-http/tls,a2m-pack-mcp/tls,example-app/tls
