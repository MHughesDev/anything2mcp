name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The whole workspace is built, linted, and tested here, and its tests
    # alone took close to thirty minutes on Windows by 2026-11-23.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Show versions
        run: cargo --version && rustc --version
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      # Every crate's tests run even when one crate fails, so that one run
      # shows every failure on this operating system.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      # The vault's root key in the operating system's own key store, which
      # no other test touches (package 2.2). On macOS the keychain is a
      # throwaway one, created and unlocked here, so that no prompt can
      # appear; on Windows the Credential Manager of the runner is used.
      # Linux takes the passphrase route and has no key store to try.
      - name: A throwaway keychain for the real key store test
        if: runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/a2m-test.keychain-db"
          security create-keychain -p test-only "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p test-only "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
      - name: The real key store holds the root
        if: runner.os != 'Linux'
        run: cargo test -p a2m-vault --locked -- --ignored the_real_key_store_holds_the_root
      # The harness and its sample scenario; nothing is gated until a budgeted
      # path is measured (spec section 225).
      - name: Benchmark
        run: cargo run --locked --release -p a2m-bench -- run --out bench-results
        env:
          A2M_BENCH_COMMIT: ${{ github.sha }}
      # Pinned by commit; this is v7.0.2.
      - name: Store the benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bench-${{ matrix.os }}
          path: bench-results/
          if-no-files-found: error

  promotion:
    name: The exit test of Phase 4, in a release build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # A request binding gained through shadow is identical and at least ten
      # times faster, asserted in a release build and run alone, so that no
      # other test shares the machine while it measures.
      - name: Promotion speed-up
        run: cargo test --locked --release -p a2m-bench --test promotion

  dependencies:
    name: Licences and advisories of dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Pinned by commit; this is v2.1.1, which runs cargo-deny 0.20.2 against deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check

  documents:
    name: Documents and crate layering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Audit the documents and the crate layering
        run: python3 tools/docs_audit.py
      - name: Prove the audit fails when it should
        run: python3 tools/test_docs_audit.py
      - name: Prove the field-test fault proxy
        run: python3 tools/test_field_proxy.py
      - name: Prove the field-test runner's closed network
        run: python3 tools/test_field_test.py
      - name: Prove the packaging check fails when a package holds another binary
        run: python3 tools/test_check_packages.py

  bindings:
    name: Wheel and npm packages on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Waits for the sign-in window job, a Linux job of some minutes, so that
    # the release check's two macOS wheels are given runners first: in the
    # tenth run of one pull request every job here passed and both wheels
    # were cancelled after fifteen minutes in the queue. Ordering only; it
    # runs whatever that job found.
    needs: web-window
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # Pinned by commit; this is v7.1.0.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      # Pinned by commit; this is v7.1.0.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Name the paths of this operating system
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "VENV_BIN=Scripts" >> "$GITHUB_ENV"
            echo "EXE=.exe" >> "$GITHUB_ENV"
          else
            echo "VENV_BIN=bin" >> "$GITHUB_ENV"
            echo "EXE=" >> "$GITHUB_ENV"
          fi
      - name: Build the wheel and the source distribution
        working-directory: bindings/python
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/$VENV_BIN/pip" install --quiet maturin==1.16.0
          "$RUNNER_TEMP/tools/$VENV_BIN/maturin" build --release --out dist
          "$RUNNER_TEMP/tools/$VENV_BIN/maturin" sdist --out dist
          ls -l dist
      - name: Check the wheel holds the product's program and no other binary
        run: python3 tools/check_packages.py wheel bindings/python/dist/*.whl
      - name: Install the wheel into a clean environment and run both names and the import
        run: |
          python -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/$VENV_BIN/pip" install --quiet bindings/python/dist/*.whl
          "$RUNNER_TEMP/try/$VENV_BIN/anything2mcp$EXE" --version
          # The client runs only the program its own installed distribution
          # put in the scripts folder: an installed wheel must find it.
          "$RUNNER_TEMP/try/$VENV_BIN/python" -c "import anything2mcp, sys; found = anything2mcp.binary_path(); print(found); sys.exit(0 if found else 1)"
          # On Windows pip makes no launcher for the a2m script (research note 21).
          if [ "$RUNNER_OS" != "Windows" ]; then "$RUNNER_TEMP/try/$VENV_BIN/a2m" --version; fi
      - name: Test the Python client, against a fake engine and the built one
        working-directory: bindings/python
        env:
          A2M_TEST_BINARY: ${{ github.workspace }}/target/release/anything2mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: python -m unittest discover -s tests -v
      - name: Run the short name from the installed wheel on Windows
        if: runner.os == 'Windows'
        run: |
          cmd.exe //c "$(cygpath -w "$RUNNER_TEMP/try/Scripts/a2m.cmd") --version"
      - name: Check the generated client methods are current
        run: |
          python bindings/python/tools/generate_actions.py --check
          node bindings/npm/scripts/generate-actions.js --check
      - name: Test the npm packages and the Node client, against a fake engine and the built one
        working-directory: bindings/npm
        env:
          A2M_TEST_BINARY: ${{ github.workspace }}/target/release/anything2mcp${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          node --test test/platform.test.js test/client.test.js
          node test/install.js --binary "$GITHUB_WORKSPACE/target/release/anything2mcp$EXE"

  presence:
    name: The Linux presence prompt against a real polkit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ACTION: io.github.mhughesdev.anything2mcp.presence
      ACCOUNT: a2m-presence
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      - name: Install polkit, its text agent, and what the job drives them with
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends polkitd dbus bsdutils jq
      - name: Build the tests of a2m-local and put the test program where another account can run it
        shell: bash
        run: |
          set -euo pipefail
          program=$(cargo test --locked -p a2m-local --lib --no-run --message-format=json-render-diagnostics \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "a2m_local") | .executable' \
            | tail -n 1)
          test -x "$program"
          sudo install -m 0755 "$program" /usr/local/bin/a2m-local-tests
          sudo tee /usr/local/bin/a2m-presence-stage >/dev/null <<'SCRIPT'
          #!/bin/bash
          # Runs the test against a real polkit as account $1, on a machine prepared as $2.
          # It fails unless exactly that one test ran and passed.
          set -euo pipefail
          sudo -u "$1" env "A2M_TEST_POLKIT=$2" /usr/local/bin/a2m-local-tests \
            --exact tests::polkit::against_a_real_polkit_the_prompt_answers_as_the_machine_is_prepared \
            --nocapture 2>&1 | tee /tmp/a2m-presence-stage.log
          grep -q 'test result: ok. 1 passed' /tmp/a2m-presence-stage.log
          SCRIPT
          sudo chmod 0755 /usr/local/bin/a2m-presence-stage
      - name: Create the test account with a made-up password, and start polkit
        run: |
          sudo useradd --no-create-home --shell /bin/sh "$ACCOUNT"
          echo "$ACCOUNT:secret-for-tests-presence" | sudo chpasswd
          sudo systemctl start polkit.service
      - name: polkit runs and the policy file is not installed
        run: a2m-presence-stage "$ACCOUNT" no_policy
      - name: Install the policy file as an administrator does
        run: |
          sudo install -m 0644 "crates/a2m-local/polkit/$ACTION.policy" "/usr/share/polkit-1/actions/$ACTION.policy"
          sudo systemctl restart polkit.service
          timeout 60 sh -c "until pkaction --action-id '$ACTION' >/dev/null 2>&1; do sleep 1; done"
          pkaction --action-id "$ACTION" --verbose
      - name: A runner has no seat, so no session on it is local and active
        run: a2m-presence-stage "$ACCOUNT" no_session
      - name: The administrator account is allowed without being asked, which proves nobody
        run: a2m-presence-stage root root
      - name: Give the test account auth_self by a rule, in the place of the seat a runner lacks
        run: |
          sudo tee /etc/polkit-1/rules.d/00-a2m-presence-test.rules >/dev/null <<RULE
          polkit.addRule(function(action, subject) {
              if (action.id == "$ACTION" && subject.user == "$ACCOUNT") {
                  return polkit.Result.AUTH_SELF;
              }
          });
          RULE
          sudo systemctl restart polkit.service
          timeout 60 sh -c "until pkaction --action-id '$ACTION' >/dev/null 2>&1; do sleep 1; done"
      - name: polkit would ask, and no agent is there to ask through
        run: a2m-presence-stage "$ACCOUNT" no_agent
      - name: A text agent types the password, wrong, right, and not at all
        run: a2m-presence-stage "$ACCOUNT" ready
      - name: Show polkit's log when a stage failed
        if: failure()
        run: sudo journalctl --unit polkit.service --no-pager | tail -n 200

  tls:
    name: Rust without TLS on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Waits for the wheel-and-npm jobs for the reason the macOS desktop job
    # gives: fewer macOS jobs ask for a runner at once. It runs whatever
    # they found.
    needs: bindings
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # HTTPS is in the default build, which the job above tests. This job
      # holds the build without it, which `--no-default-features` gives.
      - name: Lint with TLS off
        run: cargo clippy -p a2m-auth -p a2m-pack-http -p a2m-pack-mcp -p example-app -p anything2mcp -p example-mcp -p a2m-pack-web-probe --all-targets --locked --no-default-features -- -D warnings
      - name: Test with TLS off
        run: cargo test -p a2m-auth -p a2m-pack-http -p a2m-pack-mcp -p example-app -p anything2mcp -p example-mcp -p a2m-pack-web-probe --locked --no-fail-fast --no-default-features

  postgres:
    name: The data pack against a real PostgreSQL server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A missing server fails each test instead of skipping it.
      A2M_REQUIRE_POSTGRES: "1"
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # The runner image carries PostgreSQL's programs, not started. The stand
      # starts a server of its own from them, in a folder of its own. When
      # the image stops carrying them, this step says so.
      - name: The PostgreSQL programs the stand starts its own server from are here
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          test -x "$bin/initdb" && test -x "$bin/pg_ctl" && test -x "$bin/postgres"
          "$bin/postgres" --version
      - name: Lint with the server store on
        run: cargo clippy -p a2m-pack-data --all-targets --locked --features postgres -- -D warnings
      - name: Test with the server store on
        run: cargo test -p a2m-pack-data --locked --no-fail-fast --features postgres

  nats:
    name: The stream pack against a real NATS server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      A2M_TEST_NATS: 127.0.0.1:4222
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # The official image, named by its release line. It is a test's
      # counterpart and nothing of it is shipped; pinning it by digest is owed.
      - name: Start a real server with JetStream, reachable from this machine only
        run: docker run -d --name nats -p 127.0.0.1:4222:4222 nats:2.12 -js
      - name: Wait until the server greets a connection
        run: |
          for attempt in $(seq 1 60); do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/4222 && head -c 4 <&3' 2>/dev/null | grep -q INFO; then
              exit 0
            fi
            sleep 1
          done
          echo "the server did not greet a connection within a minute"
          exit 1
      - name: The pack's own client against the real server
        shell: bash
        run: |
          set -o pipefail
          cargo test -p a2m-pack-stream --locked --test nats -- the_same_client_against_a_real_server --nocapture 2>&1 | tee nats-test.log
          # The test says so when it finds no server, and passes: that is not a pass here.
          if grep -q "skipped:" nats-test.log; then
            echo "the test skipped itself"
            exit 1
          fi
          grep -q "test result: ok. 1 passed" nats-test.log
      - name: Show the server's log
        if: always()
        run: docker logs nats

  desktop:
    name: The desktop pack on Linux, against its stand
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # A machine without the programs fails each test instead of skipping it.
      A2M_REQUIRE_DESKTOP: "1"
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # No display is needed: the stand draws nothing. The test starts a
      # session bus of its own, which starts the accessibility bus on demand.
      - name: Install the session bus daemon and the accessibility bus and registry
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus-daemon at-spi2-core
      - name: Test the desktop pack against its stand
        run: cargo test --locked --no-fail-fast -p example-desk -p a2m-pack-desktop

  web-window:
    name: The sign-in window of the engine's own browser, on Linux, on a virtual display
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A machine without a display server fails each window test instead of
      # skipping it. In the matrix job above the same tests print that they
      # did not run, and pass.
      A2M_REQUIRE_DESKTOP: "1"
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # The test starts a display server of its own and gives the browser
      # its number; nothing is shown to anyone.
      - name: Install the virtual display server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      - name: Test the browser base and the web pack, the window tests among them
        run: cargo test --locked --no-fail-fast -p a2m-pack-web-browser -p a2m-pack-web-ui

  desktop-windows:
    name: The desktop pack on Windows, against its stand
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # A machine with no interactive desktop fails each test instead of skipping it.
      A2M_REQUIRE_DESKTOP: "1"
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # So that a failure for want of an interactive desktop is recognisable.
      - name: Say what desktop this runner has
        shell: pwsh
        run: |
          $p = [System.Diagnostics.Process]::GetCurrentProcess()
          "session id: $($p.SessionId)"
          "user interactive (window station visible): $([Environment]::UserInteractive)"
          "user: $([Environment]::UserName)"
          whoami /groups | Select-String 'Mandatory Label'
          query user 2>&1
          Get-Process explorer -ErrorAction SilentlyContinue | Select-Object Id, SessionId
          exit 0
      - name: Test the desktop pack against its stand
        run: cargo test --locked --no-fail-fast -p example-desk -p a2m-pack-desktop

  desktop-macos:
    name: The desktop pack on macOS, against its stand
    # Written for the macos-15 image (Apple silicon). The permission database's
    # `access` table there has the named columns the grant writes; other
    # columns (pid, boot_uuid, ...) take their defaults. Check it again if the
    # image changes.
    runs-on: macos-15
    timeout-minutes: 40
    # Six macOS jobs start with a pull request (three here besides this one,
    # two wheels in the release check). In three runs of one pull request a
    # macOS job was cancelled fifteen minutes after it was queued, with no
    # log, which reads as never having been given a runner. This one waits
    # for the wheel-and-npm jobs, as the job without TLS does, so four ask at
    # once; it runs whatever they found.
    needs: bindings
    if: ${{ !cancelled() }}
    env:
      # A test program that may not use the accessibility interface fails each
      # test, naming itself, instead of skipping it.
      A2M_REQUIRE_DESKTOP: "1"
    steps:
      # Pinned by commit; this is v7.0.1.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install the toolchain pinned in rust-toolchain.toml
        run: rustup toolchain install
      # So that a failure for want of a window server session, or of the
      # permission, is recognisable.
      - name: Say what this runner is
        run: |
          sw_vers
          uname -a
          id
          echo "session manager: $(launchctl managername)"
          echo "console user: $(stat -f %Su /dev/console)"
          pgrep -lx WindowServer || echo "no WindowServer process"
          pgrep -lx Dock || echo "no Dock process"
          csrutil status || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" ".schema access" || echo "the permission database could not be read"
          exit 0
      # The test programs' paths carry a hash cargo chooses: build them first,
      # so the grant names the very files the tests run.
      - name: Build the tests without running them
        run: |
          cargo test --locked --no-run --message-format=json -p example-desk -p a2m-pack-desktop \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' > "$RUNNER_TEMP/clients.txt"
          cat "$RUNNER_TEMP/clients.txt"
      # The CI runner only (decision 0242, point 14): the Accessibility
      # permission is granted by writing this throwaway machine's own permission
      # database as an administrator. No product code ever does this, and no
      # instruction to a person ever says to: on a person's machine the person
      # grants it in the system's settings.
      - name: Grant the Accessibility permission to the test programs on this runner
        run: |
          db="/Library/Application Support/com.apple.TCC/TCC.db"
          clients="$RUNNER_TEMP/clients.txt"
          # The programs above this shell too, in case the system judges the
          # permission by the program that started the tests.
          pid=$$
          while [ "$pid" -gt 1 ]; do
            program=$(ps -o comm= -p "$pid" | sed 's/^ *//')
            case "$program" in /*) echo "$program" >> "$clients" ;; esac
            pid=$(ps -o ppid= -p "$pid" | tr -d ' ')
          done
          sort -u "$clients" -o "$clients"
          now=$(date +%s)
          while IFS= read -r client; do
            client=$(realpath "$client")
            quoted=$(printf '%s' "$client" | sed "s/'/''/g")
            done_it=no
            for attempt in 1 2 3 4 5; do
              if sudo sqlite3 -cmd ".timeout 10000" "$db" "INSERT OR REPLACE INTO access(service,client,client_type,auth_value,auth_reason,auth_version,csreq,policy_id,indirect_object_identifier_type,indirect_object_identifier,indirect_object_code_identity,flags,last_modified) VALUES('kTCCServiceAccessibility','$quoted',1,2,4,1,NULL,NULL,0,'UNUSED',NULL,0,$now);"; then
                echo "granted: $client"; done_it=yes; break
              fi
              echo "attempt $attempt to grant $client failed"
              sleep $((attempt * 2))
            done
            [ "$done_it" = yes ] || { echo "::error::the grant for $client did not take"; exit 1; }
          done < "$clients"
          echo "what the permission database now holds for Accessibility:"
          sudo sqlite3 "$db" "SELECT client, client_type, auth_value FROM access WHERE service='kTCCServiceAccessibility';"
          sudo launchctl kickstart -k system/com.apple.tccd || sudo killall tccd || true
      # What the system now says for one test program: this test fails, naming
      # the program, when the system still says the program is not trusted.
      - name: Ask the system whether a test program may use the interface
        run: cargo test --locked -p example-desk --test stand -- a_machine_without_the_programs_skips_unless_required --nocapture
      - name: Test the desktop pack against its stand
        run: cargo test --locked --no-fail-fast -p example-desk -p a2m-pack-desktop
