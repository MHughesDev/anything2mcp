name: Release

# Builds the pip package whenever it changes, and publishes it to PyPI only when
# a version tag is pushed. PyPI's trusted publisher names this file, so it must
# stay .github/workflows/release.yml (docs/plan/publishing-setup.md). Pushing a
# version tag is the publishing step, and it is the owner's to approve.

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - ".github/workflows/release.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pip-package:
    name: Build the pip package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned by commit; this is v7.0.1. The whole history is fetched so a tag
      # can be checked against main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a tag that is not the package version on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('bindings/python/pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the package version $version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main, so CI has not passed on it there."
            exit 1
          fi
      - name: Install the build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/pip" install --quiet build==1.6.1 twine==7.0.0
      - name: Build, with file times taken from the commit so the result is repeatable
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          "$RUNNER_TEMP/tools/bin/python" -m build --outdir dist bindings/python
          sha256sum dist/*
      - name: Check the metadata
        run: |
          "$RUNNER_TEMP/tools/bin/twine" check --strict dist/*
      - name: Install the wheel into a clean environment and import it
        run: |
          python3 -m venv "$RUNNER_TEMP/try"
          "$RUNNER_TEMP/try/bin/pip" install --quiet dist/*.whl
          "$RUNNER_TEMP/try/bin/python" -c "import web2mcp, importlib.metadata as m; print('web2mcp', m.version('web2mcp'))"
      # Pinned by commit; this is v7.0.2.
      - name: Keep the built files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pip-package
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: pip-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add required reviewers to this environment in the repository's settings to
    # make GitHub ask a person before every publish.
    environment: pypi
    permissions:
      # The short-lived credential that PyPI's trusted publishing exchanges. No
      # token is stored anywhere.
      id-token: write
    steps:
      # Pinned by commit; this is v8.0.2.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pip-package
          path: dist
      # Pinned by commit; this is v1.14.3.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
