name: Bug report
description: Something does not work as the documents say it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. For a security problem, do not use this form: follow SECURITY.md instead.
        Please do not name a real application or paste real data. Describe the kind of system instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem, against the test application if possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The output of `anything2mcp --version`, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: ["Linux", "macOS", "Windows", "Other"]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The failure class and code, and any message. Check it for secrets before pasting.
      render: text
