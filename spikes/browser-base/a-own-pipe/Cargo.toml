# Throwaway. Roadmap package 0.4, candidate (a): a DevTools-protocol client of
# our own over the debugging pipe. Never promoted into the product.
[package]
name = "spike-a-own-pipe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
spike-browser-common = { path = "../common" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
command-fds = { version = "=0.3.3", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }

[profile.release]
opt-level = 3
