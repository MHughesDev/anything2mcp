# Throwaway. Roadmap package 0.4. Never promoted into the product.
# What every candidate program shares: the test application, the owned data
# directory, the timers, and the check that no browser process is left.
[package]
name = "spike-browser-common"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
example-app = { path = "../../../targets/example-app" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
