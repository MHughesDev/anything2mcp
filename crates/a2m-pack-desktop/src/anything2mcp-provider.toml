# The manifest of the desktop pack. What is not built is not declared: the
# verbs `create`, `delete`, `submit`, and `upload`, writes on Windows and
# macOS, keys and clicks, starting an application, the
# `desktop_probe` discoverer, the lint rules of the design, and every
# control but `desktop_text`. No platform list: the compiler side works on every
# system, and the driver stops at prepare with `system_not_built` where it
# has no back end.
manifest_format = 1
contract = 1

[provider]
name = "desktop"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

# Reads (decision 0198) and, on Linux, `update` and `upsert` (decision
# 0218). `snapshot` and `introspect` are sent by the discoverers only; no
# lowering gives them. `property` reads one property of the surface's
# service (decision 0316).
# No kind of step always saves: an `invoke` saves when its action is
# declared to, and the lowering refuses a `commits` mark on any other kind.
# A write holds the person's screen alone: two runs never type into one
# desktop at once (spec section 305).
[[modes]]
name = "desktop"
archetype = "interface"
verbs = ["read", "list", "update", "upsert"]
steps = ["goto", "wait", "read", "set", "invoke", "snapshot", "introspect", "property"]
commit_steps = []
rank = 60
session_reads = 1
session_writes = 1
exclusive = "screen"

[[surface_kinds]]
name = "desktop"
archetype = "interface"
session = false

[points]
driver = ["desktop"]
discoverer = ["desktop_snapshot", "desktop_service"]

[[discoverers]]
name = "desktop_snapshot"
archetype = "interface"
surface_kinds = ["desktop"]
kinds = ["window"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1048576, depth = 32 }

# Asks the service the surface names what it publishes, with the flag that
# forbids the bus to start it, and reads a `.service` file and an interface
# description a person hands it, as text and never run (decision 0316).
[[discoverers]]
name = "desktop_service"
archetype = "interface"
surface_kinds = ["desktop"]
kinds = ["dbus_service"]
sources = ["live_system", "artifact"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1048576, depth = 12 }
files = ["service_file", "interface_file"]

[[file_kinds]]
name = "screen"
directory = "screens/"
surface_kinds = ["desktop"]

[[finding_kinds]]
name = "window"
surface_kinds = ["desktop"]

[[finding_kinds]]
name = "dbus_service"
surface_kinds = ["desktop"]

# From a window's shape: a screen and a `get` read of the values it labels,
# and a screen and a `list` read of each table it names. Never an action.
[[drafting_rules]]
finding_kind = "window"
file_kind = "screen"

[[drafting_rules]]
finding_kind = "window"
file_kind = "operation"

# From a service's property that states it can only be read: a read of it.
# Never a write, and nothing for a property that states otherwise.
[[drafting_rules]]
finding_kind = "dbus_service"
file_kind = "operation"

[[controls]]
name = "desktop_text"

[[failure_codes]]
class = "drift"
code = "locator_not_found"

[[failure_codes]]
class = "drift"
code = "locator_ambiguous"

[[failure_codes]]
class = "drift"
code = "fingerprint_mismatch"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_page"

[[failure_codes]]
class = "unknown_variant"
code = "application_ambiguous"

[[failure_codes]]
class = "unknown_variant"
code = "application_not_proven"

[[failure_codes]]
class = "unknown_variant"
code = "read_too_large"

[[failure_codes]]
class = "policy"
code = "password_read_refused"

[[failure_codes]]
class = "busy"
code = "application_not_running"

[[failure_codes]]
class = "busy"
code = "accessibility_off"

[[failure_codes]]
class = "busy"
code = "target_elevated"

[[failure_codes]]
class = "policy"
code = "application_not_owned"

[[failure_codes]]
class = "busy"
code = "system_not_built"

[[failure_codes]]
class = "busy"
code = "service_not_running"

[[failure_codes]]
class = "unknown_variant"
code = "property_not_text"

[[failure_codes]]
class = "input"
code = "step_not_usable"

[[failure_codes]]
class = "rejected"
code = "app_validation_error"

[[failure_codes]]
class = "unknown_variant"
code = "field_read_only"

[[failure_codes]]
class = "unknown_variant"
code = "value_not_held"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_control"

[[failure_codes]]
class = "policy"
code = "password_set_refused"

[[failure_codes]]
class = "busy"
code = "session_in_use"

[[failure_codes]]
class = "busy"
code = "writes_not_built"

# It reads a running application a person started and the target names, on
# the person's screen. It starts nothing and reaches no network.
[effects]
attach = true
screen = true
network = "none"

[[settings]]
key = "max_nodes"
type = "int"
default = 2000
min = 10
max = 20000
doc = "The most elements one walk of a window may read. A window that holds more is not read."

[[settings]]
key = "max_depth"
type = "int"
default = 32
min = 2
max = 128
doc = "The deepest element below a window one walk may read."

[[settings]]
key = "max_read_chars"
type = "int"
default = 65536
min = 64
max = 1048576
doc = "The longest text one read of an element may return, in characters."
