[package]
name = "a2m-pack-desktop"
description = "The desktop pack: a driver over Windows UI Automation, macOS Accessibility, and Linux AT-SPI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The Linux back end: AT-SPI over the workspace's own D-Bus crate, through
# proxies of this crate's own (decision 0198).
[target.'cfg(target_os = "linux")'.dependencies]
futures-core.workspace = true
# A program's digest, as the surface states it: SHA-256 of its file.
sha2.workspace = true
zbus.workspace = true

# The Windows back end: UI Automation, the process checks, and the event
# hook, through the workspace's `windows` crate with the features they need
# and no more (decision 0209).
[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Ole", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

# The macOS back end: the system's accessibility interface (AXUIElement and
# AXObserver) and the Core Foundation types it answers in, with only the
# parts it calls; the C library for the process table and the wait on an
# application's exit (decision 0244).
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
objc2-application-services = { workspace = true, features = ["AXError", "AXUIElement", "HIServices", "libc"] }
objc2-core-foundation = { workspace = true, features = ["CFArray", "CFNumber", "CFRunLoop", "CFString"] }
sha2.workspace = true

[dev-dependencies]
# The reading of the test `every_failure_takes_its_class_from_a_table`.
a2m-core = { path = "../a2m-core", features = ["testing"] }
# For a write's tests: the field type's own comparison, and real intent
# tokens from a real store, as the engine holds them at a commit point.
a2m-expr = { path = "../a2m-expr" }
a2m-ledger = { path = "../a2m-ledger", features = ["testing"] }
a2m-vault = { path = "../a2m-vault" }
example-desk = { path = "../../targets/example-desk" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
