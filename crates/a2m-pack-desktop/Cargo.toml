[package]
name = "a2m-pack-desktop"
description = "The desktop pack: a driver over Windows UI Automation, macOS Accessibility, and Linux AT-SPI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The Linux back end: AT-SPI over the workspace's own D-Bus crate, through
# proxies of this crate's own (decision 0198). Windows and macOS have no
# back end yet, and so no system crate.
[target.'cfg(target_os = "linux")'.dependencies]
futures-core.workspace = true
# A program's digest, as the surface states it: SHA-256 of its file.
sha2.workspace = true
zbus.workspace = true

[dev-dependencies]
example-desk = { path = "../../targets/example-desk" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
