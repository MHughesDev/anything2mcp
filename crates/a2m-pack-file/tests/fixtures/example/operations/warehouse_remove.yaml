operation: example_warehouse_remove
title: Remove a warehouse
effect: irreversible
key: code
commit_points: 1
inputs:
  code: {type: identifier, description: "Warehouse code, such as W2"}
outputs:
  cutoff: {type: cutoff}
bindings:
  - mode: file
    verb: delete
    status: shadow
    document: settings
    record: warehouse
    key: {code: input.code}
    read_back: {record: warehouse}
description: >
  Removes one warehouse from the settings file.
