operation: example_ini_note_stripped_set
title: Set the order note inside its quotes
effect: write
# A settings record is one fixed place, which the document declares by
# giving it no key: no input chooses it (decision 0252).
identity: {strategy: natural, place: fixed}
commit_points: 1
inputs:
  note: {type: note, description: "The note"}
outputs:
  note: {type: note}
bindings:
  - mode: file
    verb: update
    status: shadow
    document: ini_quoted
    record: orders
    fields: {note: input.note}
    read_back: {record: orders}
description: >
  Sets the quoted note, through a document that says the quotes are around the value.
