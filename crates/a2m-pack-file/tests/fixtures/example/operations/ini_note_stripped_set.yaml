operation: example_ini_note_stripped_set
title: Set the order note inside its quotes
effect: write
# A settings value is one fixed place. The compiler asks one identity input
# of a write all the same (decision 0246 names the gap), so the record is
# named by an input the binding does not use.
key: settings
commit_points: 1
inputs:
  settings: {type: identifier, description: "The settings record written, such as orders"}
  note: {type: note, description: "The note"}
outputs:
  note: {type: note}
bindings:
  - mode: file
    verb: update
    status: shadow
    document: ini_quoted
    record: orders
    fields: {note: input.note}
    read_back: {record: orders}
description: >
  Sets the quoted note, through a document that says the quotes are around the value.
