operation: example_plist_set
title: Set the property list settings
effect: write
# A settings value is one fixed place. The compiler asks one identity input
# of a write all the same (decision 0246 names the gap), so the record is
# named by an input the binding does not use.
key: settings
commit_points: 1
inputs:
  settings: {type: identifier, description: "The settings record written, such as orders"}
  title: {type: note, description: "The title"}
  next_number: {type: integer, description: "The next number"}
  open: {type: boolean, description: "Whether it is open"}
outputs:
  title: {type: note}
  next_number: {type: integer}
  open: {type: boolean}
bindings:
  - mode: file
    verb: update
    status: shadow
    document: plist_settings
    record: general
    fields: {title: input.title, next_number: input.next_number, open: input.open}
    read_back: {record: general}
description: >
  Sets three values of the property list.
