operation: example_plist_rate_set
title: Set the rate in the property list
effect: write
# A settings record is one fixed place, which the document declares by
# giving it no key: no input chooses it (decision 0252).
identity: {strategy: natural, place: fixed}
commit_points: 1
inputs:
  rate: {type: rate, description: "The rate"}
outputs:
  rate: {type: rate}
bindings:
  - mode: file
    verb: update
    status: shadow
    document: plist_settings
    record: orders
    fields: {rate: input.rate}
    read_back: {record: orders}
description: >
  Sets a value of a nested dictionary of the property list.
