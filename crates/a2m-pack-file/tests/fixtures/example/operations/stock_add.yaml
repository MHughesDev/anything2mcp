operation: example_stock_add
title: Add an item to the stock
effect: write
key: item_code
commit_points: 1
inputs:
  item_code: {type: identifier, description: "Item code, such as EX-1009"}
  on_hand: {type: integer, description: "The quantity on hand"}
  note: {type: note, description: "A note about the item"}
outputs:
  on_hand: {type: integer}
bindings:
  - mode: file
    verb: create
    status: shadow
    document: stock
    record: stock
    key: {item_code: input.item_code}
    fields: {on_hand: input.on_hand, note: input.note}
    read_back: {record: stock}
description: >
  Adds one item to the stock file.
