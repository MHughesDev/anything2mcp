# The data pack's manifest. Everything the pack registers is declared here
# first; the registry refuses anything else.
manifest_format = 1
contract = 1

[provider]
name = "data"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

# One mode, for relational stores. `catalog` is the step the discoverer
# sends; no lowering emits it.
[[modes]]
name = "sql"
archetype = "request"
verbs = ["read", "list", "search", "create", "update", "delete"]
steps = ["begin", "execute", "fetch", "expect_rows", "commit", "catalog"]
rank = 30
session_reads = 4
session_writes = 1
exclusive = "surface"

[[surface_kinds]]
name = "database"
archetype = "request"
session = true

[points]
driver = ["sql"]
discoverer = ["catalog"]

[[discoverers]]
name = "catalog"
archetype = "request"
surface_kinds = ["database"]
kinds = ["table"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 4000000, depth = 1 }

[[file_kinds]]
name = "statement"
directory = "statements/"
surface_kinds = ["database"]

[[finding_kinds]]
name = "table"
surface_kinds = ["database"]

[[lint_rules]]
code = "data.hazard_not_declared"
level = "error"
summary = "An operation bound to a write statement that declares a hazard declares that hazard too."

[[lint_rules]]
code = "data.statement_unused"
level = "warning"
summary = "Every declared statement is named by a binding."

[[drafting_rules]]
finding_kind = "table"
file_kind = "statement"

[[failure_codes]]
class = "transient"
code = "upstream_unavailable"

[[failure_codes]]
class = "busy"
code = "store_locked"

[[failure_codes]]
class = "rejected"
code = "constraint_violated"

[[failure_codes]]
class = "policy"
code = "denied_by_store"

[[failure_codes]]
class = "policy"
code = "read_statement_wrote"

[[failure_codes]]
class = "policy"
code = "statement_not_allowed"

[[failure_codes]]
class = "drift"
code = "schema_changed"

[[failure_codes]]
class = "drift"
code = "read_not_by_key"

[[failure_codes]]
class = "drift"
code = "key_not_unique"

[[failure_codes]]
class = "stale"
code = "changed_since_preview"

[[failure_codes]]
class = "stale"
code = "version_conflict"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_status"

[[failure_codes]]
class = "unknown_variant"
code = "value_kind_unsupported"

[[failure_codes]]
class = "unknown_variant"
code = "result_too_large"

[[failure_codes]]
class = "unknown_variant"
code = "catalog_too_large"

[[failure_codes]]
class = "input"
code = "value_not_bindable"

[[failure_codes]]
class = "input"
code = "payload_unreadable"

# An embedded store is a file inside the project folder. No network: no
# server store is built yet.
[effects]
read_roots = ["project"]
write_roots = ["project"]
network = "none"
sessions = ["database"]

[[settings]]
key = "max_rows"
type = "int"
default = 1000
min = 1
max = 100000
doc = "The most rows a statement's `max_rows` may ask for."

[[settings]]
key = "result_bytes"
type = "int"
default = 4000000
min = 1024
max = 268435456
doc = "The most bytes of text one statement's result may hold."
