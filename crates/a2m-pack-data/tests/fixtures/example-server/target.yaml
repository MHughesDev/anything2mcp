# The store of the imaginary order-entry system `example` on a server, as the
# data pack sees it. It describes no real product. The port and the database
# are replaced by those of the test's own server when a test runs.
schema_version: 1
target: example
title: Example order entry, its server store
surfaces:
  orders_server:
    kind: database_server
    store: postgres
    host: 127.0.0.1
    port: 5432
    database: example
    stands: alone
environments:
  test:
    kind: test
    test_records: [["A-100", "L-101"]]
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
