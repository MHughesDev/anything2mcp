operation: example_order_get
title: Get an order
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number"}
outputs:
  status: {type: note}
bindings:
  - mode: sql
    statement: order_by_key
description: >
  Reads one order by its number, with the moment it was submitted.
  Prefer example_line_item_get for one line of the order.
