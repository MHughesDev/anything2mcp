operation: example_line_item_describe
title: Describe a line item
effect: irreversible
hazard: data_elsewhere
key: [order_id, item_code]
inputs:
  order_id: {type: identifier, description: "Order number"}
  item_code: {type: identifier, description: "Item code, such as L-101"}
  description: {type: note, description: "What the item is"}
outputs:
  description: {type: note}
bindings:
  - mode: sql
    verb: update
    statement: line_item_describe
    read_back: line_item_by_key
description: >
  Changes the description of one line item, whatever its version.
  Prefer example_line_item_update to change the length or the price.
