operation: example_order_line_get
title: Get the line of an order
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number"}
outputs:
  item_code: {type: identifier}
bindings:
  - mode: sql
    statement: line_of_order
description: >
  Reads the one line of an order that has a single line, by the order alone.
  Prefer example_line_item_get to read a line by its full key.
