operation: example_order_discount
title: Read an order's discount
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number"}
outputs:
  order_id: {type: identifier}
bindings:
  - mode: sql
    statement: order_discount
description: >
  Reads the discount of one order, which the store keeps as a float.
  Prefer example_order_get for the order without it.
