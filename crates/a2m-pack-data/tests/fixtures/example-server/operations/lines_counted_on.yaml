operation: example_lines_counted_on
title: List an order's lines (counted_on)
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number"}
outputs:
  item_code: {type: identifier, list: true}
bindings:
  - mode: sql
    verb: list
    statement: lines_counted_on
description: >
  Lists the lines of an order while it draws a number from a sequence.
  Prefer example_order_lines_list, which only reads.
