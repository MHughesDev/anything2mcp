operation: example_shipment_get
title: Get a shipment
effect: read
key: shipment_id
inputs:
  shipment_id: {type: integer, description: "Shipment number the store assigned"}
outputs:
  carrier: {type: note}
  external_ref: {type: identifier}
bindings:
  - mode: sql
    statement: shipment_by_key
description: >
  Reads one shipment by the number the store assigned to it.
  Prefer example_shipment_create to add a shipment.
