operation: example_line_item_delete
title: Delete a line item
effect: irreversible
hazard: data_elsewhere
key: [order_id, item_code]
inputs:
  order_id: {type: identifier, description: "Order number"}
  item_code: {type: identifier, description: "Item code, such as L-101"}
outputs:
  length: {type: length_inches}
bindings:
  - mode: sql
    verb: delete
    statement: line_item_delete
    read_back: line_item_by_key
description: >
  Deletes one line item of an order by its key; the read-back expects it absent.
  Prefer example_line_item_update to change a line that should stay.
