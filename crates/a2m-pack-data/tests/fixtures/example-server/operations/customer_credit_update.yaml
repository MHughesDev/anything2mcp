operation: example_customer_credit_update
title: Set a customer's credit limit
effect: write
key: customer_id
inputs:
  customer_id: {type: identifier, description: "Customer number"}
  credit_limit_cents: {type: integer, description: "The limit, in whole cents"}
outputs:
  credit_limit_cents: {type: integer}
bindings:
  - mode: sql
    verb: update
    statement: customer_credit_update
    read_back: customer_by_key
description: >
  Sets the credit limit of one customer, in whole cents, and reads it back.
  Prefer example_customer_get to read the limit without changing it.
