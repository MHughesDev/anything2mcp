operation: example_shipment_create
title: Create a shipment
effect: irreversible
hazard: data_elsewhere
identity: {strategy: none}
inputs:
  order_id: {type: identifier, description: "Order number"}
  carrier: {type: note, description: "Who carries it"}
  external_ref: {type: identifier, description: "The caller's own reference"}
outputs:
  shipment_id: {type: integer}
bindings:
  - mode: sql
    verb: create
    statement: shipment_insert
description: >
  Adds a shipment to an order; the store assigns its number and returns it.
  Prefer example_shipment_get to read a shipment that exists.
