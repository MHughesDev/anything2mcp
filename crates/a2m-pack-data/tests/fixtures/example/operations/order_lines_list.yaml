operation: example_order_lines_list
title: List the lines of an order
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number"}
outputs:
  item_code: {type: identifier, list: true}
bindings:
  - mode: sql
    verb: list
    statement: lines_of_order
description: >
  Lists the line items of one order from the store, up to five hundred.
  Prefer example_line_item_get to read one line by its key.
