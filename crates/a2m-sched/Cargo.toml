[package]
name = "a2m-sched"
description = "Queues, record locks, quotas, and runner dispatch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-core = { path = "../a2m-core" }
a2m-ledger = { path = "../a2m-ledger" }
a2m-telemetry = { path = "../a2m-telemetry" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The policy engine's stand-in in the tests (decision 0145).
a2m-ledger = { path = "../a2m-ledger", features = ["testing"] }
a2m-vault = { path = "../a2m-vault" }
# The tests ask the store's database what it holds through a connection of
# their own; the one SQLite the workspace links.
rusqlite.workspace = true

[lints]
workspace = true
