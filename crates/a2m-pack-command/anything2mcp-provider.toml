# The command pack's manifest: everything it may register and do.
# Spec section 306 is the design; `docs/architecture/crates/a2m-pack-command.md`
# says how the crate carries it out.
manifest_format = 1
contract = 1

[provider]
name = "command"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

[[modes]]
name = "cli"
archetype = "command"
verbs = ["read", "list", "search", "create", "update", "delete", "call"]
steps = ["spawn", "expect", "parse"]
rank = 60
exclusive = "surface"

[[surface_kinds]]
name = "program"
archetype = "command"

[points]
driver = ["cli"]
discoverer = ["help", "binary"]

# Runs only the help and version forms a target declares. Handed a fish
# completion file under `completions` or a manual page under `manual`, as
# files of the project's `sources` folder, it reads them as text and never
# runs them (decision 0284); handed a PowerShell XML help file under
# `powershell_help` or a module manifest under `module_manifest`, it reads
# them as data, imports no module, and starts nothing (decision 0290).
[[discoverers]]
name = "help"
archetype = "command"
surface_kinds = ["program"]
kinds = ["command", "command_file", "powershell_command"]
sources = ["live_system", "artifact"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1048576, depth = 2 }
files = ["completions", "manual", "powershell_help", "module_manifest"]

# Reads the plain facts of a binary a person hands it under `binary`, as a
# file of the project's `sources` folder: its kind and system, imports and
# exports, version resource, manifest, entitlements, and signature. It reads
# bytes only and starts nothing: the file is never run or loaded (X5,
# decision 0276). The bound of bytes is the largest program it reads.
[[discoverers]]
name = "binary"
archetype = "command"
surface_kinds = ["program"]
kinds = ["binary"]
sources = ["artifact"]
max_level = "inferred"
bounds = { seconds = 30, bytes = 268435456, depth = 3 }
files = ["binary"]

[[file_kinds]]
name = "command"
directory = "commands/"
surface_kinds = ["program"]

[[finding_kinds]]
name = "command"
surface_kinds = ["program"]

[[finding_kinds]]
name = "command_file"
surface_kinds = ["program"]

[[finding_kinds]]
name = "powershell_command"
surface_kinds = ["program"]

[[finding_kinds]]
name = "binary"
surface_kinds = ["program"]

[[lint_rules]]
code = "command.shell_program"
level = "error"
summary = "A program surface is never a shell or an interpreter."

[[lint_rules]]
code = "command.write_exit_declared"
level = "warning"
summary = "A write command declares the exit statuses that mean nothing changed."

[[drafting_rules]]
finding_kind = "command"
file_kind = "command"

[[drafting_rules]]
finding_kind = "command"
file_kind = "operation"

[[drafting_rules]]
finding_kind = "powershell_command"
file_kind = "command"

[[failure_codes]]
class = "drift"
code = "program_missing"

[[failure_codes]]
class = "drift"
code = "program_digest_changed"

[[failure_codes]]
class = "drift"
code = "program_version_unsupported"

[[failure_codes]]
class = "drift"
code = "output_unparsed"

[[failure_codes]]
class = "policy"
code = "program_path_unsafe"

[[failure_codes]]
class = "policy"
code = "limit_exceeded"

[[failure_codes]]
class = "input"
code = "argument_unsafe"

[[failure_codes]]
class = "input"
code = "schema_invalid"

[[failure_codes]]
class = "input"
code = "step_not_usable"

[[failure_codes]]
class = "rejected"
code = "app_validation_error"

[[failure_codes]]
class = "stale"
code = "version_conflict"

[[failure_codes]]
class = "stale"
code = "record_absent"

[[failure_codes]]
class = "busy"
code = "program_busy"

[[failure_codes]]
class = "transient"
code = "upstream_unavailable"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_exit_status"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_prompt"

[[failure_codes]]
class = "input"
code = "command_file_unreadable"

[[failure_codes]]
class = "input"
code = "powershell_file_unreadable"

[[failure_codes]]
class = "unknown_variant"
code = "binary_kind_unknown"

[[failure_codes]]
class = "input"
code = "binary_truncated"

[[failure_codes]]
class = "input"
code = "binary_cyclic"

[[failure_codes]]
class = "input"
code = "binary_malformed"

[[failure_codes]]
class = "possible_commit"
code = "ambiguous_match"

[effects]
# The pack starts no program of its own: only those a published compiled target
# declares for a `program` surface, by path and digest.
compiled_target_programs = true
# One fresh folder for each run is made under this root and removed after.
write_roots = ["command_runs"]
# A script a target keeps is read from the target's folder in the project.
read_roots = ["project"]
network = "none"

[[settings]]
key = "max_timeout_ms"
type = "int"
default = 600000
min = 1
max = 3600000
safer = "lower"
doc = "The longest one start of a program may run, whatever a target's files state."

[[settings]]
key = "max_output_bytes"
type = "int"
default = 16777216
min = 1
max = 1073741824
safer = "lower"
doc = "The most bytes kept of each output stream, whatever a target's files state."

[[settings]]
key = "admin_groups"
type = "list"
default = []
protected = true
safer = "fewer"
doc = "The numeric ids of groups whose members are the machine's administrators: a program, or a folder on the way to it, that such a group may write is started. Unix only; on macOS the administrators' group, 80, always counts, and on Linux none does unless named here."
