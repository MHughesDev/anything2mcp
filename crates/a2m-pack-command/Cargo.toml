[package]
name = "a2m-pack-command"
description = "The command pack: the `cli` driver over declared programs, with typed arguments and parsed output."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
regex.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
a2m-ledger = { path = "../a2m-ledger", features = ["testing"] }
a2m-vault = { path = "../a2m-vault" }
example-cli = { path = "../../targets/example-cli" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
