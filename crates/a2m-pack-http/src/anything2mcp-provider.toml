# The manifest of the HTTP pack. What is not built is not declared: the `api`
# mode, the `token` step, the edge codes, and the GraphQL and OData rules.
manifest_format = 1
contract = 1

[provider]
name = "http"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

[[modes]]
name = "http"
archetype = "request"
verbs = ["read", "list", "search", "create", "update", "upsert", "delete", "submit", "call"]
steps = ["request", "validate", "extract", "probe"]
rank = 20
session_reads = 8
session_writes = 1
exclusive = "none"

[[surface_kinds]]
name = "http"
archetype = "request"
session = true

[points]
driver = ["http"]
discoverer = ["http_surface", "http_description"]

[[discoverers]]
name = "http_surface"
archetype = "request"
surface_kinds = ["http"]
kinds = ["endpoint"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1000000, depth = 1 }

[[discoverers]]
name = "http_description"
archetype = "request"
surface_kinds = ["http"]
kinds = ["described_operation"]
sources = ["published_description"]
max_level = "inferred"
bounds = { seconds = 60, bytes = 8000000, depth = 1 }

[[file_kinds]]
name = "endpoint"
directory = "endpoints/"
surface_kinds = ["http", "web"]

[[finding_kinds]]
name = "endpoint"
surface_kinds = ["http", "web"]

[[finding_kinds]]
name = "described_operation"
surface_kinds = ["http"]

[[lint_rules]]
code = "http.secret_literal"
level = "error"
summary = "No header, query, or body template of an endpoint holds a literal that looks like a credential."

[[lint_rules]]
code = "http.no_response_schema"
level = "error"
summary = "Every endpoint states the shape of its response."

[[lint_rules]]
code = "http.effect_method"
level = "warning"
summary = "An endpoint marked `read` uses a method HTTP marks safe."

[[lint_rules]]
code = "http.signed_endpoint"
level = "error"
summary = "No `http` binding names an endpoint whose requests the front end computes or signs."

[[drafting_rules]]
finding_kind = "described_operation"
file_kind = "endpoint"

[[failure_codes]]
class = "rejected"
code = "app_validation_error"

[[failure_codes]]
class = "stale"
code = "version_conflict"

[[failure_codes]]
class = "stale"
code = "version_not_read"

[[failure_codes]]
class = "drift"
code = "response_schema_mismatch"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_status"

[[failure_codes]]
class = "unknown_variant"
code = "response_too_large"

[[failure_codes]]
class = "transient"
code = "upstream_unavailable"

[[failure_codes]]
class = "policy"
code = "surface_not_declared"

[[failure_codes]]
class = "input"
code = "path_value_refused"

[[failure_codes]]
class = "input"
code = "step_not_usable"

[[failure_codes]]
class = "input"
code = "tls_not_enabled"

[[failure_codes]]
class = "input"
code = "auth_scheme_not_built"

[[failure_codes]]
class = "input"
code = "description_unreadable"

[[failure_codes]]
class = "input"
code = "description_too_large"

[effects]
network = "surfaces"
sessions = ["http"]

[[settings]]
key = "max_response_bytes"
type = "int"
default = 8000000
min = 1024
max = 268435456
doc = "The most bytes of one response the driver reads before it stops."
