# The manifest of the HTTP pack. What is not built is not declared: writes
# through the `api` mode, and the GraphQL and OData rules.
manifest_format = 1
contract = 1

[provider]
name = "http"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

[[modes]]
name = "http"
archetype = "request"
verbs = ["read", "list", "search", "create", "update", "upsert", "delete", "submit", "call"]
steps = ["token", "request", "validate", "extract", "probe"]
# No `commit_steps`: no step kind of this mode always saves. A `request`
# saves exactly when its endpoint is marked `write`, and the lowering marks
# it `commits` then; the driver refuses an endpoint that writes from a step
# not so marked.
rank = 20
session_reads = 8
session_writes = 1
exclusive = "none"

# Reads bound to an operation of a pinned published description
# (decision 0389). A `call` never saves: a pinned description holds reads
# only. Ranked ahead of `http`, so a verified `api` binding is tried first;
# being the first, it is also the mode a surface's discovery is prepared
# in, so it takes the discoverers' `probe`, which the one driver of both
# modes carries out.
[[modes]]
name = "api"
archetype = "request"
verbs = ["read", "list", "search"]
steps = ["call", "validate", "extract", "probe"]
rank = 10
session_reads = 8
session_writes = 1
exclusive = "none"

[[surface_kinds]]
name = "http"
archetype = "request"
session = true

[points]
driver = ["http", "api"]
discoverer = ["http_surface", "http_description"]

[[discoverers]]
name = "http_surface"
archetype = "request"
surface_kinds = ["http"]
kinds = ["endpoint", "sign_in_method"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1000000, depth = 1 }

[[discoverers]]
name = "http_description"
archetype = "request"
surface_kinds = ["http"]
kinds = ["described_operation", "sign_in_method"]
sources = ["published_description"]
max_level = "inferred"
bounds = { seconds = 60, bytes = 8000000, depth = 1 }
files = ["description"]

[[file_kinds]]
name = "endpoint"
directory = "endpoints/"
surface_kinds = ["http", "web"]

[[file_kinds]]
name = "description"
directory = "descriptions/"
surface_kinds = ["http"]

[[finding_kinds]]
name = "endpoint"
surface_kinds = ["http", "web"]

[[finding_kinds]]
name = "described_operation"
surface_kinds = ["http"]

[[finding_kinds]]
name = "sign_in_method"
surface_kinds = ["http"]

[[lint_rules]]
code = "http.secret_literal"
level = "error"
summary = "No header, query, or body template of an endpoint holds a literal that looks like a credential."

[[lint_rules]]
code = "http.no_response_schema"
level = "error"
summary = "Every endpoint states the shape of its response."

[[lint_rules]]
code = "http.effect_method"
level = "error"
summary = "An endpoint marked `read` uses a method HTTP marks safe, or says with `read_asserted` that one it does not mark safe only reads."

[[lint_rules]]
code = "http.signed_endpoint"
level = "error"
summary = "No `http` binding names an endpoint whose requests the front end computes or signs."

[[lint_rules]]
code = "http.endpoint_stated_twice"
level = "error"
summary = "No endpoint entry states the operation an `api` binding binds through its pinned description."

[[lint_rules]]
code = "http.unencrypted_credentials"
level = "warning"
summary = "A surface that sends its credentials over an unencrypted link says so, and is reported on every lint."

[[drafting_rules]]
finding_kind = "described_operation"
file_kind = "endpoint"

[[drafting_rules]]
finding_kind = "described_operation"
file_kind = "operation"

[[drafting_rules]]
finding_kind = "described_operation"
file_kind = "description"

[[failure_codes]]
class = "rejected"
code = "app_validation_error"

[[failure_codes]]
class = "stale"
code = "version_conflict"

[[failure_codes]]
class = "stale"
code = "version_not_read"

[[failure_codes]]
class = "drift"
code = "response_schema_mismatch"

[[failure_codes]]
class = "drift"
code = "description_changed"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_status"

[[failure_codes]]
class = "unknown_variant"
code = "response_too_large"

[[failure_codes]]
class = "unknown_variant"
code = "document_type_refused"

[[failure_codes]]
class = "unknown_variant"
code = "answer_holds_secret"

[[failure_codes]]
class = "transient"
code = "upstream_unavailable"

[[failure_codes]]
class = "stale"
code = "token_not_read"

[[failure_codes]]
class = "drift"
code = "anti_forgery_not_found"

[[failure_codes]]
class = "unknown_variant"
code = "anti_forgery_unreadable"

[[failure_codes]]
class = "edge_blocked"
code = "rate_limited_by_edge"

[[failure_codes]]
class = "edge_blocked"
code = "forbidden_by_edge"

[[failure_codes]]
class = "policy"
code = "surface_not_declared"

[[failure_codes]]
class = "policy"
code = "link_not_encrypted"

[[failure_codes]]
class = "policy"
code = "body_not_asserted"

[[failure_codes]]
class = "policy"
code = "product_header_refused"

[[failure_codes]]
class = "busy"
code = "reads_still_running"

[[failure_codes]]
class = "input"
code = "path_value_refused"

[[failure_codes]]
class = "input"
code = "step_not_usable"

[[failure_codes]]
class = "input"
code = "tls_not_enabled"

[[failure_codes]]
class = "input"
code = "auth_scheme_not_built"

[[failure_codes]]
class = "input"
code = "description_unreadable"

[[failure_codes]]
class = "input"
code = "description_too_large"

# The session keeper's TLS failures, which the driver passes on (decision 0157).
[[failure_codes]]
class = "input"
code = "tls_setup_failed"

[[failure_codes]]
class = "unknown_variant"
code = "certificate_untrusted"

[[failure_codes]]
class = "unknown_variant"
code = "certificate_name_mismatch"

[[failure_codes]]
class = "unknown_variant"
code = "certificate_expired"

[[failure_codes]]
class = "unknown_variant"
code = "certificate_not_verified"

[[failure_codes]]
class = "unknown_variant"
code = "tls_handshake_failed"

[effects]
network = "surfaces"
sessions = ["http"]

[[settings]]
key = "max_response_bytes"
type = "int"
default = 8000000
min = 1024
max = 268435456
doc = "The most bytes of one response the driver reads before it stops."
