operation: example_order_label_get
title: Get the length and digest of an order's label
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number shown in the application"}
outputs:
  length: {type: integer}
  digest: {type: text}
bindings:
  - mode: http
