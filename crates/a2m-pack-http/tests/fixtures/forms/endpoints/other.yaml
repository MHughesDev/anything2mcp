endpoint: status_get
surface: api
method: GET
path: "/views/text/status"
auth: none
effect: read
answer:
  form: text
  pattern: 'example order entry: (?P<orders>[0-9]+) orders, (?P<draft>[0-9]+) draft, (?P<submitted>[0-9]+) submitted; newest (?P<newest>[A-Z]-[0-9]+) for (?P<customer>[^\n]+)\n'
  fields:
    orders: {type: integer}
    draft: {type: integer}
    submitted: {type: integer}
---
endpoint: legacy_status_get
surface: api
method: GET
path: "/views/text/legacy"
auth: none
effect: read
answer:
  form: text
  charset: iso-8859-1
  pattern: 'orders: (?P<orders>[0-9]+) · status: (?P<state>[a-z]+)\n'
  fields:
    orders: {type: integer}
---
endpoint: label_get
surface: api
method: GET
path: "/views/bytes/orders/{order_id}/label"
auth: none
effect: read
responses: {absent: [404]}
answer:
  form: bytes
---
endpoint: line_item_put
surface: api
method: PUT
path: "/api/orders/{order_id}/items/{item_code}"
auth: none
effect: write
headers: {accept: "application/json"}
version:
  send: {body: version}
request_schema:
  type: object
  required: [description, quantity, length_in]
  properties:
    description: {type: string}
    quantity: {type: integer}
    length_in: {type: string}
    version: {type: integer}
responses:
  ok: [200, 201]
  refused:
    - {status: 422, when: {error: validation}}
    - {status: 409, when: {error: order_not_draft}}
  conflict:
    - {status: 409, when: {error: version_conflict}, current: current_version}
response_schema:
  type: object
  required: [order_id, item_code, version]
  properties:
    order_id: {type: string}
    item_code: {type: string}
    version: {type: integer}
