operation: example_moved_get
title: Get what has moved
effect: read
inputs:
  place: {type: identifier, description: "Where the system sends the request"}
outputs:
  name: {type: text}
bindings:
  - mode: http
    verb: read
    status: verified
    endpoint: moved_get
description: >
  Reads a place the system answers with a redirect.
