# The imaginary order-entry system `example`, whose note of an order is
# written only with the anti-forgery token of the page that shows it
# (decision 0357). It describes no real product. A test gives the surface
# the address of the application it started.
schema_version: 1
target: example
title: Example order entry, notes behind an anti-forgery token
surfaces:
  api:
    kind: http
    base: "http://127.0.0.1:4010"
environments:
  test:
    kind: test
  production:
    kind: production
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
