# The route counts with `op: count` and archives with `op: archive`; a
# person asserts that the request with `op: count`, for an open or a closed
# status, and only that, changes nothing (decision 0392).
endpoint: cases_count
surface: api
method: POST
path: "/api/cases/rows/count"
auth: none
effect: read
read_asserted: true
headers: {accept: "application/json"}
request_schema:
  type: object
  additionalProperties: false
  required: [status, op]
  properties:
    status: {type: string, enum: [open, closed]}
    op: {type: string, enum: [count]}
response_schema:
  type: object
  required: [count, first, cases]
  properties:
    count: {type: integer}
    first: {type: string}
    cases: {type: array, items: {type: string}}
