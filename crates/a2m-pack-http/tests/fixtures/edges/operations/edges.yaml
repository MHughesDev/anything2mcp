operation: example_order_get
title: Get an order
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order, such as A-100"}
outputs:
  order_id: {type: identifier}
bindings:
  - mode: http
    verb: read
    status: verified
    endpoint: order_get
description: >
  Reads one order, to be answered with a status nothing declares.
