[package]
name = "a2m-actions"
description = "The action registry, the dispatcher, the settings loader, and the kernel handle."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-engine = { path = "../a2m-engine" }
a2m-files = { path = "../a2m-files" }
a2m-ledger = { path = "../a2m-ledger" }
a2m-policy = { path = "../a2m-policy" }
a2m-provider = { path = "../a2m-provider" }
a2m-sched = { path = "../a2m-sched" }
a2m-telemetry = { path = "../a2m-telemetry" }
a2m-vault = { path = "../a2m-vault" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true

[features]
# A way for the tests of the crates above this one to have a published tool
# without the compiler: `Kernel::publish_plan`. Never part of the product.
testing = []

[dev-dependencies]
a2m-expr = { path = "../a2m-expr" }
a2m-files = { path = "../a2m-files", features = ["testing"] }
example-app = { path = "../../targets/example-app" }
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
