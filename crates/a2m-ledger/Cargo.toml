[package]
name = "a2m-ledger"
description = "The run store, the ledger, reconcile, and the audit chain, on SQLite and Postgres."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
a2m-core = { path = "../a2m-core" }
# A watch's condition is evaluated on its check's own result, in the
# transaction that ends the check (decision 0291).
a2m-expr = { path = "../a2m-expr" }
a2m-logs = { path = "../a2m-logs" }
a2m-vault = { path = "../a2m-vault" }
# `hooks` gives the authorizer, which holds each crate to its own tables, and
# the update hook, which tells rule 3 what one transaction changed (decision
# 0080). Both are safe interfaces of the crate.
rusqlite = { workspace = true, features = ["hooks"] }
serde_json.workspace = true
tokio.workspace = true

[features]
# A stand-in for the policy engine, and a key to its tables, for the tests of
# crates that need a write run cleared without opening the policy engine.
# Turned on only as a feature of a dev-dependency (decision 0145). The
# crate's own tests take the key from each store they open, as the policy
# engine does, and need no feature.
testing = []

[dev-dependencies]
# The reading of the test `every_failure_takes_its_class_from_a_table`.
a2m-core = { path = "../a2m-core", features = ["testing"] }

[lints]
workspace = true
