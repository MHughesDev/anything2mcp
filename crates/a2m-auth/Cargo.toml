[package]
name = "a2m-auth"
description = "Auth providers, auth discovery, and the session keeper."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# HTTPS to identity services' token endpoints: rustls with the ring provider
# and the platform's certificate verifier. Off by default, because switching
# it on makes every HTTP client in the same build need a TLS provider
# (decision 0084). Without it, a token endpoint must be a loopback address.
tls = ["reqwest/rustls-no-provider", "dep:rustls"]

[dependencies]
a2m-core = { path = "../a2m-core" }
a2m-ledger = { path = "../a2m-ledger" }
a2m-telemetry = { path = "../a2m-telemetry" }
a2m-vault = { path = "../a2m-vault" }
reqwest.workspace = true
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
axum.workspace = true

[lints]
workspace = true
