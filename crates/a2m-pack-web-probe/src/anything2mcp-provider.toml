# The manifest of the web pack's discoverers. What is not built is not
# declared: `web_auth`, `web_endpoints`, `web_declared`, and the finding
# kinds `field`, `action`, and `declared_tool`.
manifest_format = 1
contract = 1

[provider]
name = "web_probe"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

# The `endpoint` finding belongs to the HTTP pack. This pack produces it as
# data and does not own its form.
[[reads]]
kind = "endpoint"
of = "finding_kinds"
surface_kind = "web"

[points]
discoverer = ["web_probe", "web_snapshot", "web_capture"]

[[discoverers]]
name = "web_probe"
archetype = "interface"
surface_kinds = ["web"]
kinds = ["surface", "sign_in_method"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1000000, depth = 0 }

[[discoverers]]
name = "web_snapshot"
archetype = "interface"
surface_kinds = ["web"]
kinds = ["screen"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 120, bytes = 4000000, depth = 1 }

[[discoverers]]
name = "web_capture"
archetype = "interface"
surface_kinds = ["web"]
kinds = ["exchange", "endpoint"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 120, bytes = 4000000, depth = 0 }

[[finding_kinds]]
name = "surface"
surface_kinds = ["web"]

[[finding_kinds]]
name = "sign_in_method"
surface_kinds = ["web"]

[[finding_kinds]]
name = "screen"
surface_kinds = ["web"]

[[finding_kinds]]
name = "exchange"
surface_kinds = ["web"]

[[failure_codes]]
class = "edge_blocked"
code = "forbidden_by_edge"

[[failure_codes]]
class = "edge_blocked"
code = "rate_limited_by_edge"

[[failure_codes]]
class = "session_expired"
code = "needs_login"

[[failure_codes]]
class = "policy"
code = "surface_not_declared"

[[failure_codes]]
class = "input"
code = "focus_invalid"

[[failure_codes]]
class = "unknown_variant"
code = "page_unreadable"

[[failure_codes]]
class = "transient"
code = "page_not_loaded"

# The browser is started for a profile of the engine's own, under the root
# `profiles`, and reaches only the target's declared surfaces.
[effects]
write_roots = ["profiles"]
network = "surfaces"

# The places of `a2m-pack-web-browser`'s `KNOWN_PLACES`; a test holds the two
# lists equal. The supervisor starts only a program a manifest declares.
[[requirements]]
name = "browser"
missing = "Install Chrome, Edge, or Chromium."

[requirements.detect]
paths = [
    '/opt/google/chrome/chrome',
    '/opt/microsoft/msedge/msedge',
    '/usr/lib/chromium/chromium',
    '/usr/lib/chromium-browser/chromium-browser',
    '/usr/lib64/chromium-browser/chromium-browser',
    '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome',
    '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge',
    '/Applications/Chromium.app/Contents/MacOS/Chromium',
    'C:\Program Files\Google\Chrome\Application\chrome.exe',
    'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe',
    'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
    'C:\Program Files\Microsoft\Edge\Application\msedge.exe',
]

[[settings]]
key = "max_pages"
type = "int"
default = 20
min = 1
max = 500
doc = "The most pages one discovery looks at before it stops and says so."
