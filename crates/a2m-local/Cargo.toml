[package]
name = "a2m-local"
description = "The local channel: socket and named pipe, peer check, engine lock, and the person surface on one machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-actions = { path = "../a2m-actions" }
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-policy = { path = "../a2m-policy" }
a2m-telemetry = { path = "../a2m-telemetry" }
a2m-vault = { path = "../a2m-vault" }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus.workspace = true
zbus_polkit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSDictionary", "NSError", "NSString", "NSValue"] }
objc2-local-authentication = { workspace = true, features = ["LAContext", "LAError", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future.workspace = true
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
a2m-actions = { path = "../a2m-actions", features = ["testing"] }
a2m-engine = { path = "../a2m-engine" }
a2m-expr = { path = "../a2m-expr" }
a2m-files = { path = "../a2m-files", features = ["testing"] }
a2m-ledger = { path = "../a2m-ledger" }
a2m-provider = { path = "../a2m-provider" }
a2m-sources = { path = "../a2m-sources" }
example-app = { path = "../../targets/example-app" }
reqwest.workspace = true
serde.workspace = true

[lints]
workspace = true
