[package]
name = "a2m-netstate"
description = "Reads what this machine already knows about its own place on its networks, from the operating system, and sends nothing to any other machine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# The dependency list is closed: a test reads this file and refuses any other
# entry, because nothing here may be able to reach another machine
# (decision 0243).
[dependencies]
a2m-core = { path = "../a2m-core" }
serde.workspace = true

# Linux: the route-netlink socket, which speaks only to this machine's kernel.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["net"] }

# macOS: the interface list and the routing socket's table dump.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Windows: the IP Helper tables, the current user's proxy setting, and the
# name of a process's program.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Networking_WinHttp", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
