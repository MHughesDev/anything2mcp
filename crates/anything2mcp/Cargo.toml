[package]
name = "anything2mcp"
description = "The Anything2MCP binary and the library facade for embedding the engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Two small binary targets are built from one module; `cargo run` starts
# the one with the product's name.
default-run = "anything2mcp"

[features]
# HTTPS for the session keeper, the HTTP pack, and the MCP pack, and the
# test application's TLS-aware harness for this crate's tests. On by default
# since the conditions of decisions 0157 and 0166 held (decision 0181); a
# build with `--no-default-features` refuses an `https` surface by name.
default = ["tls"]
tls = ["a2m-auth/tls", "a2m-pack-http/tls", "a2m-pack-mcp/tls", "example-app/tls"]

[dependencies]
a2m-actions = { path = "../a2m-actions" }
a2m-api = { path = "../a2m-api" }
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-local = { path = "../a2m-local" }
a2m-mcp = { path = "../a2m-mcp" }
a2m-pack-command = { path = "../a2m-pack-command" }
a2m-pack-data = { path = "../a2m-pack-data" }
a2m-pack-device = { path = "../a2m-pack-device" }
a2m-pack-file = { path = "../a2m-pack-file" }
a2m-pack-http = { path = "../a2m-pack-http" }
a2m-pack-mcp = { path = "../a2m-pack-mcp" }
a2m-pack-stream = { path = "../a2m-pack-stream" }
a2m-pack-web-browser = { path = "../a2m-pack-web-browser" }
a2m-pack-web-probe = { path = "../a2m-pack-web-probe" }
a2m-pack-web-ui = { path = "../a2m-pack-web-ui" }
a2m-policy = { path = "../a2m-policy" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
a2m-vault = { path = "../a2m-vault" }
# The routers of the front doors are joined here, and the bridge keeps a
# connection for as long as the body of its answer is read.
axum.workspace = true
futures-core.workspace = true
serde_json.workspace = true
# `serve` stops on the operating system's signal; `bridge` copies standard
# input and output.
tokio = { workspace = true, features = ["io-std", "io-util", "signal"] }

[dev-dependencies]
# The person of a test opens the approval page over loopback.
reqwest.workspace = true
# And presses it in a real browser: the browser engine of the web pack, with
# the test equipment that names the test environment's browser.
a2m-pack-web-browser = { path = "../a2m-pack-web-browser", features = ["test-support"] }
example-app = { path = "../../targets/example-app" }
example-broker = { path = "../../targets/example-broker" }
example-cli = { path = "../../targets/example-cli" }
example-db = { path = "../../targets/example-db" }
example-device = { path = "../../targets/example-device" }
example-files = { path = "../../targets/example-files" }
example-mcp = { path = "../../targets/example-mcp" }

[lints]
workspace = true
