# The imaginary order-entry system `example`, behind its own sign-in page:
# the part of the built-in test application under `/secure`. A test gives
# the surface the address of the application it started.
schema_version: 1
target: example
title: Example order entry, how it signs in
surfaces:
  app:
    kind: web
    origin: "http://127.0.0.1:4010"
    viewport: {width: 1280, height: 800}
    color_scheme: light
    reduced_motion: true
environments:
  test:
    kind: test
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
