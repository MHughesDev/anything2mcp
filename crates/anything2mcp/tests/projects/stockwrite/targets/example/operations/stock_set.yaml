operation: example_stock_set
title: Set the stock of an item
effect: write
key: item_code
commit_points: 1
inputs:
  item_code: {type: identifier, description: "Item code, such as EX-1001"}
  on_hand: {type: integer, description: "The quantity on hand"}
outputs:
  on_hand: {type: integer}
bindings:
  - mode: file
    verb: update
    status: verified
    document: stock
    record: stock
    key: {item_code: input.item_code}
    fields: {on_hand: input.on_hand}
    read_back: {record: stock}
description: >
  Sets the quantity on hand of one item in the stock file. The file is
  replaced by a new one in one step and read back by opening it again.
