# The imaginary order-entry system `example`, used through its pages. It
# describes no real product. The address is the one the built-in test
# application listens on when started by hand; a test gives the surface the
# address of the application it started.
schema_version: 1
target: example
title: Example order entry
surfaces:
  app:
    kind: web
    origin: "http://127.0.0.1:4010"
    viewport: {width: 1280, height: 800}
    color_scheme: light
    reduced_motion: true
environments:
  test:
    kind: test
    test_records: [["A-100", "L-101"]]
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
