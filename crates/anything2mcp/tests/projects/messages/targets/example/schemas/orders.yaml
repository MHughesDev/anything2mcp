schema: order_status
type: object
required: [order_id, status]
properties:
  order_id: {type: string}
  status: {type: string, enum: [draft, submitted, shipped]}
---
schema: order_event
type: object
required: [order_id, event]
properties:
  order_id: {type: string}
  event: {type: string, enum: [created, submitted, shipped]}
