operation: example_order_get
title: Get an order
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number shown in the application"}
outputs:
  status: {type: identifier}
  customer: {type: text}
examples:
  - {order_id: "A-100"}
bindings:
  - mode: http
    verb: read
    status: verified
    endpoint: order_get
description: >
  Reads the status and the customer of one order.
