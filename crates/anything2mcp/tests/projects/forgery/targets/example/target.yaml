# The imaginary order-entry system `example`, reached through its JSON
# interface. It describes no real product. The address is the one the
# built-in test application listens on when started by hand; a test gives
# the surface the address of the application it started.
schema_version: 1
target: example
title: Example order entry, notes behind a token
surfaces:
  api:
    kind: http
    base: "http://127.0.0.1:4010"
environments:
  test:
    kind: test
    test_records: ["A-102"]
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
