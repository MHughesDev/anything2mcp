[package]
name = "a2m-pack-web-browser"
description = "The web pack's base: the DevTools-protocol browser engine and the platform profiles."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test equipment only (decision 0110): lets a test name the browser program
# and switch the browser's sandbox off. The product crate never enables it.
test-support = []

[dependencies]
a2m-core = { path = "../a2m-core" }
a2m-netstate = { path = "../a2m-netstate" }
a2m-provider = { path = "../a2m-provider" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

# The memory a browser's processes hold, measured by the system calls of
# each operating system (decision 0425); Linux reads its own tables.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
a2m-telemetry = { path = "../a2m-telemetry" }
example-app = { path = "../../targets/example-app" }
tokio = { workspace = true, features = ["test-util"] }

# The test program that stops as it starts closes one end of its pipe
# itself, which has no safe form.
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
