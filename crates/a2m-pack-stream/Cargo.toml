[package]
name = "a2m-pack-stream"
description = "The stream pack: the `stream` driver over queues and topics, with bounded reads and keyed publishes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-provider = { path = "../a2m-provider" }
serde.workspace = true
# The first wire protocol is lines over a socket: buffered reads and writes.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
a2m-ledger = { path = "../a2m-ledger" }
a2m-telemetry = { path = "../a2m-telemetry" }
a2m-vault = { path = "../a2m-vault" }
example-broker = { path = "../../targets/example-broker" }
serde_json.workspace = true

[lints]
workspace = true
