# The stream pack's manifest (spec sections 203 and 309). The registry
# checks every registration against it.
manifest_format = 1
contract = 1

[provider]
name = "stream"
version = "0.1.0"
publisher = "Anything2MCP"
kind = "pack"

[[modes]]
name = "stream"
archetype = "stream"
verbs = ["read", "list", "await", "publish", "take"]
# `channels` and `describe` are sent by the discoverer only; no lowering
# gives them.
steps = ["latest", "browse", "subscribe", "await", "publish", "acknowledge", "scan", "position", "taken", "channels", "describe"]
commit_steps = ["publish", "acknowledge"]
rank = 60
intent_window = 1
session_reads = 4
session_writes = 1
exclusive = "link"

[[surface_kinds]]
name = "broker"
archetype = "stream"
session = true

[points]
driver = ["stream"]
discoverer = ["broker_look"]

[[discoverers]]
name = "broker_look"
archetype = "stream"
surface_kinds = ["broker"]
kinds = ["channel", "message_schema", "message_shape"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 1048576, depth = 1 }

[[file_kinds]]
name = "channel"
directory = "channels/"
surface_kinds = ["broker"]

[[file_kinds]]
name = "message_schema"
directory = "schemas/"
surface_kinds = ["broker"]

[[finding_kinds]]
name = "channel"
surface_kinds = ["broker"]

[[finding_kinds]]
name = "message_schema"
surface_kinds = ["broker"]

[[finding_kinds]]
name = "message_shape"
surface_kinds = ["broker"]

[[lint_rules]]
code = "stream.channel_invalid"
level = "error"
summary = "A channel file states a wait, a limit, a key, or a read path that fits its shape and the settings' ceiling."

[[lint_rules]]
code = "stream.unknown_schema"
level = "error"
summary = "A channel names a message schema that a file under `schemas/` defines."

[[lint_rules]]
code = "stream.schema_unsupported"
level = "error"
summary = "A message schema uses only the part of JSON Schema this pack checks."

[[lint_rules]]
code = "stream.unknown_channel"
level = "error"
summary = "A binding names a channel that a file under `channels/` defines."

[[lint_rules]]
code = "stream.binding_invalid"
level = "error"
summary = "A binding states what its verb needs, and nothing its verb cannot use."

[[lint_rules]]
code = "stream.verb_needs_shape"
level = "error"
summary = "A verb is used only on a channel whose shape and read path allow it."

[[lint_rules]]
code = "stream.wait_unbounded"
level = "error"
summary = "Every wait has a time limit, no longer than the channel's and the settings' ceiling."

[[lint_rules]]
code = "stream.ack_not_owned"
level = "error"
summary = "A message is taken and acknowledged only on a queue the target declares the runtime owns."

[[lint_rules]]
code = "stream.publish_effect"
level = "error"
summary = "A publish declares the effect and the hazard its channel requires."

[[lint_rules]]
code = "stream.consumers_unknown"
level = "warning"
summary = "A channel that is published to says who reads it."

[[lint_rules]]
code = "stream.protocol_unfit"
level = "error"
summary = "A channel states only what the wire protocol its surface speaks can carry."

[[lint_rules]]
code = "stream.untrusted_unmarked"
level = "error"
summary = "An output that holds text a broker returns is of a field type marked untrusted, or a field the channel's schema holds to an `enum`."

[[drafting_rules]]
finding_kind = "channel"
file_kind = "channel"

[[drafting_rules]]
finding_kind = "message_schema"
file_kind = "message_schema"

[[drafting_rules]]
finding_kind = "channel"
file_kind = "operation"

[[failure_codes]]
class = "input"
code = "schema_invalid"

[[failure_codes]]
class = "input"
code = "value_out_of_range"

[[failure_codes]]
class = "input"
code = "message_too_large"

[[failure_codes]]
class = "input"
code = "protocol_unknown"

[[failure_codes]]
class = "input"
code = "credential_not_carried"

[[failure_codes]]
class = "input"
code = "nothing_recorded"

# A compiled target made by another build of the pack: `a2m-core`'s own code.
[[failure_codes]]
class = "input"
code = "payload_unreadable"

[[failure_codes]]
class = "policy"
code = "ack_not_owned"

[[failure_codes]]
class = "policy"
code = "surface_not_declared"

[[failure_codes]]
class = "policy"
code = "scan_limit"

[[failure_codes]]
class = "policy"
code = "transport_refused"

[[failure_codes]]
class = "policy"
code = "take_too_large"

[[failure_codes]]
class = "rejected"
code = "broker_refused"

[[failure_codes]]
class = "drift"
code = "channel_missing"

[[failure_codes]]
class = "drift"
code = "shape_changed"

[[failure_codes]]
class = "drift"
code = "response_schema_mismatch"

[[failure_codes]]
class = "drift"
code = "position_out_of_range"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_reply"

[[failure_codes]]
class = "transient"
code = "upstream_unavailable"

[[failure_codes]]
class = "transient"
code = "nothing_arrived"

[[failure_codes]]
class = "busy"
code = "subscription_in_use"

[[failure_codes]]
class = "busy"
code = "message_may_be_held"

[[failure_codes]]
class = "policy"
code = "scan_inconclusive"

[effects]
network = "surfaces"
sessions = ["broker"]

[[settings]]
key = "wait_ceiling_seconds"
type = "int"
default = 60
min = 1
max = 3600
doc = "The longest any wait for a message may last, in seconds. A channel or a binding that asks for more does not compile."

[[settings]]
key = "sample_count"
type = "int"
default = 5
min = 0
max = 100
doc = "How many messages of one channel a discovery looks at, without taking any, to learn the shape of its messages."

[[settings]]
key = "message_ceiling_bytes"
type = "int"
default = 8388608
min = 1024
max = 67108864
doc = "The largest message, in bytes, the pack reads from or sends to a broker, whatever the broker states as its own limit. A larger one stops by name before anything is set aside for it."

[[settings]]
key = "idle_links"
type = "int"
default = 2
min = 0
max = 16
doc = "How many open connections to one broker are kept ready between the runs of one session."
