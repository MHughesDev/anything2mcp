# Each channel that keeps messages is a stream, named before the `/`; the
# subject after it is where its messages are published, a key as its last
# token. A topic is a subject no stream keeps.
channel: orders.status
address: ORDERS_STATUS/example.orders.status
shape: retained
role: state
schema: order_status
key: {field: order_id, type: identifier}
correlation: {field: headers.correlation_id}
read_through: [browse, own_subscription]
subscription: status_watch
consumers: none
wait: {default: 2s, max: 10s}
limits: {browse_count: 100, message_bytes: 65536}
---
channel: orders.events
address: ORDERS_EVENTS/example.orders.events
shape: log
role: events
schema: order_event
key: {field: order_id}
read_through: [browse, own_subscription]
consumers: outside
idempotency: {header: Nats-Msg-Id, broker_dedupe: true, window: 2m}
wait: {default: 2s, max: 10s}
limits: {browse_count: 2}
---
channel: orders.work
address: ORDERS_WORK/example.orders.work
shape: queue
role: events
key: {field: order_id}
read_through: browse
subscription: example_runtime
ownership: runtime_owned
consumers: none
idempotency: {header: Nats-Msg-Id, broker_dedupe: true, window: 2m}
wait: {default: 2s, max: 10s}
---
channel: orders.notices
address: example.orders.notices
shape: topic
role: events
correlation: {field: headers.correlation_id}
read_through: own_subscription
consumers: outside
wait: {default: 2s, max: 10s}
