operation: example_order_work_list
title: List waiting order work
effect: read
inputs: {}
outputs:
  count: {type: integer}
bindings:
  - mode: stream
    verb: list
    channel: orders.work
description: >
  Lists the work items waiting in the queue, without taking any.
---
operation: example_order_work_add
title: Add a work item for an order
effect: irreversible
hazard: sends_outside
inputs:
  order_id: {type: identifier, description: "Order number"}
  task: {type: text, description: "What is to be done"}
outputs:
  message_id: {type: broker_text}
bindings:
  - mode: stream
    verb: publish
    channel: orders.work
    key: {order_id: input.order_id}
    body: {order_id: input.order_id, task: input.task}
description: >
  Adds one work item to the queue. The broker refuses a repeat of the same record.
---
operation: example_order_work_take
title: Take the next work item
effect: irreversible
inputs: {}
outputs:
  arrived: {type: boolean}
bindings:
  - mode: stream
    verb: take
    channel: orders.work
    wait: 1s
description: >
  Takes the next work item from the queue the runtime owns, and acknowledges it.
---
operation: example_order_notice_send
title: Send a notice about an order
effect: irreversible
hazard: sends_outside
inputs:
  order_id: {type: identifier, description: "Order number"}
  text: {type: text, description: "The notice"}
outputs:
  message_id: {type: broker_text}
bindings:
  - mode: stream
    verb: publish
    channel: orders.notices
    headers: {correlation_id: input.order_id}
    body: {order_id: input.order_id, text: input.text}
description: >
  Sends one notice to whoever is listening. Nothing keeps it.
---
operation: example_order_notice_await
title: Wait for a notice that answers a request
effect: read
inputs:
  correlation_id: {type: identifier, description: "The request's correlation"}
outputs:
  arrived: {type: boolean}
bindings:
  - mode: stream
    verb: await
    channel: orders.notices
    correlation: input.correlation_id
    wait: 1s
description: >
  Waits a short time for a notice that carries a request's correlation.
