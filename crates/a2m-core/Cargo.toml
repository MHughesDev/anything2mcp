[package]
name = "a2m-core"
description = "Shared types for Anything2MCP: the vocabularies, checked names, identifiers, values, failures, findings, the secret wrapper, and the compiled target as data."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize.workspace = true

[features]
# The hidden module `testing`: what the test
# `every_failure_takes_its_class_from_a_table` of other crates reads their
# sources with (decision 0289). Turned on only as a feature of a
# dev-dependency, as `a2m-ledger`'s is (decision 0145).
testing = []

[lints]
workspace = true
