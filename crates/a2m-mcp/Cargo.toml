[package]
name = "a2m-mcp"
description = "The MCP server: stdio, Streamable HTTP, toolsets, and authoring tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-actions = { path = "../a2m-actions" }
a2m-core = { path = "../a2m-core" }
a2m-policy = { path = "../a2m-policy" }
axum.workspace = true
rmcp.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
a2m-actions = { path = "../a2m-actions", features = ["testing"] }
a2m-auth = { path = "../a2m-auth" }
a2m-engine = { path = "../a2m-engine" }
a2m-expr = { path = "../a2m-expr" }
a2m-ledger = { path = "../a2m-ledger" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
a2m-vault = { path = "../a2m-vault" }
example-app = { path = "../../targets/example-app" }
tracing.workspace = true

[lints]
workspace = true
