[package]
name = "a2m-provider"
description = "The provider contract for Anything2MCP: manifests, the registry of packs and plug-ins, and the supervisor of outside processes."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-ledger = { path = "../a2m-ledger" }
a2m-sources = { path = "../a2m-sources" }
a2m-telemetry = { path = "../a2m-telemetry" }
getrandom.workspace = true
serde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
toml.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds.workspace = true
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
a2m-files = { path = "../a2m-files", features = ["testing"] }
a2m-vault = { path = "../a2m-vault" }
example-cli = { path = "../../targets/example-cli" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
