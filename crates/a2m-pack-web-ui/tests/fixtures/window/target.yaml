# The imaginary order-entry system `example`, signed in to by the person in a
# window of the engine's own browser (decision 0254): on its own sign-in
# page, or through the imaginary identity provider `id`, on an origin of its
# own. A test gives each surface the address it started.
schema_version: 1
target: example
title: Example order entry, signed in by the person
surfaces:
  app:
    kind: web
    origin: "http://127.0.0.1:4010"
    viewport: {width: 1280, height: 800}
    color_scheme: light
    reduced_motion: true
  id:
    kind: web
    origin: "http://localhost:4011"
environments:
  test:
    kind: test
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
