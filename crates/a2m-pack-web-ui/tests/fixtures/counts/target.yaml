# The imaginary order-entry system `example`, used through its pages, for a
# search a read sends from inside a page with its filter in the body
# (decision 0999). It describes no real product. A test gives the surface
# the address of the application it started.
schema_version: 1
target: example
title: Example order entry
surfaces:
  app:
    kind: web
    origin: "http://127.0.0.1:4010"
    viewport: {width: 1280, height: 800}
    color_scheme: light
    reduced_motion: true
environments:
  test:
    kind: test
  production:
    kind: production
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
