# The imaginary order-entry system `example`, used through the pages that
# commit a value as a family of web interface does. It describes no real
# product. A test names the surface's platform profile, and gives the
# surface the address of the application it started.
schema_version: 1
target: example
title: Example order entry
surfaces:
  app:
    kind: web
    origin: "http://127.0.0.1:4010"
    viewport: {width: 1280, height: 800}
    color_scheme: light
    reduced_motion: true
environments:
  test:
    kind: test
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
