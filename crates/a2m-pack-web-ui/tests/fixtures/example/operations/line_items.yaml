operation: example_line_item_get
title: Get a line item
effect: read
key: [order_id, item_code]
inputs:
  order_id: {type: identifier, description: "Order number shown in the application"}
  item_code: {type: identifier, description: "Item code, such as L-101"}
outputs:
  description: {type: text}
  quantity: {type: integer}
  length_in: {type: length_inches}
bindings:
  - mode: ui
    verb: read
    status: verified
    screen: line_item
description: >
  Reads one line item of an order from its form.
---
operation: example_line_item_update
title: Update a line item
effect: write
key: [order_id, item_code]
commit_points: 1
inputs:
  order_id: {type: identifier, description: "Order number shown in the application"}
  item_code: {type: identifier, description: "Item code, such as L-101"}
  description: {type: text, description: "What the item is"}
  quantity: {type: integer, description: "How many"}
  length_in: {type: length_inches, description: "Length, in inches"}
outputs:
  description: {type: text}
  quantity: {type: integer}
  length_in: {type: length_inches}
bindings:
  - mode: ui
    verb: update
    status: shadow
    screen: line_item
    fields:
      description: input.description
      quantity: input.quantity
      length_in: input.length_in
    action: save
    read_back: {screen: line_item}
description: >
  Changes one line item of a draft order through its form.
---
operation: example_order_line_list
title: List the line items of an order
effect: read
key: order_id
inputs:
  order_id: {type: identifier, description: "Order number shown in the application"}
outputs:
  item_codes: {type: identifier, list: true}
  quantities: {type: integer, list: true}
bindings:
  - mode: ui
    verb: list
    status: verified
    screen: order
description: >
  Lists the item code and the quantity of every line item of one order.
