operation: example_account_enter
title: Enter an account
effect: write
key: account
commit_points: 1
inputs:
  account: {type: identifier, description: "The account's name"}
  remember: {type: boolean, description: "Whether the page remembers the account"}
  region: {type: identifier, description: "The region's code"}
outputs:
  account: {type: text}
  remember: {type: boolean}
  region: {type: text}
bindings:
  - mode: ui
    verb: submit
    status: shadow
    screen: sign_in
    fields:
      account: input.account
      remember: input.remember
      region: input.region
    action: enter
    read_back: {screen: sign_in}
description: >
  Fills the test page that holds a password, without touching the password.
  It proves the controls the test application lacks, and that a password
  on the page reaches no evidence.
---
operation: example_account_password_get
title: Read a password, which is refused
effect: read
inputs: {}
outputs:
  password: {type: text}
bindings:
  - mode: ui
    verb: read
    status: draft
    screen: sign_in
description: >
  Asks for the value of a password input. The driver refuses it.
