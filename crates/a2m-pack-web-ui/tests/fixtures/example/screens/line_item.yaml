# The form of one line item.
screen: line_item
surface: app
reach: {url: "/orders/{order_id}/items/{item_code}"}
ready: {visible: {role: heading, name: "Line Item Details"}}
fields:
  description:
    type: text
    control: text
    locate:
      - {role: textbox, name: Description}
      - {label: Description}
    fingerprint: {section: {role: form, name: ""}, near_text: "Line Item Details"}
  quantity:
    type: integer
    control: number
    locate:
      - {role: textbox, name: Quantity}
    fingerprint: {section: {role: form, name: ""}, near_text: "Line Item Details"}
  length_in:
    type: length_ft_in
    control: measurement
    locate:
      - {role: textbox, name: Length}
    fingerprint: {section: {role: group, name: Dimensions}, near_text: inches}
actions:
  save:
    locate:
      - {role: button, name: Save}
    fingerprint: {section: {role: form, name: ""}}
    confirm: {text: {locate: {role: status, name: ""}, equals: "Saved."}}
    commits: true
variants:
  not_found:
    when: {visible: {role: heading, name: "Not found"}}
    handling: absent
  refused:
    when: {visible: {role: listitem, name: "", within: {role: alert, name: ""}}}
    handling: stop
