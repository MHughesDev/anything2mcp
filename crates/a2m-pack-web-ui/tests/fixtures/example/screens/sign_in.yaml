# A page with a password, a check box, and a select, which the built-in
# test application does not have yet; a test serves it. The password is
# on the page already and is never read.
screen: sign_in
surface: app
reach: {url: "/sign-in"}
ready: {visible: {role: heading, name: "Sign in"}}
fields:
  account:
    type: text
    control: text
    locate:
      - {role: textbox, name: Account}
    fingerprint: {section: {role: form, name: ""}}
  password:
    type: text
    control: text
    locate:
      - {label: Password}
    fingerprint: {section: {role: form, name: ""}}
  remember:
    type: boolean
    control: checkbox
    locate:
      - {role: checkbox, name: "Remember this account"}
    fingerprint: {section: {role: form, name: ""}}
  region:
    type: text
    control: select
    locate:
      - {role: combobox, name: Region}
    fingerprint: {section: {role: form, name: ""}}
actions:
  enter:
    locate:
      - {role: button, name: Enter}
    fingerprint: {section: {role: form, name: ""}}
    confirm: {text: {locate: {role: status, name: ""}, contains: "Entered"}}
    commits: true
variants:
  not_found:
    when: {visible: {role: heading, name: "Not found"}}
    handling: absent
