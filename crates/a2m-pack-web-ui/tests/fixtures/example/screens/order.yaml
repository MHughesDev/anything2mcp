# One order, with the table of its line items.
screen: order
surface: app
reach: {url: "/orders/{order_id}"}
ready: {visible: {role: table, name: "Line items"}}
rows:
  locate:
    - {role: table, name: "Line items"}
  fingerprint: {section: {role: main, name: ""}}
  header: ["Item code", "Description", "Quantity", "Length (in)"]
  columns:
    item_codes: {header: "Item code", type: identifier}
    quantities: {header: "Quantity", type: integer}
variants:
  not_found:
    when: {visible: {role: heading, name: "Not found"}}
    handling: absent
