[effects]
write_roots = ["profiles"]
network = "surfaces"
sessions = ["web"]

[[settings]]
key = "max_read_chars"
type = "int"
default = 1048576
min = 1024
max = 16777216
doc = "The longest text one read of the page may return, in characters."

[[settings]]
key = "max_snapshot_elements"
type = "int"
default = 400
min = 10
max = 5000
doc = "The most elements a snapshot kept as evidence may hold."

[[settings]]
key = "browser_digests"
type = "list"
default = []
scope = "installation"
doc = "The digests of the browser programs a person has reviewed. When the list is not empty, a browser with another digest is closed."

# The places a browser is looked for: every path of the browser engine's
# list of known places, for every operating system. The supervisor starts
# only a program a manifest declares. A test holds the two lists together.
[[requirements]]
name = "browser"
detect = { paths = [
    '/opt/google/chrome/chrome',
    '/opt/microsoft/msedge/msedge',
    '/usr/lib/chromium/chromium',
    '/usr/lib/chromium-browser/chromium-browser',
    '/usr/lib64/chromium-browser/chromium-browser',
    '/Applications/Google Chrome.app/Contents/MacOS/Google Chrome',
    '/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge',
    '/Applications/Chromium.app/Contents/MacOS/Chromium',
    'C:\Program Files\Google\Chrome\Application\chrome.exe',
    'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe',
    'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
    'C:\Program Files\Microsoft\Edge\Application\msedge.exe',
] }
missing = "Install Chrome, Edge, or Chromium."
