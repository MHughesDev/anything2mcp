# The manifest of the web pack's drivers. What is not built is not declared:
# the `site_tools` mode, the `page_http` writes beyond `update` by PUT, the auth providers, the screen
# matcher, and platform profiles.
manifest_format = 1
contract = 1

[provider]
name = "web"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

[[modes]]
name = "ui"
archetype = "interface"
verbs = ["read", "list", "create", "update", "upsert", "submit"]
steps = ["goto", "wait", "read", "set", "invoke"]
# No kind of step always saves: an `invoke` saves when its action is
# declared to, and the lowering refuses a `commits` mark on any other kind.
commit_steps = []
# Preparing starts the browser when none is open, which may take the whole
# launch deadline of two minutes on a cold machine, and then opens a tab and
# places its state (decision 0999).
prepare_within_ms = 180000
rank = 60
session_reads = 4
session_writes = 1
exclusive = "none"

# A request made from inside the page, with the page's own session. A read
# runs in an observing tab whatever the run's posture (decision 0190). An
# `update` is a PUT from inside the page with the page's own anti-forgery
# token, in an acting tab opened only in a posture that may act, and read
# back in the observing tab (decision 0206). A `request` saves exactly when
# its entry writes, and the lowering marks it `commits` then; a `goto`
# never saves; so no kind always saves. The driver's own guard refuses a
# writing request that is not marked `commits` in every posture, and lifts
# for the marked one in a live run and against a declared test record.
[[modes]]
name = "page_http"
archetype = "request"
verbs = ["read", "update"]
steps = ["goto", "request"]
commit_steps = []
prepare_within_ms = 180000
rank = 40
session_reads = 4
session_writes = 1
exclusive = "none"

# A tool the page registers in the browser for agents (WebMCP), called by
# name from an acting tab. A tool runs the page's own script, so what it does
# is whatever that script does: the binding is held to the least effect that
# cannot be taken back, and the page's own hints are never evidence
# (decision 0359, the `site_tools` record).
[[modes]]
name = "site_tools"
archetype = "request"
verbs = ["call", "submit"]
steps = ["goto", "wait", "call_tool"]
commit_steps = ["call_tool"]
prepare_within_ms = 180000
rank = 30
session_reads = 4
session_writes = 1
exclusive = "none"

[[surface_kinds]]
name = "web"
archetype = "interface"
session = true

[points]
driver = ["ui", "page_http", "site_tools"]
# A sign-in through the application's own sign-in page with a stored
# credential (decision 0245), and a sign-in the person carries out in a
# window, on the application's pages or an identity provider's (decision 0254).
auth_provider = ["form_login", "window_login", "sso_oidc", "sso_saml"]

[[file_kinds]]
name = "screen"
directory = "screens/"
surface_kinds = ["web"]

# The requests a page makes from inside itself, in the form of entries of
# the endpoint catalog: reads (decision 0190), and writes by PUT, written by
# a person, never drafted (decision 0206).
[[file_kinds]]
name = "page_request"
directory = "page_requests/"
surface_kinds = ["web"]

# The `screen` finding belongs to the web pack's discoverers, a provider of
# their own; this pack drafts from it as data and does not own its form. It
# is not declared under `reads`, so that a registry with only this pack has
# no missing owner: with no discoverer, the rules are never called.
# From a snapshot: a screen that reads each table the page names by its
# headings, and a `list` read over it. Never a field or an action.
[[drafting_rules]]
finding_kind = "screen"
file_kind = "screen"

[[drafting_rules]]
finding_kind = "screen"
file_kind = "operation"

# From a request a page made by itself with GET to its own origin, with a
# JSON answer: its entry, and a `page_http` read over it (decision 0190).
# The `exchange` finding is the web pack's discoverers', read as data.
[[drafting_rules]]
finding_kind = "exchange"
file_kind = "page_request"

[[drafting_rules]]
finding_kind = "exchange"
file_kind = "operation"

