[package]
name = "a2m-pack-web-ui"
description = "The web pack's drivers: the ui, page_http, and site_tools modes, widget drivers, and sign-in in a browser."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-pack-web-browser = { path = "../a2m-pack-web-browser" }
a2m-provider = { path = "../a2m-provider" }
a2m-logs = { path = "../a2m-logs" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

[dev-dependencies]
# The reading of the test `every_failure_takes_its_class_from_a_table`.
a2m-core = { path = "../a2m-core", features = ["testing"] }
a2m-expr = { path = "../a2m-expr" }
a2m-ledger = { path = "../a2m-ledger", features = ["testing"] }
a2m-pack-web-browser = { path = "../a2m-pack-web-browser", features = ["test-support"] }
a2m-vault = { path = "../a2m-vault" }
example-app = { path = "../../targets/example-app" }
tokio = { workspace = true, features = ["io-util", "net", "macros", "rt-multi-thread"] }

[lints]
workspace = true
