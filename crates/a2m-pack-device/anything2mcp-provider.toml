# The device pack's manifest: what it brings and what it may do. A person
# reviews this file; the registry refuses anything the pack registers that is
# not declared here.
manifest_format = 1
contract = 1

[provider]
name = "device"
version = "0.0.1"
publisher = "Anything2MCP"
kind = "pack"

# One request at a time on one link, and one run at a time on one device.
# No `commit_steps`: `write_frame` saves only when it sends a write, and the
# driver refuses a write frame that is not marked `commits`.
[[modes]]
name = "device"
archetype = "device"
verbs = ["read", "update", "submit"]
steps = ["open", "build_frame", "write_frame", "read_frame", "expect"]
rank = 60
intent_window = 1
session_reads = 1
session_writes = 1
exclusive = "link"

[[surface_kinds]]
name = "device_link"
archetype = "device"
session = true

[points]
driver = ["device"]
discoverer = ["device_identity", "device_register_map"]

# Asks the device to identify itself, and nothing else.
[[discoverers]]
name = "device_identity"
archetype = "device"
surface_kinds = ["device_link"]
kinds = ["device_identity"]
sources = ["live_system"]
max_level = "discovered"
bounds = { seconds = 30, bytes = 4096, depth = 1 }

# Reads a register map a vendor published, given as a file of the
# project's `sources` folder under the name `register_map`. It sends no
# frame: nothing of the device is observed.
[[discoverers]]
name = "device_register_map"
archetype = "device"
surface_kinds = ["device_link"]
kinds = ["device_register_map"]
sources = ["published_description"]
max_level = "inferred"
bounds = { seconds = 30, bytes = 1000000, depth = 1 }
files = ["register_map"]

[[file_kinds]]
name = "register"
directory = "registers/"
surface_kinds = ["device_link"]

[[finding_kinds]]
name = "device_identity"
surface_kinds = ["device_link"]

[[finding_kinds]]
name = "device_register_map"
surface_kinds = ["device_link"]

[[lint_rules]]
code = "device.writable_without_hazard"
level = "error"
summary = "Every writable register declares a hazard."

[[lint_rules]]
code = "device.writable_without_range"
level = "error"
summary = "Every writable register that holds a number declares its safe range."

[[lint_rules]]
code = "device.command_hazard_none"
level = "error"
summary = "A register that can only be written is a command, and a command's hazard is not `none`."

[[drafting_rules]]
finding_kind = "device_identity"
file_kind = "register"

[[drafting_rules]]
finding_kind = "device_register_map"
file_kind = "register"

[[drafting_rules]]
finding_kind = "device_register_map"
file_kind = "operation"

[[failure_codes]]
class = "input"
code = "value_out_of_range"

[[failure_codes]]
class = "input"
code = "schema_invalid"

[[failure_codes]]
class = "input"
code = "payload_unreadable"

[[failure_codes]]
class = "policy"
code = "surface_not_declared"

[[failure_codes]]
class = "policy"
code = "device_serial_not_declared"

[[failure_codes]]
class = "policy"
code = "discovery_identifies_only"

[[failure_codes]]
class = "policy"
code = "frame_budget_exceeded"

[[failure_codes]]
class = "unknown_variant"
code = "device_identity_mismatch"

[[failure_codes]]
class = "unknown_variant"
code = "physical_not_built"

[[failure_codes]]
class = "unknown_variant"
code = "unexpected_reply"

[[failure_codes]]
class = "rejected"
code = "device_refused"

[[failure_codes]]
class = "transient"
code = "timeout"

[[failure_codes]]
class = "transient"
code = "connection_lost"

[[failure_codes]]
class = "transient"
code = "frame_corrupt"

[[failure_codes]]
class = "transient"
code = "device_busy"

[[failure_codes]]
class = "possible_commit"
code = "no_confirmation"

[effects]
network = "surfaces"
sessions = ["device_link"]
devices = true

[[settings]]
key = "reply_within_ms"
type = "int"
default = 1000
min = 10
max = 60000
doc = "How long a reply may take when a map states no pace."

# Four frames a second at most. A person who knows the device can take
# more may lower the gap.
[[settings]]
key = "min_gap_ms"
type = "int"
default = 250
min = 0
max = 60000
doc = "The least time between two frames when a map states no pace."

# Every frame counts: identification, reads, and writes.
[[settings]]
key = "max_frames_per_run"
type = "int"
default = 100
min = 1
max = 100000
doc = "The most frames one run may send on one link."
