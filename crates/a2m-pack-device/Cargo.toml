[package]
name = "a2m-pack-device"
description = "The device pack: the `device` driver over a device's link, with ranges enforced before a frame is sent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
serde.workspace = true
serde_json.workspace = true
# `io-util` is the only feature this crate adds: reading and writing whole frames.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
a2m-expr = { path = "../a2m-expr" }
a2m-ledger = { path = "../a2m-ledger", features = ["testing"] }
a2m-vault = { path = "../a2m-vault" }
example-device = { path = "../../targets/example-device" }
# `test-util` gives the tests a clock they control: the pace is proven
# without waiting.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
