operation: example_batch_target_set
title: Set the batch target
# A register is found by its name in the map, and the kernel takes a
# record key only from an input, so the operation has no identity and is
# irreversible. The register is still read back.
effect: irreversible
commit_points: 1
inputs:
  target: {type: integer, description: "Batch target, in millilitres"}
outputs:
  target: {type: integer}
bindings:
  - mode: device
    verb: update
    status: shadow
    device_map: controller.main
    registers: {batch_target: input.target}
    read_back: {target: batch_target}
description: >
  Sets the batch target, a two-word value, and reads it back.
