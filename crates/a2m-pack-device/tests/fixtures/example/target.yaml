# The imaginary pump controller `example`, reached over a device link. It
# describes no real product. The address is a placeholder: a test puts the
# test stand's own address in its place.
schema_version: 1
target: example
title: Example pump controller
surfaces:
  controller:
    kind: device_link
    address: "127.0.0.1:502"
    protocol: modbus_tcp
    unit: 1
    # The unit that answers in each environment. A device that reports
    # another serial is another device, and nothing is written where no
    # serial is declared.
    serials: {test: "100123"}
environments:
  test:
    kind: test
    surfaces: {controller: "127.0.0.1:1502"}
default_environment: test
environment: {locale: en-US, timezone: UTC}
drift_risk: low
