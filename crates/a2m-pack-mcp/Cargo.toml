[package]
name = "a2m-pack-mcp"
description = "The MCP pack: the mcp driver, which passes calls through to an upstream MCP server named in a mapping file."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-auth = { path = "../a2m-auth" }
a2m-core = { path = "../a2m-core" }
a2m-files = { path = "../a2m-files" }
a2m-provider = { path = "../a2m-provider" }
a2m-telemetry = { path = "../a2m-telemetry" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
a2m-ledger = { path = "../a2m-ledger" }
a2m-vault = { path = "../a2m-vault" }
example-mcp = { path = "../../targets/example-mcp" }

[lints]
workspace = true
