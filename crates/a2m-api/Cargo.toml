[package]
name = "a2m-api"
description = "The REST API, OpenAPI generation, and webhooks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
a2m-actions = { path = "../a2m-actions" }
a2m-core = { path = "../a2m-core" }
axum.workspace = true
futures-core.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# The kernel tests' helpers: a published compiled target without the compiler, and the
# engine's test pack over the built-in test application.
a2m-actions = { path = "../a2m-actions", features = ["testing"] }
a2m-auth = { path = "../a2m-auth" }
a2m-engine = { path = "../a2m-engine" }
a2m-expr = { path = "../a2m-expr" }
a2m-ledger = { path = "../a2m-ledger" }
a2m-policy = { path = "../a2m-policy" }
a2m-provider = { path = "../a2m-provider" }
a2m-sources = { path = "../a2m-sources" }
a2m-logs = { path = "../a2m-logs" }
a2m-vault = { path = "../a2m-vault" }
example-app = { path = "../../targets/example-app" }
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
