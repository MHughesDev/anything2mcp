[package]
name = "a2m-field-harness"
description = "The field harness: the product's own `serve` with a presence prompt only a field test's runner answers, for the closed network of a field test."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Test equipment, like the test stands and the benchmark harness: no product
# crate depends on it, and it is never packaged (decision 0310).
[dependencies]
a2m-local = { path = "../../crates/a2m-local" }
anything2mcp = { path = "../../crates/anything2mcp" }
tokio = { workspace = true, features = ["io-std", "io-util"] }

[lints]
workspace = true
