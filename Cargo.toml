[workspace]
resolver = "3"
members = [
    "crates/*",
    "targets/example-app",
    "targets/example-broker",
    "targets/example-cli",
    "targets/example-db",
    "targets/example-decompiler",
    "targets/example-desk",
    "targets/example-device",
    "targets/example-files",
    "targets/example-mcp",
    "targets/example-nats",
    "bench",
    "tools/field-harness",
]
# Throwaway experiments are never part of the product or of its build.
exclude = ["spikes"]

# Every crate shares these. The version is the one number of the whole product;
# the audit checks that the pip package carries the same one (spec section 41).
[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/MHughesDev/anything2mcp"
publish = false

# Outside crates, each verified before it was added; docs/research/09 has the
# table. Versions live here and nowhere else.
[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# One SQLite for the whole workspace: the store, the data pack, and the test
# stands all use this crate, because two crates that link SQLite cannot coexist.
rusqlite = { version = "0.43.0", features = ["bundled"] }
# The data pack's server store, behind its `postgres` feature and nowhere else
# (decision 0168; research note 23). `runtime` is its TCP and socket connect.
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
# The buffer type its value traits write into; already in its tree.
bytes = { version = "1.12.1", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
# Exact decimals for business values, wrapped by a2m-core and named nowhere
# else (decision 0068). No features: the wrapper writes its own text form.
rust_decimal = { version = "1.43.0", default-features = false }
# TLS for the session keeper's calls to identity services, behind a2m-auth's
# `tls` feature and nowhere else yet: rustls with the ring provider, which
# needs only a C compiler on every platform (decision 0084).
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
# The rest of the TLS stack, each behind a `tls` feature (decision 0157): the
# operating system's certificate verifier, the bundled roots for a machine that
# has none, the test stand's TLS listener, and test-time certificates (stands only).
rustls-platform-verifier = "0.7.1"
webpki-roots = "1.0.12"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# SHA-1 only for one-time codes, whose standard (RFC 6238) uses it by default;
# a2m-auth is its one user (decision 0084). Same family and tree as sha2.
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
# Unicode NFC for text normalization in a2m-expr (decision 0073). Its tables
# fix the Unicode version, so the version is part of the expression library.
unicode-normalization = { version = "0.1.26", default-features = false }
# Logging macros and the subscriber interface only; a2m-telemetry writes the
# subscriber itself (decision 0077). No attribute macros, so no proc-macro tree.
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
# The vault's outside crates, each verified in decision 0074: the cipher, the
# passphrase derivation, operating-system randomness, the redactor's matcher,
# memory wiping, and the three desktop key stores.
aho-corasick = "1.1.5"
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4.3"
keyring-core = "1.0.1"
windows-native-keyring-store = { version = "1.1.0", default-features = false }
zeroize = "1.9.1"
# The YAML parser for target files: an event parser that gives the line and
# column of every value; a2m-files builds its own located tree (decision 0078).
saphyr-parser = "0.3.4"
# Inflate for a workbook's package, the one outside crate of a2m-sources; the
# csv, json, package, and XML readers are its own (decision 0086).
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
# The provider contract's outside crates (decision 0088): the manifest parser;
# on Unix, the helper that places a pipe on a child's descriptors and the safe
# system calls that end a process group; on Windows, the handle and job calls.
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
command-fds = { version = "0.3.3", features = ["tokio"] }
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation"] }
# The macOS system calls of a2m-netstate, and nothing else (decision 0243):
# the interface list and the routing socket's table dump. Already in the
# tree of tokio, rustix, and getrandom.
libc = "0.2.191"
# The command pack's one outside crate (decision 0099): patterns for a
# program's version line, its prompts, its output, and its text arguments.
# Matching takes time linear in the text, which output from a program needs.
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
# The HTTP pack's reader of answers in XML (decision 0217): a streaming
# reader with no default features, which reads no document type and fetches
# nothing. Its one dependency, memchr, is already in the tree.
quick-xml = { version = "0.42.0", default-features = false }
# The command pack's reader of the plain facts of a binary (X5): the
# headers, imports, exports, and code-signature blobs of ELF, PE, and
# Mach-O, read from bytes and never run. Only the readers of those three
# formats and `std`; compression is left out, so no decompressor comes in.
# Licence Apache-2.0 OR MIT; its one dependency, memchr, is in the tree.
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
# The client end of the local channel (decision 0117): hyper's HTTP/1.1
# connection over a socket or a named pipe, and the adapter between Tokio's
# and hyper's stream traits. axum already brings both crates.
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# The stream trait alone, for the event stream a2m-mcp answers a call with
# when its caller asked for progress (decisions 0115 and 0130). Already in the
# tree of axum. The MCP protocol layer itself is our own: no SDK crate.
futures-core = { version = "0.3.34", default-features = false }
# The Linux presence prompt of a2m-local, and nothing else (decisions 0133 and
# 0142): the system bus, and polkit's authority on it. Linux only, so Windows
# and macOS builds do not carry them. No default features: Tokio is the
# runtime, and the proxy is the one part of the bus crate that is used.
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "proxy"] }
zbus_polkit = { version = "6.0.0", default-features = false, features = ["tokio"] }
# The macOS and Windows presence prompts of a2m-local, and nothing else
# (decisions 0133 and 0146), each on its own system only. macOS:
# LocalAuthentication and the Objective-C runtime and blocks under it, with
# no default features, so that only the classes the prompt names compile.
# Windows: Windows Hello's verifier and its interop, and the operation it
# returns. They share `windows-link` 0.2 with `windows-sys` 0.61.
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std"] }
# The desktop pack's macOS back end and its stand (decision 0244): the
# system's accessibility interface, the Core Foundation types it speaks, and
# AppKit for the stand's window. Same project and release as the objc2
# crates above; macOS only where they are used.
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
windows = { version = "0.62.2", default-features = false, features = ["std"] }
windows-future = { version = "0.3.2", default-features = false, features = ["std"] }

# AGENTS.md: no unsafe without a stated reason and a test; no unwrap or expect
# in library code outside tests. clippy.toml allows both inside tests.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

# The release profile is what the wheel, the npm packages, and `cargo install`
# build with. One code unit, whole-program optimisation, and size-first
# optimisation take the stripped binary from 37.2 MB to 18.5 MB with every
# first-party pack in it, at no measured cost in speed (decision 0191).
# `panic` stays `unwind`: the engine's failure handling rests on it, and that
# is the lead's to change, not a profile setting's.
# The debug and test builds (`test` inherits `dev`) keep line tables, so that a
# backtrace names the file and line of each frame of the workspace's own code,
# and drop the rest of the debug information, which made most of the build
# folder and of the link time. The dependencies keep none: a frame in one
# still shows its function, and a panic's message still names its file and
# line, which it carries without debug information. The release profile is
# not touched (decisions 0372 and 0999).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"

# The vault derives its root key from a passphrase with a function that is
# slow on purpose (decision 0074). Compiled without optimization it takes
# about two seconds a start instead of about a sixth of one; the derived key
# is the same. These two crates are optimized for speed in every profile
# (decision 0253).
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release.package.argon2]
opt-level = 3

[profile.release.package.blake2]
opt-level = 3
